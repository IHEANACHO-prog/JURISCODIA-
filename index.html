wledge or","ch":"Chapter IV – JOINT ACTS","p":"","x":"Whenever an act, which is criminal only by reason of its being done with a criminal\nknowledge or intention, is done by several persons, each of those persons who joins in\nthe act with that knowledge or intention is liable for the act in the same manner as if the\nact were done by him alone with that knowledge or intention."},{"c":"PC","n":"81","t":"Co-operation by doing one of several acts constituting an offence","ch":"Chapter IV – JOINT ACTS","p":"","x":"When an offence is committed by means of several acts, whoever intentionally co-\noperates in the commission of that offence by doing anyone of those acts, either singly\nor jointly with any other person, commits that offence.\n\nIllustrations. (a) A and B agree to kill Z by severally and at different times giving him small\ndoses of poison. A and B administer the poison according to the agreement with intent\nto kill Z. Z dies from the effects of the several doses of poison so administered to him. Here\nA and B intentionally co-operate in the commission of culpable homicide and, as each\nof them does one or more of the several acts by which death is caused, they are both\nguilty of the offence, though their acts are separate and though the acts of one without\nthe acts of the other would not have caused death.\n\n(b) A and B are joint jailors and as such have the charge of Z a prisoner alternately for six\nhours at a time. A and B intending to cause Z's death knowingly co-operate in causing\nthat effect by illegally omitting, each during the time of his attendance, to furnish Z with\nfood supplied to them for that purpose. Z dies of hunger. Both A and B are guilty of\nculpable homicide.\n\n(c) A a jailor has the charge of Z a prisoner. A intending to cause Z's death illegally omits\nto supply Z with food; in consequence of which Z is much reduced in strength but the\nstarving is not sufficient to cause his death. A is dismissed from his office and B succeeds\nhim. B without collusion or co-operation with A illegally omits to supply Z with food,\nknowing that he will probably thereby cause Z's death. Z dies of hunger. B is guilty of\nculpable homicide; but as A did not co-operate with B, A is guilty only of an attempt to\ncommit culpable homicide."},{"c":"PC","n":"82","t":"Persons condemned in criminal act may be guilty of different offences","ch":"Chapter IV – JOINT ACTS","p":"","x":"Where several persons are engaged or concerned in the commission of a criminal\nact, each person may be guilty of a different offence or offences by means of that act.\n\nIllustration. A attacks Z in such circumstances of grave provocation that his killing of Z\nwould be only culpable homicide not punishable with death. B having ill-will towards Z\nand intending to kill him and not having been subject to provocation, assists A in killing Z.\nHere, though A and B are both engaged in causing Z's death, B is guilty of culpable\nhomicide punishable with death and A is guilty only of culpable homicide not punishable\nwith death."},{"c":"PC","n":"83","t":"Abetment defined","ch":"Chapter V – ABETMENT","p":"","x":"A person abets the doing of a thing, who-\n\n(a) instigates a person to do that thing; or\n\n(b) engages with one or more other person or persons in a conspiracy for the doing of\nthat thing; or\n\n(c) intentionally aids or facilitates by an act or illegal omission the doing of that thing.\n\nEXPLANATION. A person who by wilful misrepresentation or by wilful concealment of a\nmaterial fact which he is bound to disclose voluntarily causes or procures or attempts to\n\ncause or procure a thing to be done instigates the doing of that thing within the\nmeaning of this chapter.\n\nIllustrations. (a) A is authorized by a warrant from a court of justice to arrest Z. B, knowing\nthat fact and also that C is not Z, wilfully represents to A that C is Z and thereby\nintentionally causes A to arrest C. Here B abets by instigation the arrest of C.\n\n(b) A, a policeman, bound as such to give information of all designs to commit robbery\nand knowing that Z intends to commit a robbery illegally omits to give information of Z' s\nintention, knowing that the commission of the robbery is likely to be thereby facilitated.\nHere A has abetted the robbery"},{"c":"PC","n":"84","t":"Abetment of offence defined","ch":"Chapter V – ABETMENT","p":"","x":"A person abets an offence who abets either the commission of an offence or the\ncommission of an act which would be an offence, if committed with the same intention\nor knowledge as that of the abettor by a person capable by law of committing an\noffence.\n\nEXPLANATION. I. The abetment of the illegal omission of an act may amount to an\noffence although the abettor may not himself be bound to do that act.\n\nEXPLANATION 2. To constitute the offence of abetment, it is not necessary that the act\nabetted should be committed or that the effect requisite to constitute the offence\nshould be caused.\n\nIllustrations. (a) A instigates B to 'kill C. B refuses to do so. A is guilty of abetting B to\ncommit culpable homicide.\n\n(b) A instigates B to kill D. B in pursuance of the instigation stabs D. D recovers from the\nwound. A is guilty of instigating B to commit culpable homicide.\n\nEXPLANATION 3. It is not necessary that the person abetted should be capable by law of\ncommitting an offence or that he should have the same guilty intention or knowledge as\nthat of the abettor or any guilty intention or knowledge.\n\nIllustrations. (a) A, with a guilty intention, abets a child or a lunatic in committing an act\nwhich would be an offence, if committed by a person capable by law of committing an\n\noffence and having the same intention as A. Here A, whether the act be committed or\nnot, is guilty of abetting an offence.\n\n(b) A, intending to cause a theft to be committed, instigates B to take property\nbelonging to Z out of Z's possession. A induces B to believe that the property belongs to\nA. B takes the property out of Z' s possession in good faith believing it to be A's property. B\nacting under this misconception does not take dishonestly and therefore does not\ncommit theft. But A is guilty of abetting theft andis liable to the same punishment as if B\nhad committed theft.\n\nEXPLANATION 4. The abetment of an offence being an offence, the abetment of such\nan abetment is also an offence.\n\nIllustration. A instigates B to instigate C to kill Z. B accordingly instigates C to kill Z and C\nkills Z in consequence of B' s instigation. B is liable to be punished for his offence with the\npunishment for culpable homicide; and; as A instigated B to commit the offence, A is\nalso liable to the same punishment.\n\nEXPLANATION 5. It is not necessary to the commission of the offence of abetment by\nconspiracy that the abettor should concert the offence with the person who commits it;\nit is sufficient if he engages in the conspiracy in pursuance of which the offence is\ncommitted.\n\nIllustration. A concerts with B a plan for poisoning Z. It is agreed that A shall administer the\npoison. B then explains the plan to C mentioning that a third person is to administer the\npoison but without mentioning A's name. C agrees to procure the poison and provides\nand delivers it to B for the purpose of its being used in the manner explained. A\nadministers the poison; Z dies in consequence. Here, though A and C have not conspired\ntogether, yet C has been engaged in the conspiracy in pursuance of which Z has been\nkilled, C has therefore committed the offence defined in this section and is liable to the\npunishment for culpable homicide."},{"c":"PC","n":"85","t":"Abetment if the act abetted is committed in consequence and where no express","ch":"Chapter V – ABETMENT","p":"","x":"Whoever abets an offence shall, if the act abetted is committed in consequence of\nthe abetment and no express provision is made by this Penal Code by any other law for\nthe time being in force for the punishment of the abetment, be punished with the\npunishment provided for the offence.\n\nEXPLANATION. An act or offence is said to be committed in consequence of abetment\nwhen it is committed in consequence of the instigation or in pursuance of the conspiracy\nor with the aid which constitutes the abetment.\n\nIllustrations. (a) A instigates B to give false evidence. B in consequence of the instigation\ncommits that offence. A is guilty of abetting that offence and liable to the same\npunishment as B.\n\n(b) A and B conspire to poison Z. A in pursuance of the conspiracy procures the poison\nand delivers it to B in order that he may administer it to Z. B in pursuance of the\nconspiracy administers the poison to Z in A's absence and thereby causes Z's death. Here\nB is guilty of culpable homicide. A is guilty of abetting that offence by conspiracy and is\nliable to the punishment for culpable homicide."},{"c":"PC","n":"86","t":"Abetment if person abetted does act with different intention from that of abettor","ch":"Chapter V – ABETMENT","p":"","x":"Whoever abets the commission of an offence shall, if the person abetted does the\nact with a different intention or knowledge from that of the abettor, be punished with\nthe punishment provided for the offence which would have been committed if the act\nhad been done with the intention or knowledge of the abettor and with no other."},{"c":"PC","n":"87","t":"Liability of abettor when one act abetted and different act done","ch":"Chapter V – ABETMENT","p":"","x":"When an act is abetted and a different act is done and the act done was a\nprobable consequence of the abetment and was committed under the influence of the\ninstigation or in pursuance of the conspiracy or with the aid which constituted the\nabetment, the abettor is liable for the act done in the same manner and to the same\nextent as if he had directly abetted it.\n\nIllustrations. (a) A instigates a child to put poison into the food of Z and gives him poison\nfor that purpose. The child, in consequence of the instigation, by mistake puts the poison\ninto the food of Y, which is by the side of that of Z. Here, if the child was acting under the\ninfluence of A's instigation and the act done was in the circumstances a probable\nconsequence of the abetment, A is liable in the same manner and to the same extent\nas if he had instigated the child to put the poison into the food of Y.\n\n(b) A instigates Band C to break into an inhabited house at midnight for the purpose of\nrobbery and provides them with arms for that purpose. Band C break into the house and\nbeing resisted by Z, one of the inmates, kill Z. Here, if that killing was the probable\nconsequence of the abetment, A is liable to the punishment provided for culpable\nhomicide"},{"c":"PC","n":"88","t":"Abettor when liable to cumulative punishment for act abetted and for act done","ch":"Chapter V – ABETMENT","p":"","x":"If the act for which the abettor is liable under section 87 of this Penal Code is\ncommitted in addition to the act abetted and constitutes a distinct offence, the abettor\nis liable to punishment for each of the offences."},{"c":"PC","n":"89","t":"Liability of abettor for an effect caused by the act abetted different from that","ch":"Chapter V – ABETMENT","p":"","x":"When an act is abetted with the intention on the part of the abettor of causing a\nparticular effect and an act for which the abettor is liable in consequence of the\nabetment causes a different effect from that intended by the abettor, the abettor is\nliable for the effect caused in the same manner and to the same extent as if he had\nabetted the act with the intention of causing that\n\neffect, provided he knew that the act abetted was likely to cause that effect.\n\nEXPLANATION. The abettor shall not be liable under this section to be sentenced to\ndeath, unless he knew that death would be the probable effect of the act abetted.\n\nIllustration. A instigates B to cause grievous hurt to Z. B in consequence of the instigation\ncauses grievous hurt to Z. Z dies in consequence. Here, if A knew that the grievous hurt\nabetted was likely to cause death, A is liable to be punished with the punishment\nprovided for culpable homicide."},{"c":"PC","n":"90","t":"Abettor present when offence committed liable as principal","ch":"Chapter V – ABETMENT","p":"","x":"Whenever a person who if absent would be liable to be punished as an abettor is\npresent when the act or offence for which he would be punishable in consequence of\nthe abetment is committed, he shall be deemed to have committed that act or offence."},{"c":"PC","n":"91","t":"Abetment of offence punishable with death or imprisonment for life if offence is not","ch":"Chapter V – ABETMENT","p":"","x":"(1) Whoever abets the commission of an offence punishable with death or\nimprisonment for life shall, if that offence is not committed in consequence of the\nabetment and no express provision is made by this Penal Code or by any other Act or\nLaw for the time being in force for the punishment of that abetment, be punished with\nimprisonment for a term which may extend to seven years and shall also be liable to fine.\n\n(2) If the abettor is a public officer whose duty it is to prevent the commission of the\noffence, he shall be liable to imprisonment for a term which may extend to ten years and\nshall also be liable to fine.\n\nIllustration. A instigates B to kill Z. The offence is not committed. If B had killed Z, B would\nhave been liable to the punishment of death. Therefore A is liable to imprisonment for a\nterm which may extend to seven years or, if he is a public officer whose duty it is to\nprevent the killing, to ten years and also in any event to a fine."},{"c":"PC","n":"92","t":"Abetment of offence punishable with imprisonment if offence is not committed","ch":"Chapter V – ABETMENT","p":"","x":"(1) Whoever abets an offence punishable with imprisonment shall, if that offence is\nnot committed in consequence of the abetment and no express provision is made by\nthis Penal Code or by any other Act or Law for the time being in force for the punishment\n\nof the abetment, be punished with imprisonment for a term which may extend to one\nfourth part of the longest term provided for that offence or with such fine as is provided\nfor that offence or with both.\n\n(2) If the abettor is a public officer whose duty it is to prevent the commission of such\noffence, he shall be punished with imprisonment for a term which may extend to one\nhalf of the longest term provided for that offence or with such fine as is provided for the\noffence or with both.\n\nIllustration. A, a policeman, whose duty it is to prevent robbery, abets the commission of\nrobbery. Here, though the robbery be not committed, A is liable to one half of the\nlongest term of imprisonment provided for that offence and also to fine."},{"c":"PC","n":"93","t":"Abetting commission of offence by the public or by more than ten persons","ch":"Chapter V – ABETMENT","p":"","x":"Whoever abets the commission of an offence by the public generally or by a\nmember thereof or class of persons exceeding ten, shall be punished with imprisonment\nfor a term which may extend to three years or with fine or with both."},{"c":"PC","n":"94","t":"Administering unlawful oath","ch":"Chapter V – ABETMENT","p":"","x":"Whoever administers, or takes, or is present at and consents to the administering of,\nan oath or engagement in the nature of an oath, purporting to bind the person who\ntakes it to commit an offence shall be punished-\n\n(a) with imprisonment for a term which may extend to seven years or with fine or with\nboth; and\n\n(b) if the offence is an offence punishable with death, with imprisonment for life or for\nany less term or with fine or with both."},{"c":"PC","n":"95","t":"Attempting to commit offences punishable with imprisonment","ch":"Chapter VI – ATTEMPTS TO COMMIT OFFENCES","p":"","x":"Whoever attempts to commit an offence punishable with imprisonment or to cause\nsuch an offence to be committed and in the attempt does an act towards the\ncommission of the offence shall, where no express provision is made by this Penal Code\nor by any other Act or Law for the time being in force for the punishment of the attempt,\nbe punished with imprisonment for a term which may extend to one half of the longest\nterm provided for that offence or with such fine as is provided for the offence or with\nboth.\n\nIllustrations. (a) A makes an attempt to steal some jewels by breaking open a box and\nfinds after so opening the box that there is no jewel in it. He has done an act towards the\ncommission of theft and therefore is guilty under this section.\n\n(b) A makes an attempt to pick the pocket of Z by thrusting his hand into Z's pocket. A\nfails in the attempt in consequence of Z's having nothing in his pocket. A is guilty under\nthis section."},{"c":"PC","n":"96","t":"Criminal conspiracy defined","ch":"Chapter VII – CRIMINAL CONSPIRACY","p":"","x":"(I) When two or more persons agree to do or cause to be done-\n\n(a) an illegal act; or\n\n(b) an act which is not illegal by illegal means, such an agreement is called a criminal\nconspiracy.\n\n(2) Notwithstanding the provisions of subsection (1) of this section, agreement except an\nagreement to commit an offence shall amount to a criminal conspiracy unless some act\nbesides the agreement is done by one or more parties to that agreement in pursuance\nthereof.\n\nEXPLANATION 1. It is immaterial whether the illegal act is the ultimate object of such\nagreement, or is merely incidental to that object.\n\nEXPLANATION 2. This section shall not apply to an agreement of two or more\n\npersons to do or cause to be done any act in contemplation or furtherance of a\n\ntrade dispute if such act committed by one person would not be punishable as\n\nan offence.\n\nEXPLANATION 3. Nothing in this section shall exempt from punishment any\n\npersons guilty of a conspiracy for which a punishment is provided by any Act\n\nor other Law."},{"c":"PC","n":"97","t":"Punishment for criminal conspiracy","ch":"Chapter VII – CRIMINAL CONSPIRACY","p":"","x":"(I) Whoever is a party to a criminal conspiracy to commit an offence punishable with\ndeath or with imprisonment shall, where no express provision is made in this Penal Code\nfor the punishment of such a conspiracy, be punished in the same manner as if he had\nabetted that offence.\n\n(2) Whoever is a party to a criminal conspiracy other than a criminal conspiracy to\ncommit an offence punishable as aforesaid shall be punished with imprisonment for a\nterm not exceeding six months or with fine or with both."},{"c":"PC","n":"97A","t":"Unlawful society defined","ch":"Chapter VII – CRIMINAL CONSPIRACY","p":"","x":"A society is an unlawful society if declared by an order of the President to be a\nsociety dangerous to the good government of the Federation or any part thereof."},{"c":"PC","n":"97B","t":"Management or membership of unlawful society","ch":"Chapter VII – CRIMINAL CONSPIRACY","p":"","x":"Whoever manages or is a member of an unlawful society shall be punished with\nimprisonment for a term which may extend to seven years or with fine or with both."},{"c":"PC","n":"98","t":"Breach of official trust defined","ch":"Chapter VIII – BREACH OF OFFICIAL TRUST","p":"","x":"Whoever, by reason or by means of his employment as a public officer\n\nacquires an information in respect of which he is under an obligation of secrecy\n\nexpress or implied and at any time communicates or attempts to communicate\n\nthat information to a person to whom the same ought not in the public\n\ninterest to be communicated at that time, is said to commit a breach of official\n\ntrust."},{"c":"PC","n":"99","t":"Punishment for breach of official trust","ch":"Chapter VIII – BREACH OF OFFICIAL TRUST","p":"","x":"Whoever commits a breach of official trust shall-\n\n(0) if the communication is made or attempted to be made to the agent of a\n\nforeign government, be punished with imprisonment for a term which\n\nmay extend to fourteen years and shall also be liable to fine; and\n\n(b) in any other case shall' be punished with imprisonment for a term which \"'\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"100","t":"Unlawful assembly defined","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"An assembly of five or more persons is designated an unlawful\n\nassembly if the common object of the persons composing that assembly is-\n\n(a) to overawe by criminal force or show of criminal force the Government\n\nof the Federation or any Government in Nigeria or a public officer in\n\nthe exercise of his lawful powers; or\n\n(b) to resist the execution of a law or of a legal process; or\n\n(c) to commit a mischief or criminal trespass or other offence of any kind\n\nwhatsoever, or\n\n(d) by means of criminal force or show of criminal force to enforce a right\n\nor supposed right; or\n\n(e) by means of criminal force or show of criminal force to compel a person\n\nto do that he is not legally bound to do or to omit to do what he is legally\n\nentitled to do. .\n\nEXPLANATION. An assembly which was not unlawful when it assembled,\n\nmay subsequently become an unlawful assembly."},{"c":"PC","n":"101","t":"Member of unlawful assembly defined","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever being aware of facts which render an assembly an unlawful"},{"c":"PC","n":"102","t":"Punishment for membership of unlawful assembly","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever is a member of an unlawful assembly shall be punished with\n\nimprisonment for a term which may extend to one year, or with fine or with both."},{"c":"PC","n":"103","t":"Joining unlawful assembly armed with deadly weapon","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever being a member of an unlawful assembly is armed with any\n\ndeadly weapon or with a thing which used as a weapon of offence is likely to\n\ncause death, shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both."},{"c":"PC","n":"104","t":"Joining or continuing in unlawful assembly knowing it has been commanded to","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever joins or continues in an unlawful assembly knowing that the\n\nunlawful assembly has been lawfully commanded to disperse shall be punished\n\nwith imprisonment for a term which may extend to five years or with\n\nfine or with both."},{"c":"PC","n":"105","t":"Rioting defined","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whenever force or violence is used by an unlawful assembly or by a\n\nmember thereof in prosecution of the common object of the assembly, every\n\nmember of that assembly is guilty of the offence of rioting."},{"c":"PC","n":"106","t":"Punishment for rioting","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever is guilty of rioting shall be punished with imprisonment for I\n\na term which may extend to three years or with fine or with both."},{"c":"PC","n":"107","t":"Rioting armed with deadly weapon","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever is guilty of rioting being armed with a deadly weapon or I\n\nwith a thing which used as a weapon of offence is likely to cause death, shall\n\nbe punished with imprisonment for a term which may extend to five years or\n\nwith fine or with both."},{"c":"PC","n":"108","t":"Every member of unlawful assembly guilty of offence committed in prosecution of","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"If an offence is committed by a member of an unlawful assembly in\n\nprosecution of the common object of that assembly, every person, who at the\n\ntime of the committing of that offence is a member of the assembly, is guilty\n\nof that offence."},{"c":"PC","n":"109","t":"Promoter of an unlawful assembly liable as a member","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever promotes or does an act with intent to assist the promotion\n\nof an unlawful assembly; shall be punishable as a member of the unlawful:\n\nassembly and for an offence which may be committed by a member thereof in\n\nthe same manner as if he had himself been a member of the unlawful\n\nassembly."},{"c":"PC","n":"110","t":"Joining or continuing in assembly of five or more persons knowing that it has been","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever joins or continues in an assembly of five or more persons.\n\nlikely to cause a disturbance of the public peace knowing that the assembly'\n\nhas been lawfully commanded to disperse, shall be punished with imprisonment\n\nor a term which may extend to one year or with fine or with both. 1\n\nEXPLANATION. If the assembly is an unlawful assembly within the meaning\n\nof section 100 of this Penal Code, the offender will be punishable under section\n\n104 of this Penal Code."},{"c":"PC","n":"111","t":"Wearing and carrying of emblem, flag, etc","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever wears, carries or displays in public any emblem, flag, article\n\nof clothing or other token or device in such manner or on such occasion or in '\n\nsuch circumstances as-\n\n(a) to constitute an offence under any other section of this Penal Code, or\n\nof any other subsisting Act or Law; or\n\n(b) to cause or be likely to cause annoyance to the public or a section there-\n\nof, or a breach of the peace, or disturbance of the public peace, or the\n\ncommission of an offence,\n\nshall be punished with imprisonment for a term which may extend to six\n\nmonths or with fine or with both, and in addition the emblem, flag, article of\n\nclothing or other token or device in respect of which an offence under this section\n\nhas been committed shall be liable to forfeiture."},{"c":"PC","n":"112","t":"Assaulting or obstructing public officer when suppressing riot, etc","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever assaults or threatens to assault or obstructs or attempts to\n\nobstruct a public officer in the discharge of his duty as a public officer in\n\nendeavouring to disperse an unlawful assembly or to suppress a riot or affray,\n\nor uses or threatens or attempts to use criminal force to the public officer, shall\n\nbe punished with imprisonment for a term which may extend to five years or\n\nwith fine or with both."},{"c":"PC","n":"113","t":"Disturbance of public peace","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever in a public place disturbs the public peace shall be punished\n\nwith imprisonment for a term which may extend to three years or with fine\n\nwhich may extend to six hundred naira or with both."},{"c":"PC","n":"114","t":"Inciting disturbance","ch":"Chapter IX – OFFENCES AGAINST THE PUBLIC PEACE","p":"","x":"Whoever does an act with intent to cause or which is likely to cause a\n\nbreach of the peace or disturb the public peace shall be punished with imprisonment\nwhich may extend to three years or with fine which may extend to six\n\nhundred naira or with both."},{"c":"PC","n":"115","t":"Public officers taking gratification in respect of official act","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being or expecting to be a public officer accepts or obtains\n\nor agrees to accept or attempts to obtain from any person for himself or for\n\nany other person any gratification whatever whether pecuniary or otherwise,\n\nother than lawful remuneration, as a motive or reward-\n\n(a) far doing or forbearing to do an official act, or\n\n(b) for showing or forbearing to show in the exercise of his official functions\n\nfavour or disfavour to a person; or\n\n(c) for rendering or attempting to render any service or disservice to any\n\nperson with any department of the public service or with a public\n\nofficer as such,\n\nshall be punished-\n\n(i) with imprisonment for a term which may extend to seven years or with\n\nfine or with both;\n\n(ii) if such public officer is a public officer in the service of the\n\nGovernment of the Federation acting in a judicial capacity or carrying\n\nout the duties of a police officer, with imprisonment for a term which\n\nmay extend to fourteen years or with fine or with both. -\"\n\nEXPLANATION 1. If a person not expecting to be in office obtains a gratification\n\nby deceiving others into a belief that he is about to be in office and that he\n\nwill serve them, he may be guilty of cheating but he is not guilty of an offence\n\nunder this section.\n\nEXPLANATION 2. A public officer who receives a gratification as a motive\n\nfor doing what he does not intend to do or as a reward for doing what he has\n\nnot done, is guilty of an offence under this section.\n\nIllustrations. (a) A an Alkali obtains from Z merchant a situation in Z's\n\noffice for A's brother as a reward to A for deciding a suit in favour of Z. A has\n\ncommitted an offence under this section.\n\n(b) A a District Head accepts a sum of money from a large land-owner. It\n\ndoes not appear that A accepted this sum as a motive or reward for doing or\n\nforbearing to do any particular official act or for rendering or attempting to\n\nrender any particular service to the landowner. But it does appear that A\n\naccepted the sum as a motive or reward for showing general favour in the\n\nexercise of his official functions to the land-owner. A has committed an\n\noffence under this section.\n\n(c) A public officer induces Z erroneously to believe that A's influence with\n\nthe Government has obtained for Z the position of messenger and thus induces\n\nZ to give A money as a reward for this service. A has committed an offence\n\nunder this section."},{"c":"PC","n":"116","t":"Taking gratification in order to influence public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever accepts or obtains or agrees to accept or attempts to obtain\n\nfrom a person for himself or for any other person any gratification whatever\n\nwhether pecuniary or otherwise as a motive or reward for inducing by corrupt\n\nor illegal means a public officer-\n\n(a) to do or forbear to do an official act; or\n\n(b) in the exercise of the official functions of the public officer to show\n\nfavour or disfavour to any person; or\n\n(c) to render or attempt to render service or disservice to a person with a\n\ndepartment of the public service or with a public officer as such,\n\nshall be punished with imprisonment for a term which may extend to three\n\nyears or with fine or with both."},{"c":"PC","n":"117","t":"Abetment by public officer of offence mentioned in section 116","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer, in respect of whom an offence under\n\nsection 116 of this Penal Code is committed, abets the offence, shall be punished\n\nwith imprisonment for a term which may extend to three years or with\n\nfine or with both."},{"c":"PC","n":"118","t":"Offering or giving gratification to public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever offers or gives or agrees to give any gratification whatever\n\nwhether pecuniary or otherwise in the circumstances and for any of the purposes\n\nmentioned in sections 115 and 116 of this Penal Code shall be punished with\n\nimprisonment which may extend to three years or with fine or with both."},{"c":"PC","n":"119","t":"Public officer obtaining valuable thing without consideration from person","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer accepts or obtains or agrees to accept or\n\nattempts to obtain for himself or for any other person any valuable thing without\n\nconsideration or for a consideration which he knows to be inadequate-\n\n(a) from any person whom he knows to have been or to be or to be likely to\n\nbe concerned in a proceeding or business transacted or about to be\n\ntransacted by the public officer or having a connection with the official\n\nfunctions of himself or of a public officer to whom he is subordinate; or\n\n(b) from a person whom he knows to be interested in or related to the\n\nperson so concerned,\n\nshall be punished with imprisonment for a term which may extend to five\n\nyears or with fine or with both.\n\nIllustrations. (a) A, a District Head hires a house of Z, who has a boundary\n\ncase pending before him. It is agreed that A shall pay four naira a month\n\nthe house being such that, if the bargain were made in good faith, A would be\n\nrequired to pay ten naira a month. A has obtained a valuable thing from Z\n\nwithout adequate consideration.\n\n(b) Z's brother is arrested and taken before A an Area Court Judge on a\n\ncharge of perjury. A sells to Z an old cow for twenty naira when its market\n\nvalue is only two naira. The money so obtained by A is a valuable thing\n\nobtained by him without adequate consideration."},{"c":"PC","n":"120","t":"Offering or giving valuable thing without consideration","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever in any of the circumstances mentioned in section 119 of this\n\nn Penal Code offers or gives or agrees to give to a public officer or to any per-\n\ng son, in whom a public officer is interested or to whom he is related, a valuable\n\nthing without consideration or for a consideration which he knows to be inadequate,\n\nshall be punished with imprisonment for a term which may extend to\n\ntwo years or with fine or with both."},{"c":"PC","n":"121","t":"Third person profiting by gratification","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever knowingly profits by a gratification or benefit obtained in\n\nany of the circumstances mentioned in section 115, 116 or 119 of this Penal\n\nCode but does not take an active part in obtaining the gratification or benefit,\n\nshall be punished with imprisonment for a term which may extend to one\n\nyear or with fine or with both."},{"c":"PC","n":"122","t":"Public officer dishonestly receiving money or property not due","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer in his capacity as such dishonestly\n\nreceives from a person any money or other property which he is not authorised\n\nto receive or which is in excess of the amount which he is authorised to\n\nreceive, shall be punished with imprisonment for a term which may extend to\n\nfive years or with fine or with both."},{"c":"PC","n":"123","t":"Public officer disobeying direction of law with intent to cause injury or to save person","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer knowingly disobeys a direction of the\n\nlaw as to the way in which he is to conduct himself as such public officer\n\nintending thereby or knowing himself to be likely thereby-\n\n(a) to cause injury to a person or to the public; or\n\n(b) to save a person from legal punishment or to subject him to a less punishment\n\nthan that to which he is liable or to delay the imposition on any\n\nperson of a legal punishment; or\n\n(c) to save a property from forfeiture or from a seizure or charge to which\n\nit is liable by law or to delay the forfeiture or seizure of any property or\n\nthe imposition or enforcement of a charge on a property,\n\nshall be punished with imprisonment for a term which may extend to two\n\nyears or with fine or with both."},{"c":"PC","n":"124","t":"Public officer framing incorrect document with intent to cause injury","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever, being a public officer, and being as such a public officer charged with\nthe preparation or translation of any document, frames or translates that document in a\nmanner which he knows and believes to be incorrect,\n\nintending thereby to cause or knowing it to be likely that he may thereby cause injury to\na person, shall be punished with imprisonment for a term which may extend to three\nyears or with fine or with both."},{"c":"PC","n":"125","t":"Public officer in judicial proceeding acting contrary to law","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer knowing that he is likely to cause\n\ninjury to a person or intending unlawfully to give a person an advantage\n\nmakes or pronounces in any stage of a judicial proceeding any report, order,\n\njudgment or decision which he knows to be contrary to law, shall be punished\n\nwith imprisonment for a term which may extend to seven years or with fine or\n\nwith both."},{"c":"PC","n":"126","t":"Wrongful committal or confinement by public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever, being a public officer authorised by law to commit persons'\n\nfor trial or to confinement or to keep persons in confinement, commits a\n\nperson for trial or to confinement or keeps a person in confinement-\n\n(a) knowing that he is acting contrary to law; and a\n\n(b) knowing that he is likely to cause injury to a person or intending unlawfully to give a\nperson an advantage,\n\nshall be punished with imprisonment for a term which may extend to seven\n\nyears or with fine or with both."},{"c":"PC","n":"127","t":"Public officer omitting to arrest or aiding escape","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever, being a public officer whose duty it is as a public officer to\n\narrest a person or to keep a person in confinement or custody, intentionally\n\nomits to arrest the person or intentionally suffers that person to escape or\n\nintentionally aids that person in escaping or attempting to escape from the\n\nconfinement or custody, shall be punished as follows, that is to say-\n\n(a) with imprisonment for a term which may extend to fourteen years with\n\nor without fine, if that person is under sentence of death; or\n\n(b) with imprisonment for a term which may extend to seven years with or\n\nwithout fine, if that person is under sentence of imprisonment for a\n\nterm of ten years or upwards or is charged with or liable to be arrested\n\nfor an offence punishable with death; or\n\n(c) with imprisonment for a term which may extend to three years or with\n\nfine or with both, if that person is under sentence of imprisonment for a\n\nterm not extending to ten years or is charged with or liable to be arrest-\n\ned for an offence punishable with imprisonment for a term which may\n\nextend to ten years; or\n\n(d) with imprisonment for a term which may extend to two years or with\n\nfine or with both, in a case not above specified."},{"c":"PC","n":"128","t":"Public officer omitting to arrest or permitting to escape","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever, being a public officer whose duty it is as a public officer to arrest a person\nor to keep a person in confinement or custody, negligently omits to arrest that person or\nnegligently suffers that person to escape from\n\nconfinement or custody, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both."},{"c":"PC","n":"129","t":"Public officer causing danger by omitting to perform duty","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer willfully omits to perform a duty pertaining\n\nto his office which he is legally bound to perform shall, if the omission\n\ncauses or tends to cause danger to human life, health or safety or causes or\n\ntends to cause a riot, be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both."},{"c":"PC","n":"130","t":"Abandonment of duty by public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever being a public officer wrongfully abandons his duties in pre-arranged\nagreement with two or more other public officers shall, if the intention\n\nor effect of the abandonment is to interfere with the performance of a\n\npublic officer to an extent which will cause injury or damage or grave inconvenience\n\nto the community, be punished with imprisonment for a term which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"131","t":"Public officer unlawfully purchasing property","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever, being a public officer and being legally bound: as such\n\npublic officer not to purchase or bid for certain property, purchases or bids for\n\nthat property in his own name or in the name of another or jointly or in shares\n\nwith others, shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both."},{"c":"PC","n":"132","t":"Personating a public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever pretends to hold a particular office as a public officer knowing that he\ndoes not hold that office, or falsely personates any other person\n\nholding that office, and in that assumed character does or attempts to do an act\n\nunder colour of such office, shall be punished with imprisonment for a term\n\nwhich may extend to three years or with fine or with both."},{"c":"PC","n":"133","t":"Wearing dress or carrying token used by public officer","ch":"Chapter X – OFFENCES BY OR RELATING TO PUBLIC OFFICERS SECTION","p":"","x":"Whoever not belonging to a certain class of public officer wears any\n\ndress or carries a token resembling a dress or token used by that class of public\n\nofficer with the intention that it may be believed that he belongs to that class\n\nof public officer, shall be punished with imprisonment for a term which may\n\nextend to six months or with fine which may extend to forty naira or with\n\nboth."},{"c":"PC","n":"134","t":"Absconding to avoid service of summons, notice or order","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever absconds in order to avoid being served with a summons,\n\nnotice or order proceeding from a public officer legally competent as such\n\npublic officer to issue the summons, notice or order, shall be punished-\n\n(a) with imprisonment for a term which may extend to one month or with\n\nfine which may extend to twenty naira or with both; or\n\n(b) if the summons or notice or order is to attend in person or by agent or to\n\nproduce a document in a court of justice, with imprisonment for a term\n\nwhich may extend to six months or with fine which may extend to forty\n\nnaira or with both."},{"c":"PC","n":"135","t":"Preventing service or publication of summons, etc","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever in any manner-\n\n(a) intentionally prevents the serving on himself or on any other person of a\n\nsummons, notice or order proceeding from a public officer legally competent\n\nas such public officer to issue the summons, notice or order; or\n\n(b) intentionally prevents the lawful affixing to any place of the summons,\n\nnotice or order; or\n\n(c) intentionally removes the summons, notice or order from a place to\n\nwhich it is lawfully affixed; or\n\n(d) intentionally prevents the lawful making of a proclamation under the\n\nauthority of any public officer legally competent as such a public officer\n\nto direct that proclamation to be made, shall be punished-\n\n(i) with imprisonment for a term which may extend to one month or\n\nwith fine which may extend to twenty naira or with both; or\n\n(ii) if the summons, notice, order or proclamation is to attend in person\n\nor by agent or to produce a document in a court of justice with\n\nimprisonment for a term which may extend to six months or with\n\nfine which may extend to forty naira or with both."},{"c":"PC","n":"136","t":"Failure to attend in obedience to an order from public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, having been required by a summons, notice, order or\n\nproclamation proceeding from any public officer legally competent as such a\n\npublic officer to issue the same to attend in person or by agent at a certain time\n\nand place, intentionally and without reasonable cause refuses or omits to\n\nattend at the place and time or departs from that place before the time at which it\n\nis lawful for him to depart, shall be punished-\n\n(a) with imprisonment for a term which may extend to one month or with\n\nfine which may extend to twenty naira or with both; or\n\n(b) if the summons, notice, order or proclamation is to attend in person or\n\nby agent in a court of justice, with imprisonment for a term which may\n\nextend to six months or with fine which may extend to forty naira or\n\nwith both."},{"c":"PC","n":"137","t":"Failure to produce document to public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, having been required by a summons, notice, order or proclamation\nproceeding from a public officer legally competent as a public officer to\n\nissue the same to produce or deliver up a document or other thing, intentionally omits so\nto produce or deliver up the same, shall be punished-\n\n(a) with imprisonment for a term which may extend to one month or with\n\nfine which may extend to twenty naira or with both; or\n\n(b) if the document is to be produced or delivered up to a court of justice,\n\nwith imprisonment for a term which may extend to six months or with\n\nfine which may extend to forty naira or with both."},{"c":"PC","n":"138","t":"Failure to give notice or information to public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, being legally bound to give a notice or to furnish information\n\non a subject to a public officer as such, intentionally omits to give that\n\nnotice or to furnish that information in the manner and at the time required by\n\nlaw, shall be punished-\n\n(a) with imprisonment for a term which may extend to one month or with\n\nfine which may extend to twenty naira or with both; or\n\n(b) if the notice or information required to be given is in respect of the\n\ncommission of an offence or is required for the purpose of preventing\n\nthe commission of an offence or in order to arrest an offender, with\n\nimprisonment for a term which may extend to six months or with fine\n\nwhich may extend to forty naira or with both."},{"c":"PC","n":"139","t":"Furnishing false information","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, being legally bound to furnish information on a subject to a\n\nma- public officer as such, furnishes as true information on the subject which he\n\nknows or has reason to believe to be false, shall be punished-\n\n(a) with imprisonment for a term which may extend to six months or with\n\nfine which may extend to forty naira or with both; or\n\n(b) if the information which he is legally bound to give is in respect of the\n\ncommission of an offence or is required for the purpose of preventing\n\nthe commission of an offence or in order to arrest an offender, with\n\nimprisonment for a term which may extend to two years or with fine or\n\nwith both."},{"c":"PC","n":"140","t":"False information with intent to mislead public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever gives to a public officer an information which he knows or\n\nbelieves to be false, intending thereby to cause or knowing it to be likely that\n\nhe will thereby cause the public officer-\n\n(a) to do or to omit anything which the public officer ought not to do or\n\nomit if the true state of facts respecting such information is given were\n\nknown by him; or\n\n(b) to use the lawful power of the public officer to the injury or annoyance\n\nof a person,\n\nshall be punished with imprisonment for a term which may extend to one year\n\nor with fine which may extend to forty naira or with both.\n\nIllustrations. (a) A informs a police officer that Z a policemen subordinate\n\nto such police officer has been guilty of neglect of duty or misconduct\n\nknowing such information to be false and knowing it to be likely that the information\n\nwill cause the police officer to dismiss Z. A has committed an offence\n\nunder this section.\n\n(b) A falsely informs a public officer that Z has contraband goods in a\n\nsecret place knowing such information to be false and knowing that it is likely\n\nthat the consequence of the information will be a search of Z's premises\n\nattended with annoyance to Z. A has committed an offence under this section.\n\n(c) A falsely informs a policeman that he has been assaulted and robbed in the\nneighbourhood of a particular vii/age. He does not mention the name of any person as\none of his assailants but knows it to be likely that in consequence of this information the\npolice will make enquiries and institute searches in the village to the annoyance of the\nvillagers or some of them. A has\n\ncommitted an offence under this section."},{"c":"PC","n":"141","t":"Refusing oath or affirmation when duly required by public officer to make it","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"(1) Whoever refuses to bind ,himself by an oath or affirmation to state\n\nthe truth when required so to bind himself by a public officer legally competent\n\nto require that he shall so bind himself, shall be punished with imprisonment\n\nfor a term which may extend to six months or with fine which may\n\nextend to forty naira or with both,\n\n(2) The provisions of this section shall not apply to a witness in a judicial\n\nproceeding who, having been called upon to take an oath or make a solemn\n\naffirmation that he will speak the truth under subsection (1) of section 229 of\n\nthe Criminal Procedure Code, refuses to take the oath or make the affirmation\n\nunder the provisions of section 230 of the Criminal Procedure Code."},{"c":"PC","n":"142","t":"Refusing to answer public officer authorized to question","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, being legally bound to answer questions put to him on a\n\nsubject by a public officer in the exercise of the lawful powers of the public\n\nofficer, refuses to answer a question, shall be punished with imprisonment for\n\na term which may extend to six months or with fine which may extend to forty\n\nnaira or with both."},{"c":"PC","n":"143","t":"Refusing to sign statement","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever refuses to sign a statement made by him when required to sign that\nstatement by a public officer legally competent to require that he shall sign that\nstatement, shall be punished with imprisonment for a term\n\nwhich may extend to three months or with fine which may extend to twenty\n\nnaira or with both."},{"c":"PC","n":"144","t":"Resistance to taking of property by lawful authority of public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever offers a resistance to the taking of a property by the lawful authority of a\npublic officer knowing or having reason to believe that he is a public officer, shall be\npunished with imprisonment for a term which may extend to six months or with fine which\nmay extend to forty naira or with both."},{"c":"PC","n":"145","t":"Obstructing sale of property offered for sale by authority of public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever intentionally obstructs the sale of property offered for sale by the lawful\nauthority of a public officer as such shall be punished with imprisonment for a term which\nmay extend to one month or with fine which may extend to twenty naira or with both."},{"c":"PC","n":"146","t":"Removing property under lawful seizure","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, when a property has been attached or taken by the lawful authority of a\npublic officer, knowingly and with intent to hinder or defeat the attachment or process\nreceives, removes, retains, conceals, or disposes of the property, shall be punished with\nimprisonment for three years or with fine or with both."},{"c":"PC","n":"147","t":"Illegal purchase or bid for property offered for sale by authority of public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever at the sale of property held by the lawful authority of a public\n\nofficer as such purchases or bids for the property on account of a person\n\nwhether himself or any other, whom he knows to be under a legal incapacity\n\nto purchase that property at that sale, or bids for that property not intending to\n\nperform the obligations under which he lays himself by that bidding, shall be\n\npunished with imprisonment for a term which may extend to one month or\n\nwith fine which may extend to twenty naira or with both."},{"c":"PC","n":"148","t":"Obstructing public officer in discharge of functions","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever voluntarily obstructs a public officer in the discharge of his\n\npublic functions shall be punished with imprisonment for a term which may\n\nextend to three months or with fine which may extend to forty naira or with\n\nboth."},{"c":"PC","n":"149","t":"Obstructing public officer in discharge of duty under Imperial law, or written law","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever voluntarily obstructs a public officer in the discharge of his\n\npublic functions under an Imperial law or written law or voluntarily obstructs a\n\nperson engaged in the discharge of a duty imposed on him by an Imperial\n\nlaw or written law shall be punished with imprisonment which may extend\n\ntwo years or with fine or with both."},{"c":"PC","n":"150","t":"Failing to assist public officer when bound by law to assist","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, being legally bound to render or furnish assistance to a\n\npublic officer in the execution of his public duty, intentionally omits to give\n\nsuch assistance, shall be punished with imprisonment for a term which may\n\nextend to six months or with fine which may extend to forty naira or with\n\nboth."},{"c":"PC","n":"151","t":"Contravention of residence order","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever being legally prohibited from residing in a district, or being\n\nlegally ordered to reside in any district, intentionally disobeys the prohibition\n\nor order shall be punished with imprisonment for a term which may extend to\n\nsix months or with fine which may extend to one hundred naira or with both."},{"c":"PC","n":"152","t":"Disobedience to order duly promulgated by public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever, knowing that by an order promulgated by a public officer\n\nlegally empowered to promulgate that order he is directed to abstain from a\n\ncertain act, or to take certain action with respect to certain property in his possession or\nunder his management, disobeys the direction, shall-\n\n(a) if the disobedience causes or tends to cause obstruction, annoyance or\n\ninjury or risk of obstruction, annoyance or injury to any person lawfully\n\nemployed, be punished with imprisonment for a term which may\n\nextend to three months or with fine which may extend to forty naira or\n\nwith both;\n\n(b) if the disobedience causes or tends to cause danger to human life, health\n\nor safety or causes or tends to cause a riot or affray, shall be punished\n\nwith imprisonment for a term which may extend to six months or with\n\nfine which may extend to one hundred naira or with both."},{"c":"PC","n":"153","t":"Threat of injury to public officer","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever holds out a threat of injury to a public officer or to a person in\n\nwhom he believes that public officer to be interested, for the purpose of inducing\n\nthat public officer to do an act or to forbear or delay to do an act connected with\n\nthe exercise of the public functions of that public officer, shall be punished with\n\nimprisonment for a term which may extend to two years or with fine or with\n\nboth."},{"c":"PC","n":"154","t":"Threat of injury to induce person to refrain from applying for protection to public","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever holds out a threat of injury to a person for the purpose of\n\ninducing that person to refrain or desist from applying for protection against an\n\ninjury to a public officer legally empowered as such to give that protection or to\n\ncause that protection to be given, shall be punished with imprisonment for\n\nterm which may extend to one year or with fine or with both."},{"c":"PC","n":"155","t":"Intentional insult or interruption to public officer sitting in judicial proceeding","ch":"Chapter XI – CONTEMPTS OF THE LAWFUL AUTHORITY OF PUBLIC OFFICERS","p":"","x":"Whoever intentionally offers an insult or causes an interruption to a public\n\nofficer while the public officer is sitting in any stage of a judicial proceeding shall\n\nbe punished with imprisonment for a term which may extend to six months or\n\nwith fine which may extend to forty naira or with both."},{"c":"PC","n":"156","t":"Giving false evidence defined","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever, being legally bound by an oath or by an express provision of\n\nlaw to state the truth or being bound by law to make a declaration upon a subject,\n\nmakes a statement, verbally or otherwise, which is false in a material particular\n\nand which he either knows or believes to be false or does not believe to be true, is\n\nsaid to give false evidence.\n\nEXPLANATION 1. A false statement as to the belief of the person attesting is\n\nwithin the meaning of this section and a person may be guilty of giving false\n\nevidence by stating that he believes a thing which he does not believe, as well as\n\nby stating that he knows a thing which he does not know.\n\nEXPLANATION 2. A material particular within the meaning of this section\n\nmeans a particular which is material to any question then in issue or intended to\n\nbe raised in that proceeding.\n\nIllustrations. (a) A, in support of a just claim which B has against Z for ten\n\npounds, falsely swears on a trial that he heard Z admit the justice of B' s claim. A\n\nhas given false evidence\n\n(b) A, being bound by an oath to state the truth, states that he believes a certain\n\nsignature to be the handwriting of Z, when he does not believe it to be the\n\nhandwriting of Z. Here A states that which he knows to be false and therefore\n\ngives false evidence.\n\n(c) A, knowing the general character of Z's handwriting states that he\n\nbelieves a certain signature to be the hand writing of Z; A in good faith believing\n\nit to be so. Here A's statement is merely as to his belief and is true as to his\n\nbelief and therefore although the signature may not be the hand writing of Z, A\n\nhas not given false evidence.\n\n(d) A, being bound by an oath to state the truth, states that he knows that Z\n\nwas at a particular place on a particular day, not knowing anything upon the\n\nsubject. A gives false evidence whether Z ,'as at that place on the day named\n\nor not."},{"c":"PC","n":"157","t":"Fabricating false evidence defined","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever causes a circumstance to exist or makes a false entry in a\n\nbook or record or makes a document containing a false statement intending that\n\nthe circumstance, false entry or false statement may appear in evidence or\n\nbe used in a judicial proceeding or in a proceeding taken by law before a public\n\nofficer as such or before an arbitrator and that the circumstance, false entry or\n\nfalse statement so appearing in evidence or so used may cause a person, who\n\nin that proceeding is to form an opinion upon the circumstance, entry or statement,\n\nto entertain an erroneous opinion touching a point material to the result\n\nof the proceeding, is said to fabricate false evidence.\n\nIllustrations. (a) A puts jewels into a box belonging to Z with the intention\n\nthat they may be found in that box and that this circumstance may cause Z\n\nto be convicted of theft. A has fabricated false evidence.\n\n(b) A makes a false entry in his shop-book for the purpose of using it as\n\ncorroborative evidence in a court of justice. A has fabricated false evidence.\n\n(c) A, with the intention of causing Z to be convicted of a criminal conspiracy,\n\nwrites a letter in imitation of Z' s handwriting purporting to be addressed to an\n\naccomplice in such criminal conspiracy and puts the letter in a place which he\n\nknows that the police are likely to search. A has fabricated false evidence."},{"c":"PC","n":"158","t":"Punishment for false evidence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"(1) Whoever intentionally gives false evidence in any stage of a judicial\n\nproceeding or fabricates false evidence for the purpose of its being used in\n\nany stage of a judicial proceeding shall be punished with imprisonment for a\n\nterm which may extend to fourteen years and shall also be liable to fine.\n\n(2) Whoever intentionally gives or fabricates false evidence in any other\n\ncase, shall be punished with imprisonment for a term which may extend to\n\nseven years and shall also be liable to fine.\n\nIllustration. A, in an inquiry before a magistrate for the purpose of ascertaining\n\nwhether Z ought to be committed for trial, makes on oath a statement\n\nwhich he knows to be false. As this inquiry is a stage of a judicial proceeding.\n\nA has given false evidence."},{"c":"PC","n":"159","t":"Giving false evidence to procure conviction of capital offence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"(1) Whoever gives or fabricates false evidence intending thereby to\n\ncause or knowing it to be likely that he will thereby cause a person to be\n\nconvicted of an offence which is punishable with death shall be punished with\n\nimprisonment for a term which may extend to imprisonment for life and shall\n\nalso be liable to fine.\n\n(2) If an innocent person is convicted and executed in consequence of that\n\nfalse evidence, the person who gave or fabricated the false evidence shall be\n\npunished with death."},{"c":"PC","n":"160","t":"Giving false evidence to procure conviction of offence punishable with","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever gives or fabricates false evidence intending thereby to cause\n\nor knowing it to be likely that he will thereby cause a person to be convicted\n\nof an offence which is not punishable with death but is punishable with\n\nimprisonment for a term of seven years or upwards shall be punished as a person\n\nconvicted of that offence would be liable to be punished."},{"c":"PC","n":"161","t":"Using evidence known to be false","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever uses or attempts to use as true or genuine evidence an Us\n\nevidence which he knows to be false or fabricated, shall be punished in the\n\nsame manner as if he gave or fabricated false evidence."},{"c":"PC","n":"162","t":"Issuing or signing false evidence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever issues or signs a certificate required by law to be given or\n\nsigned or relating to a fact of which the certificate is legally admissible in\n\nevidence knowing or believing that the certificate is false in a material point,\n\nshall be punished in the same manner as if he gave false evidence."},{"c":"PC","n":"163","t":"Using as true a certificate known to be false","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever uses or attempts to use a certificate mentioned in section 162"},{"c":"PC","n":"164","t":"False statement in declaration which is by law receivable as evidence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"(I) Whoever in a declaration made or subscribed by him, which\n\ndeclaration a court of justice or a public officer or other person is bound or\n\nauthorised by law to receive as evidence of a fact, makes a statement, which is\n\nfalse and which he either knows or believes to be false or does not believe to\n\nbe true, touching a point material to the object for which the declaration is\n\nmade or used, shall be punished in the same manner as if he gave false evidence.\n\n(2) Whoever uses or attempts to use as true a declaration knowing the same\n\nto be false in a material point, shall be punished in the same manner as if he\n\ngave false evidence.\n\nEXPLANATION. A declaration, which is inadmissible merely upon the ground\n\nof some informality, is a declaration within the meaning of this section."},{"c":"PC","n":"165","t":"False translation","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever knowingly makes a false translation of the evidence of a\n\nwitness or of the statement of an accused person or of a party to a civil suit or\n\nmakes a false translation or copy of a document with the intention that the\n\ntranslation or copy shall be used in a manner in a judicial proceeding or knowing\n\nthat it is likely to be so used, and whoever knowingly uses the translation\n\nor copy in a manner in a judicial proceeding, shall be punished in the same\n\nmanner as if he gave false evidence."},{"c":"PC","n":"166","t":"Destruction of document to prevent its production as evidence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever secretes or destroys a document, which he may be lawfully\n\ncompelled to produce as evidence in a court of justice or in a proceeding do\n\nlawfully held before a public officer as such, or obliterates or renders illegible\n\nthe whole or a part of the document with the intention of preventing the same\n\nfrom being produced or used as evidence before that court or public officer as\n\naforesaid or after he shall have been lawfully summoned or required to produce\n\nthe same for that purpose, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both."},{"c":"PC","n":"167","t":"Causing disappearance of evidence of offence or giving false information to screen","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever, knowing or having reason to believe that an offence has\n\nbeen committed, causes any evidence of the commission of the offence to\n\ndisappear with the intention of screening the offender from legal punishment, or\n\nwith a like intention of intending to prevent his arrest gives an information\n\nrespecting the offence which he knows or believes to be false or harbours or\n\nconceals a person whom he knows or has reason to believe to be the offender,\n\nshall be punished with imprisonment for a term which may extend to five\n\nyears and shall also be liable to fine.\n\nEXPLANATION. In this section the word \"offence\" includes an act done outside the\nFederal Capital Te rritory, Abuja, which if done in the Federal Capital Territory, Abuja\nwould be an offence and the punishment for the offence shall be deemed to be the\nsame as the punishment would be if the act were done in the Federal Capital Territory,\nAbuja.\n\nIllustration. A, knowing that B has murdered Z, assists B to hide the body\n\nwith the intention of screening B from punishment. A is liable to imprisonment\n\nfor five years and also to fine."},{"c":"PC","n":"168","t":"Taking gratification to screen an offender from punishment","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"(1) Whoever accepts or attempts to obtain or agrees to accept a gratification for\nhimself or any other person or a restitution of property to himself or any other person, in\nconsideration of his concealing an offence or of his screening a person from legal\npunishment for an offence or of his not proceeding against any person for the purpose of\nbringing him to legal punishment,\n\nshall be punished with imprisonment for a term which may extend to five years and shall\nalso be liable to fine.\n\n(2) This section shall not extend to a case in which the offence may lawfully be\ncompounded.\n\nEXPLANATION. In this section the word \"offence\" includes an act done outside the\nFederal Capital Territory, Abuja, which if done in the Federal Capital\n\nTerritory, Abuja, would be an offence and the punishment for the offence\n\nshall be deemed to be the same as the punishment would be if the act were\n\ndone in the Federal Capital Territory, Abuja."},{"c":"PC","n":"169","t":"Offering gratification in consideration of screening offender","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"(1) Whoever gives or causes or offers or agrees to give a cause a\n\ngratification to any other person or to restore or cause the restoration of a\n\nproperty to any other person, in consideration of that other person's concealing\n\nan offence or of his screening a person from legal punishment for an offence\n\nor of his not proceeding against a person for the purpose of bringing him to\n\nlegal punishment, shall be punished with imprisonment for a term which may\n\nextend to seven years and shall also be liable to fine.\n\n(2) This section shall not extend to a case in which the offence may lawfully be\ncompounded.\n\nEXPLANATION. In this section the word offence includes an act done outside\n\nthe Federal Capital Territory, Abuja, which if done in the Federal Capital\n\nTerritory, Abuja, would be an offence and the punishment for the offence\n\nshall be deemed to be the same as the punishment would be if the act were\n\ndone in the Federal Capital Territory, Abuja."},{"c":"PC","n":"170","t":"Penalty for harbouring robber or brigand","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever, knowing or having reason to believe that some persons are\n\nabout to commit or have recently committed robbery a brigandage, harbours\n\nthem or any of them with the intention of facilitating the commission of that\n\nrobbery or brigandage or of screening them or any of them from punishment,\n\nshall be punished with imprisonment for a term which may extend to seven\n\nyears and shall also be liable to fine.\n\nEXPLANATION. For the purposes of this section it is immaterial whether the\n\nrobbery or brigandage is intended to be committed or has been committed\n\nwithin the Federal Capital Territory, Abuja or elsewhere."},{"c":"PC","n":"171","t":"Resistance or obstruction to lawful arrest of another person","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever intentionally offers any resistance or illegal obstruction to\n\nthe lawful arrest of any other person or rescues or attempts to rescue any other\n\nperson from any confinement or custody in which that person is lawfully\n\ndetained, shall be punished-\n\n(a) with imprisonment for a term which may extend to seven years or with\n\nfine or with both; and\n\n(b) if such other person is under sentence of death, shall be punished with\n\nimprisonment which may extend to imprisonment for life and shall also\n\nbe liable to fine."},{"c":"PC","n":"172","t":"Resistance or obstruction by a person to his lawful arrest or escape","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever intentionally offers any resistance or illegal obstruction to\n\nthe lawful arrest of himself for an offence with which he is charged or of\n\nwhich he has been convicted or escapes or attempts to escape from any\n\ncustody in which he is lawfully detained for an offence, shall be punished with\n\nimprisonment for a term which may extend to seven years or with fine or with\n\nboth."},{"c":"PC","n":"173","t":"Resistance or obstruction to lawful arrest or escape, in cases not provided for by","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever in a case not provided for in section 172 of this Penal Code\n\nintentionally offers any resistance or illegal obstruction to the lawful arrest of\n\nhimself or escapes or attempts to escape from any custody in which he is lawfully\ndetained, shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both."},{"c":"PC","n":"174","t":"Fraudulent removal of property to prevent lawful seizure or execution","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever, with intent to prevent any property of himself or any other\n\nperson or any interest therein-\n\n(a) from being taken as a forfeiture or in satisfaction of a fine under a\n\nsentence which has been pronounced or which he knows to be likely to\n\nbe pronounced by a court of justice or other competent authority; or\n\n(b) from being taken in execution of a decree or order, which has been made\n\nor which he knows to be likely to be made by a court of justice; or\n\n(c) from being distributed according to law amongst the creditors of him-\n\nself or that other person; or\n\n(d) from being available according to law for payment of the debts of himself\n\nor that other person,\n\ndishonestly or fraudulently removes or conceals or assists in removing or concealing that\nproperty or dishonestly or fraudulently transfers, delivers or\n\nreleases such property or any interest therein to any person or practises a\n\ndeception touching the same or accepts or dishonestly or fraudulently accepts,\n\nreceives or claims that property or any interest therein, knowing that he has no\n\nright or rightful claim thereto, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both.\n\nEXPLANATION. In this section \"property\" includes rights of action and property of every\nother description whether movable or immovable and whether\n\ncorporeal or incorporeal."},{"c":"PC","n":"175","t":"Fraudulently suffering decree for sum not due","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever fraudulently causes or suffers a decree or order to be passed\n\nurn against him at the suit of a person for a sum not due or for a larger sum than is\n\ndue to that person or for any property or interest in property to which that\n\nperson is not entitled or fraudulently causes or suffers a decree a order to be\n\nexecuted against him after it has been satisfied or for anything in respect of\n\nwhich it has been satisfied, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both.\n\nIllustration. A institutes a suit against Z. Z knowing that A is likely to\n\nobtain a decree against him fraudulently suffers a judgment to pass against\n\nhim for a large amount at the suit of B, who has no just claim against him. in\n\norder that B, either on his own account or for the benefit of Z, may share in\n\nthe proceeds of any sale of Z' s property which may be made under A's decree.\n\nZ has committed an offence under this section."},{"c":"PC","n":"176","t":"Fraudulently obtaining decree for sum not due","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever fraudulently obtains a decree or order against a person for a\n\nsum not due or for a larger sum than is due or for any property or interest in\n\n1m property to which he is not entitled or fraudulently causes a decree or order to\n\nbe executed against a person after it has been satisfied or for anything in\n\nrespect of which it has been satisfied or fraudulently suffers or permits any act\n\nto be done in his name, shall be punished with imprisonment for a term which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"177","t":"Dishonest or fraudulent execution of deed of transfer containing false statement of","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever dishonestly or fraudulently signs, executes or becomes a\n\nparty to a deed or an instrument, which purports to transfer or subject to a\n\ncharge any property or any interest therein and which contains a false statement\nrelating to the consideration for that transfer or charge or relating to the\n\nperson or persons for whose use or benefit it is really intended to operate, shall\n\nn be punished with imprisonment for a term which may extend to two years or\n\nwith fine or with both."},{"c":"PC","n":"178","t":"Giving false information respecting an offence","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever, knowing or having reason to believe that an offence has\n\nbeen committed, gives an information respecting that offence which he knows\n\nor believes to be false, shall be punished with imprisonment for a term which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"179","t":"False personation","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever falsely personates another, whether that other is an actual or\n\nfictitious person, and in that assumed character makes an admission or statement,\n\nor causes a process to be issued or becomes bail or security, or d
