 shown that he was trying the keys or\nattempting to enter the shop.\n\nNote.-For sections 410 to 477 of this Penal Code, see The Penal Code Northern States)\nFederal Provisions Act (Cap. 345) of the Revised Laws of\n\nthe Federation of Nigeria 1990 where they have been published as a Schedule to that\nAct."},{"c":"PC","n":"410","t":"See the Penal Code (Northern States) (Federal Provisions)","ch":"Chapter XXV – VAGABONDS","p":"","x":"[Text of this section was not found in the source PDF.]","m":1}],TIPS={"CC-316": ["Murder starts in the mind: intent to kill, or intent to cause grievous harm (other limbs are in the text).", "Murder: unlawful killing with intent to cause death or grievous harm, among other circumstances listed."], "CC-317": ["Manslaughter is what is left once murder is taken out.", "Unlawful killing in circumstances that do not amount to murder."], "CC-319": ["Murder = death sentence, but juveniles are treated separately (offender under 17 at the time).", "Sentence of death, subject to special provisions for juveniles."], "CC-325": ["Manslaughter: the ceiling is life imprisonment, not death.", "Liable to imprisonment for life."], "CC-357": ["Forced, frightened or tricked consent is not consent.", "Unlawful carnal knowledge of a woman or girl without consent, or with consent obtained by force, threats, intimidation, fear of harm or false representation as to the nature of the act."], "CC-358": ["Rape (Criminal Code): life imprisonment, with or without caning.", "Liable to imprisonment for life, with or without caning."], "CC-383": ["Stealing = TAKE or CONVERT, plus FRAUDULENT intent.", "Fraudulently taking, or fraudulently converting, anything capable of being stolen."], "CC-390": ["Default sentence is 3 years; special things (like wills) carry their own penalties.", "Felony; three years if no other punishment is provided; special cases follow."], "CC-401": ["Robbery = Stealing + Violence (or threat of it).", "Stealing, plus actual or threatened violence at, just before or just after the stealing, to obtain or keep the thing or overcome resistance."], "CC-402": ["Criminal Code robbery: not less than 21 years; armed offenders are treated more heavily (see subsection 2).", "Imprisonment for not less than 21 years; aggravated if armed or in company of an armed person."], "CC-411": ["Break IN with intent, or break OUT after a felony.", "Breaking and entering a dwelling-house of another with intent to commit a felony, or breaking out after entering with such intent or after committing a felony there."], "CC-421": ["Cheating = a trick or device to get property.", "Obtaining anything capable of being stolen, or inducing its delivery, by a fraudulent trick or device."], "CC-443": ["Arson = WILFUL fire on the listed things (buildings, vessels, stacks, mines).", "Wilfully setting fire to any building or structure, vessel, stack of produce or fuel, or a mine."], "CC-465": ["Forgery = false document + knowing it is false + intent it be taken as genuine.", "Making a false document knowing it to be false, intending it to be used or acted upon as genuine to someone's prejudice."], "PC-220": ["Three routes to culpable homicide: Intention, Knowledge, Negligence (I-K-N).", "Causing death by an act done (a) with intention to cause death or likely fatal injury, (b) with knowledge that death is likely, or (c) by a rash or negligent act."], "PC-221": ["Death only when intent is present (or knowledge that death was probable); section 222 carves out exceptions.", "Punishable with death where the act is done with intention to cause death, or the doer knew or had reason to know death was probable, except in the section 222 circumstances."], "PC-224": ["Culpable homicide not punishable with death: life or any lesser term, or fine, or both.", "Imprisonment for life or any less term, or fine, or both."], "PC-283": ["Rape (Penal Code): life or any lesser term, plus fine.", "Imprisonment for life or any less term, and liable to fine."], "PC-287": ["Theft: up to 5 years, or fine, or both. Compare Criminal Code stealing: 3 years default.", "Imprisonment up to five years, or fine, or both."], "PC-298": ["Penal Code robbery: up to 10 years plus fine (heavier on the highway between sunset and sunrise). Compare Criminal Code: not less than 21 years.", "Imprisonment up to ten years and liable to fine, with heavier cases listed."], "PC-322": ["Cheating: up to 3 years, or fine, or both.", "Imprisonment up to three years, or fine, or both."], "PC-102": ["Just being a member of an unlawful assembly: up to 1 year, or fine, or both.", "Imprisonment up to one year, or fine, or both."], "PC-106": ["Rioting: up to 3 years, or fine, or both.", "Imprisonment up to three years, or fine, or both."], "PC-97": ["Conspiracy with no express penalty is punished as if you had abetted the offence.", "Where no express provision exists, punished as if the person had abetted that offence."]};

function search(q){const ts=terms(q),res=[];for(const d of DATA){if(!inScope(d)||!ts.every(t=>d.h.includes(t)))continue;let s=0;const tl=d.t.toLowerCase();if(d.n.toLowerCase()===q.toLowerCase())s+=1000;for(const t of ts){if(tl.includes(t))s+=40;if(tl.startsWith(t))s+=10;s+=Math.min(8,d.h.split(t).length-1)}res.push([s,d])}
 res.sort((a,b)=>b[0]-a[0]||a[1].i-b[1].i);return`<p class="note">${res.length} result${res.length==1?'':'s'}${res.length>80?' (best 80 shown)':''}</p>`+(res.slice(0,80).map(r=>item(r[1],ts,true)).join('')||'<p class="note">Nothing found. Try one word, or switch to Both codes.</p>')}
let dp=null;const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(tab==='home'&&!topic&&!$('#q').value.trim())render()});
window.addEventListener('appinstalled',()=>{dp=null;render()});
function installCard(){if(standalone)return'';if(dp)return'<button class="big" data-act="install"><b>Install JURISCODIA</b><br><span class="tag">Add it to your home screen and use it offline.</span></button>';if(ios)return'<div class="tip"><b>Install on iPhone:</b> open this page in Safari, tap Share, then Add to Home Screen.</div>';return''}
function home(){const last=byId[recent[0]],q=stats.a?Math.round(100*stats.c/stats.a):0,nn=Object.keys(notes).filter(k=>notes[k]).length;
 let h=installCard()+`<div class="stats">${last?`<button class="stat" data-id="${last.id}"><span>Continue reading</span><b>${NAME[last.c]} s. ${esc(last.n)}</b><span>${esc(last.t.slice(0,40))}</span></button>`:'<div class="stat"><span>Continue reading</span><b>Nothing yet</b><span>Open any section</span></div>'}
 <button class="stat" data-t="saved"><span>Saved and noted</span><b>${saved.length} saved · ${nn} notes</b></button>
 <button class="stat" data-t="study"><span>Quiz progress</span><b>${stats.a?q+'% correct':'Not started'}</b><span>${stats.a} answered</span></button>
 <button class="stat" data-t="study"><span>Flashcards</span><b>${Object.values(box).filter(b=>b>=3).length} known</b><span>of ${DATA.filter(real).length} sections</span></button></div><h2>Browse by topic</h2><div class="tiles">`;
 for(const t of [...TOPICS.map(x=>x[0]),'Other']){const n=DATA.filter(d=>inScope(d)&&d.tp===t&&real(d)).length;if(n)h+=`<button class="tile" data-topic="${esc(t)}"><b>${esc(t)}</b><span>${n} sections</span></button>`}
 h+='</div>';const r=recent.map(i=>byId[i]).filter(d=>d&&inScope(d)).slice(0,5);if(r.length)h+='<h2>Recently opened</h2>'+r.map(d=>item(d)).join('');return h}
function topicView(t){let h=`<button class="ib" data-back="1">All topics</button><h2>${esc(t)}</h2>`;for(const c of['CC','PC']){if(code!=='ALL'&&code!==c)continue;const l=DATA.filter(d=>d.c===c&&d.tp===t&&real(d));if(l.length)h+=`<h2 class="${c}t">${NAME[c]} (${l.length})</h2>`+l.map(d=>item(d)).join('')}return h}
function browse(){let h='';for(const c of['CC','PC']){if(code!=='ALL'&&code!==c)continue;h+=`<h2 class="${c}t">${NAME[c]}</h2>`;const gs=[];for(const d of DATA){if(d.c!==c)continue;const k=(d.p?d.p+' / ':'')+d.ch;let g=gs[gs.length-1];if(!g||g.k!==k){g={k,l:[]};gs.push(g)}g.l.push(d)}window['G'+c]=gs;h+=gs.map((g,i)=>`<details data-c="${c}" data-g="${i}"><summary>${esc(g.k||'General')}</summary></details>`).join('')}return h}
let pick={CC:null,PC:null},cmpTopic=TOPICS[0][0];
function compare(){let h=`<p class="note">Pick a topic, tap one section from each code, and read them stacked together.</p><div class="chips">${TOPICS.map(x=>x[0]).map(t=>`<button data-ct="${esc(t)}" aria-pressed="${t===cmpTopic}">${esc(t)}</button>`).join('')}</div>`;
 for(const c of['CC','PC']){const l=DATA.filter(d=>d.c===c&&d.tp===cmpTopic&&real(d));h+=`<h2 class="${c}t">${NAME[c]} (${l.length})</h2>`+(l.slice(0,60).map(d=>item(d,[],false,pick[c]===d.id)).join('')||'<p class="note">No sections in this topic.</p>')}
 if(pick.CC&&pick.PC){h+='<h2>Side by side</h2>';for(const c of['CC','PC']){const d=byId[pick[c]];h+=`<div class="${c}t"><b>${NAME[c]} s. ${esc(d.n)} – ${esc(d.t)}</b></div><div class="cmp">${esc(d.x.slice(0,2500))}${d.x.length>2500?'…':''}</div>`}}return h}
let fc=null,qz=null;
function study(){if(fc)return flash();if(qz)return quiz();
 return`<div class="stats"><div class="stat"><span>Quiz</span><b>${stats.a?Math.round(100*stats.c/stats.a):0}%</b><span>${stats.c}/${stats.a} correct</span></div><div class="stat"><span>Flashcards known</span><b>${Object.values(box).filter(b=>b>=3).length}</b></div></div>
 <button class="big" data-act="flash">Flashcards<br><span class="tag">Titles on the front; number, memory tip and text on the back. Follows your code choice${topic?' and the topic "'+esc(topic)+'"':''}.</span></button>
 <button class="big" data-act="quiz">10-question quiz<br><span class="tag">Match titles to section numbers and the other way round.</span></button>
 <p class="note">Memory tips exist for ${Object.keys(TIPS).length} core offences (green bar in the reader). Tips are study aids written from the text in your PDFs: always check the section itself.</p>`}
const deck=()=>DATA.filter(d=>inScope(d)&&real(d)&&(!topic||d.tp===topic));
function flash(){if(!fc.q.length){fc.q=deck().sort((a,b)=>(box[a.id]||0)-(box[b.id]||0)||Math.random()-.5).slice(0,30);fc.i=0}
 const d=fc.q[fc.i];if(!d){fc=null;return'<p class="note">Deck finished.</p><button class="ib" data-t="study">Back</button>'}fc.id=d.id;const tp=TIPS[d.id];
 return`<button class="ib" data-act="exit">Exit</button> <span class="tag">${fc.i+1} of ${fc.q.length}</span><div class="card"><span class="tag ${d.c}t">${NAME[d.c]} · ${esc(d.tp)}</span><h3>${esc(d.t)}</h3>${fc.f?`<p><b>Section ${esc(d.n)}</b></p>${tp?`<div class="tip">${esc(tp[0])}</div>`:''}<div class="snip">${esc(d.x.slice(0,380))}…</div>`:'<p class="note">Do you remember the section number and what it says?</p>'}</div>`+(fc.f?'<div class="two"><button class="big bad" data-act="again">Again</button><button class="big ok" data-act="know">Got it</button></div>':'<button class="big" data-act="flip">Show answer</button>')+`<button class="ib" data-id="${d.id}">Open section</button>`}
function mkQ(){const pool=DATA.filter(d=>real(d)&&inScope(d)&&(!topic||d.tp===topic));const qs=[];if(pool.length<8)return qs;for(let n=0;n<10;n++){const d=pool[Math.floor(Math.random()*pool.length)];const same=pool.filter(x=>x.c===d.c&&x.id!==d.id);const ds=[];while(ds.length<3&&same.length>3){const x=same[Math.floor(Math.random()*same.length)];if(!ds.includes(x))ds.push(x)}
 if(ds.length<3){n--;continue}qs.push({d,t:Math.random()<.5,opts:[d,...ds].sort(()=>Math.random()-.5)})}return qs}
function quiz(){const k=qz.q[qz.i];if(!k)return`<div class="card"><h3>Score: ${qz.s} / ${qz.q.length}</h3></div><button class="big" data-act="quiz">Another round</button><button class="ib" data-act="exit">Done</button>`;
 const d=k.d;return`<button class="ib" data-act="exit">Exit</button> <span class="tag">${qz.i+1} of ${qz.q.length}</span><div class="card"><span class="tag ${d.c}t">${NAME[d.c]}</span><h3>${k.t?`What is section ${esc(d.n)} about?`:`Which section is “${esc(d.t)}”?`}</h3></div>`+k.opts.map((o,j)=>`<button class="big ${qz.a!=null?(o.id===d.id?'ok':j===qz.a?'bad':''):''}" data-ans="${j}" ${qz.a!=null?'disabled':''}>${k.t?esc(o.t):'Section '+esc(o.n)}</button>`).join('')+(qz.a!=null?`<button class="big" data-act="nextq">${qz.i+1<qz.q.length?'Next question':'See score'}</button><button class="ib" data-id="${d.id}">Open section</button>`:'')}
function savedView(){const a=saved.map(i=>byId[i]).filter(Boolean),n=Object.keys(notes).filter(k=>notes[k]&&byId[k]&&!saved.includes(k)).map(i=>byId[i]),hh=Object.keys(hls).filter(k=>hls[k].length&&byId[k]).map(i=>byId[i]);
 return(a.length?'<h2>Saved</h2>'+a.map(d=>item(d)).join(''):'<p class="note">Nothing saved yet. Open a section and tap Save.</p>')+(n.length?'<h2>Sections with notes</h2>'+n.map(d=>item(d)).join(''):'')+(hh.length?'<h2>Sections with highlights</h2>'+hh.map(d=>item(d)).join(''):'')}
const credit=()=>'<div class="credit"><b>JURISCODIA</b><br>Auxano Institute of Technology services<br><a href="mailto:services.auxano@gmail.com">services.auxano@gmail.com</a> · <a href="tel:+2348140065655">+234 8140065655</a></div>';
function render(){const q=$('#q').value.trim();document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===tab&&!q));
 $('#main').innerHTML=(q?search(q):tab==='home'?(topic?topicView(topic):home()):tab==='browse'?browse():tab==='compare'?compare():tab==='study'?study():savedView())+((tab==='home'&&!topic&&!q)||(tab==='study'&&!fc&&!qz&&!q)?credit():'')}
function linkify(s,c){return esc(s).replace(/\b(sections?)\s+(\d{1,3}[A-Z]?)\b/gi,(m,w,n)=>byId[c+'-'+n.toUpperCase()]?`${w} <a href="#" data-go="${c}-${n.toUpperCase()}">${n}</a>`:m)}
function open(id,push=true){const d=byId[id];if(!d)return;cur=d.i;const same=DATA.filter(x=>x.c===d.c),tp=TIPS[id],hh=hls[id]||[];
 $('#art').innerHTML=`<div class="tag" style="color:var(--${d.c.toLowerCase()})">${NAME[d.c]}${d.p?' · '+esc(d.p):''}<br>${esc(d.ch)} · ${esc(d.tp)}</div><h1>Section ${esc(d.n)}. ${esc(d.t)}</h1>`+(tp?`<div class="tip"><b>Memory tip:</b> ${esc(tp[0])}<br><span class="tag">Key point: ${esc(tp[1])}</span></div>`:'')+
 (d.m?'<div class="gap">The text of this section is not in the source PDF.</div>':`<div class="body" style="--fs:${fs}px">${d.x.split(/\n\s*\n/).map((p,i)=>`<p data-p="${i}" class="${hh.includes(i)?'hl':''}">${linkify(p.replace(/\n(?!\s*(\(|\d))/g,' '),d.c)}</p>`).join('')}</div><p class="tag">Tap a paragraph to highlight it.</p>`)+
 `<h2>My notes</h2><textarea id="nt" rows="4" placeholder="Write a note, case, or reminder for this section">${esc(notes[id]||'')}</textarea>`;
 $('#reader').hidden=false;$('#reader').scrollTop=0;const ix=same.indexOf(d);$('#prev').disabled=ix<=0;$('#next').disabled=ix>=same.length-1;$('#prev').dataset.id=same[ix-1]?.id||'';$('#next').dataset.id=same[ix+1]?.id||'';
 $('#save').textContent=saved.includes(id)?'Saved':'Save';$('#save').dataset.id=id;recent=[id,...recent.filter(x=>x!==id)].slice(0,8);save();if(push)history.pushState({id},'','#'+id)}
function closeR(){$('#reader').hidden=true;if(location.hash)history.replaceState(null,'',location.pathname);render()}
function answer(j){const k=qz.q[qz.i];qz.a=j;stats.a++;if(k.opts[j].id===k.d.id){qz.s++;stats.c++}save()}
document.addEventListener('click',e=>{const t=e.target,g=t.closest('[data-go]');if(g){e.preventDefault();open(g.dataset.go);return}
 const p=t.closest('.body p');if(p){const id=$('#save').dataset.id,i=+p.dataset.p,a=hls[id]||[];hls[id]=a.includes(i)?a.filter(x=>x!==i):[...a,i];p.classList.toggle('hl');save();return}
 if(t.closest('[data-back]')){topic=null;render();return}
 const it=t.closest('[data-id]');if(it&&!it.closest('#reader .bar')){const id=it.dataset.id;if(tab==='compare'&&!$('#q').value.trim()&&it.classList.contains('item')){const d=byId[id];pick[d.c]=pick[d.c]===id?null:id;render();return}open(id);return}
 const tp=t.closest('[data-topic]');if(tp){topic=tp.dataset.topic;render();return}
 const ct=t.closest('[data-ct]');if(ct){cmpTopic=ct.dataset.ct;pick={CC:null,PC:null};render();return}
 const a=t.closest('[data-act]');if(a){const x=a.dataset.act;
  if(x==='flash'){fc={q:[],i:0,f:false};render()}else if(x==='quiz'){qz={q:mkQ(),i:0,s:0,a:null};render()}else if(x==='exit'){fc=qz=null;render()}
  else if(x==='flip'){fc.f=true;render()}else if(x==='know'||x==='again'){const id=fc.id;box[id]=x==='know'?Math.min(5,(box[id]||0)+1):0;save();fc.i++;fc.f=false;render()}
  else if(x==='nextq'){qz.i++;qz.a=null;render()}
  else if(x==='install'&&dp){dp.prompt();dp.userChoice.then(()=>{dp=null;render()}).catch(()=>{})}return}
 const an=t.closest('[data-ans]');if(an){answer(+an.dataset.ans);render();return}
 const tb=t.closest('[data-t]');if(tb){tab=tb.dataset.t;if(tab!=='study')fc=qz=null;if(tb.closest('#nav')){$('#q').value='';if(tab==='home')topic=null}render()}});
$('#main').addEventListener('toggle',e=>{const dt=e.target;if(dt.tagName!=='DETAILS'||!dt.open||dt.querySelector('.item'))return;dt.insertAdjacentHTML('beforeend',window['G'+dt.dataset.c][+dt.dataset.g].l.map(d=>item(d)).join(''))},true);
$('#back').onclick=()=>history.state&&history.state.id?history.back():closeR();
$('#prev').onclick=$('#next').onclick=e=>{const id=e.currentTarget.dataset.id;if(id)open(id,false)};
$('#save').onclick=e=>{const id=e.currentTarget.dataset.id;saved=saved.includes(id)?saved.filter(x=>x!==id):[id,...saved];save();e.currentTarget.textContent=saved.includes(id)?'Saved':'Save'};
$('#copy').onclick=async()=>{const d=DATA[cur];try{await navigator.clipboard.writeText(`${NAME[d.c]}, s. ${d.n} – ${d.t}\n\n${d.x}`);$('#copy').textContent='Copied'}catch(e){$('#copy').textContent='Failed'}setTimeout(()=>$('#copy').textContent='Copy',1200)};
$('#fs').onclick=()=>{fs=fs>=26?16:fs+2;LS.s('fs',fs);document.querySelector('.body')?.style.setProperty('--fs',fs+'px')};
document.addEventListener('input',e=>{if(e.target.id==='nt'){notes[$('#save').dataset.id]=e.target.value;save()}});
window.addEventListener('popstate',()=>{const id=location.hash.slice(1);id&&byId[id]?open(id,false):($('#reader').hidden=true,render())});
let t0;$('#q').addEventListener('input',()=>{clearTimeout(t0);t0=setTimeout(render,120)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=$('#q').value.trim().toLowerCase();const hit=DATA.find(d=>inScope(d)&&d.n.toLowerCase()===q);if(hit)open(hit.id)}});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{code=b.dataset.v;document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));fc=null;render()});
function theme(){document.documentElement.classList.toggle('light',LIGHT);$('#theme').textContent=LIGHT?'Dark':'Light';document.querySelector('meta[name=theme-color]').content=LIGHT?'#f4f6f7':'#0e151c'}
$('#theme').onclick=()=>{LIGHT=!LIGHT;LS.s('light',LIGHT);theme()};theme();
render();const h0=location.hash.slice(1);if(h0&&byId[h0])open(h0,false);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
