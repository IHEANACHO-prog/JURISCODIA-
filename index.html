tes the lawful exercise of their rights by a\npart of the public, may show that it is not a nuisance to any of the public.\n\nThe owner of a vessel wrecked in a navigable river is not guilty of a common nuisance because he does\nnot remove it."},{"c":"CC","n":"235","t":"(Repealed by No. 20 of 1944)","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":""},{"c":"CC","n":"236","t":"(1) Gaming houses","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"(1) A person being the owner or occupier, or having the use of, any house, room or place, who\nshall open, keep or use the same for the purpose of unlawful gaming being carried on therein, and any\nperson who, being the owner or occupier of any house, room or place, shall knowingly and wilfully\npermit the same to be opened, kept or used by any other person for the purpose aforesaid, and any\nperson having the care or management of or in any manner assisting in conducting the business of any\nhouse, room or place opened, kept or used for the purpose aforesaid, is said to keep a common gaming\nhouse.\n\nUnlawful gaming\n\n        (2) In this section, \"unlawful gaming\" includes roulette, every game of dice except\nbackgammon, every game of card which is not a game of skill, the game known as chacha and other\ngames of cowries, and any game the chances of which are not alike favourable to all the players,\nincluding the banker or other person or persons by whom the game is managed or against whom the\nother players stake, play or bet.\n\n         (3) Any person who keeps a common gaming house is guilty of a misdemeanor and is liable to a\nfine of one thousand naira or to imprisonment for two years or to both such fine and imprisonment.\n        (4) Any person other than the persons mentioned in subsection (1) of this section who is found\nin a common gaming house shall be deemed, unless the contrary is proved, to be there for the purpose\nof unlawful gaming and is guilty of an offence and liable to a fine of ten naira for the first offence and for\neach subsequent offence to a fine of forty naira or imprisonment for three months or to both such fine\nand imprisonment."},{"c":"CC","n":"237","t":"(1) Police may be authorised to enter gaming houses, etc","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"(1) A superior police officer or an administrative officer in charge of police, if he has reasonable\ngrounds for believing that any house, room or place is kept as a common gaming house, may by order in\nwriting authorise any police officer to enter and search such house, room or place at any time and if\nnecessary, to use force for the purpose of effecting such entry, whether by breaking open doors or\notherwise, and to arrest all persons who shall be found therein, and to seize all instruments of gaming\nfound in such house or premises and to seize all money found therein.\n\nObstructing entry of police to be evidence of unlawful gaming\n\n         (2) Where a police officer so authorised to enter any house, room or place is wilfully prevented\nfrom or obstructed or delayed in entering the same or any part thereof, or where any external or\ninternal door of, or means of access to, any such house, room or place shall be found to be fitted or\nprovided with any bolt, bar, chains or any means or contrivance for the purpose of preventing, delaying\nor obstructing the entry into the same or any part thereof of any police officer authorised as aforesaid\nor for giving an alarm in the case of such entry, or if any such house, room or place is found fitted or\nprovided with any means or contrivance for unlawful gaming or with any means of contrivance for\nconcealing, removing or destroying any instruments of gaming, it shall be evidence until the contrary be\nproved, that such house, room or place is used as a common gaming house within the meaning of\nsection 236 of this Code and that the persons found therein were unlawfully playing therein."},{"c":"CC","n":"238","t":"Indemnity of witnesses","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any person who shall be called to give evidence against any other person charged under the provisions\nof section 236 of this Code shall be freed from all criminal prosecution in respect of the offence with\nwhich such other person is charged or any other offence under section 236 of this Code."},{"c":"CC","n":"239","t":"Betting houses","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any house, room, or place, which is used for any of the following purposes-\n\n        (1) for the purpose of bets being made therein between persons resorting to the place and-\n\n        (a)      the owner, occupier, or keeper of the place, or any person using the place; or\n\n        (b)     any person procured or employed by or acting for or on behalf of any such owner,\n                occupier, or keeper, or person using the place; or\n        (c)        any person having the care or management, or in any manner conducting the business,\n                   of the place; or\n\n        (2) for the purpose of any money or other property, being paid or received therein by or on\nbehalf of any such owner, occupier, or keeper, or person using the place as, or for the consideration-\n\n        (a)         for an assurance, undertaking, promise, or agreement, express or implied, to payor give\n                   thereafter any money or other property on any event or contingency of or relating to\n                   any horse race, or other race, fight, game sport, or exercise; or\n\n        (b)        for securing the paying or giving by some other person of any money or other property\n                   on any such event or contingency,\n\nis called a common betting house.\n\nAny person who, being the owner or occupier of any house, room, or place, knowingly and wilfully\npermits it to be opened, kept, or used, as a common betting house by another person, or who has the\nuse or management, or assists in conducting the business of a common betting house, is guilty of a\nmisdemeanor and is liable to imprisonment for one year, and to a fine of one thousand naira:\n\nProvided always that nothing herein contained shall make illegal the use of a totalisator by a race club\nrecognised by the Government, at a race meeting, with the approval in each case, of the superintendent\nof police in charge of the area where the meeting is held. In this proviso \"totalisator\" means and\nincludes the instrument, machine, or contrivance, commonly known as the totalisator, and any other\ninstrument, machine, or contrivance of a like nature, or any scheme for enabling any number of persons\nto make bets with one another on the like principles."},{"c":"CC","n":"239A","t":"Pool betting","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"(1) (Inserted by 44 of 1958 repealed by 1961 No. 69).\n\n        (2) (Inserted by 44 of 1958 repealed by 1961 No. 69).\n\n        (3) For the purpose of section 239 of this Code any house, room or place which is used for the\npurpose of a licensed pool betting business shall not be deemed to be a common betting house by\nreason only that it is so used.\n\n                                                   [44 of 1958.1961 No. 69.]\n\n        (4) (Inserted by 44 of 1958 repealed by 1961 No. 69)."},{"c":"CC","n":"239B","t":"(Inserted by 44 of 1958 repealed by 1961 No. 69)","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":""},{"c":"CC","n":"240","t":"Definitions: lottery: lottery ticket: public lottery","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"In this Chapter-\n\"lottery\" includes any game, method or device whereby money or money's worth is distributed or\nallotted in any manner depending upon or to be determined by chance or lot;\n\n\"lottery ticket\" includes any paper, ticket, token or other article whatsoever, which either expressly or\ntacitly entitles or purports to entitle any person to receive any money or money's worth on the\nhappening of any event or contingency connected with any public lottery;\n\n\"public lottery\" means a lottery to which the public or any class of the public has, or may have, access,\nand every lottery shall, until the contrary is proved, be deemed to be a public lottery."},{"c":"CC","n":"240A","t":"Offences relating to lotteries","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (a)      gives or sells or offers for sale or delivers any lottery ticket or pays or receives directly\n                or indirectly any money or money's worth for or in respect of any chance in or event or\n                contingency connected with a public lottery; or\n\n        (b)     draws, throws, declares or exhibits, expressly or otherwise, the winner or winning\n                number, ticket, lot, figure, design, symbol, or other result of any public lottery; or\n\n        (c)     writes, prints, publishes, or causes to be written, printed, or published, any lottery\n                ticket, or any announcement relating to a public lottery; or\n\n        (d)      advances, furnishes, or receives money for the purpose of a public lottery; or\n\n        (e)     in any manner carries on, or assists in carrying on, or invites or solicits any person to\n                take part in, a public lottery,\n\nis liable to a fine not exceeding one hundred naira or to imprisonment for a period not exceeding six\nmonths."},{"c":"CC","n":"240B","t":"Recovery of money paid for lottery tickets","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any money or money's worth paid or deposited for or in respect of the purchase of a lottery ticket shall\nbe recoverable as money had and received to the use of the person by whom the same was paid or\ndeposited."},{"c":"CC","n":"240C","t":"Contract for sale of lottery ticket void","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Every sale or contract for the sale of a lottery ticket is hereby declared to be void, and no action shall be\nmaintainable by any person in respect of any such sale or contract, except by the purchaser for the\nreturn of the money or other consideration (if any) paid thereon."},{"c":"CC","n":"240D","t":"Saving of certain race club lotteries and sweepstakes","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"(1) Nothing in this Chapter contained shall apply to any lottery or sweepstake organised and\ncontrolled by any race club in Nigeria to which a minister may by notice in the Federal Gazette extend\nthe provisions of this section of this Code, at or in connection with any race meeting held under the\nauspices of any club or association.\n\n                                          [L.N. 257 of 1959.]\n\n         (2) Nothing in this Chapter contained shall apply to or prevent the sale by raffle or lottery of\narticles exposed for sale at any bazaar or fancy fair held for raising funds in aid of any institution of a\npublic character, provided that permission for such sale shall have been given in writing by the Minister."},{"c":"CC","n":"240E","t":"Lotteries carried on in clubs with approval of Minister","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"(1) A Minister may grant to any club a licence authorising a lottery to be promoted and carried\non,\n\nsubject to any conditions contained in the licence, as an incident of entertainment by members of the\nclub on the premises of the club.\n\n                                          [L.N. 257 of 1959.]\n\n         (2) It shall be a condition of every licence granted to a club under subsection (1) of this section in\nrespect of a lottery that only members of the club and their guests introduced in accordance with the\nrules of the club shall have access to the lottery.\n\n        (3) A lottery promoted and carried on in a club in accordance with the terms of a licence issued\nunder this section of this Code shall not be deemed to be a public lottery.\n\n         (4) When any condition of a licence granted under this section of this Code is contravened,\nevery person concerned in the promotion or carrying on of the lottery is guilty of an offence, unless he\nproves that the contravention was committed without his knowledge, and liable on summary conviction\nto a fine of forty naira or to imprisonment for four months."},{"c":"CC","n":"241","t":"Acting as keeper of brothels, gaming houses, and betting houses","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any person who appears, acts, or behaves, as master or mistress, or as the person having the care or\nmanagement of any such premises, house, room, set of rooms, or place, as is mentioned in section\n225B, 236 or 239 of this Code, is to be taken to be the keeper thereof, whether he is or is not the real\nkeeper."},{"c":"CC","n":"242","t":"Misconduct with regard to corpses","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (1) without lawful justification or excuse, the proof of which lies on him-\n        (a)       neglects to perform any duty imposed upon him by law, or undertaken by him, whether\n                 for reward or otherwise, touching the burial or other disposition of a human body or\n                 human remains; or\n\n        (b)      improperly or indecently interferes with, or offers any indignity to, any dead human\n                 body or human remains, whether buried or not;\n\n        (2) eats or receive for the purpose of eating any part of a dead human body,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"243","t":"(1) Exposing for sale things unfit for food or drink","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"(1) Any person who sells, as food or drink, or has in his possession with intent to sell it as food or\ndrink, any article which has been rendered or has become noxious, or is in a state unfit for food or drink,\nknowing or having reason to believe that the same is noxious as food or drink, or is in a state unfit for\nfood or drink, is guilty of a misdemeanor and is liable to imprisonment for one year.\n\nAdulteration of food or drink intended for sale\n\n        (2) Any person who adulterates any article of food or drink, so as to make such article noxious as\nfood or drink, intending to sell such article as food or drink or knowing it to be likely that the same will\nbe sold as food or drink, is guilty of a misdemeanor and is liable to imprisonment for one year."},{"c":"CC","n":"244","t":"Dealing in diseased meat","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (1) knowingly takes into a slaughter-house used for the slaughter of any animals intended for\nthe food of man the whole or any part of the carcass of any animal which has died of any disease; or\n\n        (2) knowingly sells the whole or part of the carcass of any animal which has died of any disease\nor which was diseased when slaughtered,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"245","t":"Fouling water","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"Any person who corrupts or fouls the water of any spring, stream, well, tank, reservoir, or place, so as to\nrender it less fit for the purpose for which it is ordinarily used, is guilty of a misdemeanor and is liable to\nimprisonment for six months."},{"c":"CC","n":"246","t":"Burials in houses","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"Any person who without the consent of the President or the Governor buries or attempts to bury any\ncorpse in any house, building premises, yard, garden, compound, or within a hundred yards of any\ndwelling-house, or in any open space situated within a township, is guilty of a misdemeanor and is liable\nto imprisonment for six months."},{"c":"CC","n":"247","t":"Noxious acts","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (a)       vitiates the atmosphere in any place so as to make it noxious to the health of persons in\n                  general dwelling or carrying on business in the neighbourhood or passing along a public\n                  way; or\n\n        (b)       does any act which is, and which he knows or has reason to believe to be, likely to\n                  spread the infection of any disease dangerous to life, whether human or animal,\n\nis guilty of a misdemeanor and is liable to imprisonment for six months."},{"c":"CC","n":"248","t":"Sale of matches made with white phosphorus: use of white phosphorus in manufacture of matches","ch":"Chapter 23 – Offences against Public Health","p":"Part 4 – Acts injurious to the public in general","x":"matches\n\nAny person who-\n\n        (a)       sells or has in his possession for the purposes of sale any matches made with white\n                  (yellow) phosphorus; or\n\n        (b)       uses white (yellow) phosphorus in the manufacture of matches,\n\nis guilty of an offence and liable to a fine of twenty naira, and any matches in respect of which the\noffence shall have been committed shall be forfeited."},{"c":"CC","n":"249","t":"Idle and disorderly persons","ch":"Chapter 24 – Idle and disorderly persons; Rogues and Vagabonds; bringing contempt on uniform","p":"Part 4 – Acts injurious to the public in general","x":"The following persons-\n\n        (a)       every common prostitute-\n\n                  (i)     behaving in a disorderly or indecent manner in any public place;\n\n                  (ii)    loitering and persistently importuning or soliciting persons for the purpose of\n                          prostitution;\n        (b)     every person wandering or placing himself in any public place to beg or gather alms, or\n                causing or procuring or encouraging any child or children so to do;\n\n        (c)     every person playing at any game of chance for money or money's worth in any public\n                place; and\n\n        (d)     every person who, in any public place, conducts himself in a manner likely to cause a\n                breach of the peace,\n\nshall be deemed idle and disorderly persons and may be arrested without warrant, and are guilty of a\nsimple offence and liable to imprisonment for one month."},{"c":"CC","n":"250","t":"Rogues and vagabonds","ch":"Chapter 24 – Idle and disorderly persons; Rogues and Vagabonds; bringing contempt on uniform","p":"Part 4 – Acts injurious to the public in general","x":"The following persons-\n\n       (1) every person convicted of an offence under section 249 of this Code after having been\npreviously convicted as an idle and disorderly person;\n\n       (2) every person wandering abroad and endeavouring by the exposure of wounds or\ndeformation to obtain or gather alms;\n\n        (3) every person going about as a gatherer or collector of alms, or endeavouring to procure\ncharitable contributions of any nature or kind, under any false or fraudulent pretence;\n\n        (4) every suspected person or reputed thief who has no visible means of subsistence and cannot\ngive a good account of himself;\n\n        (5) every person who exercises control, direction or influence over the movements of a\nprostitute in such a manner as to show that he is aiding, abetting, or controlling, her prostitution with\nany man, whether a particular man or not;\n\n        (6) every person found wandering in or upon or near any premises or in any road or highway or\nany place adjacent thereto or in any public place at such time and under such circumstances as to lead\nto the conclusion that such person is there for an illegal or disorderly purpose,\n\nshall be deemed to be a rogue and vagabond and is guilty of a misdemeanor and is liable on summary\nconviction for the first offence to imprisonment for three months and for every subsequent offence to\nimprisonment for one year.\n\nAn offender may be arrested without warrant."},{"c":"CC","n":"251","t":"Bringing contempt on uniform","ch":"Chapter 24 – Idle and disorderly persons; Rogues and Vagabonds; bringing contempt on uniform","p":"Part 4 – Acts injurious to the public in general","x":"Any person who, not being a person serving in any of the armed or police forces of Nigeria, wears the\nuniform of any of these forces, or any dress having the appearance or bearing any of the regimental or\nother distinctive marks of any such uniform, in such manner or in such circumstances as to be likely to\nbring contempt on that uniform, or employs any other person so to wear such uniform or dress, is guilty\nof a simple offence, and is liable to imprisonment for three months or to a fine of forty naira.\n\n                                             [L.N. 112 of 1964.]\n\n                                                   Part 5\n\n  Offences against the person and relating to marriage and parental rights and duties, and against the\n                                            reputation of individuals"},{"c":"CC","n":"252","t":"Definition of assault","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who strikes, touches, or moves, or otherwise applies force of any kind to the person of\nanother, either directly or indirectly, without his consent, or with his consent, if the consent is obtained\nby fraud, or who by any bodily act or gesture attempts or threatens to apply force of any kind to the\nperson of another without his consent, in such circumstances that the person making the attempt or\nthreat has actually or apparently a present ability to effect his purpose, is said to assault that other\nperson, and the act is called an assault.\n\nThe term \"applies force\" includes the case of applying heat, light, electrical force, gas, odour, or any\nother substance of thing whatever, if applied in such a degree as to cause injury or personal discomfort."},{"c":"CC","n":"253","t":"Assaults unlawful","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"An assault is unlawful and constitutes an offence unless it is authorised or justified or excused by law.\n\nThe application of force by one person to the person of another may be unlawful, although it is done\nwith the consent of that other person."},{"c":"CC","n":"254","t":"Execution of sentence","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is charged by law with the duty of executing or giving effect to the lawful\nsentence of a court (including a customary and an area court) to execute or give effect to that sentence."},{"c":"CC","n":"255","t":"Execution of process","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is charged by law with the duty of executing the lawful process of a court\n(including a customary and an area court) and who is required to arrest or detain another person under\nsuch process, and for every person lawfully assisting a person so charged, to arrest or detain that other\nperson according to the terms of the process."},{"c":"CC","n":"256","t":"Execution of warrant","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is charged by law with the duty of executing a lawful warrant issued by any\ncourt (including customary and an area court) or judicial officer, or other person having jurisdiction to\nissue it, and who is required to arrest or detain another person under such warrant, and for every\nperson lawfully assisting a person so charged, to arrest or detain that other person according to the\ndirections of the warrant."},{"c":"CC","n":"257","t":"Erroneous sentence or process or warrant","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"If the sentence was passed, or the process was issued, by a court (including a native tribunal) having\njurisdiction under any circumstances to pass such a sentence or to issue such process, or if the warrant\nwas issued by a court (including a customary and an area court) or judicial officer or other person having\nauthority in any circumstances to issue such a warrant, it is immaterial whether the court or judicial\nofficer or person had or had not authority to pass the sentence or issue the process or warrant in the\nparticular case; unless the person executing the same knows that the sentence or process or warrant,\nwas in fact passed or issued without authority."},{"c":"CC","n":"258","t":"Sentence or process or warrant without jurisdiction","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who executes or assists in executing any sentence, or process, or warrant which purports to be\npassed or issued by a court (including a native tribunal), judicial officer, or other person, and who would\nbe justified, under the provisions of sections 254, 255, 256 and 257 of this Code, in executing the same if\nit had been passed or issued by a court (including a customary and an area court), or judicial officer, or\nperson, having authority to pass or issue it, is not criminally responsible for any act done in such\nexecution notwithstanding that the court, judicial officer or person, had no authority to pass the\nsentence or issue the process or warrant, if in such execution he acted in good faith and in the belief\nthat the sentence, process or warrant was that of a court, judicial officer, or other person, having such\nauthority."},{"c":"CC","n":"259","t":"Arrest of wrong person","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who, being duly authorised to execute a warrant to arrest one person, arrests another person,\nbelieving in good faith and on reasonable grounds that the person arrested is the person named in the\nwarrant, is not criminally responsible for doing so to any greater extent than if the person arrested had\nbeen the person named in the warrant.\n\nAny person who lawfully assists in making such an arrest believing that the person arrested is the person\nnamed in the warrant, or who, being required by the warrant to receive and detain the person named in\nit, receives and detains the person so arrested, is not criminally responsible for doing so to any greater\nextent than if the person arrested had been the person named in the warrant."},{"c":"CC","n":"260","t":"Irregular process or warrant","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When any process or warrant is bad in law by reason of some defect in substance or in form apparent\non the face of it, a person who, in good faith and believing that it is good in law, acts in the execution of\nthe process or warrant, is not criminally responsible for anything done in such execution to any greater\nextent than if the process or warrant were good in law."},{"c":"CC","n":"261","t":"Force used in executing process or in arrest","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is engaged in the lawful execution of any sentence, process or warrant, or in\nmaking any arrest, and for any person lawfully assisting him, to use such force as may be reasonably\nnecessary to overcome any force used in resisting such execution or arrest."},{"c":"CC","n":"262","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"263","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"264","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"265","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"266","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"267","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"268","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"269","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"270","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"271","t":"Peace officer preventing escape from arrest","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a peace officer or police officer is proceeding lawfully to arrest, with or without warrant, a person\nfor an offence which is a felony, and is such that the offender may be arrested without warrant, and the\nperson sought to be arrested takes to flight in order to avoid arrest, it is lawful for the peace officer or\npolice officer and for any person lawfully assisting him, to use such force as may be reasonably\nnecessary to prevent the escape of the person sought to be arrested, and, if the offence is such that the\noffender may be punished with death or with imprisonment for seven years or more, may kill him if he\ncannot by any means otherwise be arrested."},{"c":"CC","n":"272","t":"Other cases of preventing escape from arrest","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person who is not a peace officer or police officer is proceeding lawfully to arrest, without\nwarrant, another person for an offence which is such that the offender may be arrested without\nwarrant, and when any person is proceeding lawfully to arrest another person for any cause other than\nsuch an offence, and, in either case, the person sought to be arrested takes to flight in order to avoid\narrest, it is lawful for the person seeking to arrest him to use such force as may be reasonably necessary\nto prevent his escape.\nBut this section of this Code does not authorise the use of force which is intended or is likely to cause\ndeath or grievous harm."},{"c":"CC","n":"273","t":"Preventing escape or rescue after arrest","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When any person has lawfully arrested another person for any offence, it is lawful for him to use such\nforce as he believes, on reasonable grounds, to be necessary to prevent the escape or rescue of the\nperson arrested.\n\nBut, if the offence is not one which is such that the offender may be arrested without warrant, this\nsection of this Code shall not authorise the use of force which is intended or is likely to cause death or\ngrievous harm."},{"c":"CC","n":"274","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":""},{"c":"CC","n":"275","t":"Preventing a breach of the peace","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person who witnesses a breach of the peace to interfere to prevent the continuance\nor renewal of it, and to use such force as is reasonably necessary for such prevention and is reasonably\nproportioned to the danger to be apprehended from such continuance or renewal, and to detain any\nperson who is committing or who is about to join in or to renew the breach of the peace for such time as\nmay be reasonably necessary in order to give him into the custody of a peace officer or police officer.\n\nIt is lawful for a peace officer or police officer who witnesses a breach of the peace, and for any person\nlawfully assisting him, to arrest any person whom he finds committing it, or whom he believes on\nreasonable grounds to be about to join or renew the breach of the peace.\n\nIt is lawful for a peace officer or police officer to receive into custody and detain in custody any person\ngiven into his charge as having been a party to a breach of the peace by a person whom the peace\nofficer or police officer believes, on reasonable grounds, to have witnessed the breach of the peace."},{"c":"CC","n":"276","t":"Suppression of riot","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person to use such force as is necessary to suppress a riot, and is reasonably\nproportioned to the danger to be apprehended from its continuance."},{"c":"CC","n":"277","t":"Suppression of riot by peace officers","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a peace officer to use or order to be used such force as he believes, on reasonable\ngrounds, to be necessary in order to suppress a riot, and is reasonably proportioned to the danger which\nhe believes, on reasonable grounds, is to be apprehended from its continuance."},{"c":"CC","n":"278","t":"Suppression of riot by person acting under lawful orders","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person acting in good faith in obedience to orders, not manifestly unlawful, given by a\npeace officer for the suppression of a riot, to use such force as he believes, on reasonable grounds, to be\nnecessary for carrying such orders into effect. Whether any particular order so given is or is not\nmanifestly lawful, is a question of law."},{"c":"CC","n":"279","t":"Suppression of riot by person acting without order in case of emergency","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When any person, whether subject to military law or not, believes, on reasonable grounds, that serious\nmischief will arise from a riot before there is time to procure the intervention of a peace officer, it is\nlawful for him to use such force as he believes, on reasonable grounds, to be necessary for the\nsuppression of the riot, and as is reasonably proportioned to the danger which he believes, on\nreasonable grounds, is to be apprehended from its continuance."},{"c":"CC","n":"280","t":"Riot: persons subject to military law or members of the police forces","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is bound by the laws in force relative to the Armed Forces of Nigeria or to\nthe Police Forces to obey the lawful commands of his superior officer, to obey any command given him\nby his superior officer, in order to see the suppression of a riot, unless the command is manifestly\nunlawful. Whether any particular command is or is not manifestly unlawful, is a question of law."},{"c":"CC","n":"281","t":"Prevention of offences for which an offender may be arrested without","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"violence by persons of unsound mind\n\nIt is lawful for any person to use such force as is reasonably necessary in order to prevent the\ncommission of an offence which is such that the offender may be arrested without warrant; or in order\nto prevent any act from being done as to which he believes, on reasonable grounds, that it would, if\ndone, amount to any such offence; or in order to prevent a person whom he believes, on reasonable\ngrounds, to be of unsound mind, from doing violence to any person or property."},{"c":"CC","n":"282","t":"Defence of dwelling-house","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person who is in peaceable possession of a dwelling-house, and for any person\nlawfully assisting him or acting by his authority, to use such force as he believes, on reasonable grounds,\nto be necessary in order to prevent the forcible breaking and entering of the dwelling-house, either by\nnight or day, by any person whom he believes on reasonable grounds, to be attempting to break and\nenter the dwelling-house with intent to commit a felony or misdemeanor therein."},{"c":"CC","n":"283","t":"Provocation","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The term \"provocation\", used with reference to an offence of which an assault is an element, includes,\nexcept as hereinafter stated, any wrongful act or insult of such nature as to be likely, when done to an\nordinary person, or in the presence of the ordinary person to another person who is under his\nimmediate care, or to whom he stands in a conjugal, parental, filial, or fraternal relation, or in the\nrelation of master or servant, to deprive him of the power of self-control, and to induce him to assault\nthe person by whom the act or insult is done or offered.\nWhen such an act or insult is done or offered by one person to another, or in the presence of another to\na person who is under the immediate care of that other, or to whom the latter stands in any such\nrelation as aforesaid, the former is said to give to the latter provocation for an assault.\n\nA lawful act is not provocation to any person for an assault.\n\nAn act which a person does in consequence of excitement given by another person in order to induce\nhim to do the act, and thereby to furnish an excuse for committing an assault, is not provocation to that\nperson for an assault.\n\nAn arrest which is unlawful is not necessarily provocation for an assault, but it may be evidence of\nprovocation to a person who knows of the illegality."},{"c":"CC","n":"284","t":"Defence of provocation","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person is not criminally responsible for an assault committed upon a person who gives him\nprovocation for the assault, if he is in fact deprived by the provocation of the power of self-control, and\nacts upon it on the sudden and before there is time for his passion to cool; provided that the force used\nis not disproportionate to the provocation, and is not intended, and is not such as is likely, to cause\ndeath or grievous harm.\n\nWhether any particular act or insult is such as to be likely to deprive an ordinary person of the power of\nself-control and to induce him to assault the person by whom the act or insult is done or offered, and\nwhether, in any particular case, the person provoked was actually deprived by the provocation of the\npower of self-control, and whether any force used is or is not disproportionate to the provocation, are\nquestions of fact."},{"c":"CC","n":"285","t":"Prevention of repetition of insult","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person to use such force as is reasonably necessary to prevent the repetition of an act\nor insult of such a nature as to be provocation to him for an assault:\n\nProvided that the force used is not intended and is not such as is likely, to cause death or grievous harm."},{"c":"CC","n":"286","t":"Self-defence against unprovoked assault","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person is unlawfully assaulted, and has not provoked the assault, it is lawful for him to use such\nforce to the assailant as is reasonably necessary to make effectual defence against the assault:\n\nProvided that the force used is not intended, and is not such as is likely, to cause death or grievous\nharm.\n\nIf the nature of the assault is such as to cause reasonable apprehension of death or grievous harm, and\nthe person using force by way of defence believes, on reasonable ground, that he cannot otherwise\npreserve the person defended from death or grievous harm, it is lawful for him to use any such force to\nthe assailant as is necessary for defence, even though such force may cause death or grievous harm."},{"c":"CC","n":"287","t":"Self-defence against provoked assault","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person has unlawfully assaulted another or has provoked an assault from another, and that\nother assaults him with such violence as to cause reasonable apprehension of death or grievous harm,\nand to induce him to believe, on reasonable grounds, that it is necessary for his preservation from death\nor grievous harm to use force in self-defence, he is not criminally responsible for using any such force as\nis reasonably necessary for such preservation, although such force may cause death or grievous harm.\n\nThis protection does not extend to a case in which the person using force, which causes death or\ngrievous harm, first began the assault with intent to kill or to do grievous harm to some person; nor to a\ncase in which the person using force which causes death or grievous harm endeavoured to kill or to do\ngrievous harm to some person before the necessity of so preserving himself arose; nor, in either case,\nunless, before such necessity arose, the person using such force declined further conflict, and quitted it\nor retreated from it as far as was practicable."},{"c":"CC","n":"288","t":"Aiding in self-defence","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"In any case in which it is lawful for any person to use force in any degree for the purpose of defending\nhimself against an assault, it is lawful for any other person acting in good faith in his aid to use a like\ndegree of force for the purpose of defending such first-mentioned person."},{"c":"CC","n":"289","t":"Defence of movable property against trespassers","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for any person who is in peaceable possession of any movable property, and for any person\nacting by his authority, to use such force as is reasonably necessary in order to resist the taking of such\nproperty by a trespasser, or in order to retake it from a trespasser, provided that he does not do harm\nto the trespasser."},{"c":"CC","n":"290","t":"Defence of movable property with claim of right","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person is in peaceable possession of any movable property under a claim of right, it is lawful for\nhim, and for any person acting by his authority, to use such force as is reasonably necessary in order to\ndefend his possession of the property, even against a person who is entitled by law to possession of the\nproperty, provided that he does not do harm to such other person."},{"c":"CC","n":"291","t":"Defence of movable property without claim of right","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person who is entitled by law to the possession of movable property, attempts to take from a\nperson who is in possession of the property, but who neither claims right to it, nor acts by the authority\nof a person who claims right, and the person in possession resists him, it is lawful for the person so\nentitled to possession to use force in order to obtain possession of the property, provided that he does\nnot do harm to the person in possession."},{"c":"CC","n":"292","t":"Defence of premises against trespassers: removal of disorderly persons","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is lawful for a person who is in peaceable possession of any land, structure, vessel or place, or who is\nentitled to the control or management of any land, structure, vessel, or place, and for any person acting\nby his authority, to use such force as is reasonably necessary in order to prevent any person from\nwrongfully entering upon such land, structure, vessel, or place, or in order to remove therefrom a\nperson who wrongfully remains therein, provided that he does not do harm to such person.\n\nIt is lawful for a person who is in peaceable possession of any land, structure, vessel, or place, or who is\nentitled to the control or management of any land, structure, vessel, or place, and for any person acting\nby his authority, to use force in order to remove therefrom any person who conducts himself in a\ndisorderly manner therein, provided that he does not do him harm.\n\nThe term \"place\" includes any part of an enclosure or structure, whether separated from the rest of the\nenclosure or structure, by a partition, fence, rope, or any other means, or not."},{"c":"CC","n":"293","t":"Defence of possession of real property or vessel with claim of right","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person is in peaceable possession of any land, structure, or vessel, with a claim of right, it is\nlawful for him, and for any person acting by his authority, to use such force as is reasonably necessary in\norder to defend his possession, even against a person who is entitled by law to the possession of the\nproperty provided that he does not do harm to such person."},{"c":"CC","n":"294","t":"Exercise of right of way or easement","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person who claims to be lawfully entitled to enter upon land for the exercise of a right of way or\nother easement or profit, enters upon the land for the purpose of exercising such right of way, or\neasement or profit, after notice that his right to use such way or take such profit is disputed by the\nperson in possession of the land, or having entered persists in his entry after such notice, it is lawful for\nthe person in possession, and for any person acting by his authority, to use such force as is reasonably\nnecessary for the purpose of making the person so entering desist from the entry, provided that he does\nnot do him harm."},{"c":"CC","n":"295","t":"Correction of child, servant, etc","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A blow or other force, not in any case extending to a wound or grievous harm, may be justified for the\npurpose of correction as follows-\n\n        (1) a father or mother may correct his or her legitimate or illegitimate child, being under sixteen\nyears of age, or any guardian or person acting as a guardian, his ward, being under sixteen years of age,\nfor misconduct or disobedience to any lawful command;\n\n       (2) a master may correct his servant or apprentice, being under sixteen years of age, for\nmisconduct or default in his duty as such servant or apprentice;\n\n       (3) the master of a ship may correct any person on board his ship who is bound to perform any\nmanual labour, for misconduct or disobedience to any lawful command;\n        (4)a father or mother or guardian, or a person acting as a guardian, may delegate to any person\n\nwhom he or she entrusts permanently or temporarily with the governance or custody of his or her child\nor ward on his or her own authority for correction, including the power to determine in what cases\ncorrection ought to be inflicted; and such a delegation shall be presumed, except in so far as it may be\nexpressly withheld, in the case of a schoolmaster or a person acting as a schoolmaster, in respect of a\nchild or ward;\n\n        (5) a person who is authorised to inflict correction as in this section of this Code mentioned may,\nin any particular case, delegate to any fit person the infliction of such correction; and\n\n         (6) no correction can be justified which is unreasonable in kind or in degree, regard being had to\nthe age and physical and mental condition of the person on whom it is inflicted; and no correction can\nbe justified in the case of a person who, by reasons of tender years or otherwise, is incapable of\nunderstanding the purpose for which it is inflicted."},{"c":"CC","n":"296","t":"Use of force for preserving order on board a vessel","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The master of a vessel, or any person acting by his order, may justify the use of any such force against\nany person onboard the vessel as is necessary for suppressing any mutiny or disorder on board the\nvessel, whether among officers, seamen, or passengers, whereby the safety of the vessel, or of any\nperson therein or about to enter or quitting the same, is likely to be endangered, or the master is\nthreatened to be subjected to the commands of the other person; and may kill any person who is guilty\nof or abets such mutiny or disorder, if the safety of the vessel, or the preservation of any such person as\naforesaid, cannot be otherwise secured."},{"c":"CC","n":"297","t":"Surgical operations","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person is not criminally responsible for performing in good faith and with reasonable care and skill a\nsurgical operation upon any person for his benefit, or upon an unborn child for the preservation of the\nmother's life, if the performance of the operation is reasonable, having regard to the patient's state at\nthe time and to all the circumstances of the case."},{"c":"CC","n":"298","t":"Excessive force","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person authorised by law to use force is criminally responsible for any excess, according to the\nnature and quality of the act which constitutes the excess."},{"c":"CC","n":"299","t":"Consent to death immaterial","ch":"Chapter 25 – Assaults and violence to the person generally; justification and excuse","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Consent by a person to the causing of his own death does not affect the criminal responsibility of any\nperson by whom such death is caused."},{"c":"CC","n":"300","t":"Duty to provide necessaries","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is the duty of every person having charge of another who is unable by reason of age, sickness,\nunsoundness of mind, detention or any other cause to withdraw himself from such charge, and who is\nunable to provide himself with the necessaries of life, whether the charge is undertaken under a\ncontract, or is imposed by law, or arises by reason of any act, whether lawful or unlawful, of the person\nwho has such charge, to provide for that other person the necessaries of life; and he is held to have\ncaused any consequences which result to the life or health of the other person by reason of any\nomission to perform that duty."},{"c":"CC","n":"301","t":"Duty of head of family","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is the duty of every person who, as head of a family, has charge of a child under the age of fourteen\nyears, being a member of his household, to provide the necessaries of life for such child; and he is held\nto have caused any consequences which result to the life or health of the child by reason of any\nomission to perform that duty, whether the child is helpless or not."},{"c":"CC","n":"302","t":"Duty of masters","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is the duty of every person who as master or mistress has contracted to provide necessary food,\nclothing, or lodging, for any servant or apprentice under the age of sixteen years, to provide the same;\nand he or she is held to have caused any consequences which result to the life or health of the servant\nor apprentice by reason of any omission to perform that duty."},{"c":"CC","n":"303","t":"Duty of persons doing dangerous acts","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is the duty of every person who, except in a case of necessity, undertakes to administer surgical or\nmedical treatment to any other person, or to do any other lawful act which is or may be dangerous to\nhuman life or health, to have reasonable skill and to use reasonable care in doing such act; and he is\nheld to have caused any consequences which result to the life or health of any person by reason of any\nomission to observe or perform that duty."},{"c":"CC","n":"304","t":"Duty of persons in charge of dangerous things","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is the duty of every person who has in his charge or under his control anything, whether living or\ninanimate, and whether moving or stationary, of such a nature that, in the absence of care or precaution\nin its use or management, the life, safety, or health of any person may be endangered, to use\nreasonable care and take reasonable precautions to avoid such danger; and he is held to have caused\nany consequences which result to the life or health of any person by reason of any omission to perform\nthat duty."},{"c":"CC","n":"305","t":"Duty to do certain acts","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person undertakes to do any act, the omission to do which is or may be dangerous to human life\nor health, it is his duty to do that act; and he is held to have caused any consequences which result to\nthe life or health of any person by reason of any omission to perform that duty."},{"c":"CC","n":"305A","t":"Breach of contract of person employed in certain services","ch":"Chapter 26 – Duties relating to the preservation of human life","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) Any person employed in any undertaking concerned in the supply of electricity or water, who\nmaliciously breaks his contract of service, knowing or having reasonable cause to believe that the\nprobable consequence of his so doing, either alone or in combination with others, will be to deprive the\ncommunity or any part of thereof either wholly or to a great extent of the supply of electricity or water,\nis guilty of an offence.\n\n         (2) Any person who maliciously breaks a contract of service knowing or having reasonable cause\nto believe that the probable consequences of his so doing, either alone or in combination with others,\nwill be to endanger human life or seriously to endanger public health, including the health of the\ninmates of a hospital or similar institution, or to cause serious bodily injury, or to expose valuable\nproperty, whether real or personal, to destruction or serious injury, is guilty of an offence.\n\n        (3) For the purpose of this section-\n\n                (i) \"maliciously\" means with the intention of producing any of the consequences set out\n                in subsection (1) or (2) of this section, as the case may be, or with a reckless disregard of\n                whether such consequences are produced or not, and\n\n        (ii)     the termination of any contract of service, either alone or in combination with others,\n                on less than seven days' notice of intention so to terminate, in such circumstances that\n                the actual or probable consequences of the termination are those set out in subsection\n                (1) or (2) of this section, shall, where length of such notice required by any enactment,\n                or by any contract or services, is more than seven days, be deemed to be a malicious\n                breach of contract, and the words \"maliciously breaks\" in this section of this Code shall\n                be construed accordingly.\n\n         (4) Any person guilty of an offence against any of the provisions of this section of this Code is\nliable, on conviction, to a fine of one hundred naira or to imprisonment for six months or to both such\nfine and imprisonment.\n\n        (5) No prosecution for an offence under this section of this Code shall be constituted without\nthe written consent of the Attorney-General of the Federation."},{"c":"CC","n":"306","t":"Killing of a human being unlawful","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"It is unlawful to kill any person unless such killing is authorised or justified or excused by law."},{"c":"CC","n":"307","t":"When a child becomes a human being","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A child becomes a person capable of being killed when it has completely proceeded in a living state from\nthe body of its mother, whether it has breathed or not, and whether it has an independent circulation or\nnot, and whether the navel-string is severed or not."},{"c":"CC","n":"308","t":"Definition of killing","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Except as hereinafter set forth, any person who causes the death of another, directly or indirectly, by\nany means whatever, is deemed to have killed that other person."},{"c":"CC","n":"309","t":"Death by acts done at childbirth","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a child dies in consequence of an act done or omitted to be done by any person before or during\nits birth, the person who did or omitted to do such acts is deemed to have killed the child."},{"c":"CC","n":"310","t":"Causing death by threats","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who, by threat or intimidation or by deceit, causes another person to do an act or make an\nomission which results in the death of that other person, is deemed to have killed him."},{"c":"CC","n":"311","t":"Acceleration of death","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who does any act or makes any omission which hastens the death of another person who,\nwhen the act is done or the omission is made, is labouring under some disorder or disease arising from\nanother cause, is deemed to have killed that other person."},{"c":"CC","n":"312","t":"When injury or death might be prevented by proper precaution","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person causes bodily injury to another from which death results, it is immaterial that the injury\nmight have been avoided by proper precaution on the part of the person injured, or that his death from\nthat injury might have been prevented by proper care or treatment."},{"c":"CC","n":"313","t":"Injury causing death in consequence of subsequent treatment","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person does grievous harm to another, and such other person has recourse to surgical or\nmedical treatment, and death results either from the injury or the treatment, he is deemed to have\nkilled that other person, although the immediate cause of death was the surgical or medical treatment,\nprovided that the treatment was reasonably proper under the circumstances, and was applied in good\nfaith."},{"c":"CC","n":"314","t":"Limitation as to time of death","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person is not deemed to have killed another, if the death of that other person does not take place\nwithin a year and a day of the cause of death.\nSuch period is reckoned inclusive of the day on which the last unlawful act contributing to the cause of\ndeath was done.\n\nWhen the cause of death is an omission to observe or perform a duty, the period is reckoned inclusive of\nthe day on which the omission ceased.\n\nWhen the cause of death is in part an unlawful act, and in part an omission to observe or perform a\nduty, the period is reckoned inclusive of the day on which the last unlawful act was done or the day on\nwhich the omission ceased, whichever is the later."},{"c":"CC","n":"315","t":"Unlawful homicide","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully kills another is guilty of an offence which is called murder or manslaughter,\naccording to the circumstances of the case."},{"c":"CC","n":"316","t":"Definition of murder","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Except as hereinafter set forth, a person who unlawfully kills another under any of the following\ncircumstances, that is to say-\n\n        (1) if the offender intends to cause the death of the person killed, or that of some other person;\n\n        (2) if the offender intends to do to the person killed or to some other person some grievous\nharm;\n\n          (3) if death is caused by means of an act done in the prosecution of an unlawful purpose, which\nact is of such a nature as to be likely to endanger human life;\n\n        (4) if the offender intends to do grievous harm to some person for the purpose of facilitating the\ncommission of an offence which is such that the offender may be arrested without warrant, or for the\npurpose of facilitating the flight of an offender who has committed or attempted to commit any such\noffence;\n\n       (5) if death is caused by administering any stupefying or overpowering things for either of the\npurposes last aforesaid;\n\n        (6) if death is caused by wilfully stopping the breath of any person for either of such purposes,\n\nis guilty of murder.\n\nIn the second case it is immaterial that the offender did not intend to hurt the particular person who is\nkilled.\n\nIn the third case it is immaterial that the offender did not intend to hurt any person.\nIn the three last cases it is immaterial that the offender did not intend to cause death or did not know\nthat death was likely to result."},{"c":"CC","n":"317","t":"Definition of manslaughter","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"A person who unlawfully kills another in such circumstances as not to constitute murder is guilty of\nmanslaughter."},{"c":"CC","n":"318","t":"Killing on provocation","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"When a person who unlawfully kills another in circumstances which, but for the provisions of this\nsection of this Code, would constitute murder, does the act which causes death in the heat of passion\ncaused by grave and sudden provocation, and before there is time for his passion to cool, he is guilty of\nmanslaughter only."},{"c":"CC","n":"319","t":"Punishment of murder: provision for juveniles: provision for pregnant women","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) Subject to the provisions of this section of this Code, any person who commits the offence of\nmurder shall be sentenced to death.\n\n                                          Provisions for juveniles\n\n        (2) Where an offender who in the opinion of the court had not attained the age of seventeen\nyears at the time the offence was committed, has been found guilty of murder, such offender shall not\nbe sentenced to death but shall be ordered to be detained during the pleasure of the President and\nupon such an order being made the provisions of Part 44 of the Criminal Procedure Act shall apply.\n\n                                  [1966 No. 84. L.N. 112 of 1964.]\n\n                                  Provisions for pregnant women\n\n        (3) Where a woman who has been convicted of murder alleges she is pregnant or where the\njudge before whom she is convicted considers it advisable to have inquiries made as to whether or not\nshe be pregnant, the procedure laid down in section 376 of the Criminal Procedure Act shall first be\ncomplied with."},{"c":"CC","n":"320","t":"Attempt to murder","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n        (1) attempts unlawfully to kill another; or\n\n         (2) with intent unlawfully to kill another does any act, or omits to do any act which it is his duty\nto do, such act or omission being of such a nature as to be likely to endanger human life,\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"321","t":"Attempt to murder by convict","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, being under sentence of penal servitude or of imprisonment for three years or more,\nattempts to commit murder is liable to imprisonment for life."},{"c":"CC","n":"322","t":"Accessory after the fact to murder","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who becomes an accessory after the fact to murder is guilty of a felony and is liable to\nimprisonment for life."},{"c":"CC","n":"323","t":"Written threats to murder","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, knowing the contents thereof, directly or indirectly causes any person to receive any\nwriting threatening to kill any person is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"324","t":"Conspiring to murder","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who conspires with any other person to kill any person, whether such person is in Nigeria or\nelsewhere, is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"325","t":"Punishment of manslaughter","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who commits the offence of manslaughter, is liable to imprisonment for life."},{"c":"CC","n":"326","t":"Aiding suicide","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n        (1 ) procures another to kill himself; or\n\n        (2) counsels another to kill himself and thereby induces him to do so; or\n\n        (3) aids another in killing himself;\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"327","t":"Attempting to commit suicide","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who attempts to kill himself is guilty of a misdemeanor and is liable to imprisonment for one\nyear."},{"c":"CC","n":"327A","t":"Offence of infanticide","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Where a woman by any wilful act or omission causes the death of her child being a child under the age\nof twelve months, but at the time of the act or omission the balance of her mind was disturbed by\nreason of her not having fully recovered from the effect of lactation consequent upon the birth of the\nchild, then notwithstanding that the circumstances were such that but for this section of this Code the\noffence would have amounted to murder, she is guilty of a felony, to wit of infanticide, and may for such\noffence be dealt with and punished as if she had been guilty of the offence of manslaughter of the child."},{"c":"CC","n":"328","t":"Killing unborn child","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, when a woman is about to be delivered of a child, prevents the child from being born\nalive by any act or omission of such a nature that, if the child had been born alive and had then died, he\nwould be deemed to have unlawfully killed the child, is guilty of a felony and is liable to imprisonment\nfor life."},{"c":"CC","n":"329","t":"Concealing the birth of children","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, when a woman is delivered of a child, endeavours, by any secret disposition of the\ndead body of the child, to conceal the birth, whether the child died before, at or after its birth, is guilty\nof a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"329A","t":"unlawful possession of human head","ch":"Chapter 27 – Homicide; Suicide; Infanticide; Concealment of Birth; Unlawful possession of Human Head","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) Any person who receives or has in his possession a human head or skull within six months of\nthe same having been separated from the body or skeleton with the intention that such head or skull\nshall be possessed by himself as a trophy, juju or charm or transferred by him to any other person as a\ntrophy, juju or charm, is guilty of a felony and is liable to imprisonment for five years.\n\n        (2) Where in any prosecution under this section of this Code it is proved that the person charged\nreceived or had in his possession a human head or skull within six months of the same having been\nseparated from the body or skeleton, it shall be presumed that the person charged received or had in\nhis possession such head or skull with the intention specified in subsection (1) of this section, unless the\ncontrary is proved.\n\n        (3) A prosecution for an offence under this section of this Code shall not be instituted except by\nor with the consent of a law officer."},{"c":"CC","n":"330","t":"Disabling in order to commit felony or misdemeanou
