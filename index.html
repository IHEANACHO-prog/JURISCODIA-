 felony;\n\n        (f)       being in any building whatever by night with intent to commit a felony therein; or\n\n        (g)       being in any building whatever by day with intent to commit a felony therein, and\n                  having taken precautions to conceal his presence,\n\nis guilty of a felony and is liable to imprisonment for three years.\n\nIf the offender has been previously convicted of a felony relating to property, he is liable to\nimprisonment for seven years."},{"c":"CC","n":"418","t":"Definition","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any representation made by words, writing, or conduct, of a matter of fact, either past or present,\nwhich representation is false in fact and which the person making it knows to be false or does not\nbelieve to be true, is a false pretence."},{"c":"CC","n":"419","t":"Obtaining goods by false pretences","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who by any false pretence, and with intent to defraud, obtains from any other person\nanything capable of being stolen, or induces any other person to deliver to any person anything capable\nof being stolen, is guilty of a felony and is liable to imprisonment for three years.\n\n       If the thing is of the value of one thousand naira or upwards, he is liable to imprisonment for\nseven years.\n\nIt is immaterial that the thing is obtained or its delivery is induced through the medium of a contract\ninduced by the false pretence.\n\nThe offender cannot be arrested without warrant unless found committing the offence."},{"c":"CC","n":"419A","t":"Obtaining credit by false pretences or other fraud","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who by any false pretence or by means of any other fraud obtains credit for\nhimself or any other person-\n\n                                          [1966 No. 84.]\n\n        (a)      in incurring any debt or liability; or\n\n        (b)     by means of an entry in a debtor and creditor account between the person giving and\nthe person receiving credit,\n\nis guilty of a felony and is liable to imprisonment for three years.\n\n        (2) The offender cannot be arrested without warrant unless found committing the offence."},{"c":"CC","n":"419B","t":"Presumption as to false pretences in certain circumstances","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Where in any proceedings for an offence under section 419 or 4l9A of this Code it is proved that the\naccused-\n\n                                          [1966 No. 84.]\n\n        (a)      obtained or induced the delivery of anything capable of being stolen; or\n\n        (b)      obtained credit for himself or any other person, by means of a cheque that, when\n                 presented for payment within a reasonable time, was dishonoured on the ground that\n                 no funds or insufficient funds were standing to the credit of the drawer of the cheque in\n                 the bank on which the cheque was drawn,\n\nthe thing or its delivery shall be deemed to have been obtained or induced, or the credit shall be\ndeemed to have been obtained, by a false pretence, unless the court is satisfied by evidence that when\nthe accused issued the cheque he had reasonable grounds for believing, and did in fact believe, that it\nwould be honoured if presented within a reasonable time after its issue by him."},{"c":"CC","n":"420","t":"Obtaining execution of a security by false pretences","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who by any false pretence, and with intent to defraud, induces any person to execute, make,\naccept, endorse, alter, or destroy, the whole or any part of any valuable security, or to write, impress, or\naffix, any name or seal upon or to any paper or parchment in order that it may be afterwards made or\nconverted into or used or dealt with as a valuable security, is guilty of a felony and is liable to\nimprisonment for three years.\n\nThe offender cannot be arrested without warrant unless found committing the offence."},{"c":"CC","n":"421","t":"Cheating","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who by means of any fraudulent trick or device obtains from any other person anything\ncapable of being stolen, or induces any other person to deliver to any person anything capable of being\nstolen or to pay or deliver to any person any money or goods, or any greater sum of money or greater\nquantity of goods than he would have paid or delivered but for such trick or device, is guilty of a\nmisdemeanor and is liable to imprisonment for two years.\n\n               A person found committing the offence may be arrested without warrant."},{"c":"CC","n":"422","t":"Conspiracy to defraud","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who conspires with another by deceit or any fraudulent means to affect the market price of\nanything publicly sold, or to defraud the public or any person, whether a particular person or not, or to\nextort any property from any person, is guilty of a felony and is liable to imprisonment for seven years.\n\n                             The offender cannot be arrested without warrant."},{"c":"CC","n":"423","t":"Frauds on sale or mortgage of property","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a seller or mortgagor of any property, or being the solicitor or agent of any such\nseller or mortgagor, with intent to induce the purchaser or mortgagee to accept the title offered or\nproduced to him, and with intent to defraud-\n\n      (1) conceals from the purchaser or mortgagee any instrument material to the title, or any\nencumbrance; or\n\n        (2) falsifies any pedigree on which the title depends or may depend; or\n\n        (3) makes any false statement as to the title offered or conceals any fact material thereto,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"424","t":"Pretending to exercise witchcraft or tell fortunes","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who for gain or reward pretends to exercise or use any kind of witchcraft, juju, sorcery,\nenchantment, or conjuration, or undertakes to tell fortunes, or pretends from his skill or knowledge in\nany occult science to discover where or in what manner anything supposed to have been stolen or lost\nmay be found, is guilty of a misdemeanor and is liable to imprisonment for one year."},{"c":"CC","n":"425","t":"Obtaining registration, etc., by false pretences","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully procures or attempts to procure for himself or any other person any\nregistration, licence or certificate under any Act or law or under any regulation made under the Nigerian\n(Constitution) Order in Council, 1951, or the Nigerian (Constitution) order in Council, 1954, or the\nConstitution of the Federal Republic of Nigeria, by any false pretence, is guilty of a misdemeanor, and is\nliable to imprisonment for one year."},{"c":"CC","n":"426","t":"(Repealed by Ordinance No. 20 of 1955)","ch":"Chapter 38 – Obtaining property by false pretences: cheating","p":"Part 6 – Offences relating to property and contracts","x":""},{"c":"CC","n":"427","t":"Receiving stolen property, etc","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who receives anything which has been obtained by means of any act constituting a felony or\nmisdemeanor, or by means of any act done at a place not in Nigeria, which if it had been done in Nigeria\nwould have constituted a felony or misdemeanor, and which is an offence under the laws in force in the\nplace where it was done, knowing the same to have been so obtained, is guilty of a felony.\n\nIf the offence by means of which the thing was obtained is a felony, the offender is liable to\nimprisonment for fourteen years, except in the case in which the thing so obtained was postal matter, or\nany chattel, money or valuable security contained therein, in which case the offender is liable to\nimprisonment for life.\n\nIn any other case the offender is liable to imprisonment for seven years.\n\nFor the purpose of proving the receiving of anything, it is sufficient to show that the accused person has,\neither alone or jointly with some other person, had the thing in his possession, or has aided in\nconcealing it or disposing of it."},{"c":"CC","n":"428","t":"Unlawful possession of arms, etc., belonging to Armed or Police Forces","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n                                          [L.N. 112 of 1964.]\n\n(a)      knowingly detains, buys, exchanges, or receives, from any non-commissioned officer or private\n        of the armed forces of Nigeria or from any member of the police forces, or from any deserter\n        from either of such forces, or from any person acting for and on behalf of any of the persons\n        above named; or\n\n(b)      solicits or entices any of the said persons to sell, make away with, or dispose of; or\n\n(c)      shall be employed by any of the said persons, well knowing him to belong to one or other of\n        such forces in one of the several capacities hereinbefore mentioned, or to be a deserter from\n        any of the said forces, to sell, make away with, or dispose of; or\n\n(d)      shall have in his possession and not give a satisfactory account of his possession of any arms,\n        ammunition, clothing, accoutrements, medals or other appointments, furnished for the use of\n        the armed forces of Nigeria or of the police forces,\n\nis liable to a fine of forty naira and to pay double the value of all or any of the several articles which he\nshall so become or be possessed of."},{"c":"CC","n":"429","t":"Receiving after change of ownership","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"When a thing has been obtained by means of any act constituting a felony or misdemeanor, or by means\nof an act done at a place not in Nigeria, which if it had been done in Nigeria would have constituted an\noffence, and which is an offence under the laws in force in the place where it was done, and another\nperson has acquired a lawful title to it, a subsequent receiving of the thing is not an offence although\nthe receiver knows that the thing had previously been so obtained."},{"c":"CC","n":"430","t":"Having possession of thing reasonably suspected of having been stolen","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who is charged before any court with having in his possession or under his\ncontrol in any manner or in any place, or for that he at any time within the three months immediately\npreceding the making of the complaint, did have in his possession or under his control in any manner or\nin any place, anything which is reasonably suspected of having been stolen or unlawfully obtained, and\nwho does not give an account, to the satisfaction of the court, as to how he came by the same, is guilty\nof an offence and is liable on conviction to a fine of two hundred naira or to imprisonment for six\nmonths.\n\n         (2) Where any person is charged before any court with having or with having had in his\npossession or under his control in any manner or in any place anything which has been stolen or\nunlawfully obtained, or which is reasonably suspected of having been stolen or unlawfully obtained, and\ndeclares that he received the same for some other person or that he was employed as a carrier, agent or\nservant for some other person, the court is hereby authorised and required, if practicable, to cause\nevery such other person and also if necessary every former or pretended purchaser or other person\nthrough whose possession such thing as aforesaid has passed or who has had control thereof, to be\nbrought before it and to examine witnesses upon oath touching the same; and if it appears to the court\nthat any person has had possession or control of such thing and had reasonable cause to believe the\nsame to have been stolen or unlawfully obtained, every such person shall be deemed to have had\npossession or control of such thing at the time and place when and where the same was found or seized,\nand is guilty of an offence and liable, on conviction to a fine of two hundred naira or to imprisonment\nfor six months.\n\n        (3) The possession of or control by a carrier, agent or servant shall be deemed to be the\npossession of or control by the person who employed such carrier, agent or servant to have or deal with\nsuch thing and such person shall be liable on conviction to the punishment herein mentioned.\n\n        (4) The offender may be arrested without warrant."},{"c":"CC","n":"431","t":"Unlawfully using animals or vehicles","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who unlawfully uses a horse, mare, gelding, ass, mule, camel, ostrich, bull, cow, ox, ram,\newe, wether, goat, or pig, or the young of any such animal, or any cycle or other vehicle whatsoever\nwithout the consent of the owner, or of the person in lawful possession thereof, is guilty of a\nmisdemeanor, and is liable to imprisonment for one year, or to a fine of forty naira for every animal or\nvehicle so used.\n\nThe offender may be arrested without warrant by a police officer, or by the owner of the property in\nquestion, or his servant, or by any person authorised by such owner or servant."},{"c":"CC","n":"432","t":"Suspicion of stealing animals","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"When any horse, mare, gelding, ass, mule, camel, ostrich, bull, cow, ox, ram, ewe, wether, goat, or pig,\nor the young of any of such animal is suspected, on reasonable grounds, to have been stolen, any person\nin whose possession or custody the skin, feathers or carcass, or any part of the skin or carcass, of the\nanimal or bird so suspected to have been stolen, is found, is guilty of an offence, unless he proves that\nhe came lawfully by the thing in question; and he is liable to a fine of one hundred naira.\n\nThe offender may be arrested without warrant by a police officer, or by the owner of the property in\nquestion, or his servant, or by any person authorised by such owner or servant."},{"c":"CC","n":"433","t":"Taking reward for recovery of property obtained by means of felony or misdemeanour","ch":"Chapter 39 – Receiving property stolen or fraudulently obtained and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who corruptly receives or obtains, or corruptly agrees to receive or obtain, any property or\nbenefit of any kind upon an agreement or understanding that he will help any person to recover\nanything which has been obtained by means of any act constituting a felony or misdemeanor, or by\nmeans of any act done at a place not in Nigeria, which if it had been done in Nigeria would have\nconstituted an offence, and which is an offence under the laws in force in the place where it was done,\nis, unless he has used all due diligence to cause the offender to be brought to trial for the offence, guilty\nof a felony, and liable to imprisonment for seven years."},{"c":"CC","n":"434","t":"Trustees fraudulently disposing of trust property","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a trustee of any property, destroys the property with intent to defraud, or, with\nintent to defraud, converts the property to any use unauthorised by the trust, is guilty of a felony and is\nliable to imprisonment for seven years.\n\nThe offender cannot be arrested without warrant.\n\nIf civil proceedings have been taken against a trustee in respect of any act done by him, which is an\noffence under the provisions of this section of this Code, he cannot be afterwards prosecuted for the\nsame cause, as for an offence, on the complaint of the person by whom the civil proceedings were taken\nwithout the sanction of the court or judge before whom the civil proceedings were had or are pending.\n\nFor the purposes of this section, the term \"trustee\" includes the following persons and no others-\n        (a)      trustees upon express trusts created by a deed, will, or instrument in writing, whether\n                for a public or private or charitable purpose;\n\n        (b)     trustees appointed by or under the authority of an Act, law or statute for any such\n                purpose;\n\n        (c)     persons upon whom the duties of any such trust as aforesaid devolve;\n\n        (d)      executors and administrators."},{"c":"CC","n":"435","t":"Directors and officers of corporations or companies fraudulently appropriating property or","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"keeping fraudulent accounts, or falsifying books or accounts\n\nAny person who-\n\n        (1) being a director or officer of a corporation or company, receives or possesses himself as such\nof any of the property of the corporation or company otherwise than in payment of a just debt or\ndemand, and, with intent to defraud, omits either to make a full and true entry thereof in the books and\naccounts of the corporation or company, or to cause or direct such an entry to be made therein; or\n\n        (2) being a director, officer, or member of a corporation or company, does any of the following\nacts with intent to defraud-\n\n(a) destroys, alters, mutilates, or falsifies, any book, document, valuable security, or account, which\nbelongs to the corporation or company, or any entry in any such book, documents, or account, or is\nprivy to any such act; or\n\n        (b)      makes or is privy to making any false entry in any such book, document or account; or\n\n        (c)     omits or is privy to omitting any material particular from any such book, document or\n                account,\n\nis guilty of a felony and is liable to imprisonment for seven years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"436","t":"False statements by officials of Companies","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a promoter, director, officer, or auditor, of a corporation or company, either\nexisting or intended to be formed, makes, circulates, or publishes, or concurs in making, circulating, or\npublishing, any written statement or account which in any material particular, is to his knowledge false,\nwith intent thereby to effect any of the following purposes-\n\n        (a)      to deceive or to defraud any member, shareholder, or creditor, of the corporation or\n                company, whether a particular person or not;\n        (b)     to induce any person, whether a particular person or not, to become a member of, or to\n                entrust or advance any property to, the corporation or company, or to enter into any\n                security for the benefit thereof,\n\nis guilty of a felony and is liable to imprisonment for seven years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"437","t":"Defence","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"It is a defence to a charge of any of the offences defined in this Chapter to prove that the accused\nperson, before being charged with the offence, and in consequence of the compulsory process of a\ncourt in any action or proceedings instituted in good faith by a party aggrieved, or in a compulsory\nexamination or deposition before a court, disclosed on oath the act alleged to constitute the offence.\n\n        A person is not entitled to refuse to answer any question or interrogatory in any civil proceeding\nin any court, on the ground that his doing so might tend to show that he had committed any such\noffence."},{"c":"CC","n":"438","t":"Fraudulent false accounting","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a clerk or servant, or being employed or acting in the capacity of a clerk or\nservant, does any of the following acts with intent to defraud-\n\n        (a)     destroys, alters, mutilates, or falsifies, any book, document, valuable security, or\n                account, which belongs to or is in the possession of his employer, or has been received\n                by him on account of his employer, or any entry in any such book, document, or\n                account, or is privy to any such act; or\n\n        (b)      makes, or is privy to making any false entry in any such book, document, or account; or\n\n        (c)     omits, or is privy to omitting, any material particular from any such book, document, or\n                account,\n\nis guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"439","t":"False accounting by public officer","ch":"Chapter 40 – Frauds by trustees and officers of companies and corporations: false accounting","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being an officer charged with the receipt, custody, or management of any part of the\npublic revenue, knowingly furnishes any false statement or return of any money or property received by\nhim or entrusted to his care, or of any balance of money or property in his possession or under his\ncontrol, is guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"440","t":"Unlawful acts","ch":"Chapter 41 – Definitions","p":"Part 6 – Offences relating to property and contracts","x":"An act which causes injury to the property of another, and which is done without his consent, is\nunlawful unless it is authorised or justified or excused by law.\n\nIt is immaterial that the person who does the injury is in possession of the property injured or has a\npartial interest in it.\n\nA person is not criminally responsible for any injury caused to property by the use of such force as is\nreasonably necessary for the purpose of defending or protecting himself, or any other person, or any\nproperty, from injury which he believes, on reasonable grounds, to be imminent."},{"c":"CC","n":"441","t":"Acts done with intent to defraud","ch":"Chapter 41 – Definitions","p":"Part 6 – Offences relating to property and contracts","x":"When an act which causes injury to property, and which would be otherwise lawful, is done with intent\nto defraud any person, it is unlawful.\n\nWhen an act which causes injury to property is done with intent to defraud any person, it is immaterial\nthat the property in question is the property of the offender himself."},{"c":"CC","n":"442","t":"Damage","ch":"Chapter 41 – Definitions","p":"Part 6 – Offences relating to property and contracts","x":"The term \"damage\" used in relation to a document, or to a writing or inscription, includes obliterating\nand rendering illegible, either in whole or in part."},{"c":"CC","n":"443","t":"Arson","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully sets fire to any of the following things-\n\n        (a)      any building or structure whatever, whether completed or not;\n\n        (b)       any vessel, whether completed or not;\n\n        (c)      any stack of cultivated vegetable produce, or of mineral or vegetable fuel;\n\n        (d)       a mine, or the workings, fittings, or appliances of a mine,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"444","t":"Attempts to commit arson","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n           (1) attempts unlawfully to set fire to any such thing as is mentioned in section 443 of this Code;\nor\n\n       (2) wilfully and unlawfully sets fire to anything which is so situated that any such thing as is\nmentioned in section 443 of this Code is likely to catch fire from it,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"445","t":"Setting fire to crops and growing plants","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully sets fire to any of the following things-\n\n           (a)      a crop of cultivated vegetable produce, whether standing or cut;\n\n           (b)      a crop of hay or grass under cultivation, whether the natural or indigenous products of\n                   the soil or not, and whether standing or cut;\n\n            (c)     any standing trees, saplings, or shrubs, whether indigenous or not, under cultivation,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"446","t":"Attempting to set fire to crops, etc","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n     (a)   attempts unlawfully to set fire to any such thing as is mentioned in section 445 of this Code; or\n\n     (b)   wilfully and unlawfully sets fire to anything which is so situated that any such thing as is\n\nmentioned in section 445 of this Code is likely to catch fire from it, is guilty of felony and is liable to\nimprisonment for seven years."},{"c":"CC","n":"447","t":"Casting away ships","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n            (1) wilfully and unlawfully casts away or destroys any vessel, whether complete or not; or\n\n         (2) wilfully and unlawfully does any act which tends to the immediate loss or destruction of a\nvessel in distress; or\n\n         (3) with intent to bring a vessel into danger, interferes with any light, beacon, buoy, mark, or\nsignal used for purposes of navigation, or exhibits any false light or signal,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"448","t":"Attempts to cast away ships","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who attempts unlawfully to cast away or destroy a vessel, whether completed or not, or\nattempts unlawfully to do any act tending to the immediate loss or destruction of a vessel in distress, is\nguilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"449","t":"Obstructing and injuring railways","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who unlawfully and with intent to obstruct the use of a railway or to injure any property\nupon a railway-\n\n         (1) deals with the railway or with anything whatever upon or near the railway in such a manner\nas to affect or endanger the free and safe use of the railway; or\n\n         (2) shows any light or signal, or in any way deal with any existing light or signal, upon or near\nthe railway; or\n\n         (3) by any omission to do any act which it is his duty to do, causes the free and safe use of the\nrailway to be endangered,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"450","t":"Injuring animals","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully kills, maims, or wounds, any animal capable of being stolen, is\nguilty of an offence.\n\nIf the animal in question is a horse, mare, gelding, ass, mule, camel, bull, cow, ox, goat, pig, ram, wether,\nor ostrich, or the young of any such animal, the offender is guilty of a felony and is liable to\nimprisonment for seven years.\n\n  In any other case the offender is guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"451","t":"Malicious injuries in general","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully destroys or damages any property, is guilty of an offence, which,\nunless otherwise stated, is a misdemeanor and he is liable, if no other punishment is provided, to\nimprisonment for two years.\n\n                                         Punishment in special cases\n\nDestroying or damaging an inhabited house or a vessel with explosives\n\n (1) If the property in question is a dwelling-house or a vessel, and the injury is caused by the explosion\nof any explosive substance, and if-\n\n        (a) any person is in the dwelling-house or vessel; or\n\n        (b) the destruction or damage actually endangers the life of any person,\nthe offender is guilty of a felony and is liable to imprisonment for life.\n\nRiver bank or wall, or navigation works, or bridges\n\n         (2) (a) If the property in question is a bank or wall of a river, canal, aqueduct, reservoir, or\n\n                 inland water, and the injury causes actual danger of inundation or damage to any land\n                 or building; or\n\n         (b)      if the property in question is a railway, or is a bridge, viaduct, or aqueduct, which is\n                 constructed over a highway, railway or canal, or over which a railway, highway, or canal\n                 passes, and the property is destroyed; or\n\n(c)              if the property in question, being a railway, or being any such bridge, viaduct, or\n                 aqueduct, is damaged, and the damage is done with intent to render the railway, bridge,\n                 viaduct, or aqueduct, or the highway, railway, or canal passing over or under the same,\n                 or any part thereof, dangerous or impassable, and the same or any part thereof is\n                 thereby rendered dangerous or impassable,\n\nthe offender is guilty of a felony and is liable to imprisonment for life.\n\nWills and registers\n\n          (3) If the property in question is a testamentary instrument, whether the testator is living or\ndead, or a register which is authorised or required by law to be kept for authenticating or recording the\ntitle to any property, or for recording births, baptisms, marriages, deaths, or burials, or a copy of any\npart of any such register which is required by law to be sent to any public officer, the offender is guilty of\na felony and is liable to imprisonment for fourteen years.\n\nWrecks\n\n       (4) If the property in question is a vessel in distress or wrecked, or stranded, or anything which\nbelongs to such vessel, the offender is guilty of a felony and is liable to imprisonment for seven years.\n\nRailways\n\n       (5) If the property in question is any part of a railway, or any work connected with a railway, the\noffender is guilty of a felony, and is liable to imprisonment for fourteen years.\n\nOther things of special value\n\n         (6) (a) if the property in question, being a vessel, whether complete or not, is destroyed; or\n\n(b)      if the property in question, being a vessel, whether complete or not, is damaged, and the\n         damage is done with intent to destroy it or render it useless; or manufacturing machine, or a\n         manufacturing implement, or a machine or appliance used or intended to be used for\n        performing any process connected with the preparation of any agricultural or pastoral produce,\n        is destroyed; or\n\n(c)      if the property in question is a light, beacon, buoy, mark, or signal, used for the purposes of\n        navigation, or for the guidance of persons engaged in navigation; or\n\n(d)     if the property in question is a bank or wall of a river, canal, aqueduct, reservoir, or inland\n        water, or a work which appertains to a dock, canal, aqueduct, reservoir, or inland water, or\n        which is used for the purposes of lading or unlading goods; or\n\n(e)     if the property in question, being a railway, or being a bridge, viaduct, or aqueduct, which is\n        constructed over a highway, railway or canal, or over which a highway, railway, or canal passes,\n        is damaged, and the damage is done with intent to render the railway, bridge, viaduct, or\n        aqueduct, or the highway, railway, or canal, passing over or under the same, or any part thereof,\n        dangerous or impassable; or\n\n(f)     if the property in question, being anything in process of manufacture, or an agricultural or an\n        agricultural or manufacturing machine, or a manufacturing implement, or a machine or\n        appliance used or intended to be used for performing any process connected with the\n        preparation of any agricultural or pastoral produce, is destroyed ; or\n\n(g)     if the property in question, being any such thing, machine, implement, or appliance, as last\n        aforesaid, is damaged, and the damage is done with intent to destroy the thing in question or to\n        render it useless; or\n\n(h)     if the property in question is a shaft or a passage of a mine, and the injury is done with intent to\n        damage the mine or to obstruct its working; or\n\n(i)      if the property in question is a machine, appliance, apparatus, building, erection, bridge, or\n        road, appertaining to or used with a mine, whether the thing in question is completed or not; or\n\n(f)     if the property in question, being a rope, chain, or tackle, or whatever material, which is used in\n        a mine, or upon any way or work appertaining to or used with a mine, is destroyed; or\n\n(k)     if the property in question, being any such rope, chain, or tackle, as last aforesaid, is damaged,\n        and the damage is done with intent to destroy the thing in question or to render it useless; or\n\n(I)     if the property in question is a well, or bore for water, or the dam, bank, wall, or floodgate of a\n        millpond or pool,\n\nthe offender is guilty of a felony, and is liable to imprisonment for seven years.\n\nDeeds and records\n        (7) If the property in question is a document which is deposited or kept in a public office, or\nwhich is evidence of title to any land or estate in land, the offender is guilty of a felony and is liable to\nimprisonment for seven years."},{"c":"CC","n":"452","t":"Attempts to destroy property by explosives","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, unlawfully and with intent to destroy or damage any property, puts any explosive\nsubstance in any place whatever, is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"453","t":"Attempts to injure mines","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to injure a mine or to obstruct the working of a mine-\n\n     (1) unlawfully, and otherwise than by an act done underground in the course of working an\nadjoining mine-\n\n  (a)   causes water to run into the mine or into any subterranean passage communicating with the\n        mine; or\n\n        (b)      obstructs any shaft or passage of the mine; or\n\n        (2) unlawfully obstructs the working of any machine, appliance, or apparatus, appertaining to or\nused with the mine, whether the thing in question is completed or not; or\n\n       (3) unlawfully and with intent to render it useless, injures or unfastens a rope, chain, or tackle of\nwhatever material, which is used in the mine or upon any way or work appertaining to or used with the\nmine,\n\nis guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"454","t":"lnterfering with signals used for purposes of navigation","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully removes, defaces, or renders invisible, any light, beacon, buoy,\nmark or signal, used for purposes of navigation, or for the guidance of persons engaged in navigation, or\nunlawfully attempts to remove, deface or render invisible, any such thing, is guilty of a felony and is\nliable to imprisonment for seven years."},{"c":"CC","n":"455","t":"Interfering with navigation works","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n        (1) wilfully and unlawfully removes or disturbs any fixed objects or materials used for securing a\nbank or wall of a river, canal, aqueduct, reservoir, or inland water, or for securing any work which\nappertains to a dock, canal, aqueduct, reservoir, or inland water, or which is used for purposes of\nnavigation or lading or unlading goods; or\n        (2) unlawfully does any act with intent to obstruct the carrying on, completion, or maintenance\nof the navigation of a navigable river or canal, and thereby obstructs such carrying on, completion, or\nmaintenance,\n\nis guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"456","t":"Communicating infectious diseases to animals","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully causes, or is concerned in causing, or attempts to cause, any\ninfectious disease to be communicated to or among any animal or animals capable of being stolen, is\nguilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"457","t":"Removing boundary marks with intent to defraud","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who wilfully and unlawfully, and with intent to defraud, removes or defaces any object or\nmark which has been lawfully erected or made as an indication of the boundary of any land, is guilty of a\nfelony and is liable to imprisonment for three years."},{"c":"CC","n":"458","t":"Wilful damage, etc., to survey and boundary marks","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n         (1) wilfully removes, defaces or injures any survey mark or boundary mark which shall have\nbeen made or erected by or under the direction of any government department or in the course of or\nfor the purposes of a government survey; or\n\n        (2) being under an obligation to maintain in repair any boundary mark made or erected as\naforesaid, neglects or refuses to repair the same; or\n\n        (3) wilfully removes, defaces or injures any mark erected by an intending applicant for any lease,\nlicence or right under the Minerals and Mining Act,\n\n                                          [Cap. M12.]\n\nis guilty of a simple offence and is liable to imprisonment for three months or to a fine of forty naira, and\nmay further be ordered by the court to pay the cost of repairing or replacing the survey mark or\nboundary mark and of making any survey rendered necessary by the offender's act or neglect."},{"c":"CC","n":"459","t":"Obstructing railways","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, by any unlawful act, or by any intentional omission to do any act which it is his duty to\ndo, causes any engine or vehicle in use upon a railway to be obstructed in its passage on the railway, is\nguilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"459A","t":"Obstructing aircraft","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, by any unlawful act, obstructs, causes an alteration to be made in the course of, or in\nany way whatsoever hinders or impedes the movement of any aircraft, which is in motion on or in flight\nover any aerodrome, is guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"459B","t":"Trespass on aerodrome","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who commits any nuisance or trespass in or upon any aerodrome or in or upon any building\nor premises situated on any aerodrome, is guilty of a simple offence and IS liable to imprisonment for\nthree months or to a fine of forty naira."},{"c":"CC","n":"460","t":"Penalties for damage, etc., to railway works","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n  (1)    wilfully damages, injures, or obstructs any work, way, road, building, turnstile, gate, toll bar,\n        fence, weighing machine, engine, tender, carriage, wagon, truck, material, or plant acquired for\n        or belonging to any railway works; or\n\n  (2)   pulls up, removes, defaces, or destroys, or in any way interferes with, any poles, stakes, flags,\n        pegs, lines, marks, or anything driven or placed in or upon the ground, trees, stones, or building,\n        or any other material, belonging to any railway works; or\n\n(3)     commits any nuisance or trespass in or upon any land, building, or premises, acquired for or\n        belonging to any railway works; or\n\n(4)     wilfully molests, hinders, or obstructs, the officer in charge of any railway or his assistants or\n        workmen in the execution of any work done or to be done in reference to the construction or\n        maintenance of any such railway,\n\nis guilty of a simple offence and is liable to imprisonment for three months or to a fine of forty naira."},{"c":"CC","n":"461","t":"Sending letters threatening to burn or destroy","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, knowing the contents of the writing, causes any person to receive any writing\nthreatening that any building or vessel, whether complete or not, or any stack of cultivated vegetable\nproduce, or any such produce that is in or under a building, shall be burnt or destroyed, is guilty of a\nfelony and is liable to imprisonment for seven years."},{"c":"CC","n":"462","t":"Arrest without warrant","ch":"Chapter 42 – Offences","p":"Part 6 – Offences relating to property and contracts","x":"A person found committing any of the misdemeanors or simple offences defined in this Chapter of this\nCode may be arrested without warrant by a peace officer or a member of the police force, or by the\nowner of the property injured or his servant, or by any person authorised by such owner or servant."},{"c":"CC","n":"463","t":"Definitions","ch":"Chapter 43 – Forgery in general Definitions","p":"Part 6 – Offences relating to property and contracts","x":"In this Division of this part of this Code unless the context otherwise requires\n\n                                [L.N. 112 of 1964.]\n\n          \"bank note\" includes any negotiable instrument issued by or on behalf of any person or\ncorporation in any part of the world, or issued by the authority of any State, province, or government,\nand intended to be used as equivalent to money, either immediately on issue or at any time afterwards:\nit also includes a bank bill or bank post bill, currency note or any note (by whatever name called) which\nis legal tender in the country in which it is issued;\n\n       \"document\" includes a register or register-book, or part of either, and any book, and any paper,\nparchment, or other material whatever, used for writing or printing, which is marked with any letters or\nmarks denoting words, or with any other signs capable of conveying a definite meaning to persons\nconversant with them; but does not include trade marks on articles of commerce;\n\n        \"seal\" includes any stamp, die, or other thing, of whatever material, from which an impression\ncan be taken by means of pressure, or of ink, or by any other means;\n\n        \"writing\" includes an inscription on wood, stone, metal, or other material; it also includes a\nmere signature and a mark of any kind."},{"c":"CC","n":"464","t":"Further definitions","ch":"Chapter 43 – Forgery in general Definitions","p":"Part 6 – Offences relating to property and contracts","x":"A document or writing is said to be false-\n\n(a)     in the case of a document which is a register or record kept by lawful authority, or any entry in\n        any such register, or which purports to be issued by lawful authority as testifying to the contents\n        of any register or record kept by lawful authority, or as testifying to any facts or event, if any\n        material particular stated in the document is untrue; or\n\n(b)      if the whole or some material part of the document or writing purports to be made by or on\n        behalf of some person who did not make it or authorise it to be made, or if, in a case where the\n        time or place of making is material, although the contents or writing is made by or by the\nauthority of the person by whom it purports to be made, it is with a fraudulent intent falsely dated as to\nthe time or place of making; or\n\n(c)     if the whole or some material part of the document or writing purports to be made by or on\n        behalf of some person who does not in fact, exist; or\n(d)     if the document or writing is made in the name of an existing person, either by that person\n        himself or by his authority, with the fraudulent intention that it should pass as being made by\n        some person, real or fictitious, other than the person who makes it or authorises it to be made.\n\nA seal or mark is said to be counterfeit if it is made without lawful authority, and is in such form as to\nresemble a genuine seal or mark, or, in the case of a seal, in such a form as to be capable of producing\nimpressions resembling those produced by a genuine seal.\n\nA representation of the impression of a seal is said to be counterfeit if it is not in fact made by the seal.\n\nThe term \"resemble\", applied to anything, includes the case where the thing is made to resemble, or is\napparently intended to resemble, the object spoken of."},{"c":"CC","n":"465","t":"Definition of forgery","ch":"Chapter 43 – Forgery in general Definitions","p":"Part 6 – Offences relating to property and contracts","x":"A person who makes a false document or writing knowing it to be false, and with intent that it may in\nany way be used or acted upon as genuine, whether in the State or elsewhere, to the prejudice of any\nperson, or with intent that any person may, in the belief that it is genuine, be induced to do or refrain\nfrom doing any act, whether in the State or elsewhere, is said to forge the document or writing.\n\nA person who makes a counterfeit seal or mark, or makes an impression of a counterfeit seal knowing\nthe seal to be counterfeit, or makes a counterfeit representation of the impression of a genuine seal, or\nmakes without lawful authority an impression of a genuine seal, with intent in either case that the thing\nso made may in any way be used or acted upon as genuine, whether in the State or elsewhere, to the\nprejudice of any person, or with intent that any person may, in the belief that it is genuine, be induced\nto do or refrain from doing any act, whether in the State or elsewhere, is said to forge the seal or mark.\n\nThe term \"make a false document or writing\" includes altering a genuine document or writing in any\nmaterial part, either by erasure, obliteration, removal, or otherwise; and making any material addition\nto the body of a genuine document or writing; and adding to a genuine document or writing any false\ndate, attestation, seal or other material matter.\n\n        It is immaterial in what language a forged document or writing is expressed.\n\nIt is immaterial that the forger of anything forged may not have intended that any particular person\nshould use or act upon it, or that any particular person should be prejudiced by it, or be induced to do or\nrefrain from doing any act.\n\n         It is immaterial that the thing forged is incomplete or does not purport to be a document,\nwriting, or seal, which would be binding in law for any particular purpose, if it is so made, and is of such\na kind, as to indicate that it was intended to be used or acted upon."},{"c":"CC","n":"466","t":"Certain matters immaterial","ch":"Chapter 43 – Forgery in general Definitions","p":"Part 6 – Offences relating to property and contracts","x":"In the case of an offence which involves the forging or uttering of a document or writing relating to the\npayment of money, or to the delivery or transfer of any property, or to the creation or performance of\nany obligation, it is immaterial in what country the money or property is, or purports to be, payable,\ndeliverable, or transferable, or the obligation is or purports to be, an obligation to be performed; and, if\nthe money or the property purports to be payable, deliverable or transferable or the obligation purports\nto be an obligation to be performed in some country out of Nigeria, it is immaterial whether the\ndocument or writing is under seal or not."},{"c":"CC","n":"467","t":"Punishment of forgery in general","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who forges any document, writing, or seal, is guilty of an offence which, unless otherwise\nstated, is a felony, and he is liable, if no other punishment is provided, to imprisonment for three years.\n\n                                      Punishment in special cases\n\nPublic seals, etc.\n\n(1) If the thing forged-\n\n                                     [L.N. 112 of 1964, 1976 No. 27.]\n\n(a)      purports to be, or is intended by the offender to be understood to be, or to be used as, the\n         public seal of Nigeria or of any State of Nigeria or the great or privy seal of any country of the\n         Commonwealth or under the protection of a Commonwealth country, or the seal of the\n         President, or a Governor of a State; or\n\n(b)       is a document having on it or affixed to it any such seal, signet, or sign manual, or anything\n         which purports to be, or is intended by the offender to be understood to be, any such seal,\n         signet, or sign manual,\n\nthe offender is liable to imprisonment for life.\n\nSecurities, titles, register, etc.\n\n       (2) If the thing forged purports to be, or is intended by the offender to be understood to be or to\nbe used as, any of the following things-\n\n(a)   a document which is evidence of title to any portion of the public debt of Nigeria or of any State\n        thereof or of any other country, or to any dividend or interest payable in respect of any such\n        debt, or a transfer or assignment of any such document, or a receipt or certificate for any\n        interest or money payable or accruing on or in respect of any such public debt;\n\n(b)      a transfer or assignment of a share in any corporation, company, or society, whether domestic\n         or foreign, or of any share or interest in the capital stock of any such corporation, company, or\n      society, or in the debt of any such corporation, company or society, or a receipt or certificate for\n      any interest or money payable or accruing on or in respect of any such share, interest, or debt;\n\n(c)   a document acknowledging or being evidence of the indebtedness of the Government of Nigeria\n      or of the government of any other country;\n\n(d)    a document which by the law of Nigeria, or any other country is evidence of the title to any land\n      or estate in land in Nigeria or that other country, or an entry in any register or book which is\n      such evidence;\n\n(e)   a document which by law is required for procuring the registration of any title to any land or\n      estate in land;\n\n(f)   a testamentary instrument, whether the testator is living or dead, or a probate or letters of\n      administration, whether with or without a will annexed;\n\n(g    a bank note, bill of exchange, or promissory note, or an acceptance, endorsement, or\n      assignment, of either;\n\n(h)   a deed, bond, or writing obligatory, or a draft, warrant, order, or other security for the payment\n      of money, or for the delivery or transfer of a valuable security, or for procuring or giving credit,\n      whether negotiable or not, or an endorsement or assignment of any such document;\n\n(i)   an accountable receipt, or an acknowledgement of the deposit, receipt, payment or delivery, of\n      money or goods, or of any valuable security, or an endorsement or assignment of any such\n      document;\n\n(j)   a bill of lading, dock warrant, warehouse keeper's certificate, warrant, or order for the delivery\n      of goods, or any other document used in the ordinary course of business as proof of possession\n      or control of goods, or as authorising, or purporting to authorise, either by endorsement or by\n      delivery, the possessor of the document to transfer or receive the goods represented by the\n      document, or an endorsement or assignment of any such document;\n\n(k)   a charter party, or a shipping document accompanying a bill of lading, or an endorsement or\n      assignment of either;\n\n(I)   a policy of insurance of any kind;\n\n(m)    a power of attorney or other authority to execute any such document as is mentioned in this\n      section of this Code;\n\n(n)   the signature of a witness to any of the documents mentioned in this section to which\n      attestation is by law required;\n\n(o)   a register of births, baptisms, marriages, deaths, or burials, authorised or required by law to be\n      kept, or any entry in any such register;\n(p)     a copy of any such register or entry as last aforesaid, which is authorised or required by law to\n        be given or sent to or by any person;\n\n(q)     a seal by a registrar appointed to keep any such register as is hereinbefore mentioned, or the\n        impression of any such seal, or the signature of any such registrar,\n\nthe offender is liable to imprisonment for fourteen years.\n\nDocuments relating to revenue and acts of States, etc.\n\n(3)     If the thing forged purports to be, or is intended by the offender to be understood to be or to\n        be used as, any of the following things-\n\n                                [L.N. 112 of 1964. 1967 No. 27.]\n\n        (a)   the signature of the President or a Governor of a State or of a Minister, or a\n              commissioner, as the case may be, upon any grant, commission, warrant, or order;\n\n        (b)   a seal or stamp used for the purpose of the public revenue in Nigeria or in any other\n                 country;\n\n        (c) a document relating to the obtaining or receiving of any money payable on account of the\npublic service of Nigeria, or any other property of the State in any country, or a power of attorney or\nother authority to execute any such document,\n\nthe offender is liable to imprisonment for fourteen years.\n\nCourts seals, records, process, evidence, etc.\n\n        (4) If the thing forged purports to be, or is intended by the offender to be, understood to be or\nto be used as, any of the following things-\n\n                                         [L. N. 112 of 1964.]\n\n(a)    the seal of a court of record in any part of a country of the Commonwealth or of a country under\n       the protection of a Commonwealth country, or a seal used at the chambers of a Justice of the\n       Supreme Court or a Judge of a High Court for stamping or sealing summonses or orders;\n\n(b)   a seal or signature by virtue whereof any document can by law be used as evidence;\n\n(c)   any process of any court of justice in any part of a country of the Commonwealth or of a country\n       under the protection of a Commonwealth country;\n\n(d)    a document issued or made by or out of or by the authority of any such court as last aforesaid;\n\n(e)   a document or copy of a document of any kind, which document or copy is intended by the\n       offender to be used as evidence in any such court as last aforesaid;\n(f)     a record or other document of or belonging to a court of record in any part of a country of the\n        Commonwealth or of a country under the protection of a Commonwealth country;\n\n(g)     a copy or certificate of any record of any such court as last aforesaid;\n\n(h)     an instrument, whether written or printed, partly written and partly printed, which is made\n        evidence by any Act, law, statute, or order, in force in Nigeria;\n\n(i)     a document which a judicial officer is required or authorised by law to make, attest, or issue,\n        and purporting to be made, attested, or issued by a judicial officer;\n\n(f)     a stamp used for denoting the payment of fees or percentages in any court;\n\n(k)     a licence or certificate required or authorised by law to be given for the celebration of a\n        marriage;\n\n(I)     a consent to the marriage of a minor given by a person authorised by law to give it;\n\n(m)     a certificate of marriage given under the provisions of the laws relating to the solemnisation\n\n        of marriage;\n\n(n)     a copy of the registration of a marriage;\n\n(o)     a stamp issued or made under the laws relating to the post office;\n\n(p)     a power of attorney or a letter of attorney;\n\n(q)     the signature of a witness to a power of attorney or letter of attorney;\n\n(r)     the superscription of any postal matter by any person empowered under any enactment to\n        frank postal matter;\n\n(s)      a contract or a writing which with other writings constitutes a contract or is evidence of a\n        contract;\n\n(t)     an authority or request for the payment of money or for the delivery of property;\n\n(u)     an acquaintance or discharge or a voucher of having received any property, or any document\n        which is evidence of the receipt of any property;\n\n(v) any mark which under the authority of any Act, law, statute, or order, is impressed upon or\notherwise attached to or connected with any article for the purpose of denoting the quality of the\narticle or the fact that it has been examined or approved by or under the authority of some public body\nor public officer,\n\nthe offender is liable to imprisonment for seven years.\nTelegrams\n\n        (5) If the thing forged purports to be, or is intended by the offender to be understood to be or to\nbe used as, a message to be sent by telegraph, or a message received by telegraph, the offender is liable\nto the same punishment as if he had forged a document to the same effect as the message."},{"c":"CC","n":"468","t":"Uttering false documents and counterfeit seals","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who knowingly and fraudulently utters a false document or writing, or a counterfeit seal, is\nguilty of an offence of the same kind and is liable to the same punishment as if he had forged the thing\nin question.\n\nIt is immaterial whether the false document or writing, or counterfeit seal, was made in Nigeria or\nelsewhere.\n\nThe term \"fraudulently\" means an intention that the thing in question shall be used or acted upon as\ngenuine, whether in Nigeria or elsewhere, to the prejudice of some person, whether a particular person\nor not, or that some person whether a particular person, or not, shall, in the belief that the thing in\nquestion is genuine, be induced to do or refrain from doing some act, whether in Nigeria or elsewhere."},{"c":"CC","n":"469","t":"Uttering cancelled or exhausted documents","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who knowingly utters as and for a subsisting and effectual document any document which\nhas by any lawful authority been ordered to be revoked, cancelled, or suspended, or the operation of\nwhich has ceased by effluxion of time, or by death, or by the happening of any other event, is guilty of\nan offence of the same kind and is liable to the same punishment as if he had forged the document."},{"c":"CC","n":"470","t":"Uttering cancelled stamps","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who knowingly utters as and for a valid and uncancelled stamp a stamp, or an impression of\na seal, used for any purpose connected with the public revenue of Nigeria or of any part of a\nCommonwealth country or any country under the protection of a Commonwealth country which has\nbeen already used or which has been cancelled, is guilty of an offence of the same kind and is liable to\nthe same punishment as if he had forged the stamp or seal."},{"c":"CC","n":"471","t":"Procuring execution of documents by false pretences","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, by means of any false and fraudulent representation as to the nature, contents, or\noperation, of a document, procures another to sign or execute the document, is guilty of an offence of\nthe same kind and is liable to the same punishment as if he had forged the document."},{"c":"CC","n":"472","t":"Obliterating crossings on cheques","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud-\n           (1) obliterates, adds to or alters the crossing on a cheque; or\n\n           (2) knowingly alters a crossed cheque, the crossing on which has been obliterated, added to, or\naltered,\n\nis guilty of a felony, and is liable to imprisonment for seven years."},{"c":"CC","n":"473","t":"Making documents without authority","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud-\n\n       (1) without lawful authority or excuse, makes, signs, or executes, for or in the name or on\naccount of another person, whether by procuration or otherwise, any document or writing; or\n\n           (2) knowingly utters any document or writing so made, signed, or executed, by another person,\n\nis guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"474","t":"Demanding property upon forged testamentary instruments","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who procures the delivery or payment to himself or any other person of any property or\nmoney by virtue of any probate or letters of administration granted upon a forged testamentary\ninstrument, knowing the testamentary instrument to have been forged, or upon or by virtue of any\nprobate or letters of administration obtained by false evidence, knowing the grant to have been so\nobtained, is guilty of an offence of the same kind and is liable to the same punishment as if he had\nforged the document or thing by virtue whereof he procures the delivery or payment."},{"c":"CC","n":"475","t":"Purchasing forged bank notes","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without lawful authority or excuse, the proof of which lies on him, purchases or\nreceives from any person, or has in his possession, a forged bank note, whether filled up or in blank,\nknowing it to be forged, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"476","t":"Falsifying warrants for money payable under public authority","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being employed in the public service, knowingly and with intent to defraud makes out\nor delivers to any person a warrant for the payment of any money payable by public authority for a\ngreater or less amount than that to which the person on whose behalf the warrant is made out is\nentitled, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"477","t":"Falsification of register","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, having the actual custody of any register or record kept by lawful authority, knowingly\npermits any entry which, in any material particular, is to his knowledge false, to be made in the register\nor record, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"478","t":"Sending false certificate of marriage to registrar","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who signs or transmits to a person authorised by law to register marriages, a certificate of\nmarriage, or any document purporting to be a certificate of marriage, which in any material particular is\nto his knowledge false, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"479","t":"False statements for the purpose of registers of births, deaths and marriages","ch":"Chapter 44 – Punishment of forgery and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who knowingly and with intent to procure the same to be inserted in a register of births,\ndeaths, or marriages, makes any false statements touching any matter required by law to be registered\nin any such register, is guilty of a felony and is liable to imprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"480","t":"Instruments and materials for forgery","ch":"Chapter 45 – Preparation for forgery","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without lawful authority or excuse, the proof of which lies on him\n\n                                            [L.N. 112 of 1964.]\n\n(1)     makes, or begins or prepares to make, or uses, or knowingly has in his possession or disposes of,\n        any paper resembling any paper such as is specially provided by the proper authority for the\n        purpose of being used for making any of the following things-\n\n(a)    any document acknowledging or being evidence of the indebtedness of the Government of\n       Nigeria or of any part of Nigeria or of the government of any Commonwealth country or any\n       country under the protection of a Commonwealth country, or of any foreign prince or State, or\n       of any person carrying on the business of banking, to any person; or\n\n(b)      any stamp, licence, permit, or other document, used for the purposes of the public revenue of\n        Nigeria or of any part of Nigeria or of any part of a Commonwealth country or any country under\n        the protection of a Commonwealth country; or\n\n(c)     any bank note,\n\n        or any machinery or instrument or material for making such paper, or capable of producing in or\n        on paper any words, figures, letters, marks, or lines, resembling any words, figures, letters,\n        marks or lines used in or on paper specially provided for any such purpose; or\n\n(2)      impresses or makes upon any plate or material any words, figures, letters, marks, or lines, the\n        print whereof resembles, in whole or part, the words, figures, letters, marks, or lines used in any\n        such document as aforesaid; or\n\n(3)     uses or knowingly has in his possession or disposes of, any plate or material upon which any\n        such words, figures, letters, marks or lines, are impressed or made; or\n(4)     uses, or knowingly has in his possession or disposes of, any paper on which is written or\n\n        printed the whole or any part of the usual contents of any such documents as aforesaid,\n\nis guilty of a felony and is liable to imprisonment for fourteen years, and any such paper, document,\nbank note, or any machinery or instrument or material for making or capable of producing such paper,\ndocument or bank note which are found in his possession shall be forfeited to the State by order of the\ncourt before which he is tried or if there is no trial, by order of the court before which the offence is\ninquired into."},{"c":"CC","n":"480A","t":"Unlawful inquiries relating to the possibility of forgery","ch":"Chapter 45 – Preparation for forgery","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who, without lawful authority or excuse, the proof of which lies on him, either orally or\nin writing makes inquiries of any other person, whether in Nigeria or at any place not in Nigeria-\n\n(a)      as to the cost of obtaining or the cost of supplying or as to obtaining or supplying any\n        machinery or instrument or material for the making of any paper or capable of producing in or\n        on any paper any words, figures, letters, marks or lines resembling any words, figures, letters,\n        marks or lines used in or on paper specially provided for any purpose mentioned in paragraph\n        (1) of section 480 of this Code; or\n\n(b)      as to the cost of printing or otherwise reproducing or as to printing or otherwise reproducing\n        any document referred to in subsection (1) of section 480 of this Code; no matter by what name\n        such document may be referred to; or\n\n(c)     as to whether such other person or any other person is prepared to print or otherwise\n        reproduce or would be prepared to print or otherwise reproduce any such document as\n        aforesaid; or\n\n(d)      as to whether such other person or any other person is prepared to obtain or would be\n        prepared to obtain any such document as aforesaid by any means other than paying full value\n        for the same,\n\nis guilty of an offence and liable to imprisonment for one year.\n\n(2) In the case of written inquiries in connection with any of the matters or subjects to which subsection\n(1) of this section relates, the fact that such inquiries were reduced into writing shall be sufficient proof\nof an attempt to commit the offence and the offender shall be subject to a like penalty as if he had\ncommitted the offence."},{"c":"CC","n":"481","t":"Counterfeit stamps","ch":"Chapter 45 – Preparation for forgery","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without authority or excuse, the proof of which lies on him\n\n                                 [L.N. 112 of 1964 ]\n  (1)           makes or mends, or begins or prepares to make or mend, or uses, or knowingly\n                has in his possession or disposes of, any die, plate, or instrument, capable of making an\n                impression resembling that made by any die, plate or instrument used for the purpose\n                of making any stamp, whether impressed or adhesive, which is used for the purposes of\n                the public revenue of the Nigerian Postal Service in Nigeria or in any other country, or\n                capable of producing in or on paper any words, figures, letters, marks, or lines,\n                 resembling any words, figures, letters, marks, or lines used in or on any paper specially\n                provided by the proper authority for any such purpose; or\n\n(2)             knowingly has in his possession or disposes of any paper or other material which has on\n                it the impression of any such die, plate, or instrument, or any paper which has on it any\n                 such words, figures, letters, marks, or lines, as aforesaid; or\n\n(3)             fraudulently, and with intent that use may be made of any such stamp as aforesaid, or\n                of any part of it, removes the stamp from any material in any way whatever; or\n\n(4)             fraudulently, and with intent that use may be made of any part of such stamp, mutilates\n                the stamp; or\n\n(5)             fraudulently fixes or places upon any material or upon any such stamp, any stamp or\n                part of a stamp which has been in any way removed from any other material, or out of or\n                from any other stamp; or\n\n(6) fraudulently, and with intent that use may be made of any such stamp which has been already\nimpressed upon or attached to any material, erases or otherwise removes, either really or apparently,\nfrom such material anything whatever written on it; or\n\n(7) knowingly has in his possession or disposes of anything obtained or prepared by any such unlawful\nact as aforesaid,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"482","t":"Paper for postal purposes","ch":"Chapter 45 – Preparation for forgery","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without lawful authority or excuse, the proof of which lies on him, knowingly has in his\npossession or disposes of any paper which has been specially provided by the proper authority for the\npurpose of being used for postage stamps, money orders, or postal orders, before such paper has been\nlawfully issued for public use, is guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"483","t":"Paper and dies for postage stamps","ch":"Chapter 45 – Preparation for forgery","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without lawful authority or excuse, the proof of which lies on him-\n\n        (1) makes, or begins or prepares to make, or uses for any postal purpose, or has in his\npossession, or disposes of any imitation or representation on paper or any other material, of any stamp\nused for denoting any rate of postage of Nigeria, or of any other country; or\n       (2) makes or mends, or begins or prepares to make or mend, or uses, or has in his possession or\ndisposes of, any die, plate, instrument, or material, for making any such imitation or representation,\n\nis guilty of a misdemeanor and is liable to imprisonment for one year or to a fine of one hundred naira\nand any stamps, and any other such things as aforesaid, which are found in his possession, are forfeited\nto the State.\n\nFor the purposes of this section of this Code, a stamp purporting to denote a rate of postage of any\ncountry is to be taken to be a stamp used for postal purposes in that country, until the contrary is\nshown."},{"c":"CC","n":"484","t":"Personation in general","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud any person, falsely represents himself to be some other person,\nliving or dead, is guilty of a felony and is liable to imprisonment for three years.\n\nIf the representation is that the offender is a person entitled by will or operation of law to any specific\nproperty and he commits the offence to obtain such property or possession thereof, he is liable to\nimprisonment for fourteen years."},{"c":"CC","n":"485","t":"Falsely acknowledging deeds, recognisances, etc","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, without lawful authority or excuse, the proof of which lies on him, makes, in the name\nof any other person, before any court or person lawfully authorised to take such an acknowledgment, an\nacknowledgment of liability of any kind, or an acknowledgment of deed or other instrument, is guilty of\na felony and liable to imprisonment for seven years."},{"c":"CC","n":"486","t":"Personation of a person named in a certificate","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who alters any document which has been issued by lawful authority to another person, and\nwhereby that other person is certified to be a person possessed of any qualification recognised by law\nfor any purpose, or to be the holder of any office, or to be entitled to exercise any profession, trade, or\nbusiness, or to be entitled to any right or privilege, or to enjoy any rank or status, and falsely represents\nhimself to be the person named in the document, is guilty of an offence of the same kind and is liable to\nthe same punishment as if he had forged the document."},{"c":"CC","n":"487","t":"Lending, etc., certificate for personation","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a person to whom any document has been issued by lawful authority whereby\nhe is certified to be a person possessed of any qualification recognised by law for any\n\npurpose, or to be the holder of any office, or to be entitled to exercise any profession, trade, or\nbusiness, or to be entitled to any right or privilege, or to enjoy any rank or status, sells, gives or lends the\ndocument to another person with intent that that other person may represent himself to be the person\nnamed therein, is guilty of a felony and is liable to imprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"488","t":"Personation of person named in a testimonial or character","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with the purpose of obtaining any employment, alters any document of the nature of a\ntestimonial or character given to another person, is guilty of a misdemeanor and is liable to\nimprisonment for one year."},{"c":"CC","n":"489","t":"Lending, etc., testimonial for personation","ch":"Chapter 46 – Personation","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being a person to whom any such document as is mentioned in section 488 of this\nCode has been given, gives, sells or lends such document to another person with the intent that that\nother person may alter such document for the purpose of obtaining any employment, is guilty of a\nmisdemeanor and is liable to imprisonme
