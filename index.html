INST PROPERTY Theft","p":"","x":"Whoever belongs to a gang of persons associated for the purpose of habitually\ncommitting brigandage, shall be punished with imprisonment for a term which may\nextend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"306","t":"Belonging to gang of thieves","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever belongs to a wandering or other gang of persons associated for the\npurpose of habitually committing theft or robbery and not being a gang of brigands,\nshall be punished with imprisonment for a term which may extend to seven years and\nshall also be liable to fine."},{"c":"PC","n":"307","t":"Assembling for purpose of committing brigandage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever is one of five or more persons assembled for the purpose of committing\nbrigandage, shall be punished with imprisonment for a term which may extend to seven\nyears and shall also be liable to fine.\n\nCriminal Misappropriation."},{"c":"PC","n":"308","t":"Criminal misappropriation defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever dishonestly misappropriates or converts to his own use any movable\nproperty, commits criminal misappropriation.\n\nIllustrations. (a) A takes property belonging to Z out of Z' s possession, in good faith\nbelieving at the time when he takes it that the property belongs to himself A is not guilty\nof theft; but if A, after discovering his mistake, dishonestly appropriates the property to his\nown use, he is guilty of criminal misappropriation.\n\n(b) A being on friendly terms with Z goes into Z's house in Z's absence and takes away a\ncooking pot without Z's express consent. Here, if A was under the impression that he had\nZ's implied consent to take the cooking pot for the purpose of using it, A has not\ncommitted theft. But, if A afterwards sells the cooking pot for his own benefit he is guilty\nof criminal misappropriation.\n\n(c) A and B being joint owners of a horse, A takes the horse out of B' s possession\nintending to use it. Here, as A has a right to use the horse, he does not dishonestly\nmisappropriate it. But if A sells the horse and appropriates the whole proceeds to his own\nuse, he is guilty of criminal misappropriation.\n\nEXPLANATION. A dishonest misappropriation for a time only is a misappropriation within\nthe meaning of this section.\n\nIllustration. A having borrowed Z's property pledges it as a security for a loan intending at\na future time to restore it to Z. A has committed criminal misappropriation.\n\nEXPLANATION. A person, who finds property not in the possession of any other person and\ntakes such property for the purpose of protecting it for or of restoring it to the owner,does\nnot take or misappropriate it dishonestly and is not guilty of an offence; but he is guilty\nof criminal misappropriation if he appropriates it to his own use, when he knows or has\nthe means of discovering the owner or before he has used reasonable means to discover\nand give notice to the owner and has kept the property a reasonable time to enable the\nowner\n\nto claim it.\n\nWhat are reasonable means or what is a reasonable time in such a case is a\n\nquestion of fact.\n\nIt is not necessary that the finder should know who is the owner of the property\n\nor that any particular person is the owner of it; it is sufficient if, at the\n\ntime of appropriating it, he does not believe it to be his own property or does\n\nnot believe in good faith that the real owner cannot be found.\n\nIllustrations. (a) A finds a coin on the road, not knowing to whom the\n\ncoin belongs. A picks up the coin. Here A has not committed criminal misappropriation.\n\n(b) A finds a letter on the road containing a bank note. From the direction\n\nand contents of the letter he learns to whom the note belongs. He appropriates\n\nthe note. He is guilty of criminal misappropriation.\n\n(c) A finds a cheque payable to bearer. He can form no conjecture as to the\n\nperson who has lost the cheque. But the name of the person who has drawn\n\nthe cheque appears. A knows that this person can direct him to the person in\n\nwhose favour the cheque was drawn. A appropriates the cheque without\n\nattempting to discover the owner. He is guilty of criminal misappropriation.\n\n(d) A sees Z drop his purse with money in it. A picks up the purse with the\n\nintention of restoring it to Z but afterwards appropriates it to his own use. A\n\nhas committed criminal misappropriation.\n\n(e) A finds a purse with money, not knowing to whom it belongs; he afterwards discovers\nthat it belongs to Z and appropriates it to his own use. A is guilty of criminal\nmisappropriation.\n\n(/) A finds a valuable ring not knowing to whom it belongs. A sells it immediately without\nattempting to discover the owner. A is guilty of criminal misappropriation."},{"c":"PC","n":"309","t":"Punishment for criminal misappropriation","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits criminal misappropriation shall be punished with imprisonment for\na term which may extend to two years or with fine or with both."},{"c":"PC","n":"310","t":"Criminal misappropriation of property possessed by deceased person","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits criminal misappropriation of property knowing that the property\nso misappropriated was in the possession of a deceased person at the time of that\nperson's death and has not since been in the possession of any person legally entitled to\nsuch possession shall be punished-\n\n(a) with imprisonment for a term which may extend to three years and shall also be liable\nto fine; and\n\n(b) if the offender at the time of such person's death was employed by him as a clerk or\nservant, with imprisonment for a term which may extend to seven years and shall also be\nliable to fine.\n\nCriminal Breach of Trust."},{"c":"PC","n":"311","t":"Criminal breach of trust defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, being in any manner entrusted with property or with a dominion over\nproperty, dishonestly misappropriates or converts to his own use that property or\ndishonestly uses or disposes of that property in violation of any direction of law\nprescribing the mode in which that trust is to be discharged or of a legal contract express\nor implied, which he has made touching the discharge of the trust, or wilfully suffers any\nother person so to do, commits criminal breach of trust.\n\nIllustrations. (a) A, being executor to the will of a deceased person, dishonestly disobeys\nthe law which directs him to divide the effects according to the will and appropriates\nthem to his own use. A has committed criminal breach of trust.\n\n(b) A is a warehouse keeper. Z, going on a journey, entrusts his furniture to A under a\ncontract that it shall be returned on payment of a stipulated sum for storage. A\ndishonestly sells the goods. A has committed criminal breach of\n\ntrust.\n\n(c) A residing in Kaduna is agent for Z residing at Zaria. There is an express or implied\ncontract between A and Z that all sums remitted by Z to A shall be invested by A\naccording to Z's direction. Z remits a sum of money to A with directions to A to invest the\nsame in Government securities. A dishonestly disobeys the direction and employs the\nmoney in his own business. A has committed criminal breach of trust.\n\n(d) But if A, in the last illustration, not dishonestly but in good faith believing that it will be\nmore for Z's advantage to hold Bank shares, disobeys Z's direction and buys Bank shares\nfor Z instead of buying Government securities here, though Z should suffer loss and should\nbe entitled to bring a civil action against A on account of that loss, yet A not having\nacted dishonestly has not\n\ncommitted criminal breach of trust.\n\n(e) A, a pay mallam, is entrusted with public money and is either directed\n\nby law or bound by a contract express or implied with the Government to pay\n\ninto a certain treasury all the public money which he holds. A dishonestly\n\nmisappropriates the money. A has committed criminal breach of trust.\n\n(f) A, a carrier, is entrusted by Z with property to be carried by land or by\n\nwater. A dishonestly misappropriates the property. A has committed criminal\n\nbreach of trust."},{"c":"PC","n":"312","t":"Punishment for criminal breach of trust","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits .criminal breach of trust shall be punished with\n\nimprisonment for a term which may extend to seven years or with fine or with\n\nboth."},{"c":"PC","n":"313","t":"Criminal breach of trust by carrier, etc","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, being entrusted with property as a carrier, wharfinger or\n\nwarehouse keeper, commits criminal breach of trust in respect of that property,\n\nshall be punished with imprisonment for a term which may extend to ten years\n\nand shall also be liable to fine."},{"c":"PC","n":"314","t":"Criminal breach of trust by clerk or servant","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, being a clerk or servant or employed as a clerk or servant\n\nand being in any manner entrusted in that capacity with property or with any\n\ndominion over property, commits criminal breach of trust in respect of that\n\nproperty, shall be punished with imprisonment for a term which may extend to\n\nten years and shall also be liable to fine."},{"c":"PC","n":"315","t":"Criminal breach of trust by public officer or by banker, merchant or","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, being in any manner entrusted with property or with a\n\ndominion over property in his capacity as a public officer or in the way of his\n\nbusiness as a banker, factor, broker, legal practitioner or agent, commits criminal\n\nbreach of trust in respect of that property, shall be punished with imprisonment\n\nfor a term which may extend to fourteen years and shall also be liable\n\nto fine."},{"c":"PC","n":"316","t":"Stolen property defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Property, the possession whereof has been transferred by theft or by\n\nextortion or by robbery, and property, which has been criminally misappropriated or in\nrespect of which criminal breach of trust has been committed, is\n\nstolen property, whether the transfer has been made or the misappropriation or\n\nbreach of trust has been committed within the Federal Capital Territory,\n\nAbuja or elsewhere, but if the property subsequently comes into the possession of a\nperson legally entitled to the possession thereof, it then ceases to be\n\nstolen property."},{"c":"PC","n":"317","t":"Dishonestly receiving stolen property","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever dishonestly receives or retains a stolen property knowing or\n\nhaving reason to believe the same to be stolen property shall be punished with\n\nimprisonment for a term which may extend to fourteen years or with fine or\n\nwith both."},{"c":"PC","n":"318","t":"Dishonestly receiving property stolen in the commission of brigandage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever dishonestly receives or retains a stolen property, the possession whereof he\nknows or has reason to believe to have been transferred by the\n\ncommission of brigandage, or dishonestly receives, from a person whom he\n\nknows or has reason to believe to belong or to have belonged to a gang of\n\nbrigands, property, which he knows or has reason to believe to have been\n\nstolen, shall be punished with imprisonment for life or any less term and shall\n\nalso be liable to fine."},{"c":"PC","n":"319","t":"Assisting in concealment of stolen property","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever voluntarily assists in concealing or disposing of or making\n\naway with property which he knows or has reason to believe to be stolen property,\n\nshall be punished with imprisonment for a term which may extend to five\n\nyears or with fine or with both."},{"c":"PC","n":"319A","t":"Possessing thing reasonably suspected of having been stolen","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever knowingly has in his possession or under his control a\n\nthing which is reasonably suspected of having been stolen or unlawfully\n\nobtained and who does not give an account to the satisfaction of a court of justice\n\nas to how he came by the same shall be punished with imprisonment\n\nwhich may extend to six months or with fine or with both."},{"c":"PC","n":"320","t":"Cheating defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever by deceiving a person-\n\n(a) fraudulently or dishonestly induces the person so deceived to deliver any property to\na person or to consent that any person shall retain any property; or\n\n(b) intentionally induces the person so deceived to do or omit to do anything which he\nwould not do or omit to do if he were not so deceived and which act or omission causes\nor is likely to cause damage or harm to that person in body, mind, reputation or property,\nis said to cheat.\n\nEXPLANATION. A dishonest concealment of facts is a deception within the meaning of\nthis section.\n\nIllustrations. (a) A, by falsely pretending to be in the Government service, intentionally\ndeceives Z and thus dishonestly induces Z to let him have on credit goods for which he\ndoes not mean to pay. A cheats.\n\n(b) A, by putting a counterfeit mark on an article, intentionally deceives Z\n\ninto a belief that this article was made by a certain celebrated manufacturer\n\nand thus dishonestly induces Z to buy and pay for the article. A cheats.\n\n(c) A, by exhibiting to Z a false sample of an article, intentionally deceives\n\nZ into believing that the article corresponds with the sample and thereby\n\ndishonestly induces Z to buy and pay for the article. A cheats.\n\n(d) A, by tendering in payment for an article a cheque on a bank with\n\nwhich A keeps no money and by which A expects that the cheque will be\n\ndishonored, intentionally deceives Z and thereby dishonestly induces Z to deliver\n\nthe article intending not to pay for it. A cheats.\n\n(e) A, by pledging as diamonds articles which he knows are not diamonds,\n\nintentionally deceives Z and thereby dishonestly induces Z to lend money. A\n\ncheats.\n\n(/) A intentionally deceives Z into a belief that A means to repay any\n\nmoney that Z may lend to him and thereby dishonestly induces Z to lend him\n\nmoney, A not intending to repay it. A cheats.\n\n(g) A intentionally deceives Z into a belief that A means to deliver to Z a\n\ncertain quantity of cotton which A does not intend to deliver and thereby dishonestly\ninduces Z to advance money upon the faith of such delivery. A\n\ncheats; but if A at the time of obtaining the money intends to deliver the cotton\n\nand afterwards breaks his contract and does not deliver it, he does not cheat\n\nbut is liable only to a civil action for breach of contract.\n\n(h) A intentionally deceives Z into a belief that A has performed A's part of\n\na contract made with Z, which he has not performed, and thereby dishonestly\n\ninduces Z to pay money. A cheats.\n\n(i) A sells and conveys a house to B. A knowing that in consequence of such\n\nsale he has no right to the property then sells or mortgages the same to Z,\n\nwithout disclosing the fact of the previous sale and conveyance to B, and\n\nreceives the purchase or mortgage money from Z. A cheats."},{"c":"PC","n":"321","t":"Cheating by personation defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"A person is said to cheat by personation if he cheats by pretending to\n\nbe some other person or by knowingly substituting one person for another or\n\nrepresenting that he or any .other person is a person other than he or such other\n\nperson really is.\n\nEXPLANATION. The offence is committed whether the individual personated\n\nis a real or imaginary person.\n\nIllustrations. (a) A cheats by pretending to be a certain rich merchant of\n\nthe same name. A cheats by personation.\n\n(b) A cheats by pretending to be B a person who is deceased. A cheats by\n\npersonation."},{"c":"PC","n":"322","t":"Punishment for cheating","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever cheats shall be punished with imprisonment for a term\n\nwhich may extend to three years or with fine or with both."},{"c":"PC","n":"323","t":"Cheating person whose interest offender is bound to protect","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever cheats with the knowledge that he is likely thereby to cause\n\nwrongful loss to a person whose interest in the transaction to which the cheating\n\nrelates, he was bound either by law or by a legal contract to protect, shall\n\nbe punished with imprisonment for a term which may extend to five years or\n\nwith fine or with both."},{"c":"PC","n":"324","t":"Cheating by personation","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever cheats by personation shall be punished with imprisonment\n\nfor a term which may extend to five years or with fine or with both."},{"c":"PC","n":"325","t":"Cheating and dishonestly inducing delivery of property","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever cheats and thereby fraudulently or dishonestly induces the\n\nperson deceived to deliver any property to a person or to make, alter or\n\ndestroy the whole or a part of a document of title or anything which is signed\n\nor sealed and which is capable of being converted into a document of title,\n\nshall be punished with imprisonment for a term which may extend to seven\n\nyears and shall also be liable to fine."},{"c":"PC","n":"326","t":"Mischief defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, with intent to cause or knowing that he is likely to cause\n\nwrongful loss or damage to the public or to a person causes the destruction of\n\nany property or any such change in any property or in the situation thereof as\n\ndestroys or diminishes its value or utility or affects it injuriously, commits\n\nmischief.\n\nEXPLANATION 1. It is not essential to the offence of mischief that the offend-\n\ner should intend to cause loss or damage to the owner of the property injured\n\nor destroyed. It is sufficient if he intends to cause or knows that he is likely to\n\ncause wrongful loss or damage to any person by injuring any property whether\n\nit belongs to that person or not.\n\nEXPLANATION 2. Mischief may be committed by an act affecting property\n\nbelonging to the person who commits the act or to that person and other jointly.\n\nIllustrations. (a) A voluntarily burns a document of title belonging to Z\n\nintending to cause wrongful loss to Z. A has committed mischief\n\n(b) A voluntarily throws into a river a ring belonging to Z with the intention\n\nof thereby causing wrongful loss to Z. A has committed mischief\n\n(c) A, knowing that his effects are about to be taken in execution in order to\n\nsatisfy a debt due from him to Z, destroys those effects with the intention of\n\nthereby preventing Z from obtaining satisfaction of the debt and of thus causing\n\ndamage to Z. A has committed mischief\n\n(d) A, having joint property with Z in a horse, shoots the horse intending\n\nthereby to cause wrongful loss to Z. A has committed mischief\n\n(e) A causes cattle to enter upon a field belonging to Z intending to cause"},{"c":"PC","n":"327","t":"Punishment for mischief","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief shall be punished with imprisonment for Pt\n\na term which may extend to two years or with fine or with both."},{"c":"PC","n":"328","t":"(Repealed.)","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"(Repealed by N.R. 19 of 1960.)"},{"c":"PC","n":"329","t":"Mischief by killing or maiming animal","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by killing, poisoning, maiming or rendering\n\nuseless an animal or animals shall be punished with imprisonment for a\n\nterm which may extend to three years or with fine or with both."},{"c":"PC","n":"330","t":"Mischief by killing or maiming cattle, etc","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by killing, poisoning, maiming or rendering\n\nuseless a camel, horse, donkey, mule, bull, cow, or an ox whatever may be\n\nthe value thereof shall be punished with imprisonment for a term which may\n\nextend to five years or with fine or with both."},{"c":"PC","n":"331","t":"Mischief in relation to water supply","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by doing an act which renders or which he knows to be\nlikely to render an installation for the supply or distribution of water less efficient for its\nintended purpose or which causes or which he knows to be likely to cause a diminution\nof the supply of water for animals which are the subject of ownership or for a domestic,\nan agricultural or a commercial purpose, shall be punished with imprisonment which may\nextend to five years or with fine or with both."},{"c":"PC","n":"332","t":"Mischief by injury to public road, bridge, river or channel","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by doing an act which renders or which he knows to be\nlikely to render a public road, bridge, navigable river or In navigable channel natural or\nartificial impassable or less safe for traveling or conveying properly, shall be punished with\nimprisonment for life or any less or term or with fine or with both."},{"c":"PC","n":"333","t":"Mischief by inundation or obstruction to public drainage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by doing an act which causes or which he\n\nknows to be likely to cause an inundation or an obstruction to a public drainage\n\nsystem attended with injury or damage, shall be punished with imprisonment\n\nfor a term which may extend to five years or with fine or with both."},{"c":"PC","n":"334","t":"Mischief in relation to electricity, telegraphs and telephones","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by doing an act which renders or which he knows to be\nlikely to render an installation for generating, storing, transmitting or distributing electricity\nor a telegraph or telephone installation less efficient for its intended purpose or which\ncauses or which he knows to be likely to cause a diminution of any supply of electricity,\nshall be punished\n\nwith imprisonment for a term which may extend to five years or with fine or with both."},{"c":"PC","n":"335","t":"Mischief by destroying or moving a public landmark","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by destroying or moving any land mark\n\nfixed by the authority of a public officer or by an act which renders the land\n\nmark less useful as such, shall be punished with imprisonment for a term\n\nwhich may extend to one year or with fine or with both."},{"c":"PC","n":"336","t":"Mischief by fire or explosive with intent to cause damage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by fire or an explosive substance intending to cause or\nknowing it to be likely that he will thereby cause damage to any property shall be\npunished with imprisonment for a term which may extend to seven years and shall also\nbe liable to fine."},{"c":"PC","n":"337","t":"Mischief by fire or explosive with intent to destroy house, etc","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief by fire or an explosive substance intending to cause or\nknowing it to be likely that he will thereby cause the destruction of any building which is\nordinarily used as a place of worship or as a human dwelling or as a place for the\ncustody of property, shall be punished with imprisonment for life or for any less term and\nshall also be liable to fine."},{"c":"PC","n":"338","t":"Mischief to vessel","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief to a decked vessel or a vessel of a burden of twenty tons\nor upwards intending to destroy or render unsafe or knowing it to be likely that he will\nthereby destroy or render unsafe that vessel, shall be punished with imprisonment for a\nterm which may extend to fourteen years or with fine or with both."},{"c":"PC","n":"339","t":"Mischief by fire to vessel","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits or attempts to commit by fire or an explosive substance such\nmischief as is described in section 338 of this Penal Code shall be punished with\nimprisonment for life or for a less term and shall also be liable to fine."},{"c":"PC","n":"340","t":"Running vessel aground or ashore with intent to commit theft","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever intentionally runs any vessel aground or ashore intending to\n\ncommit theft of any property contained therein or to misappropriate any such\n\nproperty dishonestly or with intent that the theft or misappropriation of property may be\ncommitted shall be punished with imprisonment for a term which\n\nmay extend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"341","t":"Mischief committed after preparation made for causing death or hurt","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits mischief having made preparation for causing to a\n\nperson death or hurt or wrongful restraint or fear of death or of hurt or of\n\nwrongful restraint, shall be punished with imprisonment for a term which may\n\nextend to five years and shall also be liable to fine."},{"c":"PC","n":"342","t":"Criminal trespass defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever enters into or upon property in the possession of another with intent to\ncommit an offence or to intimidate, insult or annoy a person in possession of that\nproperty, or, having lawfully entered into or upon that property, unlawfully remains there\n\nwith intent thereby to intimidate, insult or annoy such person or with intent to commit an\noffence, is said to commit criminal trespass."},{"c":"PC","n":"343","t":"House trespass defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits criminal trespass by entering into or remaining in any building,\ntent or vessel used as a human dwelling or a building used as a place of worship or as a\nplace for the custody of property or a railway carriage d\n\nused for the conveyance of passengers or goods, is said to commit house trespass.\n\nEXPLANATION. The introduction of any part of the criminal trespasser's\n\nbody is entering sufficient to constitute house trespass."},{"c":"PC","n":"344","t":"Lurking house trespass defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits house trespass, having taken precautions to con- 1\n\nceal the house trespass from some person who has a right to exclude or eject h\n\nthe trespasser from the building, tent, vessel or railway carriage which is the\n\nsubject of the trespass, is said to commit lurking house trespass."},{"c":"PC","n":"345","t":"Lurking house trespass by night defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits lurking house trespass between sunset and sunrise, 1\n\nis said to commit lurking house trespass by night. tl\n\nn\n\n¥34. A person is.said to c°m.mit house breaking, who c?mits house tre- .\n\npass, If he effects hIS entrance mto the house or a part of It m any of the SIX\"\n\nways hereinafter described; or if being in the house or a part of it for the pur- d\n\npose of committing an offence or having committed an offence therein, he\n\nquits the house or a part of it in any of those six ways, that is to say-\n\n(a) if he enters or quits through a passage made by himself or by any abet-\n\ntor of the house trespass in order to commit the house trespass;\n\n(b) if he enters or quits through a passage not intended by any person, other\n\nthan himself or an abettor of the offence, for human entrance, or\n\nthrough any passage to which he has obtained access by scaling or\n\nclimbing over any wall or building;\n\n(c) if he enters or quits through a passage which he or any abettor of the\n\nhouse trespass has opened in order to commit the house trespass by any\n\nmeans by which that passage was not intended by the occupier of the\n\nhouse to be opened;\n\n(d) if he enters or quits by opening a lock in order to commit the house tres-\n\npass or in order to quit the house after a house trespass;\n\n(e) if he effects his entrance or departure by using criminal force or com-\n\nmitting an assault or by threatening any person with assault;\n\n(f) if he enters or quits by a passage which he knows to have been fastened\n\nagainst the entrance or departure and to have been unfastened by him-\n\nseli or by an abettor of the house trespass.\n\nEXPLANATION 1. The word 'house\" in this section includes any place which\n\nmay be the subject of house trespass.\n\nEXPLANATION 2. Any out-house or building occupied with a house between\n\nwhich and such house there is an immediate internal communication is part of\n\nthe house within the meaning of this section.\n\nIllustrations. (a) A commits house trespass by making a hole through the\n\nwall of Z's house, or by cutting a slit in the tent in which Z is living, and\n\nputting his hand through the aperture. A commits house breaking.\n\n(b) A commits house trespass by creeping into a ship at a port-hole\n\nbetween decks. This is house breaking.\n\n(c) A commits house trespass by entering Z's house through a window;'\n\nThis is house breaking. .\n\n(d) A commits house trespass by entering Z's house through the door hay..\n\ning opened a door which was fastened. This is house breaking.\n\n(e) A commits house trespass by entering Z's house through the doorhav-\n\ning lifted a latch by putting a wire through a hole in the door. This is house\n\nbreaking.\n\n(/) A finds the key of Z' s house door which Z had lost and commits house\n\ntrespass by entering Z s house having opened the door with that key. This is\n\nhouse breaking.\n\n(g) Z is standing in his doorway. A forces a passage by knocking Z do\n\nand commits house trespass by entering the house. This is house breaking.\n\n(h) Z, the doorkeeper of Y, is standing in Y's doorway. A commits house\n\nItrespass by entering the house having deterred Zfrom opposing him by threat-\n\nening to beat him. This is house breaking. i\n\n,"},{"c":"PC","n":"346","t":"House breaking defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"347","t":"House breaking by night defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"348","t":"Punishment for criminal trespass","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits criminal trespass shall be punished with imprison-"},{"c":"PC","n":"349","t":"Punishment for house trespass","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits house trespass shall be punished with imprison- ,\n\nment for a, term which may extend to one year or with fine which may extend\n\nto one hundred naira or with both."},{"c":"PC","n":"350","t":"House trespass to commit offence punishable with death","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits house trespass in order to commit an offence pun-\n\nishable with death, shall be punished with imprisonment for a term not\n\nexceeding fourteen years and shall also be liable to fine."},{"c":"PC","n":"351","t":"House trespass to commit offence punishable with fourteen years","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits house trespass in order to commit an offence pun- I\n\nishab1e with fourteen years imprisonment, shall be punished with imprison- t\n\nment for a term not exceeding ten years and shall also be liable to fine.\n\n,"},{"c":"PC","n":"352","t":"House trespass to commit offence punishable with imprisonment","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits house trespass in order to commit an offence pun- ]\n\nishable with imprisonment, shall be punished with imprisonment for a term I\n\nwhich may extend to seven years and shall also be liable to fine. ;\n\n,"},{"c":"PC","n":"353","t":"Lurking house trespass or house breaking","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits lurking house trespass or house breaking, shall be ]\n\npunished with imprisonment for a term which may extend to two years and I\n\nshall also be liable to fine. :"},{"c":"PC","n":"354","t":"Lurking house trespass or house breaking in order to commit offence","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits lurking house trespass or house breaking in order]\n\nto commit an offence punishable with imprisonment, shall be punished with 1\n\nimprisonment for a term which may extend to fourteen years and shall also be :\n\nliable to fine."},{"c":"PC","n":"355","t":"Lurking house trespass or house breaking by night","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits lurking house trespass by night or house breaking\n\nby night, shall be punished with imprisonment for a term which may extend to\n\nthree years and shall also be liable to fine."},{"c":"PC","n":"356","t":"Lurking house trespass or house breaking by night to commit offence","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits lurking house trespass by night or house breaking\n\nby night in order to commit any offence punishable with imprisonment, shall\n\nbe punished with imprisonment for life or any less term and shall also be\n\nliable to fine."},{"c":"PC","n":"357","t":"Joint liability for lurking house trespass or house breaking by night","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"If at the time of the committing of lurking house trespass by night or\n\nhouse breaking by night a person guilty of that offence voluntarily causes or\n\nattempts to cause death or grievous hurt to a person, every person jointly con-\n\ncerned in committing that lurking house trespass by night or house breaking\n\nby night shall be punished with imprisonment for life or a less term and shall\n\nalso be liable to fine."},{"c":"PC","n":"358","t":"Breaking open receptacle containing property","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever dishonestly or with intent to commit mischief breaks open\n\nor unfastens a closed receptacle which contains or which he believes to con-\n\ntain property, shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both.\n\n:n 359. Whoever, being entrusted with a closed receptacle which contains or\n\nwhich he believes to contain property, without having authority to open the\n\nh same dishonestly or with intent to commit mischief breaks open or unfastens\n\nthat receptacle, shall be punished with imprisonment for a term which may\n\nextend to three years or with fine or with both."},{"c":"PC","n":"359","t":"Breaking open receptacle by person entrusted with custody","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"360","t":"Lurking with house breaking implements","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever is discovered between sunset and sunrise carrying false keys\n\nor other instruments suitable for house breaking and seeks to conceal himself\n\nor is otherwise shown to have a criminal intention, shall be punished with\n\nimprisonment for a term which may extend to three years and shall also be\n\nliable to fine.\n\nIf 361. Whoever imitates or alters a key or fabricates an instrument intending\n\nthat the false key or instrument shall be used for a criminal purpose, shall be\n\npunished with imprisonment for a term which may extend to two years and\n\nshall also be liable to fine."},{"c":"PC","n":"361","t":"Fabrication of false key or instrument","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"362","t":"Making a false document defined","ch":"Chapter XX – FORGERY","p":"","x":"A person is said to make a false document-\n\n(a) who dishonestly or fraudulently makes, signs, seals or executes a document or part of\na document or makes a mark denoting the execution of\n\na document with the intention of causing it to be believed that the\n\ndocument or part of a document was made, signed, sealed or executed\n\nby or by the authority of a person by whom or by whose authority he\n\nknows that it was not made, signed, sealed or executed or at a time at\n\nwhich he knows that it was not made, signed, sealed or executed; or\n\n(b) who without lawful authority dishonestly or fraudulently by cancellation or otherwise\nalters a document in a material part thereof after it has\n\nbeen made or executed either by himself or by any other person\n\nwhether such person be living or dead at the time of that alteration; or\n\n(c) who dishonestly or fraudulently causes a person to sign, seal, execute or\n\nalter a document knowing that the person by reason of unsoundness of\n\nmind or intoxication cannot or that by reason of deception practised\n\nupon him he does not know the contents' of the document or the nature\n\nof the alteration."},{"c":"PC","n":"363","t":"Forgery and forged document defined","ch":"Chapter XX – FORGERY","p":"","x":"Whoever makes a false document or part of a document, with intent to\n\ncause damage or injury to the public or to a person or to support a claim or\n\ntitle or to cause any person to part with property or to enter into an express or\n\nimplied contract or with intent to commit fraud or that fraud may be committed,\ncommits forgery; and a false document made wholly or in part by forgery\n\nis called a forged document.\n\nIllustrations. (a) A has a letter of credit upon B for two hundred naira\n\nwritten by Z. A in order to defraud B adds a cipher to the two hundred naira\n\nand makes the sum two thousand naira, intending that it may be believed by B\n\nthat Z so wrote the letter. A has committed forgery.\n\n(b) A without Z's authority affixes Z's seal to a document purporting to be\n\na conveyance of a plot from Z to A, with the intention of selling the estate to B\n\nand thereby of obtaining from B the purchase money. A has committed\n\nforgery.\n\n(c) A picks up a cheque on a banker signed by B payable to bearer but\n\nwithout any sum having been inserted in the cheque. A fraudulently fills up the\n\ncheque by inserting the sum of two hundred naira. A commits forgery.\n\n(d) A leaves with B his agent a cheque on a bank signed by A without\n\ninserting the sum payable and authorises B to fill up the cheque by inserting a\n\nsum not exceeding two hundred naira for the purpose of making certain payments. B\nfraudulently fills up the cheque by inserting the sum of six hundred\n\nnaira. B commits forgery.\n\n(e) A draws a bill of exchange on himself in the name of B without B's\n\nauthority intending to discount it as a genuine bill with a banker and intend-\n\ning to take up the bill on its maturity. Here, as A draws the bill with intent to\n\ndeceive the banker by leading him to suppose that he had the security of Band\n\nthereby to discount the bill, A is guilty of forgery.\n\n(/) Z's will contains these words-- \"I direct that all my remaining property\n\nbe equally divided between A, B and C\". A dishonestly scratches out B' s name\n\nintending that it may be believed that the whole was left to himself and C. A\n\nhas committed forgery.\n\n(g) A sells and conveys a plot to Z. A afterwards, in order to defraud Z of\n\nthe plot, executes a conveyance of the same plot to B dated six months earlier\n\nthan the date of the conveyance to Z, intending it to be believed that he had\n\nconveyed the plot to B before he conveyed it to Z. A has committed forgery.\n\n(h) Z dictates his will to A. A intentionally writes down a different legatee\n\nfrom the legatee named by Z and by representing to Z that he has prepared the\n\nwill according to his instructions induces Z to sign the will. A has committed\n\nforgery.\n\n(i) A writes a letter and signs it with B's name without B' s authority certi-\n\nfying that A is a man of good character and in distressed circumstances from\n\nunforeseen misfortune, intending by means of such letter to obtain alms from\n\nZ and other persons. Here, as A made a false document in order to induce Z to\n\npart with property, A has committed forgery.\n\n(I) A without B' s authority writes a letter and signs it in B's name certifying\n\nto A's character, intending thereby to obtain employment under Z. A has committed\nforgery inasmuch as he intended to deceive Z by the forged certificate and thereby to\ninduce Z to enter into an express or implied contract for service.\n\nEXPLANATION 1. A man's signature of his own name may amount to forgery."},{"c":"PC","n":"364","t":"Punishment for forgery","ch":"Chapter XX – FORGERY","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"365","t":"Forgery of public seals, etc","ch":"Chapter XX – FORGERY","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"366","t":"Using as genuine a forged document","ch":"Chapter XX – FORGERY","p":"","x":"Whoever fraudulently or dishonestly uses as genuine any document which he knows\nor has reason to believe to be a forged document, shall be punished in the same\nmanner as if he had forged such document ."},{"c":"PC","n":"367","t":"Making or possessing counterfeit seal with intent to commit forgery","ch":"Chapter XX – FORGERY","p":"","x":"Whoever makes or counterfeits a seal, plate or other instrument for making an\nimpression intending that the same shall be used for the purpose of committing forgery or\nwith such intent has in his possession such a seal, plate or other instrument knowing the\nsame to be counterfeit, shall be punished with imprisonment for a term which may\nextend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"368","t":"Possession of forged record","ch":"Chapter XX – FORGERY","p":"","x":"Whoever has in his possession a forged document knowing the same to be forged\nand intending that the same shall fraudulently or dishonestly be used as genuine, shall be\npunished with imprisonment for a term which may re\n\nextend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"369","t":"Counterfeiting device or mark used for authenticating documents","ch":"Chapter XX – FORGERY","p":"","x":"Whoever counterfeits upon or in the substance of a material a device or mark used\nfor the purpose of authenticating any document intending that the device or mark shall\nbe used for the purpose of giving the appearance of ;\n\nauthenticity to any document then forged or thereafter to be forged on such material or\nwho with such intent has in his possession a material upon or in the substance of which\n\nany device or mark has been counterfeited, shall be punished with imprisonment for a\nterm which may extend to fourteen years and\n\nshall also be liable to fine."},{"c":"PC","n":"370","t":"Fraudulent cancellation or destruction of document of title","ch":"Chapter XX – FORGERY","p":"","x":"Whoever fraudulently or dishonestly or with intent to cause damage or injury to the\npublic or to a person cancels, destroys or defaces or attempts to\n\ncancel, destroy or deface or secretes or commits theft in respect of a document\n\nwhich is or purports to be a document of title or a will or commits mischief in\n\nrespect to any such document, shall be punished with imprisonment for a term\n\nwhich may extend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"371","t":"Falsification of accounts","ch":"Chapter XX – FORGERY","p":"","x":"Whoever, being a clerk, officer or servant or employed or acting in\n\nthe capacity of a clerk, officer or servant, wilfully and with intent to defraud\n\ndestroys, alters, mutilates or falsifies any book, paper, writing, document of\n\ntitle or account, which belongs to or is in the possession of his employer or has\n\nbeen received by him for or on behalf of his employer, or wilfully and with\n\nintent to defraud makes or abets the making of a false entry in or omits or\n\nalters or abets the omission or alteration of a material particular from or in the\n\nbook, paper, writing, document of title or account, shall be punished with\n\nimprisonment for a term which may extend to seven years or with fine or with\n\nboth."},{"c":"PC","n":"372","t":"Property mark defined","ch":"Chapter XX – FORGERY","p":"","x":"A mark used for denoting that movable property belongs to a particular person is\ncalled a property mark."},{"c":"PC","n":"373","t":"Using a false property mark defined","ch":"Chapter XX – FORGERY","p":"","x":"Whoever marks any movable property or goods or any case, package\n\nor other receptacle containing movable property or goods or uses any case,\n\npackage or other receptacle having any mark thereon in a manner reasonably\n\ncalculated to cause it to be believed that the property or goods so marked or\n\nany property or goods contained in any such receptacle so marked belong to a\n\nperson to whom they do not belong, is said to use a false property mark."},{"c":"PC","n":"374","t":"Punishment for using a false property mark","ch":"Chapter XX – FORGERY","p":"","x":"Whoever uses a false property mark shall unless he proves that he\n\nacted without intent to defraud, be punished with imprisonment for a term\n\nwhich may extend to one year or with fine or with both."},{"c":"PC","n":"375","t":"Counterfeiting a property mark used by another","ch":"Chapter XX – FORGERY","p":"","x":"Whoever counterfeits a property mark used by any other person, shall\n\nbe punished with imprisonment for a term which may extend to two years or\n\nwith fine or with both."},{"c":"PC","n":"376","t":"Counterfeiting a mark used by a public officer","ch":"Chapter XX – FORGERY","p":"","x":"Whoever counterfeits any property mark used by a public officer or\n\nany mark used by a public officer to denote that any property has been manufactured\nby a particular person or at a particular time or place or that the prop-\n\nerty is of a particular quality or has passed through a particular office or that it\n\nis entitled to any exemption or uses as genuine any such mark knowing the\n\nsame to be counterfeit, shall be punished with imprisonment for a term which\n\nmay extend to three years and shall also be liable to fine."},{"c":"PC","n":"377","t":"Making or possession of any instrument for counterfeiting a property mark","ch":"Chapter XX – FORGERY","p":"","x":"Whoever makes or has in his possession a die, plate or any other\n\ninstrument for the purpose of counterfeiting a property mark or has in his pos-\n\nt session a property mark for the purpose of denoting that any goods belong to a\n\nperson to whom they do not belong, shall be punished with imprisonment for\n\na term which may extend to three years or with fine or with both.\n\n:378. Whoever makes any false mark upon a case, package or any other\n\nreceptacle containing goods in a manner reasonably calculated to cause a public\n\nofficer or any other person to believe that the receptacle contains goods which\n\nit does not contain or that it does not contain goods which it does contain or\n\nthat the goods contained in such receptacle are of a nature or quality different\n\nfrom the real nature or quality thereof, shall, unless he proves that he acted\n\nwithout intent to defraud, be punished with imprisonment for a term which\n\nmay extend to three years or with fine or with both."},{"c":"PC","n":"378","t":"Making a false mark upon any receptacle containing goods","ch":"Chapter XX – FORGERY","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"379","t":"Making use of any such false mark","ch":"Chapter XX – FORGERY","p":"","x":"Whoever makes use of any such false mark in any manner prohibited\n\nby section 378 of this Penal Code shall, unless he proves that he acted without\n\nintent to defraud, be punished as if he had committed an offence against that\n\nsection."},{"c":"PC","n":"380","t":"Tampering with property mark","ch":"Chapter XX – FORGERY","p":"","x":"Whoever removes, destroys, defaces or adds to any property mark\n\nintending or knowing it to be likely that he may thereby cause injury to any\n\nperson, shall be punished with imprisonment for a term which may extend to\n\none year or with fine or with both."},{"c":"PC","n":"381","t":"Breach of contract of service during voyage or journey","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever, being bound by a lawful contract to render his personal service in\nconveying or conducting a person or any property from one place to :\n\nanother place or to act as servant to a person during a voyage or journey or to ;\n\nguard a person or property during the voyage or journey, voluntarily omits so to do,\nexcept in the case of illness or ill treatment, shall be punished with\n\nimprisonment for a term which may extend to one month or with fine which\n\nmay extend to ten naira or with both.\n\nIllustrations. (a) A a porter, being bound by a lawful contract to canoy Z's\n\nbaggage from one place to another, throws the baggage away. A has committed\n\nan offence under this section.\n\n(b) A, by unlawful means, compels B a porter to canoy his baggage. B in the\n\ncourse of the journey puts down the baggage and runs away. Here, as B was\n\nnot lawfully bound to carry the baggage, he has not committed any offence.\n\nEXPLANATION. It is not essential to this offence that the contract should be\n\nmade with the person for whom the service is to be performed. It is sufficient,\n\nif the contract is lawfully made with any person either expressly or impliedly\n\nby the person who is to perform the service.\n\nIllustration. A contracts with a village head to provide horses for a journey.\n\nThe village head sub-contracts for the peiformance of the contract with B, a\n\nmember of his village, who starts in charge of some of the horses and in the\n\ncourse of the journey voluntarily leaves the horses, B is guilty of an offence\n\nunder this section."},{"c":"PC","n":"382","t":"Breach of contract to attend on and supply wants of helpless person. ","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever, being bound by a lawful contract to attend on or to supply\n\nthe wants of a person, who by reason of youth or of unsoundness of mind or of\n\ndisease or bodily weakness is helpless or incapable of providing for his own\n\nsafety or of supplying his own wants, voluntarily omits so to do, shall be punished with\nimprisonment for a term which may extend to three months or with\n\nfine which may extend to twenty naira or with both."},{"c":"PC","n":"383","t":"Deceitfully inducing belief of lawful marriage","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Every man who by deceit causes a woman who is not lawfully married\n\nto him to believe that she is lawfully married to him and to cohabit or have sexual\nintercourse with him in that belief, shall be punished with imprisonment for\n\na term which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"384","t":"Marrying again during lifetime of husband or wife","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"(I) Whoever having a husband or wife living marries in a case in\n\nwhich that marriage is void by reason of its taking place during the life of that\n\nhusband or wife, shall be punished with imprisonment for a term which may\n\n(2) This section shall not extend-\n\n(a) to a person whose marriage with the husband or wife has been legally\n\ndissolved; nor\n\n(b) to a person who contracts a marriage during the life of a former husband\n\nor wife, if the husband or wife at the time of the subsequent marriage\n\nshall have been continually absent from the person for the space of\n\nseven years and shall not have been heard of by the person as being\n\nalive within that time, provided the person contracting the subsequent\n\nmarriage shall, before that marriage takes place, inform the person with\n\nwhom the marriage is contracted of the real state of facts so far as the\n\nsame are within his or her knowledge."},{"c":"PC","n":"385","t":"Re-marriage with concealment of former marriage","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever commits the offence defined in section 384 of this Penal\n\nCode having concealed from the person with whom the subsequent marriage\n\nis contracted the fact of the former marriage, shall be punished with imprisonment for a\nterm which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"386","t":"Marriage ceremony fraudulently gone through without lawful marriage","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever dishonestly or with a fraudulent intention goes through the\n\nceremony of being married knowing that he is not thereby lawfully married,\n\nshall be punished with imprisonment for a term which may extend to seven\n\nyears and shall also be liable to fine."},{"c":"PC","n":"387","t":"Adultery by a man","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever, being a man subject to any customary law in which extra-marital sexual\nintercourse is recognized as a criminal offence, has sexual inter-\n\ncourse with a person who is not and whom he knows or has reason to believe is\n\nnot his wife, such sexual intercourse not amounting to the offence of rape, is\n\nguilty of the offence of adultery and shall be punished with imprisonment for a\n\nterm which may extend to two years or with fine or with both."},{"c":"PC","n":"388","t":"Adultery by a woman","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever, being a woman subject to any customary law in which\n\nextra-marital sexual intercourse is recognized as a criminal offence, has sexual\n\nintercourse with a person who is not and whom she knows or has reason to\n\nbelieve is not her husband is guilty of the offence of adultery and shall be\n\npunished with imprisonment for a term which may extend to two years or with\n\nfine or with both."},{"c":"PC","n":"389","t":"Enticing or taking away or detaining with criminal intent a married woman","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever takes or entices away a woman, who is and whom he knows\n\nor has reason to believe to be the wife of any other man, from that man or\n\nfrom a person having the care of her on behalf of that man with intent that she\n\nmay have illicit intercourse with a person or conceals or detains with that\n\nintent any such woman, shall be punished with imprisonment for a term which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"390","t":"Incest","ch":"Chapter XXI – CRIMINAL BREACH OF CONTRACTS OF SERVICE","p":"","x":"Whoever being a man has sexual intercourse with a woman who is\n\nand whom he knows or has reason to believe to be his daughter, his grand-\n\ndaughter, his mother or any other of his female ascendants or descendants, his\n\nsister or the daughter of his brother or sister or his paternal or maternal aunt\n\nand whoever being a woman voluntarily permits a man who is and whom she\n\nknows or has reason to believe to be her son, her grandson, her father or any\n\nother of her male ascendants or descendants, her brother or the son of her\n\nbrother or sister or her paternal or maternal uncle to have sexual intercourse\n\nwith her, shall be punished with imprisonment for a term which may extend to\n\nseven years and shall also be liable to fine.\n\nEXPLANATION. In this section words expressing relation include relatives\n\nof the half blood and relatives whose relation is not traced through a lawful\n\nmarriage."},{"c":"PC","n":"391","t":"Defamation defined","ch":"Chapter XXIII – DEFAMATION","p":"","x":"(1) Whoever by words either spoken or reproduced by mechanical D<\n\nmeans or intended to be read or by signs or by visible representations makes de\n\nor publishes any imputation concerning any person, intending to harm or\n\nknowing or having reason to believe that the imputation will harm the reputation of that\nperson, is said, except in the cases hereinafter excepted, to defame\n\nthat person.\n\nEXPLANATION I. It may amount to defamation to impute anything to a\n\ndeceased person, if the imputation would harm the reputation of that person if\n\nliving and is intended to be hurtful to the feelings of his family or other near\n\nrelatives.\n\nEXPLANATION 2. It may amount to defamation to make an imputation concerning a\ncompany or an association or collection of persons as such.\n\nEXPLANATION 3. An imputation in the form of an alternative or expressed\n\nironically may amount to defamation.\n\nEXPLANATION 4. No imputation is said to harm a person's reputation, unless\n\nthat imputation directly or indirectly in the estimation of others lowers the\n\nmoral or intellectual character of that person or lowers the character of that\n\nperson in respect of his calling or lowers the credit of that person or causes it;\n\nto be believed that the body of that person is in a loathsome state or in a state\n\ngenerally considered as disgraceful.\n\nIllustrations. (a) A says-- \"Z is an honest man, he never stole B' s watch\",\n\nintending to cause it to be believed that Z did steal B' s watch. This is defamation, unless it\nfalls within one of the exceptions.\n\n(b) A is asked who stole B' s watch. A points to Z, intending to cause it to be\n\nbelieved that Z stole B' s watch. This is defamation unless it falls within one of\n\nthe exceptions.\n\n(c) A draws a picture of Z running away with B's watch, intending it to be\n\nbelieved that Z stole B' s watch. This is defamation, unless it falls within one of\n\nthe exceptions.\n\n(2) It is not defamation-'\n\n(i) to impute anything which is true concerning any person, if it be for\n\nthe public good that the imputation should be made or published;\n\nwhether or not it is for the public good is a question of fact;\n\nIllustrations. (a) Z opens a school at Kaduna, The fact is that Z has fled\n\nfrom Europe to escape punishment for gross acts of swindling, A is protected\n\nby this exception if he publishes that fact.\n\n(b) But if the swindling had occurred twenty years ago and in the meantime\n\nZ had been carrying on a school in Zaria and had been living an upright life,\n\nA would not be protected by this exception if he raked up the facts and published them,\n\n(ii) to express in good faith an opinion whatever respecting the conduct\n\nof a public officer in the discharge of his public functions or respecting his character so\nfar as his character appears in that conduct and\n\nno further;\n\n(iii) to express in good faith an opinion whatever respecting the conduct\n\nof any person touching any public question and respecting his character so far as his\ncharacter appears in that conduct and no further;\n\nIllustration. It is not defamation in A to express in good faith any opinion\n\nwhatever respecting Z's conduct in petitioning Government on a public question, in\nsigning a requisition for a meeting on a public question, in presiding\n\nor attending at such a meeting or in forming or joining any society which\n\ninvites the public support.\n\n(iv) to publish a substantially true report of the proceedings of a court of\n\njustice or of the result of those proceedings;\n\n(v) to express in good faith an opinion whatever respecting the merits of\n\na case civil or criminal which has been decided by a court of justice\n\nor respecting the conduct of a person as a party, witness or agent in\n\nthe case or respecting the character of that person as far as his character\n\nappears in that conduct and no further,\n\nIllustrations. (a) A says-\" I think Z's evidence at that trial is so contradictory that he must be\nstupid or dishonest\". A is within this exception if he\n\nsays this in good faith, inasmuch as the opinion which he expresses respects\n\nZ's character as it appears in Z's conduct as a witness and no further.\n\n(b) But if A says-\"1 do not believe what Z asserted at the trial, because I know him to be a\nman without veracity\", A is not within this exception, inasmuch as the opinion which he\nexpresses of Z' s character is an opinion not\n\nfounded on Z's conduct as a witness.\n\n(vi) to express in good faith an opinion respecting the merits of a performance which its\nauthor has submitted to the judgment of the public\n\nor respecting the character of the author so far as his character\n\nappears in that performance and no further;\n\nEXPLANATION. A performance may be submitted to the judgment of the pub-\n\nlic expressly or by acts on the part of the author which imply such submission\n\nto the judgment of the public.\n\nIllustrations. (a) A person who publishes a book submits that book to the\n\njudgment of the public.\n\n(b) A person who makes a speech in public submits that speech to the judgment of the\npublic.\n\n(c) An actor or singer who appears on a public stage submits his acting or\n\nsinging to the judgment of the public.\n\n(d) A says of a book published by Z- \"Z' s book is foolish, Z must be a\n\nweak man. Z's book is indecent Z must be a man of impure mind\" . A is within\n\nthis exception, if he says this in good faith, inasmuch as the opinion which he\n\nexpresses of Z respects Z's character only so far as it appears in Z's book and\n\nno further.\n\n(e) But if A says-\" I am not surprised that Z's book is foolish and indecent\n\nfor he is a weak man and a libertine\", A is not within this exception, inasmuch\n\nas the opinion which he expresses of Z' s character is an opinion not founded\n\non Z's book.\n\n(vii) in a person having over another any authority either conferred by law (\n\nor arising out of a lawful contract made with that other to pass in\n\ngood faith a censure on the conduct of that other in matters to which\n\nlawful authority relates; I\n\nI\n\nIllustration. An alkali censuring in good faith the conduct of a witness or of\n\nan officer of the court, a head of a department censuring in good faith those who:\n\nare under his orders; a parent censuring in good faith a child in the presence of\n\nother children, a schoolmaster, whose authority is derived from a parent,\n\ncensuring in good faith a pupil in the presence of other pupils; a master censuring a\nservant in good faith for inefficiency in service, a banker censuring in\n\ngood faith the cashier of his bank for the conduct of such cashier as such\n\ncashier-are within his exception.\n\n(viii) to prefer in good faith an accusation against any person to any of\n\nthose who have lawful authority over that person with respect to the subject matter of\nthe accusation;\n\nIllustration. If A in good faith accuses Z before a magistrate, if A in good\n\nfaith complains of the conduct of Z a servant to Z's master; if A in good faith\n\ncomplains of the conduct of Z' s child to Z' s father-A is within this exception.\n\n(ix) to make an imputation on the character of another, provided that the\n\nimputation be made in good faith for the protection of the interests of\n\nthe person making it or of any other person or for the public good;\n\nIllustrations. (a) A shopkeeper says to B, who manages his business-\n\n\"Sell nothing to Z unless he pays you ready money, for I have no opinion of\n\nhis honesty\". A is within the exception if he has made this imputation on Z in\n\ngood faith for the protection of his own interests.\n\n(b) A a District Office' in making a report to his superior officer, casts an\n\nimputation on the character of Z. Here, if the imputation is made in good faith\n\nand for the public good, A is within the exception.\n\n(c) A in giving evidence before a court of justice identifies Z as the person\n\nhe saw committing a robbery. Although Z proves that A is mistaken, A is protected by this\nexception. If he is giving false evidence he can be proceeded '\"\n\nagainst under section 158 of this Penal Code.\n\n(x) to convey a caution in good faith to one person against another, provided that the\ncaution be intended for the good of the person to whom\n\nIn it is conveyed or of some person in whom that person is interested or\n\nfor the public good."},{"c":"PC","n":"392","t":"Punishment for defamation","ch":"Chapter XXIII – DEFAMATION","p":"","x":"Whoever defames another shall be punished with imprisonment for a\n\nterm which may extend to two years or with fine or with both."},{"c":"PC","n":"393","t":"Injurious falsehood","ch":"Chapter XXIII – DEFAMATION","p":"","x":"(1) Whoever, except as hereinafter excepted, by words either spoken\n\nor reproduced by mechanical means or intended to be read or by signs or by visible\nrepresentations makes or publishes any false statement of fact, intending\n\nto harm or knowing or having reason to believe that such false statement of\n\nfact will harm the reputation of any person or class of persons or of the\n\nGovernment of the Federation or of any local authority in the Federal Capital\n\nTerritory, Abuja shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both.\n\nEXPLANATION 1. A statement is false unless it is substantially true and proof\n\nthat a statement is substantially true shall lie on the accused.\n\nEXPLANATION 2. Whether a statement is a statement of fact or a mere\n\nexpression of opinion is a matter for the decision of the court.\n\n(2) It is not an offence under this section to make or publish in good faith a\n\nfalse statement of fact which the accused had reasonable grounds for believing\n\nto be substantially true and proof that he had such reasonable grounds shall lie\n\non the accused.\n\nIllustrations. (a) A newspaper publishes a false statement that the proceeds\n\nof a recent increase in a tax were shared amongst the Ministers of the\n\nstate personally. This is a false statement of fact.\n\n(b) A says that Z's bakery is unhygienic. This is a statement of opinion; but\n\nif A says that he saw Z take a dead mouse out of the dough before baking this\n\nis a statement of fact."},{"c":"PC","n":"394","t":"Printing or engraving matter known to be defamatory","ch":"Chapter XXIII – DEFAMATION","p":"","x":"Whoever prints or engraves a matter or prepares or causes to be prepared\n\na record for the purpose of mechanical reproduction of any matter, knowing or\n\nhaving good reason to believe that the matter is defamatory of a person, shall\n\nbe punished with imprisonment for a term which may extend to two years or\n\nwith fine or with both."},{"c":"PC","n":"395","t":"Sale of printed or engraved substance containing defamatory matter","ch":"Chapter XXIII – DEFAMATION","p":"","x":"Whoever sells or offers for sale a printed or an engraved substance\n\ncontaining defamatory matter or a record prepared for the purpose of the\n\nmechanical reproduction of defamatory matter, knowing that the substance or\n\nrecord contains that matter, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both."},{"c":"PC","n":"396","t":"Criminal intimidation defined","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever threatens another with an injury to his person, reputation or\n\nproperty or to the person reputation or property of anyone in whom that person is\ninterested, with intent to cause alarm to that person or to cause that person to do any\nact which he is not legally bound to do or to omit to do an act\n\nwhich that person is legally entitled to do as the means of avoiding the execution of that\nthreat, commits criminal intimidation.\n\nEXPLANATION. A threat to injure the reputation of any deceased person in\n\nwhom the person threatened is interested is within this section.\n\nIllustration. A, for the purpose of inducing B to desist from prosecuting a\n\ncivil suit, threatens to burn B' s house. A is guilty of criminal intimidation."},{"c":"PC","n":"397","t":"Punishment for criminal intimidation","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever commits the offence of criminal intimidation shall be punished -\n\n(a) with imprisonment for a term which may extend to two years or with\n\nfine or with both; and\n\n(b) if the threat be to cause death or grievous hurt or to cause the destruction\n\nof any property by fire or to cause an offence punishable with\n\ndeath or with imprisonment for a term which may extend to seven years\n\nor to impute unchastely to a woman, with imprisonment for a term\n\nwhich may extend to seven years or with fine or with both."},{"c":"PC","n":"398","t":"Criminal intimidation by an anonymous communication","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever commits the offence of criminal intimidation by an anonymous\n\ncommunication or having taken precaution to conceal the name or\n\nabode of the person from whom the threat comes, shall be punished with\n\nimprisonment for a term which may extend to two years in addition to the\n\npunishment provided for the offence by section 397 of this Penal Code."},{"c":"PC","n":"399","t":"Intentional insult with intent to provoke breach of the peace","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever uses insulting or abusive language concerning, or otherwise\n\nconducts himself towards, a person or class or group of persons, whether the\n\nperson or any member of that class or group is present or not, in a manner\n\nlikely to give the provocation to a person present as to cause the last mentioned person\nto break the public peace or to commit any other offence shall\n\nbe punished with imprisonment for a term which may extend to two years or\n\nwith fine or with both.\n\nIllustrations. (a) A In the presence of B, uses insulting or abusive language concerning B or\notherwise conducts himself towards B in a manner\n\nlikely to provoke B and cause him to break the public peace or to commit any\n\nother offence. A is guilty of an offence under this section.\n\n(b) A, in the presence of B but whether or not in the presence of B uses\n\ninsulting or abusive language concerning C or otherwise conducts himself\n\ntowards C in a manner likely to provoke B and cause him to break the public\n\npeace or to commit any other offence. A is guilty of an offence under this section."},{"c":"PC","n":"400","t":"Word, gesture or act intended to insult the modesty of woman","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever intending to insult the modesty of a woman utters a word,\n\nmakes a sound or gesture or exhibits an object, intending that the word or\n\nsound shall be heard or that the gesture or object shall be seen by such woman\n\nor intrudes upon the privacy of such woman, shall be punished with imprisonment for a\nterm which may extend to one year or with fine or with both."},{"c":"PC","n":"401","t":"Drunkenness in a public place","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever is found drunk in a public place or in any place by entering\n\nwhich he committed a trespass, shall be punished-\n\n(a) with imprisonment for a term which may extend to three months or with fine which\nmay extend to one hundred naira or with both; and\n\n(b) if the person so found conducts himself in such place in a disorderly\n\nmanner or is incapable of taking care of himself, with imprisonment for\n\na term of six months or with fine of two hundred naira or with both."},{"c":"PC","n":"402","t":"Drunkenness in private place","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever being drunk in any private place there conducts himself in a\n\ndisorderly manner to the annoyance of any person having a right to exclude\n\nhim from such place or fails to leave such place when requested to do so by\n\nsuch person, shall be punished with imprisonment for a term which may\n\nextend to six months or with fine which may extend to two hundred naira or\n\nwith both."},{"c":"PC","n":"403","t":"Drinking alcoholic drink","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever being of the Moslem faith drinks anything containing alcohol other than for\na medicinal purpose shall be punished with imprisonment\n\nfor a term which may extend to one month or with fine which may extend to\n\nten naira or with both."},{"c":"PC","n":"404","t":"Effect of previous convictions under section 401, 402 or 403","ch":"Chapter XXIV – CRIMINAL INTIMIDATION. INSULT AND ANNOYANCE AND DRUNKENNESS","p":"","x":"Whoever is convicted of an offence under section 401,402 or 403 of\n\nthis Penal Code shall, if he is shown to have been convicted of an offence\n\nunder any of those sections within the previous six months, be punished-\n\n(a) with imprisonment or fine which may extend to twice the maximum\n\nimprisonment or maximum fine prescribed for the offence of which he\n\nis convicted; and\n\n(b) if he is shown to have been convicted of two or more such offences\n\nwithin the like period, then with imprisonment or fine which may\n\nextend to three times the maximum imprisonment or maximum fine\n\naforesaid or with both."},{"c":"PC","n":"405","t":"Interpretation in Chapter XXV","ch":"Chapter XXV – VAGABONDS","p":"","x":"In this Chapter- In\n\nin\n\n(1) The term \"idle person\" shall include-\n\n(a) A person who being able wholly or in part to maintain himself or his\n\nfamily wilfully neglects or refuses to do so;\n\n(aa) a person who having been convicted under section 249 or 250 of the\n\nCriminal Code commits an offence which would render him liable to be convicted as an\nidle person;\n\n(b) a person who wanders abroad or places himself in a street or public\n\nplace to get or gather alms or causes or encourages children to do so\n\nunless from age or infinity he is unable to earn his living;\n\n(c) a person who has no settled home and has no ostensible means of subsistence and\ncannot give a satisfactory account of himself;\n\n(d) a common prostitute behaving in a disorderly or indecent manner in a\n\npublic place or persistently importuning or soliciting persons for the\n\npurpose of prostitution;\n\n(e) a person playing at a game of chance for money or money's worth in\n\nany public place;\n\n(f) a person who in a street or place of public resort or within sight or\n\nhearing of any person therein disturbs the peace by quarrelling or\n\nattempting to quarrel or by using any insolent, scurrilous or abusive\n\ntenn of reproach;\n\n(g) a person who in a street or place of public resort or within sight or hear-\n\ning of any person therein with the intention of annoying or irritating any\n\nperson, sings or otherwise utters any scurrilous or abusive songs or\n\nwords whether any person be particularly addressed therein or not;\n\n(h) a person who in a street or place of public resort is guilty of any\n\nriotous, disorderly or insulting behaviour to the obstruction or annoy-\n\nance of any person lawfully using such street or place or any place in\n\nthe neighbourhood thereof; and\n\n(i) a person who in a private or enclosed place is guilty of any riotous,\n\ndisorderly or insulting behaviour to the annoyance of any person law-\n\nfully using any place in the neighbourhood thereof.\n\nEXPLANATION. A nomad cannot be convicted because he has no settled home\n\nif he has either apparent means of subsistence or gives a satisfactory account\n\nof himself.\n\n(2) The tenn \"vagabond\" shall include-\n\n(0) a person who after being convicted as an idle person commits any of\n\nthe offences which would render him liable to be convicted as such;\n\nagain;\n\n(b) any person who is found in possession of housebreaking implements\n\nwith intent to commit any of the offences defined in sections 343 to 347\n\ninclusive of this Penal Code;\n\n(c) any suspected person or reputed thief who by night frequents or loiters\n\nabout any shop, warehouse, dwelling-house, dock or wharf with intent\n\nto commit any offence under Chapters XVIII or XIX of this Penal\n\nCode;\n\n(d) any male person who knowingly lives wholly or in part on the earning\n\nof a prostitute or in any public place solicits or importunes for immoral\n\npurposes; and\n\n(e) any male person who dresses or is attired in the fashion of a woman in a\n\npublic place or who practices sodomy as a means of livelihood or as a\n\nprofession. \"'\n\n(3) An \"incorrigible vagabond\" shall mean any person who after being\n\nconvicted as a vagabond commits any of the offences which would render him\n\nliable to be convicted as such again."},{"c":"PC","n":"406","t":"Penalty on conviction as idle person","ch":"Chapter XXV – VAGABONDS","p":"","x":"Whoever is convicted as being an idle person shall be punished with\n\nS imprisonment for a term which may extend to one month or with fine or with\n\nboth."},{"c":"PC","n":"407","t":"Penalty on conviction as vagabond","ch":"Chapter XXV – VAGABONDS","p":"","x":"Whoever is convicted as being a vagabond shall be punished with imprisonment\nwhich may extend to two years or with fine which may extend to four hundred and fifty\nnaira or both."},{"c":"PC","n":"408","t":"Penalty on conviction as incorrigible vagabond","ch":"Chapter XXV – VAGABONDS","p":"","x":"Whoever is convicted as being an incorrigible vagabond shall be punished with\nimprisonment which may extend to three years or with fine which may extend to six\nhundred naira or with both."},{"c":"PC","n":"409","t":"Evidence of intent to commit an offence","ch":"Chapter XXV – VAGABONDS","p":"","x":"For the purposes of this Chapter in proving the intent to commit an offence it shall\nnot be necessary to show that the person suspected was guilty of any particular act\ntending to show this purpose or intent and he may be convicted if from the\ncircumstances of the case and from his known character as proved to the court before\nwhich he is brought it appears to the court that his intent was to commit that offence.\n\nIllustration. A man who has been convicted of theft is found by night crouching in the\nshadow of a locked shop and seeing a policeman at once runs away. He is arrested in\npossession of a large bundle of keys. It need not be
