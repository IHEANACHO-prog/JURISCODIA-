nt for three years."},{"c":"CC","n":"490","t":"Fraudulent dealing with property by debtors","ch":"Chapter 47 – Fraudulent debtors","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud his creditors or any of them-\n\n        (1) makes any gift, delivery, or transfer of his property, or any charge on his property; or\n\n       (2) conceals or removes any part of his property after or within two months before the date of\nany unsatisfied judgment or order for payment of money obtained against him,\n\nis guilty of a misdemeanor and is liable to imprisonment for one year."},{"c":"CC","n":"491","t":"Making or dealing in infringing copies of copyright work","ch":"Chapter 48 – Offences in relation to copyright","p":"Part 6 – Offences relating to property and contracts","x":"Any person who knowingly-\n\n        (a)      makes for sale or hire any infringing copy of a work in which copyright subsists; or\n\n        (b)      sells or lets for hire, or by way of trade exposes or offers for sale or hire any infringing\n                copy of any such work; or\n        (c)     distributes infringing copies of any such work either for the purposes of trade or to such\n                an extent as to affect prejudicially the owner of the copyright; or\n\n        (d)      by way of trade exhibits in public any infringing copy of any such work,\n\nis guilty of a simple offence and is liable to a fine not exceeding four naira for every copy dealt with in\ncontravention of this section of this Code, but not exceeding one hundred naira in respect of the same\ntransaction; or, on the case of a second or subsequent offence, either to such fine or to imprisonment\nfor two months."},{"c":"CC","n":"492","t":"Being in possession of plate for making infringing copies: giving unauthorised performances of","ch":"Chapter 48 – Offences in relation to copyright","p":"Part 6 – Offences relating to property and contracts","x":"copyright work\n\nAny person who knowingly makes or has in his possession any plate for the purposes of making\ninfringing copies of any work in which copyright subsists, or knowingly and for his private profit causes\nany such work to be performed in public without the consent of the owner of the copyright, is guilty of a\nsimple offence and is liable to a fine of one hundred naira, or, in the case of a second or subsequent\noffence, either to such fine or to imprisonment for two months."},{"c":"CC","n":"493","t":"Forfeiture of copies or plates","ch":"Chapter 48 – Offences in relation to copyright","p":"Part 6 – Offences relating to property and contracts","x":"The court before which any proceedings are taken for any offence under sections 491 and 492 of this\nCode may, whether the alleged offender is convicted or not, order all copies of the work or all plates in\nthe possession of the alleged offender, which appear to it to be infringing copies or plates for the\npurpose of making infringing copies, to be destroyed or delivered up to the owner of the copyright or\notherwise dealt with as the court may think fit."},{"c":"CC","n":"494","t":"(1) (a) Corrupt acceptance of gift","ch":"Chapter 49 – Secret commissions and corrupt practices","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who-\n\n(a)      being an agent, corruptly accepts or obtains or agrees to accept or attempts to obtain,\n        from any person, for himself or for any other person, any gift or consideration as an\n        inducement or reward for doing or for forbearing to do or for having after the\n        commencement of this Code done or forborne to do, any act in relation to his principal's\n        affairs or business, or for showing or forbearing to show favour or do favour to any\n        person in relation to his principal's affairs or business; or\n\nCorrupt gift to agent\n(b)      corruptly gives or agrees to give or offers any gift or consideration to any agent as an\n        inducement or reward for doing or forbearing to do, or for having after the commencement of\n        this Code done or forborne to do, any act in relation to his principal's affairs or business, or for\n        showing or forbearing to show favour or disfavour to any person in relation to his principal's\n        affairs or business; or\n\nGift to agent of receipt, etc., with intent to mislead principal\n\n(c)     knowingly gives to any agent, or, being an agent, knowingly uses with intent to deceive his\n        principal, any receipt, account or other document in respect of which the principal is interested\n        and which contains any statement which is false or erroneous or defective in any material\n        particulars, and which, to his knowledge, is intended to mislead his principal,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years or to a fine of one thousand naira\nor to both such imprisonment and fine.\n\n       (2) For the purposes of this section, the expression \"consideration\" includes valuable\nconsideration of any kind; the expression \"agent\" includes any person employed by or acting for\nanother; and the expression \"principal\" includes an employer.\n\n         (3) A person serving under the State or, in the Federal Capital Territory, Abuja, the government\nof the State, as the case may be, or any local government council, is an agent within the meaning of this\nsection.\n\n        (4) A prosecution for an offence under this section of this Code shall not be instituted except by\nor with the consent of a law officer."},{"c":"CC","n":"495","t":"Offences of cruelty","ch":"Chapter 50 – Cruelty to animals","p":"Part 7 – Miscellaneous offences","x":"(1) Any person who-\n\n(a)     cruelly beats, kicks, ill-treats, over-rides, over -dri ves, over-loads, tortures, infuriates, or terrifies\n        any animal, or causes or procures, or being the owner, permits any animal to be so used; or\n\n(b)      by wantonly or unreasonably doing or omitting to do any act, or causing or procuring the\n        commission or omission of any act, causes any unnecessary suffering, or being the owner,\n        permits any unnecessary suffering to be caused to any animal; or\n(c)     conveys or carries, or being the owner, permits to be conveyed or carried any animal in such\n        manner or position as to cause such animal unnecessary suffering; or\n\n(d)     wilfully without any reasonable cause or excuse administers, or causes or procures, or, being the\n        owner, permits such administration of, any poisonous or injurious drug or substances to any\n        animal, or wilfully without any reasonable cause or excuse causes any such substance to be\n        taken by any animal; or\n\n(e)     subjects, or causes or procures, or, being the owner, permits, to be subjected, any animal to any\n        operation which is performed without due care and humanity; or\n\n(f)     causes, or procures, or assists at the fighting or baiting of any animal, or keeps, uses, manages,\n        or acts or assists in the management of any premises or place for the purpose, or partly for the\n        purpose, of fighting or baiting any animal, or permits any place to be so kept, managed or used,\n        or receives or causes or procures any person to receive money for the admission of any person\n        to such premises or place,\n\nis guilty of an offence of cruelty and is liable to imprisonment for six months or to a fine of fifty naira or\nto both such imprisonment and fine.\n\n        (2) For the purposes of this section, an owner shall be deemed to have committed cruelty within\nthe meaning of this Chapter if he shall have failed to exercise reasonable care and supervision in respect\nof the protection of the animal therefrom:\n\nProvided that, when an owner is convicted of permitting cruelty within the meaning of this Chapter by\nreason only of his having failed to exercise such care and supervision, he is not liable to imprisonment\nwithout the option of a fine.\n\n        (3) Nothing in this Chapter shall apply-\n\n        (a) to the commission or omission of any act in the course of the destruction, or the preparation\nfor destruction, of any animal as food for mankind, unless such destruction or such preparation was\naccompanied by the infliction of unnecessary suffering; or\n\n          (b) to the coursing or hunting of any captive animal, unless such animal is liberated in an injured,\nmutilated or exhausted condition; but a captive animal shall not, for the purpose of this section, be\ndeemed to be coursed or hunted before it is liberated for the purpose of being coursed or hunted, or\nafter it has been recaptured, or if it is under control."},{"c":"CC","n":"496","t":"Court may order destruction of animal","ch":"Chapter 50 – Cruelty to animals","p":"Part 7 – Miscellaneous offences","x":"When the owner of any animal is convicted of an offence of cruelty under section 495 of this Code, it\nshall be lawful for the court, if the court is satisfied that it would be cruel to keep the animal alive, to\ndirect that the animal be destroyed, and to assign the animal to a suitable person for that purpose. Any\nreasonable expenses incurred in destroying the animal may be ordered by the court to be paid by the\nowner, and thereupon shall be recoverable in like manner as a fine."},{"c":"CC","n":"497","t":"Court may deprive person of ownership","ch":"Chapter 50 – Cruelty to animals","p":"Part 7 – Miscellaneous offences","x":"If the owner of any animal is guilty of cruelty within the meaning of this Chapter to any animal, the court\nupon his conviction thereof, may if it thinks fit, in addition to any other punishment, deprive such\nperson of the ownership of the animal, and may make such order as to the disposal of the animal as it\nmay think fit:\n\nProvided that no order shall be made under this section of this Code, unless it is shown by evidence as\nto a previous conviction, or as to the character of the owner, or otherwise, that the animal, if left with\nthe owner, is likely to be exposed to further cruelty."},{"c":"CC","n":"498","t":"Power of police to take charge of animal or vehicle","ch":"Chapter 50 – Cruelty to animals","p":"Part 7 – Miscellaneous offences","x":"When a person in charge of an animal or vehicle is arrested it shall be lawful for any police officer to\ntake charge of such animal or vehicle and to deposit the same in a place of safe custody until the\ntermination of the proceedings or until the court shall direct such animal or vehicle to be delivered to\nthe person charged or to the owner, and the reasonable costs of such detention, including the\nreasonable costs of any veterinary treatment shall, in the event of a conviction in respect of the animal,\nbe paid by the owner, and such costs may be recovered in like manner as a fine."},{"c":"CC","n":"499","t":"Definitions","ch":"Chapter 50 – Cruelty to animals","p":"Part 7 – Miscellaneous offences","x":"In this Chapter, unless the context otherwise requires-\"animal\" means any domestic or captive animal;\n\n\"captive animal\" means any animal (not being a domestic animal) of whatsoever kind or species,\nincluding any bird, fish or reptile, which is in captivity, or confinement, or which is maimed, pinioned or\nsubjected to any appliance or contrivance for the purpose of hindering or preventing its escape from\ncaptivity or confinement;\n\n\"domestic animal\" means any animal or bird which is tame or which has been or is being sufficiently\ntamed to serve some purpose for the use of man."},{"c":"CC","n":"500","t":"Interpretation","ch":"Chapter 51 – Miscellaneous offences in relation to ships and wharves","p":"Part 7 – Miscellaneous offences","x":"In this Chapter, unless the context otherwise requires-\n\n\"crew\" includes masters, mates, pilots, engineers, stokers, deckhands and all persons engaged in the\nnavigation or service of the ship;\n\n\"Government\" means the government of the Federation and includes a State government;\n                                            [L.N. 112 of 1964.]\n\n\"passenger steamer\" means every steamship carrying one or more persons other than the crew, and\nthe owner, his family, friends and servants;\n\n\"ship\" includes every description of vessel in the service of the Government and every passenger\nsteamer employed in local navigation on the inland and territorial waters of Nigeria."},{"c":"CC","n":"501","t":"Offences in relation to ships","ch":"Chapter 51 – Miscellaneous offences in relation to ships and wharves","p":"Part 7 – Miscellaneous offences","x":"(1) If any of the following offences is committed on any ship-\n\n(a)     if any person being drunk or disorderly has been on that account refused admission thereto by\n        any duly authorised member of the crew and nevertheless persists in attempting to enter the\n        ship;\n\n(b)     if any person being drunk or disorderly on board the ship is requested by any duly authorised\n        member of the crew to leave the ship at any place at which he can conveniently do so, and does\n        not comply with the request;\n\n(c)     if any person on board the ship, after warning by any duly authorised member of the crew\n        molests or continues to molest any passenger;\n\n(d)     if any person shall obstruct, impede or molest the crew or any member of them in the\n        navigation or management of the ship;\n\n(e)     if any person, after having been refused admission to the ship by any duly authorised member\n        of the crew on account of the ship being full, persists in attempting to enter the ship;\n\n(f)     if any person having gone on board the ship at any place and being requested, on account of the\n        ship being full, by any duly authorised member of the crew to leave the ship, before it has\n        quitted that place, does not comply with that request;\n\n(g)      if any person travels or attempts to travel in the ship without first paying his fare and with\n        intent to avoid payment thereof;\n\n(h)      if any person having paid his fare for a certain distance, knowingly and wilfully proceeds in the\n        ship beyond that distance without first paying the additional fare for the additional distance,\n        with intent to avoid payment thereof;\n\n(i)     if any person on arriving in a ship at the point to which he has paid his fare knowingly and\n        wilfully refuses or neglects to quit the ship;\n\n(f)      if any person on board the ship fails when requested by any duly authorised member of the\n        crew either to pay his fare or exhibit such ticket or other receipt, if any, showing the payment of\n        his fare, as is usually given to persons travelling by and paying their fare on the ship;\n(k)     if any person travels or attempts to travel in that part of a ship which is set apart for passengers\n        of a superior class to that for which he holds a ticket;\n\n(I)      if any person travels or attempts to travel in any ship or part of a ship which is not set apart for\n        public passengers and on being ordered by any duly authorised member of the crew to leave\n        such place refuses so to do,\n\nthe person so offending shall for such offence be liable to a fine of ten naira but that liability shall not\nprejudice the recovery of any fare payable by him.\n\n        (2) Any member of the crew in charge of any ship, and all persons called by him to his\nassistance, may, without warrant, arrest any person who commits any offence against this section of\nthis Code and whose name and address are unknown to him.\n\n        (3) Any person who commits an offence against this section of this Code and on the application\nof the officer or quartermaster in charge of the ship, refuses to give his name and address, or gives a\nfalse name or address, is liable to a fine of forty naira."},{"c":"CC","n":"502","t":"Entering ship or wharf without ticket","ch":"Chapter 51 – Miscellaneous offences in relation to ships and wharves","p":"Part 7 – Miscellaneous offences","x":"(1) Any person who-\n\n(a)     not being a passenger by a ship or not having purchased a ticket to travel by a ship, enters upon\n        any enclosed quay, wharf, or landing place, and on being ordered to leave such quay, wharf or\n        landing place by any servant of the Nigerian Ports Authority or person in charge of such quay,\n        wharf, or landing place or any police officer, refuses to do so; or\n\n(b)      not being a passenger by a ship or not having purchased a ticket to travel by a ship, attempts to\n        enter upon any enclosed quay, wharf or landing place, and on being ordered to desist by any\n        servant of the Nigerian Ports Authority or person in charge of such quay, wharf or landing place,\n        or any police officer, persists in so doing,\n\nis guilty of a simple offence and is liable to a fine of four naira or in default to imprisonment for one\nmonth.\n\n         (2) Any duly authorised member of the crew or any police officer and all persons called by him\nto his assistance may, without warrant, arrest any person who commits any offence against this section\nof this Code and whose name and address are unknown to him."},{"c":"CC","n":"503","t":"Power to exclude drunken person from ship","ch":"Chapter 51 – Miscellaneous offences in relation to ships and wharves","p":"Part 7 – Miscellaneous offences","x":"Any duly authorised member of the crew of any ship may refuse to receive on board thereof any person\nwho by reason of drunkenness or otherwise is in such a state, or misconducts himself in such a manner,\nas to cause annoyance or injury to passengers on board, and if any such person is on board, may put him\non shore at any convenient place."},{"c":"CC","n":"504","t":"jurisdiction","ch":"Chapter 51 – Miscellaneous offences in relation to ships and wharves","p":"Part 7 – Miscellaneous offences","x":"For the purpose of giving jurisdiction under this Chapter, every offence shall be deemed to have been\ncommitted and every cause of complaint to have arisen either in the district in which the same actually\nwas committed or arose, or in any district in which the offender or person complained against is or may\nbe found."},{"c":"CC","n":"505","t":"Interpretation","ch":"Chapter 52 – Offences by members of a crew","p":"Part 7 – Miscellaneous offences","x":"In this Chapter, unless the context otherwise requires-\n\n                                            [L.N. 112 of 1964.]\n\n\"Government\" means the government of the Federation and includes a State government;\n\n\"ship\" includes every description of vessel used in inland navigation or in the service of the Government,\nbut does not include-\n\n(a)     ocean-going ships not in the service of the Government; or"},{"c":"CC","n":"506","t":"Obligation to complete voyage","ch":"Chapter 52 – Offences by members of a crew","p":"Part 7 – Miscellaneous offences","x":"A person serving in the crew of a ship shall complete any voyage the ship may be engaged in making\nwhen the period of his engagement expires:\n\nProvided that the person serving after the term of his agreement has expired, shall be paid up to the\ndate of the termination of the voyage, at the rate stipulated for under the terms of the agreement\nunder which he is serving."},{"c":"CC","n":"507","t":"Offences by members of a crew","ch":"Chapter 52 – Offences by members of a crew","p":"Part 7 – Miscellaneous offences","x":"(1) Any person who-\n           (a)       having entered into an agreement to serve in the crew of any ship fails to enter upon\n                     his employment; or\n\n           (b)       being a member of the crew of any ship-\n\n                     (i)       deserts or without leave or lawful cause absents himself from duty;\n\n                     (ii)      is intoxicated during working hours;\n\n                     (iii)    refuses without reasonable excuse therefor to obey the order of any person in\n                              authority over him;\n\n                     (iv)      uses abusive or insulting language to any person in authority over him;\n\n    (iv)         wilfully does any act tending to the loss of or damage or serious risk to his employer's\n                 property;\n\n                     (vi)     refuses or omits without reasonable cause to do any act proper and requisite to\n                              be done by him for preserving his employer's property,\n\nis guilty of a simple offence and is liable to a fine of ten naira.\n\n        (2) Any person serving in the crew of any ship who combines with any of the crew to disobey\nlawful commands, or to neglect duty, or to impede the navigation of the ship or the progress of the\nvoyage, shall be liable to imprisonment for three months.\n\n           (3) The offender may be tried in any place where he is or to which he may be brought.\n\n        (4) A master or person in charge of an ocean-going ship may inquire into any offence under this\nsection of this Code, and may impose upon the offender a fine not exceeding ten naira to be levied by\nstoppage from the offender's wages."},{"c":"CC","n":"508","t":"Attempts to commit offences","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Any person who attempts to commit a felony or misdemeanor, is guilty of an offence which, unless\notherwise stated, is a misdemeanor."},{"c":"CC","n":"509","t":"Punishment of attempts to commit felonies","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Any person who attempts to commit a felony of such a kind that a person convicted of it is liable to the\npunishment of death or of imprisonment for a term of fourteen years or upwards, with or without other\npunishment, is guilty of a felony and is liable, if no other punishment is provided, to imprisonment for\nseven years.\n\nAny person who attempts to commit a felony of any other kind is liable, if no other punishment is\nprovided, to a punishment equal to one half of the greatest punishment to which an offender convicted\nof the felony which he attempted to commit is liable."},{"c":"CC","n":"510","t":"Punishment of attempts to commit misdemeanours","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Any person who attempts to commit a misdemeanor is liable, if no other punishment is provided, to a\npunishment equal to one half of the greatest punishment to which an offender convicted of the offence\nwhich he attempted to commit is liable."},{"c":"CC","n":"511","t":"Punishment of attempts to commit simple offences","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Any person who attempts to commit a simple offence is liable, if no other punishment is provided, to\none half of the greatest punishment to which an offender convicted of the offence which he attempted\nto commit is liable."},{"c":"CC","n":"512","t":"Reduction of punishment","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"When a person is convicted of attempting to commit an offence, if it is proved that he desisted of his\nown motion from the further prosecution of his intention, without its fulfilment being prevented by\ncircumstances independent of will, he is liable to one half only of the punishment of which he would\notherwise be liable. If that punishment is imprisonment for life, the greatest punishment to which he is\nliable is imprisonment for seven years."},{"c":"CC","n":"513","t":"Attempts to procure commission of criminal acts","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"(1) Any person who attempts to procure another to do an act or make an omission of such a\nnature that if he himself were to do the act or make the omission he would be guilty of an offence, is\nhimself to be deemed guilty of attempting to commit such offence and to be punishable accordingly.\n\n       (2) Any person who while in Nigeria attempts to procure another to do an act or make an\nomission at a place not in Nigeria of such a nature-\n\n        (a) that if he were himself to do the act or make the omission in Nigeria he would be guilty of an\n            offence; and\n        (b) that if he were himself to do the act or make the omission at the place where the act or\n             omission is proposed to be done or made, he would himself be guilty of an offence under\n            the laws in force at that place,\n\nis guilty of an offence of the same kind and is liable to the same punishment as if he were himself to\nattempt to do the same act or make the same omission in Nigeria."},{"c":"CC","n":"514","t":"Preparation to commit crimes with explosives, etc","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Any person who makes or knowingly has in his possession any explosive substance, or any dangerous or\nnoxious engine, instrument, or thing whatever, with intent by means thereof to commit, or for the\npurpose of enabling any other person by means thereof to commit any felony, is guilty of a felony and is\nliable to imprisonment for three years."},{"c":"CC","n":"515","t":"Neglect to prevent felony","ch":"Chapter 53 – Attempts, incitements, and preparations to commit offences Neglect to prevent commission of felony","p":"Part 8 – Preparation to commit offences","x":"Every person who, knowing that a person designs to commit or is committing a felony, fails to use all\nreasonable means to prevent the commission or completion thereof, is guilty of a misdemeanor and is\nliable to imprisonment for two years."},{"c":"CC","n":"516","t":"Conspiracy to commit felony","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"Any person who conspires with another to commit any felony, or to do any act in any part of the world\nwhich if done in Nigeria would be a felony, and which is an offence under the laws in force in the place\nwhere it is proposed to be done, is guilty of a felony and is liable, if no other punishment is provided, to\nimprisonment for seven years, or, if the greatest punishment to which a person convicted of the felony\nin question is liable is less than imprisonment for seven years, then to such lesser punishment."},{"c":"CC","n":"516A","t":"Conspiracy to commit felony against law of a State","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"(1) Any person who while in a State conspires with another to do any act not in the State which\nif done in the State would be a felony against the law of the State and which is an offence against the\nlaw of the place where it is proposed to be done, is guilty of a felony and is liable, if no other\npunishment is provided, to imprisonment for seven years, or, if the greatest punishment to which a\nperson convicted of the felony in question is liable is less than imprisonment for seven years, then to\nsuch lesser punishment.\n\n         (2) In this section and section 517 A of this Code, \"law of a State\" has the meaning assigned to it\nin section l0A of this Code."},{"c":"CC","n":"517","t":"Conspiracy to commit offence","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"Any person who conspires with another to commit any offence which is not a felony, or to do any act in\nany part of the world, which if done in Nigeria would be an offence but not a felony, and which is an\noffence under the laws in force in the place where it is proposed to be done, is guilty of a misdemeanor\nand is liable to imprisonment for two years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"517A","t":"Conspiracy to commit offence against law of a State","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"Any person who, while in a State, conspires with another to do any act not in the State which if done in\nthe State would be an offence against the law of the State (other than a felony) and which is an offence\nagainst the law of the place where it is proposed to be done, is guilty of a misdemeanor and is liable to\nimprisonment for two years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"518","t":"Other conspiracies","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"Any person who conspires with another to effect any of the following purposes\n\n                                 [L.N. 112 of 1964.]\n\n        (1) to prevent or defeat the execution or enforcement of any Act, law, statute, or order; or\n\n       (2) to cause any injury to the person or reputation of any person, or to depreciate the value of\nany property of any person; or\n\n          (3) to prevent or obstruct the free and lawful disposition of any property by the owner thereof\nfor its fair value; or\n\n        (4) to injure any person in his trade or profession; or\n\n        (5) to prevent or obstruct, by means of any act or acts which if done by an individual person\nwould constitute an offence on his part, the free and lawful exercise by any person of his trade,\nprofession, or occupation; or\n\n        (6) to effect any unlawful purpose; or\n\n        (7) to effect any lawful purpose by any unlawful means,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years.\n\n        An offender cannot be arrested without warrant."},{"c":"CC","n":"518A","t":"Conspiracy in trade dispute","ch":"Chapter 54 – Conspiracy","p":"Part 8 – Preparation to commit offences","x":"(1) The provisions of sections 516, 517 and 518 of this Code shall not apply to an agreement or\ncombination of two or more persons to do or procure to be done any act in contemplation or\nfurtherance of a trade dispute if such act committed by one person would not be punishable as an\noffence:\n\nProvided that nothing in this section shall exempt from punishment any person guilty of a conspiracy for\nwhich a punishment is provided by any other enactment:\n\n       And provided further that nothing in this section shall affect the law relating to riot, unlawful\nassembly, breach of the peace, or sedition, or any offence against the State.\n\n                                            [L.N. 112 of 1964.]\n\n        (2) For the purposes of this section-\n\n\"offence\" does not include an offence punishable only by a fine; and \"trade dispute\" has the same\nmeaning as in the Trade Unions Act."},{"c":"CC","n":"519","t":"Accessories after the fact to felonies","ch":"Chapter 55 – Accessories after the fact","p":"Part 8 – Preparation to commit offences","x":"Any person who becomes an accessory after the fact to a felony is guilty of a felony and is liable, if no\nother punishment is provided, to imprisonment for two years."},{"c":"CC","n":"520","t":"Accessories after the fact to misdemeanours","ch":"Chapter 55 – Accessories after the fact","p":"Part 8 – Preparation to commit offences","x":"Any person who becomes an accessory after the fact to a misdemeanor, is guilty of a misdemeanor and\nis liable to a punishment equal to one half of the greatest punishment to which the principal offender is\nliable on conviction."},{"c":"CC","n":"521","t":"Accessories after the fact to simple offences","ch":"Chapter 55 – Accessories after the fact","p":"Part 8 – Preparation to commit offences","x":"Any person who becomes an accessory after the fact to a simple offence, is guilty of a simple offence\nand is liable to a punishment equal to one half of the greatest punishment to which the\n\nprincipal offender is liable on conviction."},{"c":"CC","n":"App","t":"Federal sections (list printed at end of the Act)","ch":"Appendix","p":"","x":"Federal sections\n\n                                            See Preface\n\nThe following sections of the Criminal Code are, in the opinion of the Committee, purely Federal-\n\n12                                    49A                                               233A\n13                                  49B                                     345\n\n14                                  49C                                      449\n\n20                                  58                                      454\n\n38                                  78                                      459\n\n44                                  79                                      459A\n\n45                                        87                          459B\n\n46                                        146-189                     460\n46A                                       190A                        482\n47                                        194                         483\n48                                        195                         491\n49                                        196                         492\n                                                                      493\n\n                                           CRIMINAL CODE ACT\n\n                                         SUBSIDIARY LEGISLATION\n\n                                     List of Subsidiary Legislation\n\n1. Unlawful Societies Orders\n\n2. Race Club Lotteries and Sweepstakes Notices.\n\n3. Prohibited Publications Orders\n\n                                    __________________________\n                                      UNLAWFUL SOCIETIES ORDER\n\n                                        [11 of 1917. 9 of 1926.]\n\n                                        under section 62 (2) (ii)\n\nThe following societies are hereby declared to be dangerous to the good government of Nigeria-\n\n(a) The society known as \"Akpambe\";\n\n(b) The society known as \"Ukikwe\";\n\n(c) The society known as \"Ogrinia\";\n\n(d) The society known as \"Ekpa\";\n\n(e) The society now operating in the Ijebu Province and purporting to operate under the style of\nMajeobaje or Majekobaje.\n\n                                        [42 of 1948.]\n\nThe following societies are hereby declared for the purposes of Chapter 9 of the Criminal Code to be\nsocieties dangerous to the good government of Nigeria-\n\n                                        [19 of 1950.]\n\n(f) The society commonly known as the Zikist Movement;\n\n                                        [10 of 1953.]\n\n(g) The society commonly known as Gbogbo Agbaiye;\n\n                                        [23 of 1954.]\n\n(h) The society commonly known as Aiye Peju;\n\n                                        [65 of 1957.]\n\n(i) The society commonly known as the Union des Populations du Cameroun;\n\n                                        [64 of 1957.]\n\n(j)The society commonly known as the Cameroons Democratic Youth but with the alternative French\ntitle Jeunesse Democratique Camerounaise;\n\n                                        [66 of 1957.[\n\n(k) The society commonly known as the Kamerun Women's Democratic Union but with the alternative\nFrench title Union des Femmes Camerounaises;\n                                        [L.N. 83 of 1965.]\n\n(I) The society commonly known as the \"Sawaba Party\" or alternatively Parti Sawaba.\n\n                                  _____________________________\n\n                          RACE CLUB LOTTERIES AND SWEEPSTAKES NOTICES\n\n                                         [Notice 2465 of 1937.]\n\n                                         under section 240D (1)\n\nIn accordance with the powers vested in him by section 240D (1) of the Criminal Code Act, the\n\nGovernor has extended the provisions of the said section to the following race club\n\nThe Lagos Race Club.\n\n                                        ____________________\n\n                                  PROHIBITED PUBLICATIONS ORDERS\n\n                                              [12 of 1951.]\n\n                                          under section 58 (1)\n\n1. Short title\n\nThis Order may be cited as the Prohibited Publication (\"For a Pan-African Trade Union Conference\")\nOrder.\n\n2. Prohibition of importation\n\nThe importation into Nigeria of a publication purporting to be issued by the World Federation of Trade\nUnions and entitled \"For a Pan-African Trade Union Conference\" is hereby prohibited.\n\n                                        ______________________\n\n1. Short title\n\nThis Order may be cited as the Prohibition of Publications (Film: \"The Road to Peace\") Order.\n\n2. Prohibition of importation\nThe importation into Nigeria of a publication purporting to be issued by the World Peace Council and\nentitled \"The Road to Peace\" is hereby prohibited.\n\n                                         ________________________\n\n1. Short title\n\nThis Order may be cited as the Criminal Code (Prohibited Publication) Order.\n\n                                                  [74 of 1955.]\n\n2. \"Song of the Rivers\" Prohibited\n\nThe importation into Nigeria of the following publication, that is to say, the cinematograph film entitled\n\"Song of the Rivers\" is hereby prohibited.\n\n1. Short title\n\nThis Order may be cited as the Criminal Code (Prohibited Importations) Order.\n\n                                         [75 of 1955.]\n\n2. Prohibition of importation of publications\n\nThe importation into Nigeria of-\n\n        (a) any of the publications specified in Part A of the Schedule to this Order; and\n\n        (b) any past or future issue of the periodical publications specified in Part B of the Schedule to\n            this Order,\n\nis hereby prohibited.\n\n                                         SCHEDULE\n\n                                           PART A\n\nPublication                                                       Publisher\n\nThis the LU.S., 1953                                     International Union of Students\nFor Real Social Security                                World Federation of Trade Unions\n\nTerror in Kenya                                         W.F.T.U. Publications Ltd., London\n\nFor Peace and Friendship: The Work of the Third         \"World Youth\" Magazine, organ of the world\nWorld Democratic Youth congress                          Federation of Youth Congress\n\nThe Colonies. The Way Forward                           The Communist Party, London, organ of\ntheWork with the Masses                                 W.F.T.U. Publications Ltd., London, W.C.2.\n\nUnder the Banner of Unity and International              W.F.T.U. Publications Ltd., London, W.C.2.\nsolidarity\n\nDefend Trade Union Rights                     Published in September, 1952, by W.F.T.U. Publications\n                                              Ltd., London, W.C.2.\n\nReport of the Commission of the             Women’s International Democratic Federation ,\nWomen's International Democratic Federation Berlin, Germany.\nin Korea May 16th to 27th, 1951.\n\nThe Mask is Off                               Thames Publications Ltd., England\n\nThe Right to Live.                            Kenya Committee, 86 Rochester Row, London, S.W.1\n\nKenya under the Iron Heel.                    Movement for a Democracy of Content, Contemporary\n                                              Press, Heber Road, London, N.W.2\n\n Whole World               Women's International Democratic Federation, Berlin, Germany\n\nAfrica News Letter                      Africa Committee of the Communist Party, London, W.C.2\n\nAfrica Bulletin                         M. Basset, London, N.W.3.\n\n21st February (Special newspaper for   World Federation of Democratic Youth, Budapest, Hungary.\nThe 21st February)\n\nArticle Service, World Federation of    World Federation of Democratic Youth, Budapest, Hungary.\nDemocratic Youth.\n\nFor A Lasting Peace for a People’s      Information Bureau of the Communist and Worker’s Parties,\nDemocracy.                              Bucharest, Rumania.\n\nInformation Bulletin Of the Hungarian The Central Council of Hungarian Trade Unions, Budapest,\nTrade Unions.                         Hungary.\n\nFestival.                               Newspaper of the International Predatory Committee.\n\n1. Prohibition of importation\nThe importation into Nigeria of the magazine entitled the \"Peking Review\", a weekly magazine of\nChinese news and views, is hereby prohibited.\n\n                               [L.N. 27 of 1965.]\n\n2. Short title\n\nThis Order may be cited as the Criminal Code (Prohibited Importations) Order."},{"c":"PC","n":"1","t":"Sense of expression once explained","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Every expression, which is explained in any part of this Penal Code, is used in every\npart of this Penal Code in conformity with the explanation,"},{"c":"PC","n":"2","t":"Gender","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The pronoun \"he\" and its derivatives are used of any person whether male or female."},{"c":"PC","n":"3","t":"Number","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Unless the contrary appears from the context, words importing the singular number\ninclude the plural number and words importing the plural number include the singular\nnumber."},{"c":"PC","n":"4","t":"Man, woman","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"man\" denotes a male human being of any age and the word \"woman\"\ndenotes a female human being of any age."},{"c":"PC","n":"5","t":"Person","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"person\" includes a company or an association or a body of persons,\nwhether incorporated or not.\n\n(2) A child becomes a person when it has been born alive whether it has breathed or\nnot, and whether the umbilical cord is severed or not."},{"c":"PC","n":"6","t":"Public","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"the public\" include; any class or section of the public."},{"c":"PC","n":"7","t":"Magistrate","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"magistrate\" denotes a magistrate under the Criminal Procedure Code Act."},{"c":"PC","n":"8","t":"Court of justice","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"\"court of justice\" includes every civil or criminal court established by any Act or Law or\ndeemed to be so established and every person or body of persons exercising judicial\nfunctions in the Federal Capital Territory, Abuja by virtue of any Act or Law and shall also\ninclude every court martial held in the Federal Capital Territory, Abuja under the military\nlaw in force in the Federal Capital Territory, Abuja."},{"c":"PC","n":"9","t":"Judicial proceedings","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"\"Judicial proceedings\" includes any proceeding in the course, of which Judicial it is\nlawful to take evidence on oath."},{"c":"PC","n":"10","t":"Public officer","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"public officer\" denote a person falling under any of the descriptions\nhereinafter following, that is to say-\n\n(a) every person appointed by the Government of the Federation or of a State while\nserving the Federal Capital Territory, Abuja;\n\n(b) every person not coming within the description set out in paragraph (a) of this section\nwho is in the service of the Government or local authority in a judicial, or quasi-judicial,\nexecutive, administrative or clerical capacity;\n\n(c) every commissioned officer of the Nigerian Armed Forces;\n\n(d) every assessor or other person assisting a court of justice or a public officer exercising\njudicial or quasi-judicial functions, while acting in that capacity;\n\n(e) every arbitrator or other person to whom a cause or matter has been referred for\ndecision or report by a court of justice or by any other competent public authority, while\nacting in that capacity;\n\n(f) every officer or other person not being a member who is appointed to perform a duty\nin connection with the discharge of its functions by a body forming part of the National\nAssembly.\n\n(g) every person who is in the service of any public corporation established by any Act or\nLaw.\n\nEXPLANATION 1. In this section public duties include duties to be performed for the\nprotection, preservation or promotion of the public health, order, safety or convenience\nand duties to be performed for the protection of the pecuniary interests of or for carrying\non the work of the Federal Capital Territory, Abuja, municipal or other local authority.\n\nEXPLANATION 2. The expression \"public officer\" applies to every person who is in actual\noccupation of the post of a public officer whatever legal defect there may be in his right\nto hold such post."},{"c":"PC","n":"11","t":"Armed forces, military affairs","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The term \"armed forces\" includes naval and air forces and the term \"military affairs\"\nincludes affairs relating to naval and air forces and defences."},{"c":"PC","n":"12","t":"Movable property","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"movable property\" include corporeal property of every property.\ndescription except land and things attached to the earth or permanently fastened to\nanything which is attached to the earth."},{"c":"PC","n":"13","t":"Wrongful gain","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"\"Wrongful gain\" is gain by unlawful means of property to which the gain. person\ngaining is not legally entitled."},{"c":"PC","n":"14","t":"Wrongful loss","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"\"Wrongful loss\" is the loss by unlawful means of property to which the person losing it is\nlegally entitled."},{"c":"PC","n":"15","t":"Gaining wrongfully, losing wrongfully","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to gain wrongfully when the person retains wrongfully as well as when\nthe person acquires wrongfully, and a person is said to lose wrongfully. wrongfully when\nthe person is wrongfully kept out of any property as well as when the person is wrongfully\ndeprived of property."},{"c":"PC","n":"16","t":"Dishonestly","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to do a thing \"dishonestly\" who does that thing with the intention of\ncausing a wrongful gain to himself or another or of causing wrongful loss to any other\nperson."},{"c":"PC","n":"17","t":"Fraudulently","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to do a thing \"fraudulently' or \"with intent to defraud\" who does that\nthing with intent to deceive and by means of the deceit to obtain some advantage for\nhimself or another or to cause loss to any other person."},{"c":"PC","n":"18","t":"Reason to believe","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to have \"reason to believe\" a thing if he has sufficient cause to that\nthing but not otherwise."},{"c":"PC","n":"19","t":"Likely, probable","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"(1) An act is said to be \"likely\" to have a certain consequence or to Likely, cause a\ncertain effect if the occurrence of that consequence or effect would probable cause no\nsurprise to a reasonable man.\n\n(2) An effect is said to be a probable consequence of an act if the occurrence of that\nconsequence would be considered by a reasonable man to be the natural and normal\neffect of the act."},{"c":"PC","n":"20","t":"Property in possession of wife, clerk or servant","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"When property is in the possession of a person's wife, clerk or servant on account of\nthat person, it is in that person's possession within the meaning of this Penal Code.\n\nEXPLANATION. A person employed temporarily or on a particular occasion in the\ncapacity of a clerk or servant, is a clerk or servant within the meaning of this section."},{"c":"PC","n":"21","t":"Counterfeit","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to \"counterfeit\" who causes one thing to resemble another thing\nintending by means of that resemblance to practise deception or knowing it to be likely\nthat deception will thereby be practised.\n\nEXPLANATION 1. It is not essential to counterfeiting that the resemblance should be\nexact.\n\nEXPLANATION 2. When a person causes one thing to resemble another thing and the\nresemblance is such that a person might be deceived thereby, it shall be presumed until\nthe contrary is proved, that the person so causing the one thing to resemble the other\nthing intended by means of that resemblance to practise deception or knew it to be\nlikely that deception would thereby be practised."},{"c":"PC","n":"22","t":"Writing document","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"writing\" denotes a mark made on paper or other substance to express\nwords or ideas, and includes marks made by printing, lithography, photography,\nengraving or any other process; and the word \"document\" signifies any writing intended\nto be used or which may be used as evidence of the matter thereby expressed."},{"c":"PC","n":"23","t":"Document of title","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"document of title\" denote a document which is or purports to be, a\ndocument whereby a legal right is created, extended, transferred, restricted,\nextinguished or released, or whereby the existence or the extinction of a legal right is\nacknowledged or established."},{"c":"PC","n":"24","t":"Words referring to acts include illegal omissions","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"In every part of this Penal Code, except where a contrary intention appears from the\ncontext, words which refer to acts done extend also to illegal omissions."},{"c":"PC","n":"25","t":"Act, omission","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"act\" denotes a series of acts as well as a single act; and the word \"omission\"\ndenotes a series of omissions as well as a single omission."},{"c":"PC","n":"26","t":"Effect caused partly by act and partly by omission","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Wherever the causing of a certain effect or an attempt to cause that effect by an\nact or by an omission is an offence, it is to be understood that the causing of that effect\nor the attempt to cause that effect partly by an act and partly by an omission is the\nsame offence."},{"c":"PC","n":"27","t":"Voluntarily","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to cause an effect \"voluntarily\" when he causes it by means whereby\nhe intended to cause it or by means which, at the time of employing those means, he\nknew or had reason to believe to be likely to cause it.\n\nIllustration. A sets fire by night to an inhabited house for the purpose of facilitating a\nrobbery and thus causes the death of a person in the house. Here, A may not have\nintended to cause death and may even be sorry that death has been caused by his act;\nyet, if he knew that he was likely to cause death, he has caused death voluntarily."},{"c":"PC","n":"28","t":"Offence","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Except where it otherwise appears from the context, the word \"offence\" includes an\noffence under a law for the time being in force."},{"c":"PC","n":"29","t":"Illegal","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Everything which is prohibited by law and which is an offence or which furnishes\nground for a civil action is said to be \"illegal\"."},{"c":"PC","n":"30","t":"Legally bound to do","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to be \"legally bound to do\" not only whatever he is to do. bound by\nlaw to do but also everything the omission to do which by him is an offence; or furnishes\nground for a civil action."},{"c":"PC","n":"31","t":"Injury","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"injury\" denotes any harm whatever illegally caused to a person, in body,\nmind, reputation, or property."},{"c":"PC","n":"32","t":"Life, death","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"life\" and \"death\" denote the life or death of a human being unless it\notherwise appears from the context."},{"c":"PC","n":"33","t":"Animal","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"animal\" does not include a human being."},{"c":"PC","n":"34","t":"Vessel.,","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"vessel\" denotes a thing made for the conveyance by water of human\nbeings or of property."},{"c":"PC","n":"35","t":"Year, month","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Wherever the word \"year\" or the word \"month\" is used it is to be understood that the\nyear or the month is to be reckoned according to the Gregorian calendar."},{"c":"PC","n":"36","t":"Oath","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The word \"oath\" includes a solemn affirmation substituted by law for an oath, and any\ndeclaration required or authorised by law to be made before a public officer or to be\nused for the purpose of proof, whether in a court of justice or not."},{"c":"PC","n":"37","t":"Good faith","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Nothing is said to be done or believed in good faith which is done or believed without\ndue care and attention."},{"c":"PC","n":"38","t":"Provocation","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"Such grave and sudden provocation as under any section of this Penal Code\nmodifies the nature of an offence or mitigates the penalty which may be inflicted shall\nnot be deemed to include-\n\n(a) provocation sought or voluntarily provoked by the offender as an excuse for\ncommitting an offence;\n\n(b) provocation given by anything done in obedience to the law or by a public officer in\nthe lawful exercise of the powers ot such public officer;\n\n(c) provocation given by anything done in the lawful exercise of the right of private\ndefence.\n\nIllustrations. (a) A is lawfully arrested by Z, a police officer. A excited to sudden and\nviolent passion by the arrest kills Z. A is not protected by sub-section (1) of section 222.\n\n(b) A appears as a witness before Z, a magistrate Z says that he does not believe a word\nof A's evidence. A provoked thereby causes hurt to Z. fie is punishable under section 246\nand not under section 244.\n\n(c) A attempts to pull Z's nose. Z in self defence lays hold of A. A provoked thereby\nattacks Z and causes him grievous harm. A is punishable under section 247 and not\nunder section 245."},{"c":"PC","n":"39","t":"Invalid consents","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A consent is not such a consent as is intended by any section of this Invalid Penal\nCode, if the consent is given- consents.\n\n(a) by a person under fear of injury, or under a misconception of fact, and if the person\ndoing the act knows, or has reason to believe, that the consent was given in\nconsequence of that fear or misconception; or\n\n(b) by a person who, from unsoundness of mind or intoxication, is unable to understand\nthe nature and consequence of that to which he gives his consent; or\n\n(c) by a person who is under fourteen years of age."},{"c":"PC","n":"40","t":"Harbour","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"A person is said to \"harbour\" another person who has committed or intends to commit\nan offence or who is seeking to evade arrest when he supplies that other person with\nshelter, food, drink, money, clothes, arms, ammunition, or means of conveyance, or\nassists that other in any way to evade arrest."},{"c":"PC","n":"41","t":"Deleted","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"(Deleted.)"},{"c":"PC","n":"42","t":"Foreign government","ch":"Chapter I – GENERAL EXPLANATIONS AND INTERPRETATION","p":"","x":"The words \"foreign government\" mean any government other than any government\nwithin the Federation of Nigeria, the government of the United Kingdom or of a\ncommonwealth country or part thereof."},{"c":"PC","n":"43","t":"Common knowledge","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"A person is presumed, unless the contrary is proved, to have knowledge of a material\nfact if that fact is a matter of common knowledge."},{"c":"PC","n":"44","t":"Presumption of knowledge of an intoxicated person","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"A person who does an act in a state of intoxication is presumed to have the same\nknowledge as he would have had if he had not been intoxicated."},{"c":"PC","n":"45","t":"Act done by person justified by law","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence which is done by a person who is justified by law, or who by\nreason of a mistake of fact and not by reason of a mistake of law, in good faith believes\nhimself to be justified by law in doing it.\n\nIllustrations. (a) A an officer of a court of justice being ordered by that court to arrest Y\nand after due enquiry believing Z to be Y arrests Z. A has committed no offence.\n\n(b) A sees Z commit what appears to A to be culpable homicide. A in the exercise to the\nbest of his judgment exerted in good faith of the power which the law gives to all persons\nof arresting murderers seizes Z in order to bring him before the proper authorities. A has\ncommitted no offence, though it may turn out that Z was acting in self defence."},{"c":"PC","n":"46","t":"Act of court of justice","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence which is done by a person when acting judicially as a court of\njustice or as a member of a court of justice in the exercise of a power which is or which in\ngood faith he believes to be given to him by law."},{"c":"PC","n":"47","t":"Act done pursuant to the judgment or order of court","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing which is done in pursuance of or which is warranted by the judgment or\norder of a court of justice, if done whilst such judgment or order remains in force, is an\noffence, notwithstanding that the court may have had no jurisdiction to pass such\njudgment or order, provided the person doing the act in good faith believes that the\ncourt had the jurisdiction."},{"c":"PC","n":"48","t":"Accident in doing a lawful act","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence which is done by accident or misfortune and without any\ncriminal intention or knowledge in the course of doing a lawful act in a lawful manner by\nlawful means and with proper care and caution."},{"c":"PC","n":"49","t":"Act likely to cause injury, but done without criminal intent and to pre-","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"(1) Nothing is an offence by reason of any injury which it may cause or be intended\nby the doer to cause or be known by the doer to be likely to cause, if it be done without\nany criminal intention to cause injury and in good faith for the purpose of preventing or\navoiding other injury to person or property or of benefiting the person to whom injury is or\nmay be caused:\n\nProvided-\n\n(a)    that, having regard to all the circumstances of the case, the doing of the thing\nwas reasonable; and\n\n(b)    that, where the circumstances so require, the thing is done with reasonable care\nand skill.\n\n(2) This section shall not apply to the intentional ,causing of death or to the attempting to\ncause death in order to prevent or avoid injury to property only except as is provided for\nin section 66 of this Penal Code,\n\n(3) The death of a person shall under no circumstances be deemed to be for the benefit\nof that person,\n\n(4) Mere pecuniary benefit is not benefit within the meaning of this section.\n\nIllustrations. (a) A passenger train traveling at a high speed is approaching a stationary\npassenger train upon the same line of rails. A railway employee, as the only means of\npreventing a collision which would probably involve the lives of many passengers,\nswitches the moving train into a siding. The employee is not guilty of an offence if in all\nthe circumstances his act was reasonable,\n\nalthough a fatal though less serious accident will probably result and a fatal accident in\nfact occurs.\n\n(b) A in a great fire pulls down houses in order to prevent the conflagration from\nspreading. He does this with the intention in good faith of saving human life or property.\nHere, if it is found that in the circumstances A's act was reasonable A is not guilty of an\noffence.\n\n1 (c) (i) A a surgeon knowing that a particular operation is likely to cause\n\nr the death of Z, who suffers from a painful complaint, but not intending to cause Z's\ndeath and intending in good faith Z's benefit performs that operation.\n\nZ dies in consequence of the operation. If the operation is one which in all the\ncircumstances it was reasonable for A to perform and it is performed with reasonable\ncare and skill, A has committed no offence.\n\n(ii) If through drunkenness the operation is performed unskillfully. A is not protected by this\nsection.\n\n(iii) Whether Z (or some competent person on his behalf) has consented to the operation\nor not, is a material circumstance in judging whether it was reasonable to peiform the\noperation.\n\n (d) Z is seized by a crocodile. A fires at the crocodile not intending to kill Z and in good\nfaith intending Z's benefit. In fact A kills Z. A has committed no offence."},{"c":"PC","n":"50","t":"Act of child","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"No act is an offence which is done- Act of child.\n\n(a) by a child under seven years of age; or .\n\n(b) by a child above seven years of age but under twelve years of age who has not\nattained sufficient maturity of understanding to judge the nature and consequence of\nthat act."},{"c":"PC","n":"51","t":"Act of a person of unsound mind","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence which is done by a person who. at the time of doing it, by\nreason of unsoundness of mind, is incapable of knowing the nature of the act, or that he\nis doing what is either wrong or contrary to law."},{"c":"PC","n":"52","t":"Involuntary intoxication","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence which is done by a person who, at the time of doing it, is, by\nreason of intoxication caused by something administered to him without his knowledge\nor against his will, incapable of knowing the nature of the act, or that he is doing what is\neither wrong or contrary to law."},{"c":"PC","n":"53","t":"Act not intended to cause death or grievous hurt done by consent","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"(1) No act is an offence by reason of the injury it has caused to the person or\nproperty of a person who, being above the age of eighteen years, hasvoluntarily and\nwith understanding given his consent express or implied to done by that act.\n\n(2) This section shall not apply to acts which are likely to cause death or grievous hurt, nor\nto acts which constitute offences independently of any injury which they are capable of\ncausing to the person who has given his consent or to his property."},{"c":"PC","n":"54","t":"Act not intended to cause death done by consent for a person's benefit","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing, which is not intended to cause death, is an offence by reason of any harm\nwhich it may cause, or be intended by the doer to cause, or be known by the doer to be\nlikely to cause, to a person for whose benefit it is sent for a per- done in good faith, and\nwho has given a consent, whether express or implied, to suffer that harm, or to take the\nrisk of that harm."},{"c":"PC","n":"55","t":"Correction of child, pupil, servant or wife","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"(1) Nothing is an offence which does not amount to the infliction of child, pupil,\ngrievous hurt upon a person and which is done-\n\n(a) by a parent or guardian for the purpose of correcting his child or ward that child or\nward being under eighteen years of age; or\n\n(b) by a schoolmaster for the purpose of correcting a child under eighteen years of age\nentrusted to his charge; or\n\n(c) by a master for the purpose of correcting his servant or apprentice, the servant or\napprentice being under eighteen years of age; or\n\n(d) by a husband for the purpose of correcting his wife such husband and wife being\nsubject to any customary law in which the correction is recognized as lawful.\n\n(2) No correction is justifiable which is unreasonable in kind or in degree, regard being\nhad to the age and physical and mental condition of the person on whom it is inflicted;\nand no correction is justifiable in the case of a person who, by reason of tender years or\notherwise, is incapable of understanding the purpose for which it is inflicted."},{"c":"PC","n":"56","t":"Communication made in good faith","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"No communication made in good faith is an offence by reason of any harm to the\nperson to whom it is made, if it is made for the benefit of that person.\n\nIllustration. A a surgeon in good faith communicates to a patient his opinion that he\ncannot live. The patient dies in consequence of the shock. A has committed no offence..\nthough he knew it to be likely that the communication might cause the patient's death."},{"c":"PC","n":"57","t":"Act to which a person is compelled by threats","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Except culpable homicide and offences against the State punishable with death, no\nact is an offence which is done by a person who is compelled to do it by threats which\nat the time of doing it reasonably cause the apprehension that instant death to that\nperson will otherwise be the consequence:\n\nProvided that the person doing the act did hot, of his own accord or from apprehension\nof harm to himself short of instant death, place himself in the situation by which he\nbecame subject to that compulsion."},{"c":"PC","n":"58","t":"Act causing slight harm","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is an offence by reason that it causes or that it is intended to cause or that it\nis likely to cause an injury if that injury is so slight that no person of ordinary sense and\ntemper would complain of the injury."},{"c":"PC","n":"59","t":"Things done in private defence","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Nothing is all offence which is done in the lawful exercise of the right of private\ndefence."},{"c":"PC","n":"60","t":"Right of private defence","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"Every person has a right subject to the restrictions hereinafter contained, to defend\n\n(a) his own body and the body of any other person against an offence affecting the\nhuman body;\n\n(b) the property whether movable or immovable of himself or of any other person\nagainst any act, which is an offence falling under the definition of theft, robbery,\nmischief, or criminal trespass or which is an attempt to commit theft, robbery mischief or\ncriminal trespass."},{"c":"PC","n":"61","t":"Right of private defence against act of a person of unsound mind, etc","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"When an act, which would otherwise be a certain offence is not that offence by\nreason of the youth, the want of maturity of understanding, the unsoundness of mind or\nthe intoxication of the person doing that act or by reason of a misconception on the part\nof that person, every person has the same right of private defence against that act\nwhich he would have if the act were\n\nthat offence.\n\nIllustrations. (a) Z under the influence of madness attempts to kill A; Z is guilty of no\noffence. But A has the same right of private defence which he would have if Z were\nsane.\n\n(b) A enters by night a house which he is legally entitled to enter. Z, in good faith taking A\nfor a house-breaker, attacks A. Here Z, by attacking A under this misconception, commits\nno offence. But A has the same right of private defence against Z, which he would have\nif Z were not acting under that misconception."},{"c":"PC","n":"62","t":"General limit of right of private defence","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"The right of private defence in no case extends to the inflicting of more harm than it is\nnecessary to inflict for the purpose of defence."},{"c":"PC","n":"63","t":"No right of private defence when protection of public authorities available","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"There is no right of private defence in cases in which there is time to have recourse to\nthe protection of the public authorities."},{"c":"PC","n":"64","t":"Limitation of right of private defence against act of public officer","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"There is no right of private defence against an act which does not reasonably cause\nthe apprehension of death or of grievous hurt, if done or attempted to be done-\n\n(a) by a public officer doing an act justifiable in law and in good faith; or\n\n(b) by the direction of a public officer acting lawfully and in good faith.\n\nEXPLANATION. A person is not deprived of the right of private defence against an act\ndone or attempted to be done\n\n(a) by a public officer as such unless he knows or has reason to believe that the person\ndoing that act is a public officer, or\n\n(b) by the direction of a public officer, unless he knows or has reason to believe that the\nperson doing the act is acting by that direction or unless the person states the authority\nunder which he acts or, if he has authority in writing, unless he produces that authority if\ndemanded."},{"c":"PC","n":"65","t":"When right of private defence of the body extends to causing death","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"The right of private defence of the body extends, under the restrictions mentioned in\nsections 62 and 63 of this Penal Code, to the voluntary causing death only when the act\nto be repelled is of any of the following descriptions,\n\nnamely-\n\n(a) an attack which causes reasonable apprehension of death or grievous hurt; or\n\n(b) rape or an assault with the intention of gratifying unnatural lust; or .\n\n(c) abduction or kidnapping."},{"c":"PC","n":"66","t":"When right of private defence of property extends to causing death","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"The right of private defence of property extends, under the restrictions mentioned in\nsections 62 and 63 of this Penal Code, to the voluntary causing If death only when the\nact to be repelled is of any of the following descripions, namely-\n\n(a) robbery; or .\n\n(b) house-breaking by night, or\n\n(c) mischief by fire committed on any building, tent or vessel, which building\n\ntent or vessel is used as a human dwelling or as a place for the causing custody of\nproperty; or\n\n(d) theft, mischief, or house trespass in such circumstances as may reasonably cause\napprehension that, if such right of private defence is not exercised, death or grievous\nhurt will be the consequence."},{"c":"PC","n":"67","t":"Right of private defence against deadly assault when there is risk of harm to innocent","ch":"Chapter II – CRIMINAL RESPONSIBILITY","p":"","x":"If, in the exercise of the right of private defence against an assault which reasonably\ncauses the apprehension of death, the defender be so situated that he cannot\neffectually exercise that right without risk of harm to an innocent person, his right of\nprivate defence extends to the running of that risk.\n\nIllustration. A is attacked by a mob which attempts to kill him. He cannot effectually\nexercise his right of private defence without firing on the mob and he cannot fire without\nrisk of harming young children who are mingled with the mob. A commits no offence if\nby so firing he harms any of the children."},{"c":"PC","n":"68","t":"Punishments","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"(1) The punishments to which offenders are liable under the provisions Punishments.\n\nof this Penal Code are-\n\n(a) death;\n\n(b) forfeiture of property;\n\n(c) imprisonment;\n\n(d) detention in a reformatory;\n\n(e) fine;\n\n(f) caning.\n\n(2) Offenders who are of the Muslim faith may in addition to the punishments specified in\nsubsection (1) of this section be liable to the punishment of Haddi lashing as prescribed\nby Islamic law for offences contrary to sections 387, 388, 392, 393, 401, 402, 403 and 404\nof this Penal Code."},{"c":"PC","n":"69","t":"Limitation on punishments","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"No sentence of imprisonment shall be passed on a person who in the opinion of the\ncourt is under fourteen years of age."},{"c":"PC","n":"70","t":"Fractions of term of punishment","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"In calculating fractions of terms of punishment, imprisonment for life shall be reckoned\nas equivalent to imprisonment for twenty years."},{"c":"PC","n":"71","t":"Special provision for juvenile offenders","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"When an accused person who has completed his seventh but not completed his\neighteenth year of age is convicted by a court of an offence, the court may, instead of\npassing the sentence prescribed by law, deal with such accused person in accordance\nwith the provisions of the Children and Young Persons Act."},{"c":"PC","n":"72","t":"Amount of fine","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"Where no sum is expressed to which a fine may extend, the amount of fine to which\nthe offender is liable is unlimited but shall not exceed the jurisdiction of the court\nimposing it and shall not be excessive."},{"c":"PC","n":"73","t":"Sentence of imprisonment for non-payment of fine","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"Whenever an offender is sentenced to a fine whether with or without imprisonment\nunder this Penal Code, the court which sentences the offender may direct by the\nsentence that, in default of payment of the fine, the offender shall be committed to\nprison for a certain term, which term shall be in excess of any other term of imprisonment\nto which he may have been sentenced or to which he may be liable under a\ncommutation of a sentence."},{"c":"PC","n":"74","t":"Imprisonment in default of payment of fine","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"If an offence is punishable with fine or with imprisonment and fine the court may\ndirect that in default of payment the offender be imprisoned for a term not exceeding\nthe maximum following scale, that is to say-\n\nWhere the fine                                              - The period of imprisonment shall\n                                                            not exceed-\ndoes not exceed one naira                                   seven days;\n\nexceeds ten shillings and does not exceed two naira         fourteen days;\n\nexceeds two naira and does not exceed twenty                one month\nnaira\n                                                            two months;\nexceeds twenty naira and does not exceed sixty\nnaira                                                       four months;\n\nexceeds sixty naira and does not exceed one\nhundred naira\n                                                            six months\nexceeds one hundred naira and does exceed two\nhundred naira\n\nexceeds two hundred naira and does not exceed\nfour hundred naira\n                                                            one year\n\nexceeds four hundred naira\n\n                                                            two years."},{"c":"PC","n":"75","t":"Fine not discharged by death or service of sentence in default of payment","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"Where a fine or a part thereof remains unpaid, the offender or his estate, if he is\ndead, is not discharged from liability to pay the fine or the unpaid part thereof\nnotwithstanding that he has served a term of imprisonment in default of payment of the\nfine."},{"c":"PC","n":"76","t":"Limit of punishment when act within definition of more than one offence or when","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"When the same act falls within the definition of more than one offence or when an\noffence consists of a series of acts each of which or anyone or more of which constitutes\nthe same or some other offence, the offender shall not, unless it be otherwise expressly\nprovided, be punished with a more severe punishment than the court which tries him\ncould award for anyone of those offences.\n\nIllustrations. (a) A gives Z fifty strokes with a stick. Here A can be punished for one beating\nonly. although each blow may by itself constitute an offence.\n\n(b) But if while A is beating Z. Y interferes and A intentionally strikes Y. here. as the blow\ngiven to Y is no part of the act whereby A voluntarily causes hurt to Z. A is liable to one\npunishment for voluntarily causing hurt to Z and to another for the blow given to Y."},{"c":"PC","n":"77","t":"Caning","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"A sentence of caning not exceeding twelve strokes may be passed by a court\nwhether trying a case summarily or otherwise on any male offender in lieu of or in\naddition to any other punishment to which he might be sentenced for an offence not\npunishable with death."},{"c":"PC","n":"78","t":"Compensation","ch":"Chapter III – PUNISHMENTS AND COMPENSATION","p":"","x":"A person who is convicted of an offence under this Penal Code may be adjudged to\nmake compensation to a person injured by his offence and the compensation may be\neither in addition to or in substitution for any other punishment."},{"c":"PC","n":"79","t":"Acts done by several persons in furtherance of common intention","ch":"Chapter IV – JOINT ACTS","p":"","x":"When a criminal act is done by several persons in furtherance of the common\nintention of all, each of those persons is liable for that act in the same manner as if it\nwere done by him alone."},{"c":"PC","n":"80","t":"When such an act is criminal by reason of its being done with a criminal kno
