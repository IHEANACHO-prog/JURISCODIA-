r","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, by any means calculated to choke, suffocate or strangle, and with intent to commit or\nto facilitate the commission of a felony or misdemeanor, or to facilitate the flight of an offender after\nthe commission or attempted commission of a felony or misdemeanor, renders or attempts to render\nany person incapable of resistance, is guilty of a felony and is liable to imprisonment for life, with or\nwithout caning."},{"c":"CC","n":"331","t":"Stupefying in order to commit felony or misdemeanour","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with intent to commit or to facilitate the commission of a felony or misdemeanor or to\nfacilitate the flight of an offender after the commission or attempted commission of a felony or\nmisdemeanor, administers or attempts to administer any stupefying or overpowering drug or thing to\nany person, is guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"332","t":"Acts intended to cause grievous harm or prevent arrest","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with intent to maim, disfigure or disable, any person, or to do some grievous harm to\nany person, or to resist or prevent the lawful arrest or detention of any person-\n\n        (1) unlawfully wounds or does any grievous harm to any person by any means whatever; or\n\n        (2) unlawfully attempts in any manner to strike any person with any kind of projectile or with a\nspear, sword, knife, or other dangerous or offensive weapon; or\n\n        (3) unlawfully causes any explosive substance to explode; or\n\n        (4) sends or delivers any explosive substance or other dangerous or noxious thing to any person;\nor\n\n        (5) causes any such substance or thing to be taken or received by any person; or\n\n        (6) puts any corrosive fluid or any destructive or explosion substances in any place; or\n\n        (7) unlawfully casts or throws any such fluid or substances at or upon any person, or otherwise\napplies any such fluid or substances to the person of any person,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"333","t":"Preventing escape from wreck","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully-\n\n         (1) prevents or obstructs any person who is on board of, or is escaping from a vessel which is in\ndistress or wrecked, in his endeavours to save his life; or\n\n        (2) obstructs any person in his endeavours to save the life of any person so situated,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"334","t":"Intentionally endangering safety of persons travelling by railway","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with intent to injure or to endanger the safety of any person travelling by any railway,\nwhether a particular person or not-\n\n        (1) places anything on the railway; or\n         (2) deals with the railway, or with anything whatever upon or near the railway, in such a manner\nas to affect or endanger the free and safe use of the railway or the safety of any such person; or\n\n        (3) shoots or throws anything at, into, or upon, or causes anything to come into contact with,\nany person or thing on the railway; or\n\n         (4) shows any light or signal, or in any way deals with any existing light or signal, upon or near\nthe railway; or\n\n        (5) by any omission to do any act which it is his duty to do causes the safety of any such person\nto be endangered,\n\nis guilty of a felony and is liable to imprisonment for life, with or without caning."},{"c":"CC","n":"335","t":"Grievous harm","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully does grievous harm to another is guilty of a felony and is liable to\nimprisonment for seven years."},{"c":"CC","n":"336","t":"Attempting to injure by explosive substances","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully, and with intent to do any harm to another, puts any explosive substance in\nany place whatever, is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"337","t":"Maliciously administering poison with intent to harm","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully, and with intent to injure or annoy another, causes any poison or other\nnoxious thing to be administered to, or taken by, any person, and thereby endangers his life, or does\nhim some grievous harm, is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"338","t":"Wounding and similar acts","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n        (1) unlawfully wounds another; or\n\n        (2) unlawfully, and with intent to injure or annoy any person, causes any poison or other\nnoxious thing to be administered to, or taken by, any person,\n\nis guilty of a felony and is liable to imprisonment for three years."},{"c":"CC","n":"339","t":"Failure to supply necessaries","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, being charged with the duty of providing for another the necessaries of life, without\nlawful excuse fails to do so, whereby the life of that other is or is likely to be endangered, or his health is\nor is likely to be permanently injured, is guilty of a felony and liable to imprisonment for three years.\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"340","t":"Endangering life or health of apprentices or servants","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, being charged as a master or mistress with the duty of providing necessary food,\nclothing, or lodging, for a servant or apprentice under the age of sixteen years, unlawfully fails to\nperform that duty, or in any other manner does any harm or causes any harm to be done to such\nservant or apprentice, whereby, in either case, the life of such servant or apprentice is or is likely to be\nendangered, or his health is likely to be permanently injured, is guilty of a felony and is liable to\nimprisonment for three years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"341","t":"Abandoning or exposing children","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully abandons or exposes a child under the age of seven years, in such a manner\nthat any grievous harm is likely to be caused to it, is guilty of a felony and is liable to imprisonment for\nfive years."},{"c":"CC","n":"342","t":"Setting man-trap","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who sets or places any spring-gun, man-trap or other engine calculated to destroy human\nlife or to inflict grievous harm, or causes any such thing to be set or placed with the intent that it may kill\nor inflict grievous harm upon a trespasser or any person coming in contact with it, or sets or places any\nsuch thing in any such place and in any such manner that it is likely to cause any such result, is guilty of a\nfelony and is liable to imprisonment for three years.\n\nAny person who knowingly permits any such spring-gun, man-trap, or other engine, which has been set\nor placed by another person in any such place and in any such manner that it is likely to cause any such\nresult, to continue to be so set or placed in any place which is then in, or afterwards comes into, his\npossession or occupation, is deemed to have set and placed the gun, trap, or engine, with the intent\naforesaid.\n\nThis section of this Code, does not make it unlawful to set any gun or trap such as is usually set for the\npurpose of destroying vermin, or to set any spring-gun, man-trap, or engine, at night in a dwelling-house\nfor the protection of the dwelling-house.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"343","t":"Reckless and negligent acts","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) Any person who in a manner so rash or negligent as to endanger human life or to be likely to\n\ncause harm to any other person-\n\n        (a)      drives any vehicle or rides on any public way; or\n        (b)     navigates, or takes part in the navigation or working of, any vessel; or\n\n        (c)     does any act with fire or any combustible matter, or omits to take precautions against\n                any probable danger from any fire or any combustible matter in his possession; or\n\n        (d)     omits to take precautions against any probable danger from any animal in his\n                possession; or\n\n        (e)      gives medical or surgical treatment to any person whom he has undertaken to treat; or\n\n        (f)     dispenses, supplies, sells, administers, or gives away, any medicine, or poisonous or\n                dangerous matter; or\n\n        (g)     does any act with respect to, or omits to take proper precautions against any probable\n                danger from, any machinery of which he is solely or partly in charge; or\n\n        (h)     does any act with respect to, or omits to take proper precautions against any probable\n                danger from, any explosive in his possession,\n\nis guilty of a misdemeanor and is liable to imprisonment for one year.\n\n        (2) Any person who conveys or causes to be conveyed, for hire, any person by water, in a vessel\nin such a state or so loaded as to be unsafe, is guilty of a misdemeanor and is liable to imprisonment for\none year."},{"c":"CC","n":"344","t":"Negligent acts causing harm","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully does any act, or omits to do any act which it is his duty to do, not being an\nact or omission specified in section 343 of this Code, by which act or omission harm is caused to any\nperson, is guilty of a misdemeanor and is liable to imprisonment for six months."},{"c":"CC","n":"345","t":"Sending unseaworthy ship to sea","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) Any person who sends or attempts to send or is party to sending or attempting to send a\nNigerian ship to sea in such an unseaworthy state that the life of any person is likely to be thereby\nendangered, is guilty of a misdemeanor, unless he proves either that he used all reasonable means to\ninsure her being sent to sea in a seaworthy state, or that her going to sea in such an unseaworthy state\nwas in the circumstances reasonable and justifiable.\n\n                                         [L.N. 112 of 1964.]\n\n         (2) The master of a Nigerian ship who knowingly takes the same to sea in such an unseaworthy\nstate that the life of any person is likely to be thereby endangered, is guilty of a misdemeanor, unless he\nproves that her going to sea in such an unseaworthy state was in the circumstances reasonable and\njustifiable.\n       (3) Any person convicted of a misdemeanor under this section of this Code is liable to\nimprisonment for two years.\n\n       (4) A prosecution shall not be instituted in respect of an offence under this section of this Code\notherwise than by or with the consent of a law officer."},{"c":"CC","n":"346","t":"Endangering safety of person travelling by railway","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, by any unlawful act, or by any omission to do any act which it is his duty to do, causes\nthe safety of any person travelling by any railway to be endangered, is guilty of a misdemeanor and is\nliable to imprisonment for two years."},{"c":"CC","n":"347","t":"Endangering steamships by tampering with machinery","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, being a person having actual control over a steam vessel, or over any part of the\nmachinery of a steam vessel, does any act or makes any omission or is privy to any act or omission with\nrespect to the machinery of the vessel, whereby to his knowledge, the safety of any person on board the\nvessel is or is likely to be endangered, is guilty of a felony and is liable to imprisonment for three years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"348","t":"The like by engineers","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who is an engineer, or one of the engineers, in charge of the machinery of a steam vessel at\nany time when any act is done or omitted to be done by any other person with respect to the machinery\nof the vessel, whereby the safety of any person on board the vessel is, or is likely to be endangered, is\nguilty of a simple offence and is liable to a fine of two hundred naira.\n\nIt is a defence to a charge of the offence defined in this section of this Code to prove that the act or\nomission was done or made without the knowledge of the accused person, and without any neglect or\ndefault on his part."},{"c":"CC","n":"349","t":"Evading laws as to shipping dangerous goods","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who knowingly sends by any vessel, or carries in any vessel, any explosive substance, or any\nacid, or other thing of a dangerous or destructive nature, under false description of the substance or\nthing or with a false description of the sender thereof, is guilty of a felony and is liable to imprisonment\nfor three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"350","t":"Landing, etc., explosives","ch":"Chapter 28 – Offences endangering life or health","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) being charged by law with any duty respecting the shipping, unshipping, landing, putting off\nshore, conveyance, delivery or storage of any explosive substance, or of any acid, or other thing of a\ndangerous or destructive nature, from any vessel, fails to perform that duty; or\n        (2) being concerned in the shipping, unshipping, landing, putting off shore, conveyance, delivery\nor storage of any such substance, acid or thing, violates the provisions of the laws relating to such\nshipping, unshipping, landing, putting off shore, conveyance, delivery or storage,\n\nis guilty of a felony and is liable to imprisonment for three years.\n\nThis section of this Code does not apply to any explosive, acid or other thing, the property of the State,\nwhile it is under the control of an officer of the armed forces of Nigeria.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"351","t":"Punishment of assault","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully assaults another is guilty of a misdemeanor, and is liable, if no greater\npunishment is provided, to imprisonment for one year."},{"c":"CC","n":"352","t":"Assault with intent to commit unnatural offence","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who assaults another with intent to have carnal knowledge of him or her against the order\nof nature is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"353","t":"Indecent assault on males","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully and indecently assaults any male person is guilty of a felony and is liable to\nimprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"354","t":"Assaults on persons protecting wrecks","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully assaults and uses actual violence to a peace officer or any other person\nwhile acting in the execution of his duty in or concerning the preservation of a vessel in distress, or of\nany vessel or goods wrecked or stranded or lying under water, is guilty of a felony and is liable to\nimprisonment for seven years."},{"c":"CC","n":"355","t":"Assaults occasioning harm","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully assaults another and thereby does him harm, is guilty of a felony and is\nliable to imprisonment for three years."},{"c":"CC","n":"356","t":"Serious assaults","ch":"Chapter 29 – Assaults","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n        (1) assaults another with intent to commit a felony, or with intent to resist or prevent the lawful\narrest or detention of himself or of any other person; or\n\n        (2) assaults, resists, or wilfully obstructs a police officer while acting in the execution of his duty,\nor any person acting in aid of a police officer while so acting; or\n\n        (3) unlawfully assaults, resists, or obstructs, any person engaged in the lawful execution of any\nprocess against any property, or in making a lawful distress, while so engaged; or\n\n         (4) assaults, resists, or obstructs any person engaged in such lawful execution of process, or in\nmaking a lawful distress, with intent to rescue any property lawfully taken under such process or\ndistress; or\n\n       (5) assaults any person on account of any act done by him in the execution of any duty imposed\non him by law; or\n\n        (6) assaults any person in pursuance of any unlawful conspiracy respecting any manufacture,\ntrade, business, or occupation, or respecting any person or persons concerned or employed in any\nmanufacture, trade, business, or occupation, or the wages of any such person or person,\n\nis guilty of a felony and is liable to imprisonment for three years."},{"c":"CC","n":"357","t":"Definition of rape","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who has unlawful carnal knowledge of a woman or girl, without her consent, or with her\nconsent, if the consent is obtained by force or by means of threats or intimidation of any kind, or by fear\nof harm, or by means of false and fraudulent representation as to the nature of the act, or, in the case of\na married woman, by personating her husband, is guilty of an offence which is called rape."},{"c":"CC","n":"358","t":"Punishment of rape","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who commits the offence of rape is liable to imprisonment for life, with or without caning."},{"c":"CC","n":"359","t":"Attempt to commit rape","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who attempts to commit the offence of rape is guilty of a felony, and is liable to\nimprisonment for fourteen years, with or without caning."},{"c":"CC","n":"360","t":"Indecent assaults on females","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully and indecently assaults a woman or girl is guilty of a misdemeanor, and is\nliable to imprisonment for two years."},{"c":"CC","n":"361","t":"Abduction","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with intent to marry or carnally know a female of any age, or to cause her to be\nmarried, or carnally known by any other person, takes her away, or detains her against her will, is guilty\nof a felony, and is liable to imprisonment for seven years."},{"c":"CC","n":"362","t":"Abduction of girls under sixteen","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully takes an unmarried girl under the age of sixteen years out of the custody or\nprotection of her father or mother or other person having the lawful care or charge of her, and against\nthe will of such father or mother or other person, is guilty of a misdemeanor, and is liable to\nimprisonment for two years."},{"c":"CC","n":"363","t":"Ignorance of age of girl, or consent, no defence","ch":"Chapter 30 – Assaults on females: abduction","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"In the case of proceedings in respect of an offence under section 362 of this Code-\n\n        (a)      it is immaterial that the offender believed the girl to be of or above the age of sixteen\n                 years;\n\n        (b)       it is immaterial that the girl was taken with her own consent or at her own suggestion."},{"c":"CC","n":"364","t":"Kidnapping","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n        (1) unlawfully imprisons any person, and takes him out of Nigeria without his consent; or\n\n        (2) unlawfully imprisons any person within Nigeria in such a manner as to prevent him from\napplying to a court for his release or from discovering to any other person the place where he is\nimprisoned, or in such a manner as to prevent any person entitled to have access to him from\ndiscovering the place where he is imprisoned,\n\nis guilty of a felony and is liable to imprisonment for ten years."},{"c":"CC","n":"365","t":"Deprivation of liberty","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who unlawfully confines or detains another in any place against his will, or\notherwise unlawfully deprives another of his personal liberty, is guilty of a misdemeanor and is liable to\nimprisonment for two years."},{"c":"CC","n":"366","t":"Compelling action by intimidation","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Subject to the provisions of the Trade Unions Act, any person who, with intent to prevent or hinder any\nother person from doing any act which he is lawfully entitled to do, or with intent to compel him to do\nany act which he is lawfully entitled to abstain from doing, or to abstain from doing any act which he is\nlawfully entitled to do-\n\n                                                 [Cap. Tl4.]\n\n        (a)     threatens such other person with injury to his person, reputation, or property, or to the\n                person, reputation, or property of anyone in whom he is interested; or\n\n        (b)      persistently follows such other person about from place to place; or\n\n        (c)     hides any tools, clothes, or other property owned or used by such other person, or\n                deprives him of or hinders him in the use thereof; or\n\n        (d)     watches or besets the house or other place where such other person resides, or works,\n                or carries on business, or happens to be, or the approach to such house or place; or\n\n        (e)      follows such other person with two or more other persons in a disorderly manner in or\n                through any street or road; or\n\n        (f)     induces or attempts to induce that person to believe that he, or any person in whom he\n                is interested, will become an object of displeasure to the Government of Nigeria or to\n                any person employed in the public service of Nigeria,\n\nis guilty of an offence and is liable on conviction to imprisonment for one year. 367. Compelling action\nby assault"},{"c":"CC","n":"367","t":"Compelling action by assault","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with any of the intents in section 366 of this Code mentioned, assaults any other\nperson or anyone in whom he is interested, is guilty of a felony and liable to imprisonment for five years."},{"c":"CC","n":"368","t":"Concealment of matters affecting liberty","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n       (1) being required by law to keep any record touching any matter relating to any person in\nconfinement, refuses or neglects to keep such record, or makes in such record an entry which, in any\nmaterial particular, is, to his knowledge, false; or\n\n(2) being required by law to give any information to any person touching any person in confinement, or\nto show to any person, any person in confinement, or any place in which a person is confined-\n\n(a)     refuses or neglects to give such information or to show such person or place to any person to\n        whom he is so required to give the information or show the person or place; or\n(b)     gives to any person to whom he is so required to give it, information touching any such matter\n        which, in any material particular, is to his knowledge, false,\n\n        is guilty of a felony and is liable to imprisonment for three years."},{"c":"CC","n":"369","t":"Slave dealing","ch":"Chapter 31 – Offences against liberty: slave dealing","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who-\n\n        (1) deals or trades in, purchases, sells, transfers or takes any slave;\n\n       (2) deals or trades in, purchases, sells, transfers or takes any person in order or so that such\nperson should be held or treated as a slave;\n\n       (3) places or receives any person in servitude as a pledge or security for debt whether then due\nand owing, or to be incurred or contingent, whether under the name of a pawn or by whatever other\nname such person may be called or known;\n\n        (4) conveys or induces any person to come within the limits of Nigeria in order or so that such\nperson should be held, possessed, dealt or traded in, purchased, sold, or transferred as a slave, or be\nplaced in servitude as a pledge or security for debt;\n\n        (5) conveys or sends or induces any person to go out of the limits of Nigeria in order or so that\nsuch person should be possessed, dealt or traded in, purchased, sold, or transferred as a slave, or be\nplaced in servitude as a pledge or security for debt;\n\n        (6) whether or not a citizen of Nigeria holds or possesses in Nigeria any person as a slave;\n\n         (7) enters into any contract or agreement with or without consideration for doing any of the\nacts or accomplishing any of the purposes herein above enumerated, is guilty of slave dealing and is\nliable to imprisonment for fourteen years."},{"c":"CC","n":"370","t":"Bigamy","ch":"Chapter 32 – Offences relating to marriage and parental rights and duties","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, having a husband or wife living, marries in any case in which such marriage is void by\nreason of its taking place during the life of such husband or wife, is guilty of a felony and is liable to\nimprisonment for seven years.\n\nThis section of this Code does not extend to any person whose marriage with such husband or wife has\nbeen dissolved or declared void by a court of competent jurisdiction, nor to any person who contracts a\nmarriage during the life of a former husband or wife, if such husband or wife, at the time of the\nsubsequent marriage, shall have been absent from such person for the space of seven years, and shall\nnot have been heard of by such person as being alive within that time."},{"c":"CC","n":"371","t":"Child-stealing","ch":"Chapter 32 – Offences relating to marriage and parental rights and duties","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who, with intent to deprive any parent, guardian or other person who has the lawful care or\ncharge of a child under the age of twelve years, of the possession of such child, or with intent to steal\nany article upon or about the person of any such child-\n\n        (1) forcibly or fraudulently takes or entices away, or detains the child; or\n\n        (2) receives or harbours the child, knowing it to have been so taken or enticed away or detained,\n\nis guilty of a felony and is liable to imprisonment for fourteen years.\n\n        It is a defence to a charge of any of the offences defined in this section of this Code to prove t\n        hat the accused person claimed in good faith a right to the possession of the child, or, in the\n        case of an illegitimate child, is its mother or claimed to be its father."},{"c":"CC","n":"372","t":"Desertion of children","ch":"Chapter 32 – Offences relating to marriage and parental rights and duties","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who being the parent, guardian or other person having the lawful care or charge of a child\nunder the age of twelve years, and being able to maintain such child, wilfully and without lawful or\nreasonable cause deserts the child and leaves it without means of support, is guilty of a misdemeanor\nand is liable to imprisonment for one year."},{"c":"CC","n":"373","t":"Definition of defamatory matter","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Defamatory matter is matter likely to injure the reputation of any person by exposing him to hatred,\ncontempt, or ridicule, or likely to damage any person in his profession or trade by any injury to his\nreputation.\n\nSuch matter may be expressed in spoken words or in any audible sounds, or in words legibly marked on\nany substance whatever, or by any sign or object signifying such matter otherwise than by words, and\nmay be expressed either directly or by insinuation or irony.\n\nIt is immaterial whether at the time of the publication of the defamatory matter, the person concerning\nwhom such matter is published is living or dead:\n\n        Provided that no prosecution for the publication of defamatory matter concerning a dead\nperson shall be instituted without the consent of the Attorney-General of the Federation."},{"c":"CC","n":"374","t":"Definition of publication","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) For the purposes of this Code, the publication of defamatory matter is-\n\n(a)      in the case of spoken words or audible sounds, the speaking of such words or the making of\n        such sounds in the hearing of the person defamed or any other person;\n\n(b)      in other cases, the exhibiting of it in public, or causing it to be read or seen, or showing or\n        delivering it, or causing it to be shown or delivered, with intent that it may be read or seen by\n        the person defamed or by any other person.\n\n(2) Sounds where recorded shall, if defamatory, be deemed to be published if reproduced in any place\nto the hearing of persons other than the person causing it to be reproduced.\n\n(3) In this section-\n\n\"recorded\" means sounds collected or stored by means of tape, disc, cylinder or other means\nwhatsoever, where the sounds are capable of being reproduced or are intended for reproduction by\nelectrical or mechanical means at any time or from time to time thereafter, and includes the matrix, and\ncognate expressions shall have the like meaning;\n\n\"sound\" includes speech and mere noise."},{"c":"CC","n":"375","t":"Publication of defamatory matter","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Subject to the provisions of this Chapter, any person who publishes any defamatory matter, is guilty of a\nmisdemeanor and is liable to imprisonment for one year; and any person who publishes any defamatory\nmatter knowing it to be false, is liable to imprisonment for two years."},{"c":"CC","n":"376","t":"Publishing defamatory matter with intent to extort","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"Any person who publishes, or threatens to publish, or offers to abstain from publishing, or offers to\nprevent the publication of defamatory matter, with intent to extort money or other property, or with\nintent to induce any person to give, confer, procure, or attempt to procure, to, upon, or for, any person,\nany property or benefit of any kind, is guilty of a felony and is liable to imprisonment for seven years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"377","t":"Publication of truth for public benefit","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The publication of defamatory matter is not an offence if the publication is, at the time it is made, for\nthe public benefit and if the defamatory matter is true."},{"c":"CC","n":"378","t":"Cases in which publication is absolutely privileged","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The publication of defamatory matter is absolutely privileged, and no person is criminally liable in\nrespect thereof, in the following cases-\n                         [L.N. 257 of 1959. L.N. 112 of 1964. 1967 No. 27.]\n\n(1)     if the matter is published by the President, Minister or a Governor or by order of the President,\n        Minister or a Governor in any official document, Gazette or proceedings; or\n\n(2)     if the publication is made in a petition to the President, Minister, or a Governor; or\n\n(3)     if the publication takes place in proceedings held before or under the authority of any court, or\n        in any inquiry held under the authority of any Act, law, statute, or order, or under the authority\n        of the President, Minister, or a Governor; or\n\n(4)     if the publication takes place in an official report made by a person appointed to hold an inquiry\n        under the authority of any Act, law, statute, or Order in Council, or of the President, Minister, or\n        a Governor; or\n\n(5)     if the matter is published concerning a person subject to military discipline for the time being,\n        and relates to his conduct as a person subject to such discipline, and is published by some\n        person having authority over him in respect of such conduct, and to some person having\n        authority over him in respect of such conduct."},{"c":"CC","n":"379","t":"Cases in which publication is conditionally privileged","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The publication of defamatory matter is conditionally privileged, and no person is criminally liable in\nrespect thereof, in the following cases-\n\n        (1) if the defamatory matter consists of an extract from, or an abstract of, a petition to, or a\nGazette or document published by or under the authority of, the President or a Governor of a State, or a\nMinister, and the publication is made without ill-will to the person defamed; or\n\n        (2) if the defamatory matter constitutes, in whole or in part, a fair report, for the information of\nthe public, of any public proceeding of any court, whether preliminary or final; or of any public\nproceeding of any body, constituted, or authorised to hold such proceeding by any Act, law, statute or\norder; or of any public meeting so far as the public is concerned in the matter published; if in every such\ncase the publication is made without ill-will to the person defamed; or\n\n       (3) if the publication is for the information of the public at the request of any government\ndepartment or peace officer, or if the defamatory matter is any notice or report issued by such\ndepartment or officer, for the information of the public, and if in every such case the publication is made\nwithout ill-will to the person defamed; or\n\n        (4) if the defamatory matter consists of fair comment either on any matter the publication of\nwhich, or on any report which, is hereinbefore in the preceding or this section referred to; or\n         (5) if the defamatory matter consists of fair comment upon the public conduct of any person in\npublic affairs, or upon the public conduct of any person employed in the public service in the discharge\nof his public duties, or upon the character of any of such persons so far as it appears by such conduct; or\n\n        (6) if the defamatory matter consists of fair comment on any published book or other literary\nproduction, or any composition or work of art, or performance publicly exhibited, or any other\ncommunication made to the public on any subject; or of the character of the author of such book,\nproduction, composition, work of art, or the person exhibiting such performance, so far as their\ncharacters may appear therefrom respectively; or\n\n        (7) if the publication is in good faith for the purpose of seeking remedy or redress for any private\nor public wrong or grievance from a person who has, or is reasonably believed by the person publishing\nto have, the right to remedy or redress such wrong or grievance; or\n\n        (8) if the publication is made in good faith by a person having any lawful authority over another,\nand is made by him in the course of a censure passed by him on the conduct of that other, in matters to\nwhich such lawful authority relates; or\n\n        (9) if the publication is made on the invitation or challenge of the person defamed; or\n\n        (10) if the publication is made in order to answer or refute some other defamatory matter\npublished by the person defamed, concerning the person making the publication or some other person;\nor\n\n          (11) if the defamatory matter constitutes an answer to inquiries made of the person publishing\nit, relating to some subject as to which the person by whom or on whose behalf the inquiry is made, has,\nor on reasonable grounds is believed by the person publishing to have, an interest in knowing the truth,\nand if the publication is made in good faith for the purpose of giving information in respect of that\nmatter to that person; or\n\n         (12) if the defamatory matter constitutes information given to the person to whom the\ndefamatory matter is published, with respect to some subject as to which he has, or is on reasonable\ngrounds believed to have, such an interest in knowing the truth, as to make the conduct of the person\ngiving the information reasonable in the circumstances:\n\n          Provided that as regards paragraphs (7), (8), (9), (10) and (11) of this section, the person making\nthe publication honestly believes the matter published to be true, the matter published is relevant to\nthe matters the existence of which may excuse the publication of defamatory matter, and the manner\nand extent of the publication do not exceed what is reasonably sufficient for the occasion; and as\nregards paragraphs (12) that the defamatory matter is relevant to the subject therein mentioned, and\nthat it is either true, or is made without ill-will to the person defamed and in the honest belief, on\nreasonable grounds, that it is true."},{"c":"CC","n":"380","t":"Publication in a periodical","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"(1) In this section and section 381 of this Code, the term \"periodical\" includes any newspaper,\nreview, magazine, or other writing or print, published periodically.\n\n        (2) The criminal responsibility of the proprietor, editor, or publisher, of any periodical for the\npublication of any defamatory matter contained therein, may be rebutted by proof that such publication\ntook place without his knowledge and without negligence on his part."},{"c":"CC","n":"381","t":"Protection of innocent sellers of books and newspapers","ch":"Chapter 33 – Defamation","p":"Part 5 – Offence against the person and relating to Marriage and parental Rights and Duties,","x":"The sale by any person of any book, pamphlet, or other printed or written matter, or of any number or\npart of any periodical, is not a publication thereof for the purposes of this Chapter, unless such person\nknows that such book, pamphlet, printed or written matter, or number or part, contains defamatory\nmatter; or, in the case of any part or number of any periodical, that such periodical habitually contains\ndefamatory matter."},{"c":"CC","n":"382","t":"Things capable of being stolen","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"Every inanimate thing whatever which is the property of any person, and which is movable, is capable of\nbeing stolen.\n\nEvery inanimate thing which is the property of any person, and which is capable of being made movable,\nis capable of being stolen as soon as it becomes movable, although it is made movable in order to steal\nit.\n\nEvery tame animal, whether tame by nature or wild by nature and tamed, which is the property of any\nperson, is capable of being stolen: but tame pigeons are not capable of being stolen except while they\nare in a pigeon-house or on their owner's land.\n\nA thing in action is capable of being stolen.\n\nAnimals wild by nature, of a kind which is not ordinarily found in a condition of natural liberty in Nigeria,\nwhich are the property of any person, and which are usually kept in a state of confinement, are capable\nof being stolen, whether they are actually in confinement or have escaped from confinement.\n                                 [1966 No. 84.]\n\nAnimals wild by nature, of a kind which is ordinarily found in a condition of natural liberty in Nigeria,\nwhich are the property of any person, are capable of being stolen while they are in confinement and\nwhile they are being actually pursued after escaping from confinement, but not at any other time.\n\nAn animal wild by nature is deemed to be in a state of confinement so long as it is in a den, cage, sty,\ntank, or other small enclosure, or is otherwise so placed that it cannot escape and that its owner can\ntake possession of it at pleasure.\n\nAn ostrich on an enclosed ostrich farm is capable of being stolen. The term \"animal\" includes any living\ncreature other than mankind.\n\nWild animals in the enjoyment of their natural liberty are not capable of being stolen, but their dead\nbodies are capable of being stolen.\n\nEverything produced by or forming part of the body of an animal capable of being stolen is capable of\nbeing stolen."},{"c":"CC","n":"383","t":"Definition of stealing","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"(1) A person who fraudulently takes anything capable of being stolen, or fraudulently converts\nto his own use or to the use of any other person anything capable of being stolen, is said to steal that\nthing.\n\n        (2) A person who takes or converts anything capable of being stolen IS deemed to do so\nfraudulently If he does so with any of the following intents-\n\n        (a)     an intent permanently to deprive the owner of the thing of it;\n\n        (b)     an intent permanently to deprive any person who has any special property in the thing\n                of such property;\n\n        (c)      an intent to use the thing as a pledge or security;\n\n        (d)      an intent to part with it on a condition as to its return which the person taking or\n                converting it may be unable to perform;\n\n        (e)     an intent to deal with it in such a manner that it cannot be returned in the condition in\n                which it was at the time of the taking or conversion;\n\n        (f)     in the case of money, an intent to use it at the will of the person who takes or converts\n                it, although he may intend afterwards to repay the amount to the owner.\n\nThe term \"special property\" includes any charge or lien upon the thing in question, and any right arising\nfrom or dependent upon holding possession of the thing in question, whether by the person entitled to\nsuch right or by some other person for his benefit.\n       (3) The taking or conversion may be fraudulent, although it is effected without secrecy or\nattempts at concealment.\n\n        (4) In the case of conversion, it is immaterial whether the thing converted is taken for the\npurpose of conversion, or whether it is at the time of the conversion in the possession of the person\nwho converts it. It is also immaterial that the person who converts the property is the holder of a power\nof attorney for the disposition of it, or is otherwise authorised to dispose of the property.\n\n         (5) When a thing converted has been lost by the owner and found by the person who converts\nit, the conversion is not deemed to be fraudulent if at the time of the conversion the person taking or\nconverting the thing does not know who is the owner, and believes on reasonable grounds that the\nowner cannot be discovered.\n\n        (6) A person shall not be deemed to take a thing unless he moved the thing or causes it to move."},{"c":"CC","n":"384","t":"Special cases","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"(1) When a factor or agent pledges or gives a lien on any goods or documents of title to goods\nentrusted to him for the purpose of sale or otherwise for any sum of money not greater than the\namount due to him from his principal at the time of pledging or giving the lien, together with the\namount of any bill of exchange or promissory note accepted or made by him for or on account of his\nprincipal, such dealing with the goods or document of title is not deemed to be stealing.\n\n         (2) When a servant, contrary to his master's orders, takes from his possession any food in order\nthat it may be given to an animal belonging to or in the possession of his master, such taking is not\ndeemed to be stealing."},{"c":"CC","n":"385","t":"Funds, etc., held under direction","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"When a person receives, either alone or jointly with another person, any money or valuable security or a\npower of attorney for the sale, mortgage, pledge, or other disposition, of any property, whether capable\nof being stolen or not, with a direction in either case that such money or any part thereof, or any other\nmoney received in exchange for it, or any part thereof, or the proceeds or any part of the proceeds of\nsuch security, or of such security, or of such mortgage, pledge, or other disposition, shall be applied to\nany purpose or paid to any person specified in the direction, such money and proceeds are deemed to\nbe the property of the person from whom the money, security or power of attorney, was received until\nthe direction has been complied with:\n\nProvided that if the person receiving the money, security, or power of attorney, and the person from\nwhom he receives it, ordinarily deal with each other on such terms that in the absence of any special\ndirection all money paid to the former on account of the latter would be properly treated as an item in a\ndebtor and creditor account between them, the former cannot be charged with stealing the money or\nany proceeds unless the direction is in writing."},{"c":"CC","n":"386","t":"Funds, etc., received by agents for sale","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"When a person receives, either alone or jointly with another person, any property from another on\nterms authorising or requiring him to sell it or otherwise dispose of it, and requiring him to pay or\naccount for the proceeds of the property, or any part of such proceeds, or to deliver anything received\nin exchange of the property, to the person from whom it is received, or some other person, then the\nproceeds of the property, and anything so received in exchange for it, are deemed to be the property of\nthe person from whom the property was so received, until they have been disposed of in accordance\nwith the terms on which the property was received, unless it is a part of those terms that the proceeds,\nif any, shall form an item in a debtor and creditor account between him and the person to whom he is to\npay them or account for them, and that the relation of debtor and creditor only shall exist between\nthem in respect thereof."},{"c":"CC","n":"387","t":"Money received for another","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"When a person receives, either alone or jointly with another person, any money on behalf of another,\nthe money is deemed to be the property of the person on whose behalf it is received, unless the money\nis received on the terms that it shall form an item in a debtor and creditor account, and that the relation\nof debtor and creditor only shall exist between the parties in respect of it."},{"c":"CC","n":"388","t":"Stealing by persons having an interest in the thing stolen","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"When any person takes or converts anything capable of being stolen, in such circumstances as would\notherwise amount to stealing, it is immaterial that he himself has a special property or interest therein\nor that he himself is the owner of the thing taken or converted subject to some special property or\ninterest of some other person therein; or that he is lessee of the thing, or that he himself is one of two\nor more joint owners of the thing; or that he is a director or officer of a corporation or company or\nsociety who are the owners of it."},{"c":"CC","n":"389","t":"Husband and wife","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"A person who, while a man and his wife are living together, procures either of them to deal with\nanything which is, to his knowledge, the property of the other in a manner which would be stealing, if\nthey were not married, is deemed to have stolen the thing, and may be charged with stealing it."},{"c":"CC","n":"390","t":"Punishment of stealing","ch":"Chapter 34 – Stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who steals anything capable of being stolen, is guilty of a felony and is liable, if no other\npunishment is provided, to imprisonment for three years.\n\n                                        Punishment in special cases\n\nStealing wills\n\n       (1) If the thing stolen is a testamentary instrument, whether the testator is living or dead, the\noffender is liable to imprisonment for life.\n\nStealing postal matter, etc.\n       (2) If the thing stolen is a postal matter or any chattel, money, or valuable security, contained in\nany postal matter, the offender is liable to imprisonment for life.\n\nStealing cattle\n\n          (3) If the thing stolen is any of the things following, that it to say: a horse, mare, gelding, ass,\nmule, camel, bull, cow, ox, ram, ewe, wether, goat or pig, or the young of any such animal, the offender\nis liable on conviction to pay a fine of two hundred naira or to imprisonment for two years.\n\nStealing from the person; stealing goods in transit, etc.\n\n        (4) If the offence is committed in any of the following circumstances-\n\n        (a)       if the thing is stolen from the person of another;\n\n        (b)        if the thing is stolen in a dwelling-house, and its value exceeds ten naira, or the offender\n                  at or immediately before or after the time of stealing uses or threatens to use violence\n                  to any person in the dwelling-house;\n\n        (c)       if the thing is stolen from any kind of vessel or vehicle or place of deposit used for the\n\n                  conveyance or custody of goods in transit from one place to another;\n\n        (d)       if the thing stolen is attached to or forms part of a railway;\n\n        (e)       if the thing is stolen from a vessel which is in distress or wrecked or stranded;\n\n        (f)       if the thing is stolen from a public office in which it is deposited or kept;\n\n        (g)       if the offender, in order to commit the offence, opens any locked room, box, or other\n                  receptacle, by means of a key or other instrument,\n\nthe offender is liable to imprisonment for seven years.\n\nStealing by persons in public service\n\n         (5) If the offender is a person employed in the public service and the thing stolen is the property\nof the State, or came into the possession of the offender by virtue of his employment, he is liable to\nimprisonment for seven years.\n\nStealing by clerks and servants\n\n       (6) If the offender is a clerk or servant and the thing stolen is the property of his employer or\ncame into the possession of the offender on account of his employer, he is liable to imprisonment for\nseven years.\n\nStealing by directors or officers of companies\n       (7) If the offender is a director or officer of a corporation or company, and the thing stolen is the\nproperty of the corporation or company, he is liable to imprisonment for seven years.\n\nStealing by agents, etc.\n\n        (8) If the thing stolen is any of the following things-\n\n        (a)     property which has been received by the offender with a power of attorney for the\n                disposition thereof;\n\n        (b)     property which has been entrusted to the offender either alone or jointly with any other\n                person for him to retain in safe custody or to apply, pay or deliver for any purpose or to\n                any person the same or any part thereof or any proceeds thereof;\n\n        (c)     property which has been received by the offender either alone or jointly with any other\n                person for or on account of any other person;\n\n        (d)     the whole or part of the proceeds of any valuable security which has been received by\n                the offender with a direction that the proceeds thereof should be applied to any\n                purpose or paid to any person specified in the direction;\n\n        (e)     the whole or part of the proceeds arising from any disposition of any property which\n                have been received by the offender by virtue of a power of attorney for such\n                disposition, such\n\npower of attorney having been received by the offender with a direction that such proceeds should be\napplied to any purpose or paid to any person specified in the direction,\n\nthe offender is liable to imprisonment for seven years.\n\nStealing property of value of N1,000\n\n       (9) If the thing stolen is of the value of one thousand naira or upwards, the offender is liable to\nimprisonment for seven years.\n\nStealing by tenants or lodgers\n\n        (10) If the thing stolen is a fixture or chattel let to the offender to be used by him with a house\nor lodging, and its value exceeds ten naira, he is liable to imprisonment for seven years.\n\n        (10A) If the thing stolen is a motor vehicle or motor cycle the offender shall upon conviction be\nsentenced to imprisonment for not less than five years but not more than seven years without the\noption of a fine.\n\nStealing after previous conviction\n       (11) If the offender, before committing the offence, has been convicted of any of the felonies or\nmisdemeanors defined in this division of this Part of this Code, he is liable to imprisonment for seven\nyears."},{"c":"CC","n":"391","t":"Concealing registers","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud, conceals or takes from its place of deposit any register which is\nauthorised or required by law to be kept for authenticating or recording the title to any property, or for\nrecording births, baptisms, marriages, deaths, or burials, or a copy of any part of any such register which\nis required by law to be sent to any public officer, is guilty of a felony and is liable to imprisonment for\nfourteen years."},{"c":"CC","n":"392","t":"Concealing wills","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud, conceals any testamentary instrument, whether the testator is\nliving or dead, is guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"393","t":"Concealing deeds","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud, conceals the whole or part of any document which is evidence\nof title to any land or estate in land, is guilty of a felony and is liable to imprisonment for three years."},{"c":"CC","n":"394","t":"Killing animals with intent to steal","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who kills any animal capable of being stolen with intent to steal the skin or carcass, or any\npart of the skin or carcass, is guilty of an offence and is liable to the same punishment as if he had stolen\nthe animal."},{"c":"CC","n":"395","t":"Severing with intent to steal","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who makes anything movable with the intent to steal it, is guilty of an offence and is liable to\nthe same punishment as if he has stolen the thing after it had become movable."},{"c":"CC","n":"396","t":"Fraudulently dealing with minerals in mines","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who takes, conceals, or otherwise disposes of, any ore of any metal or mineral in or\n\nabout a mine, with intent to defraud any person, is guilty of a felony and is liable to imprisonment for\nthree years."},{"c":"CC","n":"397","t":"Bringing stolen goods into Nigeria","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, having at any place not in Nigeria obtained any property by any act which if it had been\ndone in Nigeria would have constituted the offence of stealing, and which is an offence under the laws\nin force in the place where it was done, brings such property into the country, or has it in his possession\nin Nigeria, is guilty of an offence, and is liable to the same punishment as if he had stolen it in Nigeria;\nbut so that the punishment does not exceed that which would be incurred for the same act under the\nlaws in force in the place where the act by which he obtained the property was done."},{"c":"CC","n":"398","t":"Fraudulent disposition of mortgaged goods","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, being the mortgagor of mortgaged goods, removes or disposes of the goods without\nthe consent of the mortgagee and with intent to defraud, is guilty of a felony and is liable to\nimprisonment for three years.\n\n        The offender cannot be arrested without warrant."},{"c":"CC","n":"399","t":"Definition of mortgaged goods; consent of mortgagee","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"In section 398 of this Code, the term \"mortgaged goods\" includes any goods and chattels of any kind,\nand any live animals, and any progeny of any animals and any crops or produce of the earth, whether\ngrowing or severed, which are subject for the time being to the provisions of the written instrument by\nwhich a valid charge or lien is created upon them by way of security of any debt or obligation.\n\nThe consent of the mortgagee may be either express or implied from the nature of the property\nmortgaged."},{"c":"CC","n":"400","t":"Fraudulent appropriation of power","ch":"Chapter 35 – Offences analogous to stealing","p":"Part 6 – Offences relating to property and contracts","x":"Any person who fraudulently abstracts or diverts to his own use or to the use of any other person any\nmechanical, illuminating, or electrical power derived from any machine apparatus, or substance, the\nproperty of another person, is guilty of a felony and is liable to imprisonment for three years.\n\n                The offender cannot be arrested without warrant."},{"c":"CC","n":"401","t":"Definition of robbery","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who steals anything and, at or immediately before or immediately after the time of stealing\nit, uses or threatens to use actual violence to any person or property in order to obtain or retain the\nthing stolen or to prevent or overcome resistance to its being stolen or retained, is said to be guilty of\nrobbery."},{"c":"CC","n":"402","t":"Punishment of robbery","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who commits the offence of robbery shall upon conviction be sentenced to\nimprisonment for not less than 21 years.\n(2) If-\n\n          (a)   any offender mentioned in subsection (1) of this section is armed with any firearms or\n                any offensive weapon or any obnoxious or chemical materials or is in company with any\n                person so armed; or\n\n          (b)   at or immediately before or immediately after the time of robbery the said offender\n                wounds any person,\n\nthe offender shall upon conviction be sentenced to death."},{"c":"CC","n":"403","t":"Punishment for attempted robbery, etc","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who with intent to steal anything, assaults any other person and at or\nimmediately after the time of assault, uses or threatens to use actual violence to any other person or\nany property in order to obtain the thing intended to be stolen shall upon conviction be sentenced to\nimprisonment for not less than fourteen years but not more than twenty years.\n\n                                [1970 No. 47.]\n\n(2) If-\n\n          (a)   any offender mentioned in subsection (1) of this section, is armed with any firearms or\n                any offensive weapon or is in company with any other person so armed; or\n\n          (b)   at or immediately before or immediately after the time of the assault the offender\n                wounds or uses any other personal violence to any person,\n\nthe offender shall upon conviction be sentenced to imprisonment for life with or without whipping.\n\n        (3)      Any person found in any public place in possession of any firearms, whether real or\nimitation, and in circumstances reasonably indicating that the possession of the firearms is with intent\nto the immediate or eventual commission by that person or any other person of any offence under\nsection 402 of this Code shall upon conviction be sentenced to imprisonment for not less than fourteen\nyears or more than twenty years."},{"c":"CC","n":"403A","t":"Conspiracy to commit robbery","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who conspires with any person to commit an offence under section 402 of this Code,\nwhether or not he is present when the offence is committed or attempted to be committed, shall be\ndeemed to be guilty of the offence as a principal offender and shall be punished accordingly."},{"c":"CC","n":"403B","t":"Definition of firearms and offensive weapons","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"For the purposes of sections 402, 403 and 403A of this Code-\n         \"firearms\" includes any canon, gun, flint-lock gun, revolver, pistol, explosive or ammunition or\nother firearm, whether whole or in detached pieces;\n\n         \"offensive weapon\" means any article, apart from a firearm, made or adapted for use for\ncausing injury to the person or intended by the person having it for such use by him and it includes an\nair gun, air pistol, bow and arrow, spear, cutlass, matchet, dagger, cudgel, or any piece of wood, metal,\nglass or stone capable of being used as an offensive weapon."},{"c":"CC","n":"404","t":"Public servants demanding property, etc","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"(1) Any person who, being employed in the public service of Nigeria, or in that of any other\n\ngovernment, corruptly and under colour of his employment-\n\n        (a)      demands or takes property from any person; or\n\n        (b)      compels any person to sell any property at other than its fair market value; or\n\n        (c)      obtains lodging from and against the will of any person without payment or for\n                 inadequate payment; or\n\n        (d)      compels, whether partially or wholly for his own profit, any person to work without\n                 payment or for inadequate payment,\n\nis guilty of a felony and is liable to imprisonment for five years.\n\n        (2) Any person who, falsely representing himself by words, conduct, or otherwise, to be a\nperson employed in the public service of Nigeria, or of any other government, or to be an agent of or act\nunder the authority of, the government, unlawfully and in such assumed character-\n\n        (a)       does any of the acts or things specified in paragraphs (a), (b), (c), and (d) of subsection\n                 (1) of this section; or\n\n        (b)       compels or orders any person to hand any property over to any other person, whether\n                 such property does or does not rightly belong, or is or is not rightly due, to the last-\n                 named person,\n\nis guilty of a felony and is liable to imprisonment for five years.\n\n        (3) Any person attempting, or inciting, soliciting, counselling, procuring, aiding, or abetting any\nperson to commit any of the offences enumerated in subsections (1) and (2) of this section, is guilty of a\nfelony and is liable to imprisonment for five years."},{"c":"CC","n":"405","t":"Assault with intent to steal","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who assaults any person with intent to steal anything, is guilty of a felony and is liable to\nimprisonment for three years."},{"c":"CC","n":"406","t":"Demanding property with menaces with intent to steal","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to steal anything, demands it from any person with threats of any injury or\ndetriment of any kind to be caused to him, either by the offender or by any other person, if the demand\nis not complied with, is guilty of a felony and is liable to imprisonment for three years."},{"c":"CC","n":"407","t":"Demanding property by written threats","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to extort or gain anything from any person, and knowing the contents of\nthe writing, causes any person to receive any writing demanding anything from any person without\nreasonable or probable cause, and containing threats of any injury or detriment of any kind to be caused\nto any person, either by the offender or any other person, if the demand is not complied with, is guilty\nof a felony, and is liable to imprisonment for fourteen years."},{"c":"CC","n":"408","t":"Attempts at extortion by threats","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to extort or gain anything from any person-\n\n        (1) accuses or threatens to accuse any person of committing any felony or misdemeanor, or of\noffering or making any solicitation or threat to any person as an inducement to commit or permit the\ncommission of any felony or misdemeanor; or\n\n      (2) threatens that any person shall be accused by any other person of any felony or\nmisdemeanor or of any such act; or\n\n        (3) knowing the contents of the writing, causes any person to receive any writing containing any\nsuch accusation or threat as aforesaid,\n\nis guilty of a felony and if the accusation or threat of accusation is of-\n\n        (a)      an offence for which the punishment of death or imprisonment for life may be inflicted;\n                 or\n\n        (b)      any of the offences defined in Chapter 21 of this Code, or an attempt to commit any of\n                 such offences; or\n\n        (c)      an assault with intent to have carnal knowledge of any person against the order of\n                 nature, or an unlawful and indecent assault upon a male person; or\n\n        (d)      an attempt to commit the offence of rape, or an assault with intent to commit the\n\n                 offence of rape, or an unlawful and indecent assault upon a woman or girl; or\n\n        (e)    a solicitation or threat offered or made to any person as an inducement to commit or\n               permit the commission of any of the offences aforesaid, the offender is liable to\nimprisonment for fourteen years.\nIn any other case, the offender is liable to imprisonment for three years.\n\nIt is immaterial whether the person accused or threatened to be accused has or has not committed the\noffence or act of which he is accused or threatened to be accused."},{"c":"CC","n":"409","t":"Procuring execution of deeds, etc., by threats","ch":"Chapter 36 – Stealing with violence: extortion by threats","p":"Part 6 – Offences relating to property and contracts","x":"Any person who, with intent to defraud, and by means of any unlawful violence to, or restraint of, the\nperson of another, or by means of any threat of violence or restraint to be used to the person of\nanother, or by means of accusing or threatening to accuse any person of committing any felony or\nmisdemeanor, or by offering or making any solicitation or threat to any person as an inducement to\ncommit or permit the commission of any offence, compels or induces any person-\n\n        (a)        to execute, make, accept, endorse, alter, or destroy, the whole or any part of any\n                   valuable security; or\n\n        (b)      to write, impress, or affix, any name or seal upon or to any paper or parchment, in\n                order that it may be afterwards made or converted into or used or dealt with as a\n                valuable security,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"410","t":"Definitions","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"A person who breaks any part, whether external or internal, of a building, or opens by unlocking, pulling,\npushing, lifting, or any other means whatever, any door, window, shutter, cellar flap, or other thing,\nintended to close or cover an opening in a building, or an opening giving passage from one part of a\nbuilding to another, is said to break the building.\n\nA person is said to enter a building as soon as any part of his body or any part of any instrument used by\nhim is within the building.\n\nA person who obtains entrance into a building by means of any threat or artifice used for that purpose,\nor by collusion with any person in the building, or who enters any chimney or other aperture of the\nbuilding permanently left open for any necessary purpose, but not intended to be ordinarily used as a\nmeans of entrance, is deemed to have broken and entered the building."},{"c":"CC","n":"411","t":"Housebreaking: burglary","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n        (1) breaks and enters the dwelling-house of another with intent to commit a felony therein; or\n        (2) having entered the dwelling-house of another with intent to commit a felony therein, or\nhaving committed a felony in the dwelling-house of another, breaks out of the dwelling-house,\n\nis guilty of a felony and is liable to imprisonment for fourteen years.\n\nIf the offence is committed in the night, the offender is liable to imprisonment for life."},{"c":"CC","n":"412","t":"Entering dwelling-house with intent to commit felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who enters or is in the dwelling-house of another with intent to commit a felony therein, is\nguilty of a felony and is liable to imprisonment for seven years.\n\nIf the offence is committed in the night, the offender is liable to imprisonment for fourteen years."},{"c":"CC","n":"413","t":"Breaking into building and committing felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who-\n\n        (1) breaks and enters a schoolhouse, shop, warehouse, store, office, or counting-house, or a\nbuilding which is adjacent to a dwelling-house and occupied with it but is not part of it, and commits a\nfelony therein; or\n\n        (2) having committed a felony in a schoolhouse, shop, warehouse, store, office, or counting-\nhouse, or in any such other building as last mentioned, breaks out of the building,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"414","t":"Breaking into building with intent to commit felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who breaks and enters a schoolhouse, shop, warehouse, store, office, or counting-house, or\na building which is adjacent to a dwelling-house and occupied with it but is not part of it, with intent to\ncommit a felony therein, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"415","t":"Breaking into place of worship and committing felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who breaks and enters a building ordinarily used for religious worship and commits a felony\ntherein, or having committed a felony in any such building breaks out of it, is guilty of a felony and is\nliable to imprisonment for fourteen years."},{"c":"CC","n":"416","t":"Breaking into place of worship with intent to commit felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who breaks and enters a building ordinarily used for religious worship, with intent to commit\na felony therein, is guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"417","t":"Persons found armed, etc., with intent to commit felony","ch":"Chapter 37 – Burglary: housebreaking: and like offences","p":"Part 6 – Offences relating to property and contracts","x":"Any person who is found in any of the following circumstances-\n        (a)       being armed with any dangerous or offensive weapon or instrument, and being so\n                  armed with intent to break or enter a dwelling-house, and to commit a felony therein;\n\n        (b)       being armed as aforesaid by night, and being so armed with intent to break or enter\n                  any building whatever, and to commit a felony therein;\n\n        (c)       having in his possession by night without lawful excuse, the proof of which lies on him,\n                  any instrument of housebreaking;\n\n        (d)       having in his possession by day, any such instrument with intent to commit a felony;\n\n        (e)       having his face masked or blackened or being otherwise disguised, with intent to\n                  commit a
