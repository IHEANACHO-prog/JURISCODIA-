 or excuse, the proof of which lies on him, knowingly makes or\n                 mends, or begins, or prepares to make or mend, or has in his possession, or disposes of,\n                 any tool, instrument, or machine, which is adapted and intended for making any\n                 counterfeit current nickel coin; or\n\n        (c)       buys, sells, receives, pays, or disposes of, any counterfeit current nickel coin at a lower\n                 rate of value than it imports, or was apparently intended to import, or offers to do any\n                 such act,\n\nis guilty of a felony and is liable to imprisonment for seven years.\n\nA person found committing the offence may be arrested without warrant."},{"c":"CC","n":"155","t":"Uttering base nickel coin","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"(1) Any person who-\n\n        (a)      utters any counterfeit current nickel coin, knowing it to be counterfeit; or\n\n        (b)       has in his possession three or more pieces of counterfeit current nickel coin, knowing\n                 them to be counterfeit, and with intent to utter any of them,\n\nis guilty of a misdemeanour and is liable to imprisonment for one year.\nA person found committing the offence may be arrested without warrant.\n\n        (2) Where a person has ten or more counterfeit coins in his possession, the court may presume\nan intent to utter unless he proves the contrary."},{"c":"CC","n":"156","t":"Defacing coin by stamping words thereon","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who defaces any current coin by stamping thereon any name or word, whether the weight\nof the coin is or is not thereby diminished, is guilty of a misdemeanour and is liable to imprisonment for\none year.\n\nA person found committing the offence may be arrested without warrant."},{"c":"CC","n":"157","t":"Uttering foreign coin, medals, etc., as current coin with intent to defraud","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, with intent to defraud, utters as and for current gold or silver coin-\n\n        (a)     any coin which is not current coin; or\n\n        (b)      any metal or pieces of metal, whether a coin or not, which is of less value than the\n                current coin as and for which it is uttered,\n\nis guilty of a misdemeanour, and is liable to imprisonment for one year.\n\nA person found committing the offence may be arrested without warrant."},{"c":"CC","n":"158","t":"Exporting counterfeit current coin","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, without lawful authority or excuse, the proof of which lies on him, exports or puts on\nboard of a vessel or vehicle of any kind for the purpose of being exported from Nigeria, any counterfeit\ncurrent coin whatever, knowing it to be counterfeit, is guilty of a felony and is liable to imprisonment for\nfourteen years.\n\nA person found committing the offence may be arrested without warrant."},{"c":"CC","n":"159","t":"Unlawfully importing counterfeit coin","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who without lawful authority or excuse, the proof of which lies on him, imports or receives\ninto Nigeria any counterfeit coin whatever, knowing it to be counterfeit, is guilty of a felony and is liable\nto imprisonment for fourteen years.\n\nA person found committing the offence may be arrested without warrant."},{"c":"CC","n":"160","t":"Tender of defaced coin not legal tender: penalty for uttering","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who utters any current coin which is defaced by the stamping of any name or word thereon,\nis guilty of an offence and is liable to a fine of four naira.\nA prosecution for any such offence cannot be commenced without the consent of a law officer. A tender\nof payment in money made in any coin so defaced is not a legal tender."},{"c":"CC","n":"160A","t":"Making, issue and circulation of promissory notes payable to bearer on demand, without","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"authority\n\nAny person, other than the Central Bank of Nigeria, who makes or issues within Nigeria promissory\nnotes payable to bearer on demand or circulates within Nigeria any promissory note\n\npayable to bearer on demand, is guilty of a misdemeanour and liable on conviction to a fine equal to\ndouble the value of any promissory note unlawfully made, issued or circulated or to imprisonment for a\nterm of twelve months, or to both such imprisonment and fine."},{"c":"CC","n":"160B","t":"Portrayal of Nigerian notes and coins","ch":"Chapter 16 – Offences relating to the Currency","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, without the written permission of the Minister of the Federation charged with\nresponsibility for matters relating to finance, makes or sells, or exposes or offers for sale, or uses for the\npurpose of advertising any material or document on or in which is portrayed a note or coin in any way\nresembling a currency note, bank note or coin current in Nigeria, is guilty of a misdemeanour and is\nliable to imprisonment for one year or to a fine of two hundred naira."},{"c":"CC","n":"161","t":"Stopping mails","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who stops a mail with intent to search or rob postal matter is guilty of a felony and is liable\nto imprisonment for life."},{"c":"CC","n":"162","t":"Intercepting telegrams or postal matter","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who unlawfully secretes or destroys any postal matter or telegram or any part of any such\nthing, is guilty of a felony and is liable to imprisonment for seven years, and if any such postal matter so\nsecreted or destroyed shall contain any money or chattel whatsoever, or any valuable security, such\nperson is liable to imprisonment for life."},{"c":"CC","n":"163","t":"Tampering with telegrams or postal matter","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being employed by or under the Nigerian Postal Service, does with respect to any\npostal matter or telegram any act which he is not authorised to do by virtue of his employment, or\nknowingly permits any other person to do any such act with respect to any such thing, is guilty of a\nfelony and is liable to imprisonment for three years.\n                                         [1966 No. 84.]"},{"c":"CC","n":"164","t":"Wilful misdelivery of telegrams or postal matter","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being charged by virtue of his employment or by virtue of any contract, with the\ndelivery of any postal matter or telegram, wilfully delivers it to a person other than the person to whom\nit is addressed, or his authorised agent in that behalf, is guilty of a felony and is liable to imprisonment\nfor three years."},{"c":"CC","n":"165","t":"Obtaining telegrams or postal matter by false pretences","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who by means of any false pretence induces any person employed by or under the Nigerian\nPostal Service or any telegraph official to deliver to him any postal matter or telegram which is not\naddressed to him, is guilty of a misdemeanour and is liable to imprisonment for two years."},{"c":"CC","n":"166","t":"Secreting letters and telegrams","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who wilfully secretes or detains any postal matter or telegram which is found by him, or\nwhich is wrongly delivered to him, and which, in either case, ought to his knowledge, to have been\ndelivered to another person, is guilty of a misdemeanor and is liable to imprisonment for two years."},{"c":"CC","n":"167","t":"Fraudulent issue of money orders and postal orders","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being employed by or under the Nigerian Postal Service, and being charged by virtue of\nhis employment with any duty in connection with the issue of money orders or postal orders, unlawfully,\nand with intent to defraud, issues a money order or postal order, is guilty of a felony, and is liable to\nimprisonment for seven years."},{"c":"CC","n":"168","t":"Fraudulent messages respecting money orders","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being employed by or under the Nigerian Postal Service, and being charged by virtue of\nhis employment with any duty in connection with money orders, sends to any other person, with intent\nto defraud, any false or misleading letter, telegram, or message concerning a money order, or\nconcerning any money payable under a money order, is guilty of a felony and is liable to imprisonment\nfor three years.\n\n                                         [1966 No.84.]\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"169","t":"Unlawful franking of letters","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being empowered under the provisions of any enactment or authorised by the\nMinister charged with responsibility for postal matter to frank postal matter, superscribes any postal\nmatter-\n\n                                            [L.N. 112 of 1964.]\n\n        (a)     which does not relate to the business of his office or department; or\n\n        (b)      into which there has been inserted any letter or other thing which does not relate to\n                such business,\n\nwith intent to avoid payment of the postage on such postal matter or other letter or thing inserted as\naforesaid into such postal matter, is guilty of an offence, and is liable to a fine of two hundred naira."},{"c":"CC","n":"170","t":"Sending dangerous or obscene things by post","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who knowingly sends, or attempts to send by post anything which-\n\n        (a)     encloses anything, whether living or inanimate, of such a nature as to be likely to injure\n                any other thing in the course of conveyance or to injure any person; or\n\n        (b)     encloses an indecent or obscene print, painting, photograph, lithograph, engraving,\n                book, card, or article, or which has on it, or in it, or on its cover, any indecent, obscene,\n                or grossly offensive words, marks, or designs,\n\nis guilty of a misdemeanour and is liable to imprisonment for one year."},{"c":"CC","n":"171","t":"Retarding delivery of telegrams or postal matter","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being required by law or by virtue of his employment to do any act with respect to the\nreceipt, despatch, or delivery, of any postal matter or telegram-\n\n                                         [L.N. 112 of 1964.]\n\n        (a)     neglects or refuses to do such act; or\n\n        (b)     wilfully detains or delays, or permits the detention or delay of any such thing; or\n\n        (c)     opens, or procures or suffers to be opened, any postal matter,\n\nis guilty of a misdemeanour and is liable to a fine of two hundred naira or to imprisonment for one year:\n\nProvided always that nothing herein contained shall extend to the opening or detaining of any postal\nmatter or telegram returned by reason that the person to whom the same shall be directed is dead, or\ncannot be found, or shall have refused the same, or shall have refused or neglected to pay the postage\nthereof or any charges payable in respect thereof, nor to the opening or detaining or delaying of any\npostal matter or telegram under the authority of any Act or in obedience to an express warrant in\nwriting under the hand of the Minister charged with responsibility for postal matter."},{"c":"CC","n":"172","t":"Obstructing mails","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who wilfully obstructs or delays the conveyance or delivery of postal matter, is guilty of a\nsimple offence and is liable to a fine of one hundred naira."},{"c":"CC","n":"173","t":"Penalty on loitering, carelessness in delivery of mails, etc","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"(1) Any person who, being employed by or under the Nigerian Postal Service to conveyor deliver\npostal matter whilst so employed-\n\n        (a)      allows any postal matter bag or postal matter out of his possession; or\n\n        (b)      suffers any unauthorised person to interfere with any such postal matter bag or postal\n                 matter; or\n\n        (c)      is guilty of any neglect whereby any such postal matter bag or postal matter is\n                 endangered; or\n\n        (d)      loiters on the road; or\n\n        (e)      wilfully misspends or loses time; or\n\n        (f)      is under the influence of intoxicating liquor; or\n\n        (g)    does not convey postal matter at the speed fixed by the Postmaster-General for the\nconveyance thereof, unless prevented by some cause beyond his control, the proof, whereof lies on the\nperson charged,\n\nis guilty of a simple offence and is liable to a fine of twenty naira.\n\n        (2) Any person who, being employed by or under the Nigerian Postal Service, negligently loses\nany postal mater or telegram or negligently detains or delays, or permits the detention or delay of, any\npostal matter or telegram, is guilty of a simple offence and is liable to a fine of twenty naira."},{"c":"CC","n":"174","t":"Fraudulently removing stamps","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, with intent to defraud-\n\n        (1) removes from any postal matter or telegram any stamp affixed thereon; or\n\n        (2) removes from any stamp previously used any mark thereon at a postal or telegraph office; or\n\n       (3) knowingly uses a postage stamp which has been obliterated or defaced by a mark made\nthereon at a post or telegraph office; or\n\n        (4) knowingly tampers with a postage stamp by smearing or coating the surface with mucilage\nor any other substance so that it may be used again at a post or telegraph office,\nis guilty of a misdemeanour and is liable to imprisonment for one year or to a fine of one hundred naira.\n\nOn the trial of a person charged with the offence of knowingly using a postage stamp which has been\nobliterated or defaced by a mark made thereon at a post office, proof that the person charged is the\nwriter of the address of anything sent by post on which the stamp is affixed is sufficient evidence that he\nis the person who used the stamp, until the contrary is shown."},{"c":"CC","n":"175","t":"Fraudulent evasion of postal laws","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who-\n\n        (1) knowingly and fraudulently puts into a post office anything in or upon which, or in or upon\nthe cover of which there is any letter, newspaper, or other thing, or any writing or mark, not allowed by\nlaw to be there placed; or\n\n        (2) wilfully subscribes on the outside of anything sent by post a false statement of its contents;\nor\n\n         (3) knowingly and fraudulently puts into a post office anything which falsely purports to be a\nthing falling within any exemption or privilege declared by the laws relating to postal matter,\n\nis guilty of a simple offence and is liable to a fine of one hundred naira."},{"c":"CC","n":"176","t":"Carrying letters otherwise than by post","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, not being authorised by the Postmaster-General\n\n                                                   [1966 No. 84.]\n\n        (1) sends or conveys a letter otherwise than by post; or\n\n        (2) takes charge of a letter for conveyance,\n\nis guilty of a simple offence and is liable to a fine of one hundred naira.\n\nThis section of this Code does not extend to a letter sent or conveyed to a place in Nigeria with which\npostal communication has not been established, nor to a letter exceeding the weight prescribed by law\nfor letters sent by post, nor to a letter sent by a private friend without hire or reward, on his way,\njourney, or travel, so as such letter be delivered to the party to whom it is directed, nor to a letter to be\nsent out of Nigeria by a vessel not being a packet boat, nor to a letter concerning goods sent and to be\ndelivered with it, without any hire or reward being paid or received in respect thereof, or containing\nprocess of, or proceedings or pleadings in, a court of justice, or briefs or cases, of instructions for\ncounsel and their opinions thereon, or containing a deed, affidavit, or power of attorney, nor to a letter\nsent by a special messenger and concerning the private affairs of the sender, nor to a letter sent or\ncarried to or from the nearest post office:\nProvided always that nothing in this section of this Code shall authorise any of the persons hereinafter\nnamed to carry a letter, or to receive or collect or deliver a letter, although they shall not receive hire or\nreward for the same-\n\n        (a)      common carriers, except a letter concerning goods which they are conveying;\n\n        (b)      officers of the Nigerian Postal Service;\n\n        (c)       owners, masters, or commanders of vessels being passage or packet boats, sailing and\n                 passing between places in Nigeria with which postal communication has been\n                 established, except in respect of letters concerning goods on board, or letters belonging\n                 to the owners of such vessels;\n\n        (d)      passengers, members of the crew, or other persons on board any such vessels as is\n                 mentioned in paragraph (c) of this section;\n\n        (e)      owners of, members of the crew, or others on board a vessel passing or repassing on a\n                 river within Nigeria, except with respect to places in Nigeria with which postal\n                 communication has not been established."},{"c":"CC","n":"177","t":"Illegally making postal envelopes or setting up post office or office for sale of","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"imitating post office\n\nAny person who-\n\n                                          [1966 No. 84. L.N. 112 of 1964.]\n\n        (1) without lawful authority or excuse, the proof of which lies on him-\n\n        (a) makes any envelope, wrapper, card, form, or paper, in imitation of one issued by or under\n           the authority of the Postmaster-General or of the postal authority of any other country, or\n           having thereon any word, letter, or mark, which signifies or implies, or may reasonably induce\n         a person receiving it to believe, that a letter, newspaper, packet, or parcel, bearing such word,\n        letter, or mark, is sent on State service, or on the public service of another country; or\n\n        (b)       makes on any envelope, wrapper, card, form, or paper, in order to its being issued or\n                 sent by post or otherwise, any stamp or mark in imitation of a stamp or mark of any\n                 post office under the control of the Postmaster-General or of the postal authority of any\n                 other country, or any other stamp or mark, or any word or letter, which signifies or\n                 implies, or may reasonably induce a person receiving it to believe, that a letter,\n                 newspaper, packet, or parcel, bearing such stamp, mark, word, or letter, is sent on State\n                 service, or on the public service of another country; or\n\n        (c)      issues or sends by post or otherwise, any envelope, wrapper, card, form, or paper, so\n                 marked; or\n        (2) without the authority of the Postmaster-General, the proof of which lies on the person\ncharged, places or maintains, or permits to be placed or maintained, or to remain in, on, or near, any\nplace under his control-\n\n        (i)      the words \"post office\"; or\n\n        (ii)      the words \"letter box\", accompanied with words, letters or marks which signify or\n                 imply, or may reasonably lead the public to believe, that it is a receptacle provided by\n                 the authority of the Postmaster-General for the reception of postal matter; or\n\n        (iii)    any words, letters or marks which signify or imply, or may reasonably lead the public to\n                 believe, that any place is a post office, or that any such receptacle is provided by the\n                 authority of the Postmaster-General as aforesaid; or\n\n        (3) without the authority of the Postmaster-General, the proof of which lies on the person\ncharged, places, or permits to be placed or to remain, on any vehicle or vessel under his control the\nwords \"royal mail\", or any word, letter or mark, which signifies or implies, or may reasonably induce any\nperson to believe, that the vehicle or vessel is used for the conveyance of mails; or\n\n        (4) without the licence of the Minister charged with responsibility for postal matters, the proof\nof which lies on the person charged-\n\n        (i)      sells, or offers or exposes for sale, any postage stamp; or\n\n        (ii)     places, permits to be placed or to remain, on or near to his house or premises the words\n\"licensed to sell stamps\", or any word, letter or mark, which signifies or implies, or may reasonably\ninduce any person to believe, that he is duly licensed to sell postage stamps,\n\nis guilty of a simple offence and is liable to a fine of ten naira."},{"c":"CC","n":"178","t":"Destroying or damaging letter box","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who wilfully destroys or damages any receptacle provided by authority of the Postmaster-\nGeneral for the receipt of postal matter, or any card or notice relating to the postal or telegraph service\nset up by authority of the Postmaster-General, or obliterates any letter or figure on any such thing, is\nguilty of a simple offence and is liable to a fine of one hundred naira."},{"c":"CC","n":"179","t":"Placing injurious substances in or against letter box","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who places in or against any receptacle provided by authority of the Postmaster-General for\nthe reception of postal matter or telegrams, any fire or match, or any explosive, dangerous, noxious or\ndeleterious substance, or any fluid or filth, is guilty of a simple offence and is liable to a fine of forty\nnaira.\n                                            [1966 No. 84.]"},{"c":"CC","n":"180","t":"Defacing post office or letter box","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who without the licence of the Postmaster-General affixes, or attempts to affix, any placard,\nadvertisement, notice, list, document, board, or paint, tar, or other thing to any post office or telegraph\noffice, is guilty of a simple offence and is liable to a fine of ten naira."},{"c":"CC","n":"181","t":"Obstructing post and telegraph offices","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, by stopping or loitering opposite to or on the premises of a post office or telegraph\noffice, obstructs the business of the office or any other person lawfully going to the office, is guilty of a\nsimple offence and is liable to a fine of ten naira."},{"c":"CC","n":"182","t":"Obstructing post and telegraph officers in the execution of duty","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who-\n\n                                              [1966 No. 84.]\n\n          (1) wilfully obstructs a person employed by or under the Nigerian Postal Service or any telegraph\nofficial in the execution of the duties of his employment; or\n\n        (2) being in a post office or telegraph office, or within any premises appertaining to a post office\nor telegraph office, or used therewith, wilfully obstructs the business of the office; or\n\n        (3) without the permission of a competent authority enters any part of a telegraph office to\nwhich the public are not admitted,\n\nis guilty of a simple offence and is liable to a fine of four naira.\n\nAny person employed by or under the Nigerian Postal Service or any telegraph official may require any\nperson committing any of the offences defined in this section of this Code to leave the post office, or\ntelegraph office, or premises.\n\nAny person who refuses or fails to comply with such request is guilty of a simple offence and is liable to\na further fine of ten naira, and may be removed by any person authorised to make the request; and all\nmembers of the police force are required, on demand, to remove or assist in removing such person."},{"c":"CC","n":"183","t":"Contravening exclusive privilege of the Nigerian Postal Services Department","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who-\n\n        (a)      not being authorised by or under any Act so to do, establishes or maintains any\n                 telegraph; or\n        (b)      knowing or having reason to believe that a telegraph has been established or is\n                 maintained without such authority as aforesaid, transmits or receives any message by\n                 such telegraph or performs any service incidental thereto, or delivery of any message\n                 for transmission by such telegraph or accepts delivery of any message sent thereby,\n\nis guilty of a simple offence and is liable on a first conviction to a fine of twenty naira, and on every\nsubsequent conviction to a fine of one hundred naira."},{"c":"CC","n":"184","t":"(Deleted by 1975 No. 30)","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":""},{"c":"CC","n":"185","t":"(Deleted by 1975 No. 30)","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":""},{"c":"CC","n":"186","t":"Negligently injuring telegraphs","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who negligently destroys or damages any telegraph works, is guilty of a simple offence and\nis liable to a fine of four naira."},{"c":"CC","n":"187","t":"Violation of secrecy","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any telegraph official who, contrary to his duty, publishes or communicates the contents or substance of\na telegram, or any information relating to the despatch or receipt of any telegram, except to some\nperson to whom he is authorised to deliver the telegram, is guilty of a felony and is liable to\nimprisonment for three years."},{"c":"CC","n":"188","t":"Resisting officers","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who resists a person employed by or under the Nigerian Postal Service while engaged in the\nexecution of his duty under the laws relating to posts and telegraphs, is guilty of a simple offence and is\nliable to imprisonment for three months, or to a fine of forty naira."},{"c":"CC","n":"189","t":"Laying property in postal matter and telegraph works","ch":"Chapter 17 – Offences relating to Posts and Telecommunications","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"(1) In case of any offence under this Code in respect of any postal matter bag or postal matter,\nor of any chattel, money, or valuable security sent by post, it shall be sufficient in any proceedings to lay\nthe ownership in the Postmaster-General.\n\n                                                   [1966 No. 84.]\n\n         (2) In case of any offence under this Code in respect of any telegram, telegraph line or telegraph\nworks, established under the provisions of the Wireless Telegraphs Act, or the Telegraphs Proclamation,\nor in respect of any form, paper, book, or other thing used for the purpose of carrying out the provisions\nof such Act or proclamation, it shall be sufficient in any proceedings to lay the ownership in the\nPostmaster-General.\n\n                                                   [Cap. W5.]\n        (3) In any such proceedings as aforesaid, it shall not be necessary to prove ownership, or to\nallege or prove any value."},{"c":"CC","n":"190","t":"False declaration as to execution of sentence of death","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who subscribes a certificate or declaration as to the execution of a sentence of death, which,\nin any material particular, is to his knowledge false, is guilty of a felony and is liable to imprisonment for\nfourteen years."},{"c":"CC","n":"190A","t":"False statements in application for passports","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who for the purpose of procuring a passport, whether for himself or any other individual,\nmakes or causes to be made in any written application to a public officer a statement which to the\nknowledge of such person is false in any material particular, is guilty of an offence and is liable to\nimprisonment for one year."},{"c":"CC","n":"191","t":"False statements in statements required to be under oath or solemn declaration","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, on any occasion on which a person making a statement touching any matter is\nrequired by law to make it on oath, or under some sanction which may by law be substituted for an\noath, or is required to verify it by solemn declaration or affirmation, makes a statement touching such\nmatter which, in any material particular, is to his knowledge false, and verifies it on oath, or under such\nother sanction or by solemn declaration or affirmation, is guilty of a felony and is liable to imprisonment\nfor seven years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"192","t":"False declarations and statements","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, on any occasion on which he is permitted or required by law to make a statement or\ndeclaration before any person authorised by law to permit it to be made before him, makes a statement\nor declaration before that person which, in any material particular, is to his knowledge false, is guilty of\na felony and is liable to imprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"193","t":"Evidence","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"A person cannot be convicted of any of the offences defined in sections 191 and 192 of this Code upon\nthe uncorroborated testimony of one witness."},{"c":"CC","n":"194","t":"Shooting at customs boats or officers","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who-\n\n        (1) shoots at a vessel of any kind which is in use by a customs officer while engaged in the\nexecution of his duty as such officer; or\n\n        (2) shoots at, wounds, or causes any grievous harm to a customs officer while engaged in the\nexecution of his duty in the prevention of smuggling, or any person acting in aid of a customs officer\nwhile so engaged,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"195","t":"Resisting officers engaged in preventing smuggling","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who with violence assaults, obstructs, or resists a customs officer, or any person duly\nemployed for the prevention of smuggling, while engaged in the execution of his duty in the prevention\nof smuggling, or any person acting in aid of any such officer or person while so engaged, is guilty of a\nfelony and is liable to imprisonment for three years."},{"c":"CC","n":"196","t":"Resisting customs officers","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who-\n\n        (1) assaults or obstructs a customs officer, or any person duly employed for the prevention of\nsmuggling , while engaged in the execution of his duty under any law relating to the customs, or in the\nseizure of any goods claimed to be liable to forfeiture under any such law, or any person acting in aid of\nany such officer or person while so engaged; or\n\n        (2) rescues or attempts to rescue any goods which have been seized under any such law; or\n\n(3) before, at, or after, the seizure of any goods under any such law, staves, breaks or destroys the\ngoods, with intent to prevent the seizure or the securing of the goods, or attempts to do any such act,\n\nis guilty of a simple offence and is liable to a fine of two hundred naira."},{"c":"CC","n":"197","t":"Resisting public officers","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who in any manner obstructs or resists any public officer while engaged in the\n\ndischarge or attempted discharge of the duties of his office under any order, Act, law, or Statute, or\nobstructs or resists any person while engaged in the discharge or attempted discharge of any duty\nimposed on him by an order, Act, law, or statute, is guilty of a misdemeanour and is liable to\nimprisonment for two years."},{"c":"CC","n":"198","t":"Refusal by public officer to perform duty","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being a person employed in the public service and being required by any order, Act,\nlaw, or statute, to do any act by virtue of his employment, perversely and without lawful excuse omits or\nrefuses to do any such act, is guilty of a misdemeanour and is liable to imprisonment for two years. A\nprosecution for any offence under this section of this Code shall not be instituted except by or with the\nconsent of a law officer."},{"c":"CC","n":"199","t":"Neglect of peace officer to suppress riot","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, being a peace officer and having notice that there is a riot in his neighbourhood,\nwithout reasonable excuse omits to do his duty in suppressing such riot, is guilty of a misdemeanour and\nis liable to imprisonment for two years."},{"c":"CC","n":"200","t":"Neglect to aid in suppressing riot","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, having reasonable notice that he is required to assist any peace officer in suppressing a\nriot, without reasonable excuse omits to do so, is guilty of a misdemeanour and is liable to\nimprisonment for one year."},{"c":"CC","n":"201","t":"Neglect to aid in arresting offenders","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, having reasonable notice that he is required to assist any peace officer or member of\nthe police force in arresting any person, or in preserving the peace, without reasonable excuse omits to\ndo so, is guilty of a misdemeanour and is liable to imprisonment for one year."},{"c":"CC","n":"202","t":"Disobedience to Act, Law, or Statute","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, without lawful excuse, the proof of which lies on him, does any act which he is by the\nprovisions of any order, Act, law, or statute, forbidden to do, or omits to do any act which he is by the\nprovisions of any such order, Act, law or statute, required to do, is guilty of a misdemeanour, unless\nsome mode of proceeding against him for such disobedience is expressly provided by order, Act, law, or\nstatute, and is intended to be exclusive of all other punishment.\n\n                                                  [L.N. 112 of 1964.]\n\nThe offender is liable to imprisonment for one year.\n\nIn this section, the terms \"Act\" and \"law\" do not include an order, regulation or proclamation made\nunder the authority of an Act or a law."},{"c":"CC","n":"203","t":"Disobedience to lawful order issued by constituted authority","ch":"Chapter 18 – Miscellaneous offences against public authority","p":"Part 3 – Offences against the administration of law and justice and against public authority","x":"Any person who, without lawful excuse, the proof of which lies on him, disobeys any lawful order issued\nby any person authorised by any order, Act, law, or statute, to make the order, is guilty of a\nmisdemeanor, unless some mode of proceeding against him for such disobedience is expressly provided\nby order, Act, law, or statute, and is intended to be exclusive of all other punishment.\n                                                  [L.N. 112 of 1964.]\n\nThe offender is liable to imprisonment for one year."},{"c":"CC","n":"204","t":"Insult to a religion","ch":"Chapter 19 – Offences relating to religious worship","p":"Part 4 – Acts injurious to the public in general","x":"Any person who does an act which any class of persons consider as a public insult on their religion, with\nthe intention that they should consider the act such an insult, and any person who does an unlawful act\nwith the knowledge that any class of persons will consider it such an insult, is guilty of a misdemeanour\nand is liable to imprisonment for two years."},{"c":"CC","n":"205","t":"Offering violence to officiating ministers of religion","ch":"Chapter 19 – Offences relating to religious worship","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n         (1) by threats or force prevents or attempts to prevent any minister of religion from lawfully\nofficiating in any place of religious worship, or from performing his duty in the lawful burial of the dead\nin any cemetery or other burial place; or\n\n         (2) by threats or force obstructs or attempts to obstruct, any minister of religion while so\nofficiating or performing his duty; or\n\n         (3) assaults, or, upon or under the pretence of executing any civil process, arrests any minister\nof religion who is engaged in, or is, to the knowledge of the offender, about to engage in, any of the\noffices or duties aforesaid, or who is, to the knowledge of the offender, going to perform the same or\nreturning from the performance thereof,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years."},{"c":"CC","n":"206","t":"Disturbing religious worship","ch":"Chapter 19 – Offences relating to religious worship","p":"Part 4 – Acts injurious to the public in general","x":"Any person who wilfully and without lawful justification or excuse, the proof of which lies on him,\ndisquiets, or disturbs any meeting of persons lawfully assembled for religious worship, or assaults any\nperson lawfully officiating at any such meeting, or any of the persons there assembled, is guilty of a\nsimple offence and is liable to imprisonment for two months or to a fine of ten naira."},{"c":"CC","n":"207","t":"Unlawful trial by ordeal: prohibited juju","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"(1) The trial by the ordeal of sasswood, esere-bean, or the poison, boiling oil, fire, immersion in\nwater or exposure to the attacks of crocodiles or other wild animals, or by any ordeal which is likely to\nresult in the death of or bodily injury to any party to the proceeding, is unlawful.\n\n        (2) The President or, as the case may be, the Governor of a State may by order prohibit the\nworship or invocation of any juju which may appear to him to involve or tend towards the commission\nof any crime or breach of peace, or to the spread of any infectious or contagious disease."},{"c":"CC","n":"208","t":"Directing, etc., unlawful trial by ordeal","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any person who directs or controls or presides at any trial by ordeal which is unlawful, is guilty of a\nfelony and is liable, when the trial which such person directs, controls or presides at results in the death\nof any party to the proceeding, to the punishment of death and m every other case, to imprisonment for\nten years."},{"c":"CC","n":"209","t":"Being present at, or making poison for, unlawful trial by ordeal","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (a)      is present at or takes part in any trial by ordeal which is unlawful; or\n\n        (b)     makes, sells or assists or takes part in making or selling, or has in his possession for sale\n                or use any poison or thing which is intended to be used for the purpose of any trial by\n                ordeal which is unlawful,\n\nis guilty of a misdemeanour and is liable to imprisonment for one year."},{"c":"CC","n":"210","t":"Offences in relation to witchcraft and juju","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (a)     by his statements or actions represents himself to be a witch or to have the power of\n                witchcraft; or\n\n        (b)     accuses or threatens to accuse any person with being a witch or with having the power\n                of witchcraft; or\n\n        (c)     makes or sells or uses, or assists or takes part in making or selling or using or has in his\n                possession or represents himself to be in possession of any juju, drug or charm which is\n                intended to be used or reported to possess the power to prevent or delay any person\n                from doing an act which such person has a legal right to do, or to compel any person to\n                do an act which such person has a legal right to refrain from doing, or which is alleged or\n                reported to possess the power of causing any natural phenomenon or any disease or\n                epidemic; or\n        (d)     directs or controls or presides at or is present at or takes part in the worship or\n                invocation of any juju which is prohibited by an order of the President or the Governor\n                of a State; or\n\n        (e)      is in possession of or has control over any human remains which are used or are\n                intended to be used in connection with the worship or invocation of any juju; or\n\n        (f)     makes or uses or assists in making or using, or has in his possession anything\n                whatsoever the making, use or possession of which has been prohibited by an order as\n                being or believed to be associated with human sacrifice or other unlawful practice,\n\nis guilty of misdemeanour and is liable to imprisonment for two years."},{"c":"CC","n":"211","t":"Chiefs permitting unlawful ordeal and prohibited juju worship","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any chief who directly or indirectly permits, promotes, encourages or facilitates any trial by ordeal\nwhich is unlawful, or the worship or invocation of any juju which has been prohibited by an order, or\nwho knowing of such trial, worship or invocation, or intended trial, worship or invocation, does not\nforthwith report the same to an administrative officer, is guilty of a felony and is liable to imprisonment\nfor three years.\n\n                                                 [L.N. 257 of 1959.]\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"212","t":"Destruction of place where unlawful ordeal or prohibited juju worship is held","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any house, grove or place in which it has been customary to hold any trial by ordeal which is unlawful,\nor the worship or invocation of any juju which is prohibited by an order, may, together with all articles\nfound therein, be destroyed or erased upon the order of any court by such persons as the court may\ndirect."},{"c":"CC","n":"213","t":"Criminal charms","ch":"Chapter 20 – Ordeal, Witchcraft, Juju and Criminal Charms","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n(a)     makes, sells or keeps for sale or for hire or reward, any fetish or charm which is pretended or\n        reputed to possess power to protect burglars, robbers, thieves or other malefactors, or to aid or\n        assist in any way in the perpetration of any burglary, housebreaking, robbery or theft, or in the\n        perpetration of any offence whatsoever, or to prevent, hinder or delay the detection of or\n        conviction for any offence whatsoever; or\n\n(b)     is found having in his possession without lawful and reasonable excuse (the proof of which\n        excuse shall lie on such person) any such fetish or charm as aforesaid,\nis guilty of a felony and is liable to imprisonment for five years."},{"c":"CC","n":"214","t":"Unnatural offences","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (1) has carnal knowledge of any person against the order of nature; or\n\n        (2) has carnal knowledge of an animal; or\n\n        (3) permits a male person to have carnal knowledge of him or her against the order of nature,\n\nis guilty of a felony and is liable to imprisonment for fourteen years."},{"c":"CC","n":"215","t":"Attempt to commit unnatural offences","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who attempts to commit any of the offences defined in section 214 of this Code, is guilty of\na felony and is liable to imprisonment for seven years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"216","t":"Indecent treatment of boys under fourteen","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who unlawfully and indecently deals with a boy under the age of fourteen years, is guilty of\na felony and is liable to imprisonment for seven years.\n\nThe term \"deal with\" includes doing any act which, if done without consent, would constitute an assault\nas hereinafter defined."},{"c":"CC","n":"217","t":"Indecent practices between males","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any male person who, whether in public or private, commits any act of gross indecency with another\nmale person, or procures another male person to commit any act of gross indecency with him, or\nattempts to procure the commission of any such act by any male person with himself or with another\nmale person, whether in public or private, is guilty of a felony and is liable to imprisonment for three\nyears.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"218","t":"Defilement of girls under thirteen","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who has unlawful carnal knowledge of a girl under the age of thirteen years is guilty of a\nfelony and is liable to imprisonment for life, with or without caning.\n\n                                                   [30 of 1960.]\nAny person who attempts to have unlawful carnal knowledge of a girl under the age of thirteen years is\nguilty of a felony and is liable to imprisonment for fourteen years, with or without caning.\n\nA prosecution for either of the offences defined in this section of this Code shall be begun within two\nmonths after the offence is committed.\n\nA person cannot be convicted of either of the offences defined in this section of this Code upon the\nuncorroborated testimony of one witness."},{"c":"CC","n":"219","t":"Householder permitting defilement of young girls on his premises","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who, being the owner or occupier of any premises, or having, or acting, or assisting in the\nmanagement or control of any premises, induces or knowingly permits any girl of such age as is in this\nsection of this Code mentioned to resort to or be in or upon such premises for the purpose of being\nunlawfully carnally known by any man, whether a particular man or not, is guilty of an offence.\n\n         If the girl is of or above thirteen and under sixteen years of age, he is guilty of a misdemeanour\nand is liable to imprisonment for two years, with or without caning.\n\nIf the girl is under the age of thirteen years, he is guilty of felony, and is liable to imprisonment for life,\nwithout caning."},{"c":"CC","n":"220","t":"Defence to charge under preceding section","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"*It is a defence to a charge of any of the offences defined in section 219 of this Code to prove that the\naccused person believed, on reasonable grounds, that the girl was of or above the age of sixteen years."},{"c":"CC","n":"221","t":"Defilement of girls under sixteen and above thirteen, and of idiots","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n       (1) has or attempts to have unlawful carnal knowledge of a girl being of or above thirteen years\nand under sixteen years of age; or\n\n                                                    [1960 No. 30.]\n\n       (2) knowing a woman or girl to be an idiot or imbecile, has or attempts to have unlawful carnal\nknowledge of her,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years, with or without caning.\n\n*It is a defence to a charge of either of the offences firstly defined in this section of this Code to prove\nthat the accused person believed, on reasonable grounds, that the girl was of or above the age of\nsixteen years.\n\nA prosecution for any of the offences defined in this section of this Code shall be begun within two\nmonths after the offence is committed.\nA person cannot be convicted of any of the offences defined in this section of this Code upon the\nuncorroborated testimony of one witness."},{"c":"CC","n":"222","t":"Indecent treatment of girls under sixteen","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who unlawfully and indecently deals with a girl under the age of sixteen years is guilty of a\nmisdemeanour, and is liable to imprisonment for two years, with or without caning.\n\n                                                   [20 of 1960.]\n\nIf the girl is under the age of thirteen years, he is guilty of a felony and is liable to imprisonment for\nthree years, with or without caning.\n\n*It is a defence to a charge of the offence defined in this section to prove that the accused person\nbelieved, on reasonable grounds, that the girl was of or above the age of sixteen years.\n\nThe term \"deal with\" includes doing any act which, if done without consent, would constitute an assault\nas hereinafter defined."},{"c":"CC","n":"222A","t":"Causing or encouraging the seduction or prostitution of a girl under sixteen","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"(1) Whoever, having the custody, charge or care of a girl under the age of sixteen years, causes\nor encourages the seduction, unlawful carnal knowledge or prostitution of, or the commission of an\nindecent assault upon, such a girl, shall be liable to imprisonment for two years.\n\n         (2) For the purposes of this section, a person shall be deemed to have caused or encouraged the\nseduction, unlawful carnal knowledge or prostitution of, or the commission of an indecent assault upon,\na girl who has been seduced, unlawfully carnally known, or indecently assaulted, or who has become a\nprostitute, if he has knowingly allowed her to consort with, or to enter or continue in the employment\nof, any prostitute or person of known immoral character."},{"c":"CC","n":"222B","t":"Allowing persons under sixteen to be in brothels","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"(1) Whoever, having the custody, charge or care of a child or young person who has attained the\nage of four years and is under the age of sixteen years, allows that child or young person to reside in or\nfrequent a brothel, is liable to a fine of one hundred naira or to imprisonment for six months or to both\nsuch fine and imprisonment.\n\n        (2) If, upon the trial of a person charged with an offence against section 219 of this Code, the\nfacts proved in evidence authorise a conviction for an offence against this section of this Code, the\nperson charged may be convicted of the offence against this section of this Code although he was not\ncharged with that offence."},{"c":"CC","n":"222C","t":"Restriction on defence of reasonable belief","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Notwithstanding anything contained in sections 220, 221 and 222, it shall only be a defence to a charge\nof any of the offences defined in sections 219, 221 (1) and 222 of this Code to prove that the accused\nperson believed, on reasonable grounds, that the girl was of or above the age of sixteen years if the\naccused person was under the age of 21 years at the time when the offence is alleged to have been\ncommitted and has not previously been charged with any of such offences."},{"c":"CC","n":"223","t":"Procuration","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who\n\n       (1) procures a girl or woman who is under the age of eighteen years to have unlawful carnal\nconnection with any other person or persons either in Nigeria or elsewhere; or\n\n        (2) procures a woman or girl to become a common prostitute either in Nigeria or elsewhere; or\n\n        (3) procures a woman or girl to leave Nigeria with intent that she may become an inmate of a\nbrothel elsewhere; or\n\n        (4) procures a woman or girl to leave her usual place of abode in Nigeria, with intent that she\nmay, for the purposes of prostitution, become an inmate of a brothel either in Nigeria or elsewhere,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years.\n\nA person cannot be convicted of any of the offences defined in this section of this Code upon the\nuncorroborated testimony of one witness.\n\nThe offender may be arrested without warrant."},{"c":"CC","n":"224","t":"Procuring defilement of woman by threats or fraud, or administering drugs","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (1) by threats or intimidation of any kind procures a woman or girl, to have unlawful carnal\n\nconnection with a man either in Nigeria or elsewhere; or\n\n       (2) by any false pretence procures a woman or girl to have unlawful carnal connection with a\nman either in Nigeria or elsewhere; or\n\n        (3) administers to a woman or girl, or causes a woman or girl, to take, any drug or other thing\nwith intent to stupefy or overpower her in order to enable any man, whether a particular man or not, to\nhave unlawful carnal knowledge of her,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years.\n\nA person cannot be convicted of any of the offences defined m this section upon the uncorroborated\ntestimony of one witness."},{"c":"CC","n":"225","t":"Abduction of girl under eighteen with intent to have carnal knowledge","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who, with intent that an unmarried girl under the age of eighteen years may be unlawfully\ncarnally known by any man, whether a particular man or not, takes her or causes her to be taken out of\nthe custody or protection of her father or mother, or other person having the lawful care or charge of\nher, and against the will of such father or mother or other person, is guilty of a misdemeanour and is\nliable to imprisonment for two years.\n\nIt is a defence to a charge of any of the offences defined in this section of this Code to prove that the\naccused person believed, on reasonable grounds, that the girl was of or above the age of eighteen years."},{"c":"CC","n":"225A","t":"Persons trading in prostitution","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"(1) Every male person who-\n\n                                         [30 of 1960.]\n\n        (a)      knowingly lives wholly or in part on the earnings of prostitution; or\n\n        (b)      in any public place persistently solicits or importunes for immoral purposes,\n\nis liable to imprisonment for two years, and in the case of a second or subsequent conviction, shall, in\naddition to any term of imprisonment awarded, be liable to caning.\n\n        (2) Any magistrate who is satisfied, by evidence upon oath, that there is reason to suspect that\nany premises or any part of any premises are or is used by a female for purposes of prostitution, and\nthat any male person residing in or frequenting the premises is living wholly or in part of the earnings of\nthe prostitute, may issue a warrant under his hand authorising any constable to enter and search the\npremises and to arrest that male person.\n\n         (3) Where a male person is proved to live with or to be habitually in the company of a prostitute\nor is proved to have exercised control, direction, or influence over the movements of a prostitute in\nsuch a manner as to show that he is aiding, abetting, or compelling her prostitution with any other\nperson or generally, he shall, unless he can satisfy the court to the contrary, be deemed to be knowingly\nliving on the earnings of prostitution.\n\n        (4) Every female who is proved to have, for the purposes of gain, exercised control, direction or\ninfluence over the movements of a prostitute in such a manner as to show that she is aiding, abetting or\ncompelling her prostitution with any person or generally, is liable to imprisonment for two years."},{"c":"CC","n":"225B","t":"Keeping a brothel","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Whoever-\n\n        (a)     keeps or manages or assists in the management of a brothel; or\n\n        (b)     being the tenant, lessee, or occupier or person in charge of any premises, knowingly\n                permits such premises or any part thereof to be used as a brothel or for the purposes of\n                habitual prostitution; or\n        (c)     being the lessor or landlord of any premises, or the agent of such lessor or landlord, lets\n                the same or any part thereof with the knowledge that such premises or some part\n                thereof are or is to be used as a brothel, or is wilfully a party to the continued use of\n                such premises or any part thereof as a brothel, is liable-\n\n        (i)      to a fine of one hundred naira or to imprisonment for six months; and\n\n        (ii)    on a second or subsequent conviction, to a fine of three hundred naira or to\n                imprisonment for one year,\n\nor in either case, to both such fine and imprisonment."},{"c":"CC","n":"226","t":"Unlawful detention with intent to defile, or in a brothel","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n       (1) detains a woman or girl against her will in or upon any premises in order to her being\nunlawfully carnally known by any man, whether a particular man or not; or\n\n        (2) detains a woman or girl against her will in a brothel,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years.\n\nWhen a woman or girl is in or upon any premises in order to her being unlawfully carnally known by any\nman, whether a particular man or not, or is in a brothel, a person is deemed to detain such woman or\ngirl in or upon such premises in order to her being so unlawfully carnally known or to detain her in such\nbrothel if, with intent to compel or induce her to remain in or upon the premises or in the brothel, he\nwithholds from her any wearing apparel or other property belonging to her, or if, after wearing apparel\nhas been lent or otherwise supplied to the woman or girl by or by the direction of such person or any\nother person, he threatens the woman or girl with legal proceedings if she takes away with her the\nwearing apparel so lent or supplied.\n\nIt is lawful for a woman or girl to take any such wearing apparel as may be necessary to enable her to\nleave a brothel or any premises in or upon which she is in order to her being unlawfully carnally known\nby any man."},{"c":"CC","n":"227","t":"Conspiracy to defile","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who conspires with another to induce any woman or girl, by means of any false pretence or\nother fraudulent means, to permit any man to have unlawful carnal knowledge of her, is guilty of a\nfelony, and is liable to imprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"228","t":"Attempts to procure abortion","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who, with intent to procure miscarriage of a woman, whether she is or is not with child,\nunlawfully administers to her or causes her to take any poison or other noxious thing, or uses any force\nof any kind, or uses any other means whatever, is guilty of a felony and is liable to imprisonment for\nfourteen years."},{"c":"CC","n":"229","t":"Attempt to procure own miscarriage","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any woman who, with intent to procure her own miscarriage, whether she is or is not with child,\nunlawfully administers to herself any poison or other noxious thing, or uses any force of any kind, or\nuses any other means whatever, or permits any such thing or means to be administered or used to her is\nguilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"230","t":"Supplying drugs or instruments to procure abortion","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who unlawfully supplies to or procures for any person any thing whatever, knowing that it is\nintended to be unlawfully used to procure the miscarriage of a woman, whether she is or is not with\nchild is guilty of a felony and is liable to imprisonment for three years.\n\nThe offender cannot be arrested without warrant."},{"c":"CC","n":"231","t":"Indecent acts","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n        (1) wilfully and without lawful excuse does any indecent act in any public place; or\n\n        (2) wilfully does any indecent act in any place with intent to insult or offend any person,\n\nis guilty of a misdemeanour and is liable to imprisonment for two years."},{"c":"CC","n":"232","t":"(Repealed by 1961 No. 51)","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":""},{"c":"CC","n":"233","t":"Knowledge of age immaterial","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"Except as otherwise expressly stated, it is immaterial, in the case of any of the offences defined in this\nChapter committed with respect to a woman or girl under a specified age, that the accused person did\nnot know that the woman or girl was under that age or believed that she was not under that age."},{"c":"CC","n":"233A","t":"Deportation of non-citizens of Nigeria","ch":"Chapter 21 – Offences against Morality","p":"Part 4 – Acts injurious to the public in general","x":"(1) Any person not being a citizen of Nigeria shall, upon conviction of an offence against section\n219, 222A, 222B, 223, 225A, or 225B of this Code, be liable to be deported by order of the Minister, and\nthe provisions of the Immigration Act shall apply, mutatis mutandis, in the case of a deportation under\nthis section.\n\n                [L.N. 139 of 1965.1967 No. 27.1963 No.6. Cap. 11.]\n         (2) Where any person being a citizen of Nigeria is deported from any British possession to\nNigeria under the provisions of any law of such possession and for offences similar to the offences\ncontained in section 219, 222A, 222B, 223, 225A, or 225B of this Code, such person may, on arrival in\nNigeria, be kept temporarily in custody and returned under police escort to the place in Nigeria to which\nsuch person belongs."},{"c":"CC","n":"233B","t":"Interpretation","ch":"Chapter 21A – Obscene Publications","p":"Part 4 – Acts injurious to the public in general","x":"In this Chapter-\n\n                                                [1961 No. 51.]\n\n        \"article\" means anything capable of being or likely to be looked at and read or looked at or read,\nand includes any film or record of a picture or pictures, and any sound records;\n\n        \"distribute\" includes circulates, lends, sells, lets on hire or offers for sale or on hire;\n\n        \"projects\", in relation to an article to be looked at or heard, includes shows or plays."},{"c":"CC","n":"233C","t":"Test of obscenity","ch":"Chapter 21A – Obscene Publications","p":"Part 4 – Acts injurious to the public in general","x":"(1) An article shall be deemed to be obscene for the purposes of this Chapter if its effect taken\nas a whole is such as to tend to deprave and corrupt persons who are likely, having regard to all relevant\ncircumstances, to read, see or hear the matter contained or embodied in it.\n\n                                           [1961 No. 51.]\n\n        (2) The provisions of this section of this Code shall extend to any article of two or more distinct\nitems the effect of anyone of which is such as to tend to deprave and corrupt; but nothing in this section\nshall apply to exhibitions in private houses to which the public are not admitted or to anything done in\nthe course of television or sound broadcasting."},{"c":"CC","n":"233D","t":"Prohibition of publication of obscene matter","ch":"Chapter 21A – Obscene Publications","p":"Part 4 – Acts injurious to the public in general","x":"(1) Subject to the provisions of this Chapter, any person who, whether for gain or not,\ndistributes or projects any article deemed to be obscene for the purposes of this Chapter, commits an\noffence punishable on conviction by a fine not exceeding four hundred naira or by imprisonment for a\nterm not exceeding three years or by both.\n\n                                          [1961 No. 51.]\n\n        (2) A person shall not be convicted of an offence against this section of this Code if he proves\nthat he had not examined the article in respect of which he is charged and had no reasonable cause to\nsuspect that it was such that his publication of it would make him liable to be convicted of an offence\nagainst this section of this Code.\n\n          (3) In any proceedings against a person under this section of this Code, the question whether an\narticle is obscene shall be determined without regard to any publication by another person unless it\ncould reasonably have been expected that the publication by the other person would follow from\npublication by the person charged.\n\n       (4) No prosecution for an offence against this section of this Code shall be commenced more\nthan two years after the commission of the offence."},{"c":"CC","n":"233E","t":"Power of search and seizure","ch":"Chapter 21A – Obscene Publications","p":"Part 4 – Acts injurious to the public in general","x":"(1) Subject to the provisions of this Chapter, if a magistrate is satisfied by information on oath\nthat there is reasonable ground for suspecting that articles deemed to be obscene for the purposes of\nthis Chapter are, or are from time to time, kept for publication for gain in any premises or on any stall or\nvehicle in the State, the magistrate may issue a warrant under his hand empowering any constable to\nenter (if need be by force) and search the premises, or to search the stall or vehicle, within fourteen\ndays from the date of the warrant, and to seize and remove any articles found therein or thereon which\nthe constable has reason to believe to be obscene articles for the purposes of this Chapter and to be\nkept for publication for gain.\n\n                                         [1961 No. 51.]\n\n       (2) A warrant under subsection (1) of this section shall, if any obscene articles are seized under\nthe warrant, also empower the seizure and removal of any documents found in the premises or, as the\ncase may be, on the stall or vehicle which relate to a trade or business carried on at the premises or\nfrom the stall or vehicle.\n\n         (3) Articles seized under subsection (1) of this section may, be brought before the magistrate\nwho issued the warrant or before any other magistrate and the magistrate before whom the articles are\nbrought may thereupon issue a summons to the occupier of the premises, or as the case may be, the\nuser of the stall or vehicle, to appear on a day specified in the summons before a magistrate's court, to\nshow cause why the articles or any of them should not be forfeited. If the court is satisfied, as respects\nany of the articles, that at the time when they were seized they were obscene articles kept for\npublication for gain, the court shall order those articles to be forfeited; but no order shall be made\nunder this subsection in default of appearance by the person summoned unless service of the summons\nis proved.\n\n        (4) In addition to the person summoned, any other person being the owner, author or maker of\nany of the articles brought before the court, or any other person through whose hand they had passed\nbefore being seized, shall be entitled to appear before the court on the day specified in the summons to\nshow cause why they should not be forfeited.\n         (5) Where an order is made under this section of this Code for the forfeiture of any articles, any\nperson who appeared, or was entitled to appear, to show cause against the making of the order, may\nappeal to the High Court; and no such order shall take effect until the expiration of fourteen days after\nthe day on which the order is made, or, if before the expiration thereof notice of appeal is duly given,\nuntil the final determination or abandonment of the proceedings on the appeal.\n\n         (6) If, as respects any articles brought before it, the court does not order forfeiture, the court\nmay if it thinks fit, order the person on whose information the warrant for the seizure of the articles was\nissued to pay such costs as the court thinks reasonable to any person who has appeared before the\ncourt to show cause why those articles should not be forfeited; and costs ordered to be paid under this\nsubsection shall be enforceable as a civil debt.\n\n        (7) For the purposes of this section of this Code, the question whether an article is obscene shall\nbe determined on the assumption that copies of it would be published in any manner likely having\nregard to the circumstances in which it was found, but in no other manner.\n\n        (8) Nothing in this section shall be construed to preclude the making of any order for the\npurposes of section 263 of the Criminal Procedure Act (which relates to disposal of property produced\nbefore a court)."},{"c":"CC","n":"233F","t":"Defence of public good","ch":"Chapter 21A – Obscene Publications","p":"Part 4 – Acts injurious to the public in general","x":"(1) No person shall be convicted of an offence against this Chapter, and no order for forfeiture\nshall be made if it is proved that the publication of the article in question is justified as being for the\npublic good on the ground that it is in the interests of science, literature, art or learning, or of other\nobjects of general concern.\n\n                                                    [1961 No. 51.]\n\n        (2) It is hereby declared that the opinion of experts as to the literary, artistic, scientific or other\nmerits of an article may be admitted in any proceedings under this Chapter either to establish or to\nnegative the said ground."},{"c":"CC","n":"234","t":"Common nuisance","ch":"Chapter 22 – Nuisances; gaming houses; lotteries; misconduct relating to corpses","p":"Part 4 – Acts injurious to the public in general","x":"Any person who-\n\n(a)      obstructs any highway, by any permanent work or erection thereon or injury thereto, which\n        renders the highway less commodious to the public than it would otherwise be; or\n(b)     prevents the public from having access to any part of a highway by an excessive and\n        unreasonable temporary use thereof, or by so dealing with the land in the immediate\n        neighbourhood of the highway as to prevent the public from using and enjoying it securely; or\n\n(c)     does not repair a highway which he is bound to repair; or\n\n(d)     does not repair a bridge which he is bound to repair; or\n\n(e)     wilfully diverts or obstructs the course of any navigable river so as to appreciably diminish its\n        convenience for purposes of navigation; or\n\n(f)     does any act not warranted by law, or omits to discharge any legal duty, which act or omission\n        obstructs or causes inconvenience or damage to the public in the exercise of rights common to\n        the public,\n\nis guilty of a misdemeanor and is liable to imprisonment for two years.\n\nIt is immaterial whether the act complained of is convenient to a larger number of the public than it\ninconveniences, but the fact that the act complained of facilita
