oes any\n\nother act in a suit or criminal prosecution, shall be punished with imprisonment\n\nfor a term which may extend to three years or with fine or with both."},{"c":"PC","n":"180","t":"False charge of offence made with intent to injure","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever with intent to cause injury to a person institutes or cause to\n\nbe instituted a criminal proceeding against that person or falsely charges a per-\n\nson with having committed an offence knowing that there is no just or lawful\n\nground for that proceeding or charge against that person, shall be punished-\n\n(a) with imprisonment for a term which may extend to two years or with\n\nfine or with both; and\n\n(b) where such criminal proceeding is instituted on a false charge of an\n\noffence punishable with death or imprisonment for seven years or\n\nupwards, with imprisonment for a term which may extend to seven\n\nyears or with fine or with both."},{"c":"PC","n":"181","t":"Taking gift to help to recover stolen property","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever takes or agrees or consents to take a gratification under\n\npretence or on account of helping any person to recover a movable property of\n\nwhich he shall have been deprived by any offence, shall, unless he uses\n\nmeans in his power to cause the offender to be brought to justice, be punished\n\nwith imprisonment for a term which may extend to seven years or with fine or\n\nwith both.\n\nEXPLANATION. In this section the word \"offence\" includes an act done out-\n\nside the Federal Capital Territory, Abuja, which if done in the Federal Capital\n\nTerritory, Abuja, would be an offence."},{"c":"PC","n":"182","t":"Influencing course of justice","ch":"Chapter XII – FALSE EVIDENCE AND OFFENCES RELATING TO THE ADMINISTRA NON OF JUSTICE Offences relating to Evidence","p":"","x":"Whoever with intent to influence the course of justice in a civil or\n\ncriminal proceeding does an act whereby the fair hearing, trial or decision of a\n\nmatter in that proceeding may be prejudiced shall be punished with imprisonment\n\nfor a term which may extend to two years or with fine or with both."},{"c":"PC","n":"183","t":"Public nuisance defined","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"(I) A person is guilty of a public nuisance who does an act or is guilty\n\nof an illegal omission which causes a common injury, danger or annoyance to\n\nthe public or to the people in general who dwell or occupy property in the\n\nvicinity or which must necessarily came injury, obstruction, danger or annoyance\n\nto persons who may have occasion to use a public right.\n\n(2) Where premises on which a public nuisance has occurred are occupied\n\nby two or more persons in common each of those persons shall be liable to\n\nconviction on account of the nuisance in the absence of sufficient evidence\n\nthat he has not been guilty of the offence.\n\nEXPLANATION 1. A public nuisance does not cease to be an offence because\n\nit causes some convenience or advantage.\n\nEXPLANATION 2. Whether an act or omission is a public nuisance is a matter\n\nof fact, which may depend on the character of the neighbourhood.\n\nIllustration. A powerful steam whistle sounded at intervals during the day, which\n\nmight be a public nuisance in a residential quarter, may not be a public\n\nnuisance in a manufacturing quarter."},{"c":"PC","n":"184","t":"Adulteration of food or drink intended for sale","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever adulterates an article of food or drink or abstracts from an\n\narticle of food or drink a part thereof so as to affect injuriously the quality,\n\nsubstance or nature, intending to sell that article as food or drink without\n\nnotice to the purchaser or knowing that it is likely that the same will be sold as\n\nfood or drink without notice to the purchaser, shall be punished with imprisonment\n\nfor a term which may extend to one year or with fine not exceeding\n\ntwo hundred naira."},{"c":"PC","n":"185","t":"Sale of food or drink not corresponding to description","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever sells an article of food or drink which is not of the nature,\n\nsubstance and quality demanded by the purchaser or the article which the seller\n\nrepresents it to be, shall be punished with fine which may extend to twenty\n\nnaira."},{"c":"PC","n":"186","t":"Sale of adulterated food or drink","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever sells or offers or exposes for sale an article of food or drink,\n\nd k with which an admixture has been fraudulently made to increase the bulk,\n\nweight or measure of such article or to conceal the inferior quality thereof, or\n\nany article of food or drink, from which any part has been intentionally\n\nabstracted so as to affect injuriously its quality, substance or nature, without\n\nnotice to the purchaser, shall be punished with imprisonment for a term which\n\nmay extend to six months or with fine not exceeding one hundred naira or\n\nwith both."},{"c":"PC","n":"187","t":"Sale of noxious food or drink","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever sells or offers or exposes for sale as food or drink an article\n\nwhich has been rendered or has become noxious or is in a state unfit for food\n\nor drink, knowing or having reason to believe that the same is noxious as or\n\nunfit for food or drink, shall be punished with imprisonment for a. term which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"188","t":"Adulteration of drugs","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever adulterates a drug or medical preparation in such a manner\n\nas to lessen the efficacy or change the operation of that drug or medical preparation\n\nor to make it noxious, intending that it shall be sold or used for or\n\nknowing it to be likely that it will be sold or used for a medicinal purpose as if\n\nit had not undergone that adulteration, shall be punished with imprisonment\n\nfor a term which may extend to six months or with fine which may extend to\n\none hundred naira or with both."},{"c":"PC","n":"189","t":"Sale of adulterated drugs","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever, knowing a drug or medical preparation to have been adulterated in such\na manner as to lessen its efficacy or change its operation or render it noxious, sells the\nsame or offers or exposes it for sale or issues it from a dispensary for medicinal purposes as\nunadulterated or causes it to be used for medicinal purposes by a person not knowing of\nthe adulteration, shall\n\nbe punished with imprisonment for a term which may extend to six months or with fine\nwhich may extend to one hundred naira or with both."},{"c":"PC","n":"190","t":"Sale of drug as a different drug or preparation","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever knowingly sells or offers or exposes for sale or issues from a\n\ndispensary for medicinal purposes a drug or medical preparation as a different\n\ndrug or medical preparation; shall be punished with imprisonment for a term\n\nwhich may extend to six months or with fine which may extend to one hundred\n\nnaira or with both."},{"c":"PC","n":"191","t":"Fouling water of public well or reservoir","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever voluntarily corrupts or fouls the water of a public well or\n\nreservoir or other public water supply so as to render it less fit for the purpose\n\nfor which it is ordinarily used, shall be punished with imprisonment for a term\n\nwhich may extend to two years or with fine or with both."},{"c":"PC","n":"192","t":"Making atmosphere noxious to health","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever voluntarily vitiates the atmosphere in a place so as to make it\n\nnoxious to the health of persons in general dwelling or carrying on business in the\n\nneighbourhood or passing along a public way, shall be punished with imprisonment for a\nterm which may extend to six months or with fine or with both."},{"c":"PC","n":"193","t":"Exhibition of false light, mark or buoy","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever exhibits a false light, mark or buoy intending or knowing it\n\nto be likely that the exhibition will mislead a navigator, shall be punished with\n\nimprisonment for a term which may extend to seven years or with fine or with\n\nboth."},{"c":"PC","n":"194","t":"Obstruction in public way or line of navigation","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever by doing an act or by omitting to keep in order any property\n\nin his possession or under his charge causes obstruction to a person in a public\n\nway or public line of navigation, shall be punished with imprisonment which\n\nmay extend to two years or with fine or with both."},{"c":"PC","n":"195","t":"Employees engaged on work of public utility ceasing work without notice","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever being an employee engaged in a work connected with the\n\npublic health or safety or with a service of public utility ceases from that work in\n\npre-arranged agreement with two or more other such employees without giving\n\nto his employer fifteen days notice of his intention so to do, shall, if the intention\n\nor effect of that cessation is to interfere with the performance of a general service\n\nconnected with public health, safety or utility to an extent which will cause injury\n\nor damage or grave inconvenience to the community, be punished with imprisonment\nwhich may extend to six months or with me or with both."},{"c":"PC","n":"196","t":"Negligent conduct causing danger to person or property","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"Whoever does an act in a manner so rash or negligent as to endanger human life or\nto be likely to cause hurt or injury to a person or property, or knowingly or negligently\nomits to take such order with any property or substance in his possession or under his\ncontrol or with any operation under his control as is sufficient to guard against probable\ndanger to human life from such property, substance or operations, shall be punished with\nimprisonment for a term which may extend to six months or with fine which may extend\nto one hundred naira or with both."},{"c":"PC","n":"197","t":"Negligent conduct with respect to animal","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"198","t":"Punishment for public nuisance in cases not otherwise provided for","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"199","t":"Continuance of nuisance after injunction to discontinue","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"200","t":"Obscene or indecent acts","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"201","t":"Keeping a brothel","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"202","t":"Sale of obscene books, etc","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"203","t":"Obscene songs, etc","ch":"Chapter XIII – PUBLIC NUISANCE","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"204","t":"Interpretation in Chapter XIV","ch":"Chapter XIV – LOITERIES AND GAMING HOUSES","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"205","t":"Keeping gaming house or lottery office","ch":"Chapter XIV – LOITERIES AND GAMING HOUSES","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"206","t":"Offences relating to lotteries","ch":"Chapter XIV – LOITERIES AND GAMING HOUSES","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"207","t":"Ill-treatment of domestic animals","ch":"Chapter XV – CRUELTY TO ANIMALS","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"208","t":"Over-riding and neglect of animal","ch":"Chapter XV – CRUELTY TO ANIMALS","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"210","t":"Insulting or exciting contempt of religious creed","ch":"Chapter XVI – OFFENCES RELATING TO RELIGION I","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"211","t":"Injuring or defiling place of worship","ch":"Chapter XVI – OFFENCES RELATING TO RELIGION I","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"212","t":"Disturbing religious assembly","ch":"Chapter XVI – OFFENCES RELATING TO RELIGION I","p":"","x":"[Text of this section was not found in the source PDF.]","m":1},{"c":"PC","n":"213","t":"Committing trespass on place of worship or burial","ch":"Chapter XVI – OFFENCES RELATING TO RELIGION I","p":"","x":"Whoever, with the intention of wounding the feelings of a person or of insulting the\nreligion of a person or with the knowledge that the feelings of a person are likely to be\nwounded or that the religion of a person is likely to be insulted thereby, commits a\ntrespass in a place of worship or in any place of burial or offers an indignity to a human\ncorpse a causes disturbance to persons assembled for the performance of funeral\nceremonies, shall be punished with imprisonment for a term which may extend to two\nyears or with fine or with both."},{"c":"PC","n":"214","t":"Trial by ordeal","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"Whoever presides or is present at an unlawful trial by ordeal shall be punished-\n\n(a) with imprisonment which may extend to ten years or with fine or with\n\nboth; and\n\n(b) if such trial results in the death of any party to the proceeding shall be punished with\ndeath.\n\nEXPLANATION. The trial by any ordeal which is likely to result in the death of or bodily\ninjury to any party to the proceeding is unlawful."},{"c":"PC","n":"215","t":"Unlawful juju","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"The Minister may by order declare the worship or invocation of any juju to be\nunlawful."},{"c":"PC","n":"216","t":"Offences relating to witchcraft and juju","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"Whoever-\n\n(a) by his statements or actions represents himself to be a witch or to have the power of\nwitchcraft; or\n\n(b) accuses or threatens to accuse a person with being a witch or with having the power\nof witchcraft; or\n\n(c) makes or sells or uses, or has in his possession or represents himself to be in possession\nof any juju, drug or charm which is intended to be used or reported to possess the power\nto prevent or delay a person from doing an act which that person has a legal right to do,\nor to compel a person to do an act which that person has a legal right to refrain from\n\ndoing, or which is alleged or reported to possess the power of causing a natural\nphenomenon or a disease or an epidemic; or\n\n(d) presides at or is present at or takes part in the worship or invocation of any juju which\nhas been declared unlawful under the provisions of section 215\n\nof this Penal Code; or\n\n(e) is in possession of or has control over any human remains which are\n\nused or are intended to be used in connection with the worship or invocation\n\nof any juju; or\n\n(f) makes or uses or assists in making or using, or has in his possession\n\nanything whatsoever the making, use or possession of which has been\n\ndeclared unlawful under the provisions of section 215 of this Penal Code,\n\nshall be punished with imprisonment which may extend to two years or with\n\nfine or with both."},{"c":"PC","n":"217","t":"Criminal charms","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"Whoever knowingly has in his possession a fetish or charm which is\n\npretended or reputed to possess power to protect a person in the committing of\n\nany offence shall be punished with imprisonment which may extend to five\n\nyears or with fine or with both."},{"c":"PC","n":"218","t":"Cannibalism","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"Whoever knowingly eats or receives for the purpose of eating a part\n\nof a human corpse shall be punished with imprisonment for a term which may\n\nextend to two years or with fine or with both."},{"c":"PC","n":"219","t":"Unlawful possession of human head","ch":"Chapter XVII – OFFENCES RELATING TO ORDEAL. WITCHCRAFT AND JUJU SECTION","p":"","x":"Whoever receives or has in his possession a human head or skull\n\nwithin six months of the same having been separated from the body or skeleton\n\nwith the intention that the head or skull shall be possessed by any person\n\nas a trophy, juju or charm shall be punished with imprisonment which may\n\nextend to five years or with fine or with both.\n\nEXPLANATION. Where it is proved that a person received or had in his possession\n\nsuch human head or skull proof that he received or had such human head\n\nor skull in his possession for a lawful purpose shall lie on that person."},{"c":"PC","n":"220","t":"Culpable homicide defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever causes death-\n\n(a) by doing an act with the intention of causing death or such bodily injury as is likely to\ncause death; or\n\n(b) by doing an act with the knowledge that he is likely by such act to cause death; or\n\n(c) by doing a rash or negligent act, commits the offence of culpable homicide.\n\nIllustrations. (a) A lays sticks and turf over a pit with the intention of thereby causing death\nor with the knowledge that death is likely to be thereby caused. Z believing the ground\nto be firm treads on it ,falls in and is killed. A has committed the offence of culpable\nhomicide.\n\n(b) A knows Z to be behind a bush. B does not know it. A intending to cause or knowing it\nto be likely to cause Z's death induces B to fire at the bush. B fires and kills Z. Here B may\nbe guilty of no offence.. but A has committed the offence of culpable homicide.\n\n(c) A by shooting at a fowl with intent to kill and steal it kills B, who is behind a bush, A not\nknowing that he was there. Here, although A was doing an unlawful act, he was not\nguilty of culpable homicide as he did not intend to kill B or cause death by doing an act\n\nthat he knew was likely to cause death, but he may be guilty of culpable homicide not\npunishable with death if, in shooting at the fowl, he acted rashly or negligently.\n\nEXPLANATION 1. A person who causes bodily injury to another who is labouring under a\ndisorder, disease or bodily infirmity and thereby accelerates the death of that other, shall\nbe deemed to have caused his death.\n\nEXPLANATION 2. Where death is caused by bodily injury, the person who causes such\nbodily injury shall be deemed to have caused the death, although by resorting to proper\nremedies and skilful treatment the death might have been prevented.\n\nEXPLANATION 3. The causing of the death of a child in the mother's womb is not\nhomicide; but it may amount to culpable homicide to cause the death of a living child, if\nany part of that child has been brought forth, although the child may not have breathed\nor been completely born."},{"c":"PC","n":"221","t":"Culpable homicide punishable with death","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Except in the circumstances mentioned in section 222 of this Penal Code, culpable\nhomicide shall be punished with death-\n\n(a) if the act by which the death is caused is done with the intention of causing death;\nor\n\n(b) if the doer of the act knew or had reason to know that death would be the probable\nand not only a likely consequence of the act or of any bodily injury which the act was\nintended to cause.\n\nEXPLANATION. Whether death was the probable or only a likely consequence of an act\nor of any bodily injury, is a question of fact.\n\nIllustrations.\n\n(a) In illustrations (a) and (b) to section 20, if A's act is done with the intention of causing\ndeath the offence is culpable homicide punishable with death. If it is done with the\nknowledge that death is likely to be thereby caused, the offence mayor may not be\npunishable with death according to whether death was the probable consequence or\nonly a likely consequence of A's act.\n\n(b) A, knowing that Z is labouring under such a disease that a blow would probably\ncause his death, strikes him with the intention of causing bodily injury. Z dies in\nconsequence of the blow. A is guilty of culpable homicide punishable with death,\nalthough the blow might not have been sufficient to cause the death of a person in a\nsound state of health. But if A, not knowing that Z is labouring under any disease, gives\nhim such a blow as would not ordinarily kill a person in a sound state of health, here A is\nnot guilty of culpable homicide punishable with death unless he intended to cause\ndeath or such bodily injury as would probably cause death.\n\n(c) A fires a loaded cannon into a crowd of persons and kills one of them. A is guilty of\nculpable homicide punishable with death, although he may not have had a\npremeditated design to kill any particular individual."},{"c":"PC","n":"222","t":"When culpable homicide is not punishable with death","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Culpable homicide is not punishable with death if the offender whilst deprived of\nthe power of self control by grave and sudden provocation causes the death of the\nperson who gave the provocation or causes the death of any other person by mistake or\naccident.\n\nEXPLANATION. Whether the provocation was grave and sudden enough to prevent the\noffence from amounting to culpable homicide punishable with death is a question of\nfact.\n\nIllustrations. (a) A, under the influence of passion excited by grave and sudden\nprovocation given by Z, intentionally kills the child of Z. This is culpable homicide\npunishable with death, inasmuch as the provocation was not given by the child.\n\n(b) Y gives grave and sudden provocation to A. A on this provocation fires a pistol at Y,\nneither intending nor knowing himself to be likely to kill Z, who is near him but out of sight.\nA kills Z. Here A has committed culpable homicide not punishable with death.\n\n(c) Z gives grave and sudden provocation to B who is thereby excited to violent rage. A\na bystander intending to take advantage of B' s rage and to cause hurt to kill Z, puts a\nknife into B's hand for that purpose. B kills Z with his knife. Here B has committed culpable\nhomicide not punishable with death but A is guilty of culpable homicide punishable with\ndeath.\n\n (2) Culpable homicide is not punishable with death if the offender, in the exercise in\ngood faith of the right of private defence of person or property, exceeds the power\ngiven to him by law and causes the death of the person against whom he is exercising\nsuch right of defence without premeditation and without any intention of doing more\nharm than is necessary for the purpose of that defence.\n\n(3) Culpable homicide is not punishable with death if the offender, being a public officer\nacting for the advancement of public justice or being a person aiding a public officer so\nacting exceeds the powers given to him by law and causes death by doing an act\nwhich he in good faith believes to be lawful and necessary for the due discharge of his\nduty as a public officer or for assisting that public officer in the due discharge of such\nduty and without ill will towards the person whose death is caused.\n\n(4) Culpable homicide is not punishable with death if it is committed without\npremeditation in a sudden fight in the heat of passion upon a sudden quarrel and\nwithout the offender's having taken undue advantage or acted in a cruel or unusual\nmanner.\n\nEXPLANATION. It is immaterial in such cases which party first provokes the other or\ncommits the first assault.\n\n(5) Culpable homicide is not punishable with death when the person whose death is\ncaused, being above the age of eighteen years, suffers death or takes the risk of death\nwith his own consent.\n\n (6) Culpable homicide is not punishable with: death where a woman intentionally\ncauses the death of her child being a child under the age of twelve months, but at the\ntime of the act or omission the balance of her mind was disturbed by reason of her not\nhaving fully recovered from the effect of giving birth to the child or by reason of the\neffect of lactation consequent upon the birth of the child.\n\n(7) Culpable homicide is not punishable with death when a person causes the death of\nanother by doing a rash or negligent act."},{"c":"PC","n":"223","t":"Culpable homicide by causing death of person other than person","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"If a person by doing anything which he intends or knows to be likely to cause death\ncommits culpable homicide by causing the death of a person whose death he neither\nintends nor knows himself to be likely to cause, the culpable homicide committed by the\noffender is of the description of which it would have been if he had caused the death of\nthe person whose death he intended or knew himself to be likely to cause."},{"c":"PC","n":"224","t":"Culpable homicide not punishable with death","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever commits culpable homicide not punishable with death, shall be punished\nwith imprisonment for life or for any less term or with fine or with both."},{"c":"PC","n":"225","t":"Death caused when intention is to cause hurt only","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever causes the death of a person by doing an act not amounting to culpable\nhomicide but done with the intention of causing hurt or grievous hurt, shall be punished\nwith imprisonment for a term which may extend to fourteen years or with fine or with\nboth."},{"c":"PC","n":"226","t":"Death caused in act of committing offence","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever causes the death of a person by doing an act not amounting to culpable\nhomicide which constitutes an offence punishable with imprisonment for one year or\nwith any greater punishment or by any act done in committing such an offence, shall be\npunished with imprisonment for a term which may extend to ten years or with fine or with\nboth."},{"c":"PC","n":"227","t":"Abetment of suicide of child or insane person","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"If a person under eighteen years of age, an insane person, a delirious person, an\nidiot or a person in a state of intoxication commits suicide, whoever abets the\ncommission of that suicide shall be punished with death."},{"c":"PC","n":"228","t":"Abetment of suicide","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"If a person commits suicide, whoever abets the commission of that suicide shall be\npunished with imprisonment for a term which may extend to ten years and shall also be\nliable to fine."},{"c":"PC","n":"229","t":"Attempts to commit culpable homicide","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever does an act not resulting in death with such intention or knowledge\nand in such circumstances that if he by that act caused death, he would be guilty of\nculpable homicide punishable with death shall be punished with imprisonment for life or\nfor any less term or with fine or with both.\n\n(2) When a person being under sentence of imprisonment for life commits an offence\nunder this section, he shall, if hurt is caused, be punished with death.\n\nIllustrations. (a) A shoots at Z with intention to kill him, in such circumstances that, if death\nensued, A would be guilty of culpable homicide punishable with death. A is liable to\npunishment under this section.\n\n (b) A with the intention of causing the death of a child of tender years exposes it in a\ndesert place. A has committed the offence denied by this section, though the death of\nthe child does not ensue.\n\n(c) A, intending to kill Z, buys a gun and loads it. A has not yet committed the offence. A\nfires the gun at Z. He has committed the offence defined in this section.\n\n (d) A intending to kill Z by poison, purchases poison and mixes it with food which remains\nin A's keeping.. A has not yet committed the offence in this section. A places the food\non Z's table or delivers it to Z's servants to place it on Z's table. A has committed the\noffence defined in this section."},{"c":"PC","n":"230","t":"Attempt to commit culpable homicide not punishable with death","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever does an act with such intention or knowledge and in such circumstances\nthat, if he by that act caused death, he would be guilty of culpable homicide not\npunishable with death, shall be punished-\n\n(a) with imprisonment for a term which may extend to three years or with fine or with\nboth; or\n\n(b) if hurt is caused to any person by such act with imprisonment which may extend to\nseven years or with fine or with both."},{"c":"PC","n":"231","t":"Attempt to commit suicide","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever attempts to commit suicide and does an act towards the commission of\nthat offence, shall be punished with imprisonment for a term which may extend to one\nyear or with fine or with both. Causing Miscarriage, Injuries to Unborn Children, Exposure\nof Infants, Cruelty to Children and Concealment of Births."},{"c":"PC","n":"232","t":"Causing miscarriage","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever voluntarily causes a woman with child to miscarry shall, if the miscarriage\nbe not caused in good faith for the purpose of saving the life of the woman, be punished\nwith imprisonment for a term which may extend to fourteen years or with fine or with\nboth.\n\nEXPLANATION. A woman, who causes herself to miscarry, is within the meaning of this\nsection."},{"c":"PC","n":"233","t":"Death caused by act done with intent to cause miscarriage","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever with intent to cause the miscarriage of a woman whether with child or not\ndoes an act which causes the death of that woman, shall be punished-\n\n(a) with imprisonment for a term which may extend to fourteen years and shall also be\nliable to fine; and\n\n(b) if the act is done without the consent of the woman, with imprisonment for life or for\nany less term and shall also be liable to fine.\n\nEXPLANATION. It is not essential for an offence under this section that the offender should\nknow that the act is likely to cause death."},{"c":"PC","n":"234","t":"Causing miscarriage unintentionally","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever uses force to a woman and thereby unintentionally causes her to miscarry,\nshall be punished-\n\n(a) with imprisonment for a term which may extend to three years or with fine or with\nboth; and (b) if the offender knew that the woman was with child, he shall be punished\nwith imprisonment for a term which may extend to five years or with fine or with both."},{"c":"PC","n":"235","t":"Act done with intent to prevent child being born alive or to cause it to die after birth","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever before the birth of a child does an act with the intention of Act thereby\npreventing that child from being born alive or causing it to die after its birth and does by\nsuch act prevent that child from being born alive or causes it to die after its birth, shall, if\nthe act be not caused in good faith for the purpose bar of saving the life of the mother,\nbe punished with imprisonment for a term which may extend to fourteen years or with\nfine or with both."},{"c":"PC","n":"236","t":"Causing death of quick unborn child by act amounting to culpable homicide","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever does an act in such circumstances that, if he thereby caused death he\nwould be guilty of culpable homicide, and does by that act cause the death of a quick\nunborn child, shall be punished with imprisonment for life or for any less term and shall\nalso be liable to fine.\n\nIllustration. A, knowing that he is likely to cause the death of a pregnant woman, does an\nact which, if it caused the death of the woman, would amount to culpable homicide.\nThe woman is uninjured but does not die; but the death of a quick unborn child with\nwhich she is pregnant is thereby caused. A is guilty of an offence under this section."},{"c":"PC","n":"237","t":"Abandonment of child under twelve years","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever being the father or mother or having the care of a child under the age of\ntwelve years exposes or leaves that child in a place with the intention of wholly\nabandoning the child, shall be punished with imprisonment for a term which may extend\nto seven years or with fine or with both.\n\nEXPLANATION. This section does not prevent the trial of the offender for culpable\nhomicide if the child dies in consequence of the exposure or abandonment."},{"c":"PC","n":"238","t":"Cruelty to children","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever having the charge or care of a child under the age of fifteen years or\nbeing in a position of authority over him willfully ill-treats or neglects him in such a way as\nto cause him unnecessary suffering, shall be punished-\n\n(a) with imprisonment for a term which may extend to two years or with fine or with both;\nand\n\n(b) if the ill treatment or neglect results in serious injury to the health of such child, the\noffender shall be punished with imprisonment for a term\n\nwhich may extend to five years or with fine or with both."},{"c":"PC","n":"239","t":"Concealment of birth Hurt","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever, by secretly burying or otherwise disposing of the dead body of a child\nwhether the child dies before or after or during its birth, intentionally conceals or\nendeavours to conceal the birth of that child, shall be punished, with imprisonment for a\nterm which may extend to two years or with fine or with both."},{"c":"PC","n":"240","t":"Hurt defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever causes bodily pain, disease or infirmity to a person is said to cause hurt."},{"c":"PC","n":"241","t":"Grievous hurt defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"The following kinds of hurt only are designated as grievous-\n\n(a) emasculation;\n\n(b) permanent deprivation of the sight of an eye, of the hearing of an ear or the power\nof speech;\n\n(c) deprivation of any member or joint;\n\n(d) destruction or permanent impairing of the powers of any member or joint;\n\n(e) permanent disfiguration of the head or face;\n\n(f) fracture or dislocation of a bone or tooth;\n\n(g) any hurt which endangers life or which causes the sufferer to be during the space of\ntwenty days in severe bodily pain or unable to follow his\n\nordinary pursuits."},{"c":"PC","n":"242","t":"Voluntarily causing hurt defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever does an act with the intention of thereby causing hurt to a person or with\nthe knowledge that he is likely thereby to cause hurt to a person and does thereby\ncause hurt to a person is said voluntarily to cause hurt."},{"c":"PC","n":"243","t":"Voluntarily causing grievous hurt defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever voluntarily causes hurt, if the hurt which he intends to cause or knows\nhimself to be likely to Cause is grievous hurt and if the hurt which he causes is grievous\nhurt, is said voluntarily to cause grievous hurt.\n\nEXPLANATION. A person is not said voluntarily to cause grievous hurt except when he both\ncauses grievous hurt and intends or knows himself to be likely to cause grievous hurt.But\nhe is said voluntarily to cause grievous hurt if intending or knowing himself to be likely to\ncause grievous hurt of one kind he actually causes grievous hurt of another kind.\n\nIllustrations. A, intending or knowing himself; to be likely permanently to disfigure Z's face,\ngives Z a blow which does not permanently disfigure Z's\n\nface but which causes Z to suffer severe bodily pain for the space of twenty days. A has\nvoluntarily caused grievous hurt."},{"c":"PC","n":"244","t":"Voluntarily causing hurt on provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever voluntarily causes hurt on grave and sudden provocation, if he neither\nintends nor knows himself to be .likely to cause hurt to a person other than the person\nwho gave the provocation, shall be punished with imprisonment for a term which may\nextend to one month or with fine which may extend to twenty naira or with both."},{"c":"PC","n":"245","t":"Voluntarily causing grievous hurt on provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever voluntarily causes grievous hurt on grave and sudden provocation, if he\nneither intends nor knows himself to be likely to cause grievous hurt to a person other\nthan the person who gave the provocation, shall be punished with imprisonment for a\nterm which may extend to four years or with fine which may extend to one hundred\nnaira or with both."},{"c":"PC","n":"246","t":"Voluntarily causing hurt without provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever, except in the case provided for by section 244 of this Penal Code,\nvoluntarily causes hurt, shall be punished with imprisonment for a term which may extend\nto one year or with fine which may extend to forty naira or with both."},{"c":"PC","n":"247","t":"Voluntarily causing grievous hurt without provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever, except in the case provided for by section 245 of this Penal Code,\nvoluntarily causes grievous hurt, shall be punished with imprisonment for a term which\nmay extend to seven years and shall also be liable to fine."},{"c":"PC","n":"248","t":"Voluntarily causing hurt or grievous hurt by dangerous means","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever, except in the case provided for by section 244 of this Penal Code,\nvoluntarily causes hurt by means of an instrument for shooting, stabbing or cutting or any\ninstrument, which used as a weapon of offence is likely to cause death, or by means of\nfire or any heated substance or by means of electricity or by means of a corrosive or\nexplosive substance or by the administration of a poisonous or deleterious substance or\nby means of an animal, shall be punished with imprisonment for a term which may\nextend to three years or with fine or with both.\n\n(2) Whoever, except in the case provided for by section 245 of this Penal Code,\nvoluntarily causes grievous hurt by any of the means mentioned in sub- section (1) of this\nsection shall be punished with imprisonment for a term which may extend to fourteen\nyears and shall also be liable to fine."},{"c":"PC","n":"249","t":"Causing hurt by means of poison with intent to commit an offence","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever administers to or causes to be taken by a person a poison or any\nstupefying, intoxicating or unwholesome drug or thing with intent to cause hurt to that\nperson or with intent to commit or to facilitate the commission of an offence or knowing\nit to be likely that he will thereby cause hurt, shall be punished with imprisonment for a\nterm which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"250","t":"Voluntarily causing hurt to extort property or to constrain to an illegal act","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever voluntarily causes hurt for the purpose of extorting from the person hurt\nor from a person interested in the person hurt any property or document of title or of\nconstraining the person hurt or a person interested in the person hurt to do anything\nwhich is illegal or which may facilitate the commission of an offence, shall be punished\nwith imprisonment for a term which may extend to ten years and shall also be liable to\nfine.\n\n(2) Whoever for the like purpose voluntarily causes grievous hurt, shall be punished with\nimprisonment for a term which may extend to fourteen years and shall also be liable to\nfine."},{"c":"PC","n":"251","t":"Voluntarily causing hurt to extort, confession or to compel restoration of property","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever voluntarily causes hurt for the purpose of extorting from the person hurt\nor any person interested in the person hurt a confession or an information which may\nlead to the detection of an offence or misconduct or for the purpose of constraining the\nperson hurt or a person interested in the person hurt to restore or to cause the restoration\nof any property or document of title or to satisfy a claim or demand or to give\ninformation which may lead to the restoration of any property or document of title, shall\nbe punished with imprisonment for a term which may extend to seven years and shall\nalso be liable to fine.\n\n(2) Whoever for the like' purpose voluntarily causes grievous hurt, shall be punished with\nimprisonment for a term which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"252","t":"Voluntarily causing hurt or grievous hurt to deter public officer from his duty","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever voluntarily causes hurt to a person being a public officer in the\ndischarge of his duty as a public officer or with intent to prevent or deter that person or\nany other public officer from discharging his duty as a public officer or in consequence\nof anything done or attempted to be done by that 1m person in the lawful discharge of\nhis duty as a public officer, shall be punished with imprisonment for a term which may\nextend to three years or with fine or with both.\n\n(2) Whoever in the like circumstances with the like intent or for like reason voluntarily\ncauses grievous hurt to any person being a public officer, shall be punished with\nimprisonment for a term which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"253","t":"Causing hurt by act endangering life or personal safety of others","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever causes hurt to a person by doing an act so rashly or negligently as to\nendanger human life or the personal safety of others, shall be punished with\nimprisonment for a term which may extend to one year or with fine or with both.\n\n(2) Whoever in like manner causes grievous hurt to a person, shall be punished with\nimprisonment for a term which may extend to two years or with fine or with both."},{"c":"PC","n":"254","t":"Wrongful restraint defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(1) Whoever voluntarily obstructs a person so as to prevent that person from\nproceeding in a direction in which that person has a right to proceed, is said to restrain\nthat person wrongfully.\n\n(2) The obstruction of a private way over land or water which a person in good faith\nbelieves himself to have a lawful right to obstruct, is not within the meaning of this\nsection.\n\nIllustration. A obstructs a path along which Z has a right to pass, A not believing in good\nfaith that he has a right to stop the path. Z is thereby prevented from passing. A\nwrongfully restrains Z."},{"c":"PC","n":"255","t":"Wrongful confinement defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully restrains a person in such a manner as to prevent lent that\nperson from proceeding beyond certain circumscribing limits, is said to confine that\nperson wrongfully.\n\nIllustrations. (a) A causes Z to go within a walled space, and locks Z in. Z is thus prevented\nfrom proceeding in any direction beyond the circumscribing line of wall. A wrongfully\nconfines Z.\n\n(b) A places men with firearms at the outlets of a building and tells Z that they will fire at Z\nif Z attempts to leave the building. A wrongfully confines Z."},{"c":"PC","n":"256","t":"Wrongful restraint","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully restrains' a person, shall be punished with imprisonment for a\nterm which may extend to one month or with fine which may extend to sixty naira or with\nboth."},{"c":"PC","n":"257","t":"Wrongful confinement","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully confines a person, shall be punished-\n\n(a) with imprisonment for a term which may extend to one year or with fine which may\nextend to one hundred naira or with both;\n\n(b) if the wrongful confinement continues for three days or more with imprisonment for a\nterm which may extend to three years or with fine or with both."},{"c":"PC","n":"258","t":"Wrongful confinement after warrant or order or writ issued for production or","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever keeps a person in wrongful confinement knowing that a warrant or order\nor writ for the production or liberation of that person has been duly issued, shall be\npunished with imprisonment for a term which may extend to two years in addition to any\nterm of imprisonment to which he may be liable under any other section of this chapter."},{"c":"PC","n":"259","t":"Wrongful confinement in secret","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully confines a person in such manner as to indicate an intention\nthat the confinement of that person may not be known to a person interested in the\nperson so confined or to a public officer or that the place of the confinement may not\nbe known to or discovered by any such person or public officer as hereinbefore\nmentioned, shall be punished with imprisonment for a term which may extend to two\n\nyears in addition to any other punishment to which he may be liable for such wrongful\nconfinement."},{"c":"PC","n":"260","t":"Wrongful confinement to extort property or constrain to illegal act","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully confines a person for the purpose of extorting from the person\nconfined or from a person interested m the person confined any property or document\nof title or of constraining the person confined or a person interested in such person to do\nanything illegal or to give an information which may facilitate the commission of an\noffence, shall be punished with imprisonment for a term which may extend to three\nyears and shall also be liable to fine."},{"c":"PC","n":"261","t":"Wrongful confinement to extort confession or compel restoration of property","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever wrongfully confines a person for the purpose of extorting from the person\nconfined or a person interested in the person confined a confession or any information\nwhich may lead to the detection of an offence or misconduct or for the purpose of\nconstraining the person confined or a person interested in the person confined to restore\nor to cause the restoration of any property or document of title or to satisfy a claim or\ndemand or to give information which may lead to the restoration of any property or\ndocument of title, shall be punished with imprisonment for a term which may extend to\nthree years and shall also be liable to fine."},{"c":"PC","n":"262","t":"Force defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"A person is said to use force to another if he causes motion, change of motion or\ncessation of motion to that other or if he causes a substance to come into contact with a\npart of that other's body or with anything which that other is wearing or carrying or with\nanything so situated that the contact affects that other's sense of feeling where the\nperson causing any effect above-mentioned, causes it-\n\n(a) by his own bodily power, or\n\n(b) by disposing any substance in such a manner that the effect takes place without any\nfurther voluntary act on his part or on the part of any other person; or\n\n(c) by means of any animal.\n\nIllustrations. (a) A unfastens the moorings of a boat in which Z is sitting so that the boat\ndrifts down the river. A has caused motion to Z.\n\n(b) A lashes the horse on which Z is riding so that the horse quickens his pace. A has\ncaused change of motion to Z.\n\n(c) A seizes the rein of Z' s horse and stops the horse. A has caused cessation of motion to\nz.\n\n(d) A pushes against Z in the street. A has caused his own body to come into contact\nwith Z.\n\n(e) A throws a stone at Z and hits him.\n\n(f) A rides past Z on a muddy road and splashes him.\n\n(g) A pulls up the veil of Z, a woman.\n\n(h) A pours boiling water into the bath in which Z is bathing. A has caused the boiling\nwater to come into contact with the water in the bath, so as to affect Z's sense of feeling.\n\nIn all the above cases, A has used force to Z."},{"c":"PC","n":"263","t":"Criminal force defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever intentionally uses force to any person without that person's consent-\n\n(a) while preparing to commit an offence; or\n\n(b) in the course of committing an offence; or\n\n(c) intending by the use of the force to cause or knowing it to be likely that by the use of\nthe force he will cause injury, fear or annoyance to the person to whom the force is used,\nis said to use criminal force to that other."},{"c":"PC","n":"264","t":"Assault defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever makes a gesture or a preparation intending or knowing it to be likely that\nthe gesture or preparation will cause any person present to apprehend that he who\nmakes that gesture or preparation is about to use criminal force to that person, is said to\ncommit an assault.\n\nEXPLANATION. Mere words do not amount to assault, but the words which a person uses\nmay give to his gestures or preparations such a meaning as may make those gestures or\npreparations amount to an assault.\n\nIllustrations. (a) A shakes his fist at Z, intending or knowing it to be likely that he may\nthereby cause Z to believe that A is about to strike Z. A has committed an assault.\n\n(b) A begins to untie the lead of a ferocious dog intending or knowing it to be likely that\nhe may thereby cause Z to believe that he is about to cause the dog to attack Z. A has\ncommitted an assault upon Z.\n\n(c) A takes up a stick saying to Z \"[ will give you a beating\". Here, though the words used\nby A could in no case amount to assault and though the mere gesture unaccompanied\nby any other circumstances might not amount to an assault, the gesture explained by\nthe words may amount to an assault."},{"c":"PC","n":"265","t":"Punishment for assault or criminal force without provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force to a person otherwise than on grave and\nsudden provocation given by that person, shall be punished-\n\n(a) with imprisonment for a term which may extend to one year or with fine or with both;\nand\n\n(b) if grievous hurt is caused to any person by such assault or criminal force with\nimprisonment which may extend to three years or with fine or with both."},{"c":"PC","n":"266","t":"Punishment for assault or criminal force with provocation","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force to a person on grave and sudden\nprovocation given by that person, shall be punished with imprisonment for a term which\nmay extend to three months or with fine which may extend to forty naira or with both."},{"c":"PC","n":"267","t":"Assault or criminal force to deter public officer from discharge of his duty","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force to a person being a public officer in the\nexecution of his duty as a public officer or with intent to prevent or deter that person\nfrom discharging his duty as a public officer or in consequence of anything done or\nattempted to be done by that person in the lawful discharge of his duty as such public\nofficer shall be punished with imprisonment\n\nfor a term which may extend to three years or with fine or with both."},{"c":"PC","n":"268","t":"Assault or criminal force to woman with intent to outrage modesty","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force to a woman intending to outrage or knowing\nit to be likely that he will thereby outrage her modesty, shall be punished with\nimprisonment for a term which may extend to three years or with fine or with both."},{"c":"PC","n":"269","t":"Assault or criminal force in attempt to commit theft of property carried by a person","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force to a person in attempting to commit theft of\nany property which that person is then wearing or carrying, shall be punished with\nimprisonment for a term which may extend to three years or with fine or with both."},{"c":"PC","n":"270","t":"Assault or criminal force in attempt wrongfully to confine a person","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever assaults or uses criminal force for a person in attempting wrongfully to\nconfine that person, shall be punished with imprisonment for a term which may extend to\ntwo years or with fine or with both."},{"c":"PC","n":"271","t":"Kidnapping defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever takes or entices a person, under fourteen years of age if a male or under\nsixteen years of age if a female, or any person of unsound mind out of the keeping of the\nlawful guardian of such person without the consent of such guardian or conveys that\nperson beyond the limits of the Federal Capital Territory, Abuja, without the consent of\nsomeone legally authorized to consent to such removal is said to kidnap such person.\n\nEXPLANATION. The words \"lawful guardian\" in this section include a person lawfully\nentrusted with the care or custody of such person and authorized to consent to the\ntaking."},{"c":"PC","n":"272","t":"Abduction defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever by force compels or by a deceitful means induces a person to go from a\nplace, is said to abduct that person."},{"c":"PC","n":"273","t":"Punishment for kidnapping","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever kidnaps or abducts a person shall be punished with imprisonment for a\nterm which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"274","t":"Kidnapping or abduction in order to commit culpable homicide","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever kidnaps or abducts a person in order that the person may be killed or may\nbe so disposed of as to be put in danger of being killed, shall be punished with\nimprisonment for a term which may extend to fourteen years and shall also be liable to\nfine."},{"c":"PC","n":"275","t":"Procuration of minor girl","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever, by any means whatsoever, induces a girl under the age of eighteen years\nto go from any place or to do an act with intent that the girl may be, or knowing that it is\nlikely that she will be, forced or seduced to illicit intercourse with another person shall be\npunished with imprisonment which may extend to ten years and shall also be liable to\nfine."},{"c":"PC","n":"276","t":"Importation of girl from foreign country","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever imports into the Federal Capital Territory, Abuja from a country outside\nNigeria a girl under the age of twenty-one years with intent that she may be, or knowing\nit to be likely that she will be, forced or seduced to illicit intercourse with another person\nshall be punished with imprisonment which may extend to ten years and shall also be\nliable to fine."},{"c":"PC","n":"277","t":"Concealing or keeping in confinement kidnapped or abducted person","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever knowing that a person has been kidnapped or has been abducted\nwrongfully conceals or confines the person, shall be punished in the same manner as if\nhe had kidnapped or abducted that person."},{"c":"PC","n":"278","t":"Buying or selling minor for immoral purpose","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever buys, sells, hires, lets to hire or otherwise obtains possession or disposes of a\nperson under the age of eighteen years with intent that the person shall be employed or\nused for the purpose of prostitution or for an unlawful or immoral purpose or knowing it to\nbe likely that such minor will be employed or used for any such purpose, shall be\npunished with imprisonment\n\nfor a term which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"279","t":"Buying or disposing of slave","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever imports, exports, removes, buys, sells, disposes, traffics or deals in a person\nas a slave, or accepts, receives or detains against his will a person as a slave, shall be\npunished with imprisonment for a term which may extend to fourteen years and shall also\nbe liable to fine."},{"c":"PC","n":"280","t":"Unlawful compulsory labour","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever unlawfully compels a person to labour against the will of that person, shall\nbe punished with imprisonment for a term which may extend to one year or with fine or\nwith both."},{"c":"PC","n":"281","t":"Traffic in women","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever, in order to gratify the passions of another person, procures, entices or\nleads away, even with her consent, a woman or girl for immoral purposes shall be\npunished with imprisonment which may extend to seven years and shall also be liable to\nfine."},{"c":"PC","n":"282","t":"Rape defined","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"(I) A man is said to commit rape who, except in the case referred to in subsection (2)\nof this section, has sexual intercourse with a woman in any of the following\ncircumstances-\n\n(a) against her will;\n\n(b) without her consent;\n\n(c) with her consent, when her consent has been obtained by putting her in fear of\ndeath or of hurt;\n\n(d) with her consent, when the man knows that he is not her husband and that her\nconsent is given because she believes that he is another man to whom she is or believes\nherself to be lawfully married;\n\n(e) with or without her consent, when she is under fourteen years of age or of unsound\nmind.\n\n(2) Sexual intercourse by a man with his own wife is not rape, if she has attained to\npuberty.\n\nEXPLANATION. Mere penetration is sufficient to constitute the sexual intercourse\nnecessary to the offence of rape."},{"c":"PC","n":"283","t":"Punishment for rape","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever commits rape shall be punished with imprisonment for life or for any less\nterm and shall also be liable to fine."},{"c":"PC","n":"284","t":"Unnatural offences","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever has carnal intercourse against the order of nature with a man, woman or\nan animal, shall be punished with imprisonment for a term of which may extend to\nfourteen years and shall also be liable to fine.\n\nEXPLANATION. Mere penetration is sufficient to constitute the carnal intercourse\nnecessary to the offence described in this section."},{"c":"PC","n":"285","t":"Acts of gross indecency","ch":"Chapter XVIII – OFFENCES AFFECTING THE HUMAN BODY Offences affecting Life","p":"","x":"Whoever commits an act of gross indecency upon the person of another without his\nconsent or by the use of force or threats compels a person to join with him in the\ncommission of that act, shall be punished with imprisonment for a term which may\nextend to seven years and shall also be liable to fine:\n\nProvided that a consent given by a person below the age of sixteen years to such an act\nwhen done by his teacher, guardian or a person entrusted with his care or education\nshall not be deemed to be a consent within the meaning of this section."},{"c":"PC","n":"286","t":"Theft defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"(I) Whoever, intending to take dishonestly any movable property out of the\npossession of a person Without that person's consent, moves that property in order to\ntake it is said to commit theft.\n\n(2) Whoever dishonestly abstracts, diverts, consumes or uses any electricity or electric\ncurrent is said to commit theft.\n\nEXPLANATION I. A thing so long as it is attached to the earth, not being movable\nproperly, is not the subject of theft; but it becomes capable of being the subject of theft\nas soon as it is severed from the earth.\n\nEXPLANATION 2. A moving effected by the same act which effects the severance\n\nmay be a theft.\n\nEXPLANATION 3. A person is said to cause a thing to move by removing an obstacle\nwhich prevented it from moving or by separating it from any other thing as well as by\nactually moving it.\n\nEXPLANATION 4. A person, who by any means causes an animal to move, is said to move\nthat animal and to move everything which in consequence of the motion so caused is\nmoved by that animal.\n\nEXPLANATION 5. The consent mentioned in the definition may be express or implied and\nmay be given either by the person in possession or by any person having for that purpose\nauthority either express or implied.\n\nIllustrations. (a) A cuts down a tree on Z's ground with the intention of dishonestly taking\nthe tree out of Z' s possession without Z's consent. Here as soon as A has severed the tree\nin order to take it, he has committed theft.\n\n(b) A puts a bait for dogs in his pocket and thus induces Z's dog to follow him. Here, if A's\nintention is dishonestly to take the dog out of Z' s possession without Z's consent, A has\ncommitted theft as soon as Z's dog has begun to follow A.\n\n(c) A meets a camel carrying a box of treasure. He drives the camel in a certain\ndirection in order that he may dishonestly take the treasure. As soon as the camel begins\nto move, A has committed theft of the treasure.\n\n(d) Z going on a journey entrusts jewellery to A till Z shall return. A carries the jewellery to\nthe market and sells it. Here the jewellery was not in Z's possession. It could not therefore\nbe taken out of Z' s possession and A has not committed theft, though he may have\ncommitted criminal breach of trust.\n\n(e) A finds a ring belonging to Z on a table in the house which Z occupies. Here the ring is\nin Z's possession and if A dishonestly removes it A commits theft.\n\n(f) A finds a ring lying on the road not in the possession of any person. A by taking it\ncommits no theft, though he may commit criminal misappropriation of property.\n\n(g) A sees a ring belonging to Z lying on a table in Z's house. Not venturing to\nmisappropriate the ring immediately for fear of search and detection A hides the ring in\na place where it is highly improbable that it will ever be found by Z, with the intention of\ntaking the ring from the hiding place and selling it when the loss is forgotten. Here A at\nthe time of first moving the ring commits theft.\n\n(h) A delivers a jewel to Z a jeweller to be re-set. Z carries it to his shop. A, not owing to\nthe jeweller any debt for which the jeweller might lawfully detain the jewel as a security,\nenters the shop openly, takes his jewel by force out of Z' s hand and carries it away. Here\nA, though he may have committed criminal trespass and assault, has not committed\ntheft inasmuch as what he did was not done dishonestly.\n\n (i) If A owes money to Z for re-setting the jewel and if Z retains the jewel lawfully as a\nsecurity for the debt and A takes the jewel out of Z' s possession, with the intention of\ndepriving Z of the property as a security for his debt, he commits theft inasmuch as he\ntakes it dishonestly.\n\n(j) A takes an article belonging to Z out of Z' s possession without Z's consent with the\nintention of keeping it until he obtains money from Z as a reward for its restoration. Here A\ntakes dishonestly; A has therefore committed theft.\n\n(k) A, being on friendly terms with Z, goes into Z's house in Z's absence and takes away a\ncooking pot without Z's express consent with the intention of returning it after use. Here, it\nis probable that A may have conceived that he had Z's implied consent to use Z's\ncooking pot. If this was A's impression, A has not committed theft.\n\n(I) A asks charity from Z's wife. She gives A money, food and clothes, which A knows to\nbelong to Z her husband. Here it is probable that A may conceive that Z's wife is\nauthorized to give away alms. If this was A's impression, A has not committed theft.\n\n(m) A is the paramour of Z' s wife. She gives A valuable property, which A knows to\nbelong to her husband Z and to be such property as she has not authority from Z to give.\nIf A takes the property dishonestly, he commits theft.\n\n(n) A in good faith, believing property belonging to Z to be A's own property, takes that\nproperty out of Z's possession. Here, as A does not take dishonestly, he does not commit\ntheft."},{"c":"PC","n":"287","t":"Punishment for theft","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits theft shall be punished with imprisonment for a term which may\nextend to five years or with fine or with both."},{"c":"PC","n":"288","t":"Theft in dwelling-house, etc","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits theft in or from a building, tent or vessel, which building, tent or\nvessel is used as a human dwelling or used for the custody of property, or in or from any\nrailway carriage, lorry, omnibus or aircraft used for the conveyance of passengers or\n\ngoods, shall be punished with imprisonment far a term which may extend to seven or\nwith fine or with both."},{"c":"PC","n":"289","t":"Theft by clerk or servant of property in possession of master","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever, being a clerk or servant 01 being employed in the capacity of a clerk or\nservant, commits theft in respect of any property in the possession of his master or\nemployer, shall be punished with imprisonment for a term which may extend to seven\nyears or with fine or with both."},{"c":"PC","n":"290","t":"Theft after preparing to cause death, hurt or restraint in order to commit theft","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits theft having made preparation for causing death or hurt or\nrestraint or fear of death or of hurt or of restraint to a person in order to commit such theft\nor in order to effect his escape after the committing of such theft or in order to retain\nproperty taken by such theft, shall be punished with imprisonment for a term which may\nextend to fourteen years and shall also be liable to fine.\n\nIllustrations. (a) A commits theft on property in Z's possession; while committing this theft\nhe has a loaded pistol under his garment having provided this pistol for the purposes of\nhurting Z in case Z should resist. A has committed an offence under this section.\n\n(b) A picks Z's pocket, having posted several of his companions near him, in order that\nthey may restrain Z, if Z should perceive what is passing and should resist or should\nattempt to arrest A. A has committed an offence under this section."},{"c":"PC","n":"291","t":"Extortion defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever intentionally puts any person in fear of any injury to that person or to any\nother and thereby dishonestly induces the person so put in fear to deliver to a person any\nproperty or document of title or anything signed or sealed which may be converted into\na valuable security, commits extortion. Illustrations. (a) A threatens to publish a\ndefamatory libel concerning Z, unless Z gives him money. He thus induces Z to give him\nmoney. A has committed extortion.\n\n(b) A threatens Z that he will keep Z's child in wrongful confinement unless Z will sign and\ndeliver to A a promissory note binding Z to pay certain monies to A. Z signs and delivers\nthe note. A has committed extortion.\n\n(c) A threatens to send men to pull up Z's crops unless Z will sign and deliver to B a bond\nbinding Z under a penalty to deliver certain produce to B and thereby induces Z to sign\nand deliver the bond. A has committed extortion.\n\n(d) A by putting Z in fear of grievous hurt dishonestly induces Z to sign or affix his seal to a\nblank paper and deliver it to A. Z signs and delivers the paper to A. Here, as the paper so\nsigned may be converted into a valuable security, A has committed extortion.\n\n(e) A, not pretending to be a judicial officer, usurps the functions of a court by unlawfully\nusing his position in the community to force Z to pay a fine to him under threat of injury. A\nhas committed extortion."},{"c":"PC","n":"292","t":"Punishment for extortion","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits extortion shall be punished with imprisonment for a term which\nmay extend to five years or with fine or with both."},{"c":"PC","n":"293","t":"Putting person in fear of injury in order to commit extortion","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever in order to commit extortion puts a person in fear or attempts to put a\nperson in fear of any injury to that person or to any other, shall be punished with\nimprisonment for a term which may extend to two years or with fine or with both."},{"c":"PC","n":"294","t":"Extorting by putting a person in fear of death or grievous hurt","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits extortion by putting a person in fear of death or of grievous hurt\nto that person or to any other, shall be punished with imprisonment ment for a term\nwhich may extend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"295","t":"Extortion by threat of accusation of an offence punishable with death","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits extortion by putting a person in fear of an accusation tion against\nthat person or any other of having committed or attempted to commit an offence\npunishable with death or with imprisonment for a term which may extend to ten years or\nof having attempted to induce any other person to commit such offence, shall be\npunished with imprisonment for a term w which may extend to fourteen years and shall\nalso be liable to fine.\n\nRobbery and Brigandage."},{"c":"PC","n":"296","t":"Robbery defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"(I) In all robbery there is either theft or extortion.\n\n(2) Theft is robbery if, in order to commit the theft or in committing the theft or in carrying\naway or attempting to carry away property obtained by the theft, the offender for that\nend voluntarily causes or attempts to cause to any person death or hurt or wrongful\nrestraint or fear of instant death or of instant hurt or of instant wrongful restraint.\n\n(3) Extortion is robbery, if the offender at the time of committing the extortion is in the\npresence of the person put in fear and commits the extortion by putting that person in\nfear of instant death, of instant hurt or of instant wrongful restraint to that person or to\nsome other person and by so putting in fear induces the person so put in fear then and\nthere to deliver up the thing extorted.\n\nEXPLANATION. The offender is said to be present if he is sufficiently near to put the other\nperson in fear of instant death, of instant hurt or of instant wrongful restraint.\n\nIllustrations. (a) A holds Z down and takes Z's money and jewels from Z's clothes without Z's\nconsent. Here A has committed theft and in order to commit that theft has voluntarily\ncaused wrongful restraint to Z. A has therefore committed robbery.\n\n(b) A meets Z on the road, shows a pistol and demands Z's purse. Z in consequence\nsurrenders his purse. Here A has extorted the purse from Z by\n\nputting him in fear of instant hurt and being at the time of committing the extortion in his\npresence. A has therefore committed robbery.\n\n(c) A meets Z and Z' s child on the river bank. A takes the child and threatens to fling it\ninto the river, unless Z delivers his purse. Z in consequence delivers his purse. Here A has\nextorted the purse from Z by causing Z to be in fear of instant hurt to the child who is\nthere present. A has therefore committed robbery on Z.\n\n(d) A obtains property from Z by saying- \"Your child is in the hands of my gang and will be\nput to death unless you send us fifty pounds\". This is extortion and punishable as such; but\nit is not robbery, unless Z is put in fear of the instant death of his child."},{"c":"PC","n":"297","t":"Brigandage defined","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"When five or more persons conjointly commit or attempt to commit a robbery or\nwhere the whole number of persons conjointly committing or attempting to commit a\nrobbery and persons present and aiding the commission or attempt amount to five or\nmore, every person so committing, attempting or aiding is said to commit brigandage."},{"c":"PC","n":"298","t":"Punishment for robbery","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits robbery shall be punished-\n\n(a) with imprisonment for a term which may extend to ten years and shall also be liable\nto fine; and\n\n(b) if the robbery is committed-\n\n(i) between sunset and sunrise on the highway, or\n\n(ii) between sunset and sunrise from a person sleeping or having lain down to sleep in the\nopen air,\n\nwith imprisonment for a term which may extend to fourteen years and shall also be liable\nto fine; and\n\n(c) if the robbery is committed by a person armed with a dangerous or an offensive\nweapon or instrument, to imprisonment for life or a less term and shall also be liable to\nfine."},{"c":"PC","n":"299","t":"Punishment for attempted robbery","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever attempts to commit robbery shall be punished with imprisonment for a\nterm which may extend to seven years and shall also be liable to fine"},{"c":"PC","n":"300","t":"Voluntarily causing hurt in committing robbery","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"If a person in committing or in attempting to commit robbery voluntarily causes hurt,\nsuch person and any other person jointly concerned in--committing or attempting to\ncommit that robbery, shall be punished with imprisonment for a term which may extend\nto fourteen years and shall also be liable to fine."},{"c":"PC","n":"301","t":"Brigandage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever commits brigandage shall be punished with imprisonment for a term which\nmay extend to fourteen years and shall also be liable to fine."},{"c":"PC","n":"302","t":"Brigandage with culpable homicide punishable with death","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"If anyone of five or more persons, who are conjointly committing brigandage,\ncommits culpable homicide punishable with death in so committing brigandage, every\none of these persons shall be punished with death."},{"c":"PC","n":"303","t":"Robbery or brigandage with attempt to cause death or grievous hurt","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"If, at the time of committing or attempting to commit robbery or brigandage, the\noffender uses a deadly weapon or causes grievous hurt to a person or attempts to cause\ndeath or grievous hurt to a person, the imprisonment with which such offender shall be\npunished shall not be less than seven, years."},{"c":"PC","n":"304","t":"Making preparation to commit brigandage","ch":"Chapter XIX – OFFENCES AGAINST PROPERTY Theft","p":"","x":"Whoever makes a preparation for committing brigandage, shall be punished with\nimprisonment for a term which may extend to ten years and shall also be liable to fine."},{"c":"PC","n":"305","t":"Belonging to gang of brigands","ch":"Chapter XIX – OFFENCES AGA
