<script>
const DATA=[{"c":"CC","n":"1","t":"Interpretation","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"(1) In this Code, unless the context otherwise requires-\n\n        \"brothel\" means any premises or room or set of rooms in any premises kept for purposes of\nprostitution;\n\n        \"Christian marriage\" means a marriage which is recognised by the law of the place where it is\ncontracted as the voluntary union for life of one man and one woman to the exclusion of all others;\n\n         \"clerk\" and \"servant\" include any person employed for any purpose as or in the capacity of a\nclerk, or servant, or as a collector of money, although temporarily only, or although employed also by\nother persons than the person alleged to be his employer, or although employed to pay as well as\nreceive money, and any person employed as or in the capacity of a commission agent for the collection\nor disbursement of money or in any similar capacity, although he has no authority from his employer to\nreceive money or other property on his account;\n\n        \"company\" means an incorporated company;\n\n        \"court\", \"a court\", \"the court\", includes-\n\n        (a)     the High Court and the Chief Judge and other Judges of the High Court;\n\n        (b)     a magistrate being engaged in any judicial act or proceeding or inquiry;\n        (c)     an administrative officer being engaged in any judicial act or proceeding or inquiry;\n\n        (d)     the Federal High Court and the Chief Judge and other Judges of that Court;\n\n        (e)      the Court of Appeal and the President and the Justices thereof sitting together or\n                separately;\n\n        (f)      the Supreme Court, and the Justices thereof sitting together or separately;\n\n        \"criminally responsible\" means liable to punishment as for an offence;\n\n        \"criminal responsibility\" means liability to punishment as for an offence;\n\n        \"dangerous harm\" means harm endangering life;\n\n         \"dwelling-house\" includes any building or structure, or part of a building or structure, which is\nfor the time being kept by the owner or occupier for the residence therein of himself, his family, or\nservants, or any of them: it is immaterial that it is, from time to time, uninhabited:\n\nA building or structure adjacent to, and occupied with, a dwelling-house is deemed to be part of the\ndwelling-house if there is a communication between such building or structure and the dwelling-house,\neither immediate or by means of a covered and enclosed passage leading from the one to other, but not\notherwise;\n\n        \"explosive substance\" includes a gaseous substance in such a state of compression as to be\ncapable of explosion;\n\n         \"grievous harm\" means any harm which amounts to a maim or dangerous harm as defined in\nthis section, or which seriously or permanently injures health, or which is likely so to injure health, or\nwhich extends to permanent disfigurement or to any permanent or serious injury to any external or\ninternal organ, member, or sense;\n\n        \"harm\" means any bodily hurt, disease, or disorder, whether permanent or temporary;\n\n        \"have in possession\" includes having under control in any place whatever, whether for the use\nor benefit of the person of whom the term is used or of another person, and although another person\nhas the actual possession or custody of the thing in question;\n\n        \"judicial officer\" includes the Chief Judge and a Judge of a High Court, a Magistrate, the\nPresident and Justices of the Court of Appeal, the Chief Judge and Judges of the Federal High Court, the\nChief Justice of Nigeria and a Justice of the Supreme Court, and when engaged in any judicial act or\nproceeding or inquiry, an administrative officer;\n\n        \"knowingly\" used in connection with any term denoting uttering or using, implies knowledge of\nthe character of the thing uttered or used;\n        \"law officer\" means the Attorney-General and the Solicitor-General of the Federation, and\nincludes the Director of Public Prosecutions and such other qualified officers, by whatever names\ndesignated, to whom any of the powers of a law officer are delegated by law or necessary intendment;\n\n        \"local authority\" means the local government council of the local government area;\n\n        \"mail\" includes any conveyance of any kind by which postal matter is carried, and also any\nvessel employed by or under the Nigerian Postal Service, or the postal authority of any other country, or\nthe Admiralty, for the conveyance of postal matter, under contract or not, and also a ship of war or\nother vessel in the service of the Federation in respect of letters conveyed by it and also a person or\nanimal used for the conveyance or delivery of postal matter;\n\n     \"maim\" means the destruction or permanent disabling of any external or internal organ,\nmember or sense;\n\n       \"money\" includes bank notes, bank drafts, cheques, and any other orders, warrants, or\nrequests, for the payment of money;\n\n        \"Nigeria\" means the Federal Republic of Nigeria;\n\n         \"night\" or \"night time\" means the interval between half past six o’clock in the evening and half\npast six o'clock in the morning;\n\n         \"officer of the Nigerian Postal Service\" includes the Post Master General, and every agent,\nofficer, clerk, sorter, messenger, letter carrier, post boy, rider, or any other person employed in the\nbusiness of the post office, whether employed by the Civil Services Commission of the Federation or any\nperson on behalf of the post office;\n\n        \"Order in Council\" when used in connection with the terms ordinance and statute includes any\nrelevant Order in Council of the United Kingdom applicable to Nigeria;\n\n       \"packet boat\" means a post office packet and includes any other vessel so employed in\nconveying postal matters by the Nigerian Postal Service;\n\n        \"peace officer\" includes any magistrate and any police officer of or above the rank of assistant\nsuperintendent;\n\n       \"person\" and \"owner\" and other like terms, when used with reference to property, include\ncorporations of all kinds, and any other association of persons capable of owning property; and also,\nwhen so used, include the State;\n\n\"person employed by or under the Nigerian Postal Service\" includes an officer of the said Service and a\ntelegraph official;\n\n\"person employed in the public service\" means any person holding any of the following offices, or\nperforming the duties thereof, whether as deputy or otherwise-\n(1) any civil office, the power of appointing a person to which or removing a person from which is vested\nin the Civil Service Commission or any Board; or\n\n(2) any office to which a person is appointed by or under the Constitution of the Federal Republic of\nNigeria or any enactment; or\n\n(3) any civil office, the power of appointing to which or of removing from which is vested in any person\nor persons holding an office of any kind included in either of the two last preceding sub-heads of this\nsection; or\n\n(4) any office of arbitrator or umpire in any proceeding or matter submitted to arbitration by order or\nwith the sanction of any court, or in pursuance of any enactment; or\n\n(5) a member of a commission of inquiry appointed under any Act or law,\n\nand the said term further includes-\n\n(1) any justice of the peace;\n\n(2) any person employed to execute any process of a court;\n\n(3) all persons belonging to the military or police forces of Nigeria;\n\n(4) all persons in the employ of any government department;\n\n(5) a person acting as a minister of religion of whatsoever denomination in so far as he performs\nfunctions in respect of the notification of intended marriage, or in respect of the solemnisation of\nmarriage or in respect of the making and keeping of any register or certificate of marriage, birth,\nbaptism, death or burial, but not in any other respect;\n\n(6) a person employed by a head chief in connection with any powers or duties exercised or performed\nby such chief under any Act or law or with the consent of the President or a Governor;\n\n(7) a person in the employ of a local authority;\n\n(8) a person in the employ of a local government council in connection with any powers or duties\nexercised or performed by such local government council and in respect of the duties for which the\nemployment actually exists;\n\n\"police officer\" means any member of the police force;\n\n\"postal matter\" includes any letter, newspaper, packet, parcel or other thing, authorised by law to be\ntransmitted by post, which has been posted or received at a post office for delivery or transmission by\npost, and which is in course of transmission by post, and any movable receptacle which contains any\nsuch thing, and which is in course of transmission by post:\nA thing is deemed to be in course of transmission by post or telegraph from the time of its being\ndelivered to a post or telegraph office to the time of its being delivered to the person to whom it is\naddressed:\n\nA delivery at the house or office of the person to whom any postal matter or telegram is addressed,\neither to him or to some person apparently authorised to receive it according to the usual manner of\ndelivering postal matter or telegrams addressed to him, is deemed a delivery to such first-named\nperson;\n\n\"postal matter bag\" includes any bag, or box, or parcel, or other envelope or covering, in which postal\nmatter is conveyed, whether it does or does not contain postal matter;\n\n\"post office\" and \"telegraph office\" respectively, includes any structure, room, place or receptacle, of\nany kind, appointed in pursuance of the Nigerian Postal Service Act or, as the case may be, of the\nWireless Telegraphy Act for the receipt, despatch, or delivery, of any postal matter or telegram, or for\nthe transaction of the business of the department relating to posts and telegraphs; and \"telegraph\noffice\" includes any room or place used by a telegraph company for the receipt, despatch or delivery of\ntelegrams;\n\n                                    [Cap. N127. Cap. W5.]\n\n\"property\" includes everything, animate or inanimate, capable or being the subject of ownership;\n\"prostitution\" (with its grammatical variations and cognate expressions) includes the offering by a\nfemale of her body commonly for acts of lewdness for payment although there is no act or offer of an\nact or ordinary sexual connection;\n\n\"public\" refers not only to all persons within Nigeria, but also to the persons inhabiting or using any\nparticular place or any number of such persons, and also to such indeterminate persons as may happen\nto be affected by the conduct with respect to which such expression is used;\n\n\"public place\" includes any public way, and any building, place, or conveyance, to which for the time\nbeing the public are entitled or permitted to have access, either without any conditions or upon\ncondition of making any payment, and any building or place which is for the time being used for any\npublic or religious meeting or assembly, or as an open court;\n\n\"public way\" includes any highway, market place, square, street, bridge, or other way, which is lawfully\nused by the public;\n\nacts are done \"publicly\"-\n\n(a) if they are so done in any public place as to be likely to be seen by any person, whether such person\nbe, or be not, in a public place; or\n\n(b) if they are so done in any place, not being a pubic place, as to be likely to be seen by any person in\nany public place;\n\"railway\" includes every kind of way on which vehicles are borne upon a rail or rails, whatever may be\nthe means of propulsion;\n\n\"railway servant\" means any person employed by a railway administration in connection with the\nservices of a railway;\n\n\"Statute\" means a statute of the Imperial Parliament which is in force in, or forms a part of the law of,\nNigeria;\n\n  \"telegram\" means any message or other communication transmitted or intended for transmission by\n    telegraph, and includes a written or printed message or communication sent to or delivered at a\ntelegraph office or post office for transmission by telegraph, or delivered or prepared for delivery from a\n  telegraph office or post office as a message or communication transmitted by telegraph for delivery;\n\n\"telegraph\" means a wire or wires used for the purpose of telegraphic communications, with any casing,\ncoating, tube, or pipe enclosing the same, and any apparatus connected therewith, for the purpose of\ntelegraphic communications, and includes a telephone, and submarine cable; it also includes any\napparatus for transmitting messages or other communications by means of electric signals, whether\nwith or without the aid of wires;\n\n\"telegraph company\" means any company, corporation or person, authorised under the provisions of\nany Act to carry on the business of sending telegrams for the public;\n\n\"telegraph official\" means any person employed in the Nigerian Postal Service or by a telegraph\ncompany in and about the reception, transmission, and delivery of telegrams, or in the construction,\nmaintenance, or setting up of telegraphs;\n\n\"telegraph post\" includes a post, pole, standard, stay, strut, or other above-ground contrivance for\ncarrying, suspending, or supporting a telegraph, and also includes a tree used for a like purpose;\n\n\"telegraph works\" includes any wire insulator or telegraph post, and also any instrument, furniture,\nplant, office, building, machinery, engine, excavation, work, matter, or thing of whatever description, in\nany way connected with a telegraph;\n\n\"uncorroborated testimony\" means testimony which IS not corroborated in some material particular by\nother evidence implicating the accused person;\n\n\"utter\" includes using or dealing with, and attempting to use or deal with, and attempting to induce any\nperson to use, deal with, or act upon the thing in question;\n\n\"valuable security\" includes any document which is the property of any person, and which is evidence\nof the ownership of any property or of the right to recover or receive any property;\n\n\"vessel\" includes a ship, a boat, and every other kind of vessel used in navigation either on the sea or in\ninland waters;\n\"wound\" means any incision or puncture which divides or pierces any exterior membrane of the body;\nand any membrane is exterior, for the purpose of this definition, which can be touched without dividing\nor piercing any other membrane."},{"c":"CC","n":"2","t":"Definition of offence","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"An act or omission which renders the person doing the act or making the omission liable to punishment\nunder this Code, or under any Act, or law, is called an offence."},{"c":"CC","n":"3","t":"Division of offences","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"Offences are of three kinds, namely, felonies, misdemeanors, and simple offences.\n\nA felony is any offence which is declared by law to be a felony, or is punishable, without proof of\nprevious conviction, with death or with imprisonment for three years or more.\n\nA misdemeanor is any offence which is declared by law to be a misdemeanor, or is punishable by\nimprisonment for not less than six months, but less than three years.\n\nAll offences, other than felonies and misdemeanors, are simple offences."},{"c":"CC","n":"4","t":"Attempts to commit offences","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"When a person, intending to commit an offence, begins to put his intention into execution by means\nadapted to its fulfilment, and manifests his intention by some overt act, but does not fulfil his intention\nto such an extent as to commit the offence, he is said to attempt to commit the offence.\n\nIt is immaterial, except so far as regards punishment, whether the offender does all that is necessary on\nhis part for completing the commission of the offence, or whether the complete fulfilment of his\nintention is prevented by circumstances independent of his will, or whether he desists of his own\nmotion from the further prosecution of his intention.\n\nIt is immaterial that by reason of circumstances not known to the offender it is impossible in fact to\ncommit the offence.\n\nThe same facts may constitute one offence and an attempt to commit another offence."},{"c":"CC","n":"5","t":"Arrest without warrant","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"The expression \"the offender may be arrested without warrant\" means that the provisions of this Code\nrelating to the arrest of offenders or suspected offenders without warrant are applicable to the offence\nin question, either generally or subject to such conditions, if any, as to time, place, or circumstance, or\nas to the person authorised to make the arrest, as are specified in the particular case.\n\n         Except when otherwise stated, the fact that an offence is within the definition of a felony as set\nforth in this Code imports that the offender may be arrested without warrant.\nThe expression \"the offender cannot be arrested without warrant\" means that the provisions of this\nCode relating to the arrest of offenders or suspected offenders without warrant are not applicable to\nthe offence in question, except subject to such conditions, if any, as to time, place, or circumstance, or\nas to the person authorised to make the arrest, as are specified in the particular case."},{"c":"CC","n":"6","t":"Carnal knowledge","ch":"Chapter 1 – Interpretation","p":"Part 1 – Introductory","x":"When the term \"carnal knowledge\" or the term \"carnal connection\" is used in defining an offence, it is\nimplied that the offence, so far as regards that element of it, is complete upon penetration.\n\n\"unlawful carnal knowledge\" means carnal connection which takes place otherwise than between\nhusband and wife."},{"c":"CC","n":"7","t":"Principal offenders","ch":"Chapter 2 – Parties to Offences","p":"Part 1 – Introductory","x":"When an offence is committed, each of the following persons is deemed to have taken part in\ncommitting the offence and to be guilty of the offence, and may be charged with actually committing it-\n\n(a) every person who actually does the act or makes the omission which constitutes the offence;\n\n(b) every person who does or omits to do any act for the purpose of enabling or aiding another person\nto commit the offence;\n\n(c) every person who aids another person in committing the offence;\n\n(d) any person who counsels or procures any other person to commit the offence.\n\nIn the fourth case, he may be charged either with himself committing the offence or with counselling or\nprocuring its commission.\n\nA conviction of counselling or procuring the commission of an offence entails the same consequences in\nall respects as a conviction of committing the offence.\n\nAny person who procures another to do or omit to do any act of such a nature that, if he had himself\ndone the act or made the omission, that act or omission would have constituted an offence on his part,\nis guilty of an offence of the same kind, and is liable to the same punishment, as if he had himself done\nthe act or made the omission; and he may be charged with himself doing the act or making the\nomission."},{"c":"CC","n":"8","t":"Offences committed in prosecution of common purpose","ch":"Chapter 2 – Parties to Offences","p":"Part 1 – Introductory","x":"When two or more persons form a common intention to prosecute an unlawful purpose in conjunction\nwith one another, and in the prosecution of such purpose an offence is committed of such a nature that\nits commission was a probable consequence of the prosecution of such purpose, each of them is\ndeemed to have committed the offence."},{"c":"CC","n":"9","t":"Mode of execution immaterial","ch":"Chapter 2 – Parties to Offences","p":"Part 1 – Introductory","x":"When a person counsels another to commit an offence, and an offence is actually committed after such\ncounsel by the person to whom it is given, it is immaterial whether the offence actually committed is the\nsame as that counselled or a different one, provided in either case that the facts constituting the offence\nactually committed are a probable consequence of carrying out the counsel.\n\nIn either case, the person who gave the counsel is deemed to have counselled the other person to\ncommit the offence actually committed by him."},{"c":"CC","n":"10","t":"Accessories after the fact","ch":"Chapter 2 – Parties to Offences","p":"Part 1 – Introductory","x":"A person who receives or assists another who is, to his knowledge, guilty of an offence, in order to\nenable him to escape punishment, is said to become an accessory after the fact to the offence.\n\nA wife does not become an accessory after the fact to an offence of which her husband is guilty by\nreceiving or assisting him in order to enable him to escape punishment; nor by receiving or assisting, in\nher husband's presence and by his authority, another person who is guilty of an offence in the\ncommission of which her husband has taken part, in order to enable that other person to escape\npunishment; nor does a husband become accessory after the fact to an offence of which his wife is\nguilty by receiving or assisting her in order to enable her to escape punishment.\n\nIn this section the terms \"wife\" and \"husband\" mean respectively the wife and husband of a Christian\nmarriage."},{"c":"CC","n":"11","t":"Effect of changes in law","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"A person shall not be punished for doing or omitting to do an act unless the act or omission constituted\nan offence under the law in force when it occurred."},{"c":"CC","n":"12","t":"Application of code as to offences wholly or partially committed in Nigeria","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"Where by the provisions of any Federal law the doing of any act or the making of any omission\nconstituted an offence, those provisions shall apply to every person who is in Nigeria at the time of his\ndoing the act or making the omission.\n\nWith regard to such offences which are of such a nature that they comprise several elements, if any acts\nor omissions or events actually occur, which, if they all occurred in Nigeria, would constitute an offence\nand any of such acts or omissions or events occur in Nigeria, although all or some of the other acts or\nomissions or events which, if they occurred in Nigeria, would be elements of the offence occur\nelsewhere than in Nigeria; then-\n\n         (1) if the act or omission, which in the case of an offence wholly committed in Nigeria would be\nthe initial element of the offence, occurs in Nigeria, the person who does that act or makes that\nomission is guilty of an offence of the same kind and is liable to the same punishment, as if all the\nsubsequent elements of the offence had occurred in Nigeria; and\n\n        (2) if that act or omission occurs elsewhere than in Nigeria, and the person who does that act or\nmakes that omission afterwards comes into Nigeria, he is by such coming into Nigeria guilty of an\noffence of the same kind, and is liable to the same punishment, as if that act or omission had occurred in\nNigeria and he had been in Nigeria when it occurred.\n\nBut in any such case it is a defence to the charge to prove that the accused person did not intend that\nthe act or omission should have effect in Nigeria. This section does not extend to a case in which the\nonly material event that occurs in Nigeria is the death in Nigeria of a person whose death is caused by an\nact, done or omitted to be done, at a place not in Nigeria and at a time when he was not in Nigeria."},{"c":"CC","n":"12A","t":"Offences against laws of a State","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"(1) Where by the provisions of any law of a State the doing of any act or the making of any\nomission is constituted an offence, those provisions shall apply to every person who is in the State at the\ntime of his doing the act or making the omission.\n\n         (2) With regard to any such offence which is of such a nature that it comprises several elements,\nif any acts or omissions or events actually occur, which, if they all occurred in the State, would constitute\nan offence, and any of such acts or omissions or events occur in the State, although all or some of the\nother acts or omissions or events which, if they occurred in the State, would be elements of the offence,\noccur elsewhere than in the State, then-\n\n        (a)      if the act or omission, which in the case of an offence committed wholly in the State\n                would be the initial element of the offence, occurs in the State, the person who does\n                that act or makes that omission is guilty of an offence of the same kind and is liable to\n                the same punishment as if all the subsequent elements of the offence had occurred in\n                the State; and\n\n        (b)      if that act or omission occurs elsewhere than in the State, and the person who does\n                that act or makes that omission afterwards comes into the State, he is by such coming\n                into the State guilty of an offence of the same kind and is liable to the same\n                punishment, as if that act or omission had occurred in the State and he had been in the\n                State when it occurred.\n\nBut in any such case, it is a defence to the charge to prove that the accused person did not intend that\nthe act or omission should have effect in the State. This subsection does not extend to a case in which\nthe only material event that occurs in the State is the death in the State of a person whose death is\ncaused by an act, done or omitted to be done, at a place not in the State and at a time when he was not\nin the State."},{"c":"CC","n":"13","t":"Offences procured or counselled by persons out of Nigeria","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"(1) Any person who, having while out of Nigeria procured another to do or omit to do in Nigeria\nan act of such a nature that if he had himself done the act or made the omission in Nigeria, he would\nhave been guilty of an offence, afterwards comes into Nigeria, is by such coming into Nigeria guilty of an\noffence of the same kind, and is liable to the same punishment, as if he himself had done the act or\nmade the omission in Nigeria.\n\nAny person who, having while out of Nigeria counselled or procured the commission of an offence which\nis actually committed in Nigeria, afterwards comes into Nigeria, is by such coming into Nigeria guilty of\nan offence of the same kind, and is liable to the same punishment, as if he had been in Nigeria when the\noffence was committed.\n\n        (2) In this section, \"offence\" means an offence against any Federal law."},{"c":"CC","n":"13A","t":"Offences against State laws procured, etc., outside the State","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"The provisions of section 13 shall apply in relation to offences against a law of the State as they apply in\nrelation to offences against a Federal law but as if references to Nigeria were references to the State."},{"c":"CC","n":"14","t":"Offences procured in Nigeria to be committed out of Nigeria","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"Any person who, while in Nigeria, procures another to do an act or make an omission at a place not in\nNigeria of such a nature that, if he had himself done the act or made the omission in Nigeria, he would\nhave been guilty of an offence, and that, if he had himself done the act or made the omission, he would\nhave been guilty of an offence under the laws in force in the place where the act or omission is done or\nmade, is guilty of an offence of the same kind, and is liable to the same punishment, as if the act had\nbeen done or the omission had been made in Nigeria."},{"c":"CC","n":"14A","t":"Offences procured in the State to be committed out of the State","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"Any person who, while in a State, procures another to do an act or make an omission at a place not in\nthe State of such a nature that if he had himself done the act or made the omission in the State, he\nwould have been guilty of an offence against a law of the State, and that, if he had himself done the act\nor made the omission, he would have been guilty of an offence under the laws of the place where the\nact or omission is done or made, is guilty of an offence of the same kind, and is liable to the same\npunishment, as if the act had been done or the omission had been made in the State."},{"c":"CC","n":"15","t":"Armed Forces and Police Forces","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":"Members of the armed forces and of the police force of Nigeria are subject to the special laws relating\nto the forces to which they respectively belong, but are not exempt from the provisions of this Code."},{"c":"CC","n":"16","t":"(Repealed by No. 43 of 1945)","ch":"Chapter 3 – Application of Criminal Law","p":"Part 1 – Introductory","x":""},{"c":"CC","n":"17","t":"Kinds of punishment","ch":"Chapter 4 – Punishments","p":"Part 1 – Introductory","x":"Subject to the provisions of any other written law, the punishments which may be inflicted under this\nCode are death, imprisonment, caning, fine and forfeiture."},{"c":"CC","n":"18","t":"Caning for male persons under seventeen","ch":"Chapter 4 – Punishments","p":"Part 1 – Introductory","x":"Whenever a male person who, in the opinion of the court, has not attained seventeen years of age, has\nbeen found guilty of any offence the court may, in its discretion, order him to be caned in addition to or\nin substitution for any other punishments to which he is liable."},{"c":"CC","n":"19","t":"Forfeiture of bribes","ch":"Chapter 4 – Punishments","p":"Part 1 – Introductory","x":"When any person is convicted of an offence under section 98, 98A, 98B, 99, 112, 117, 126, 128 or 494 of\nthis Code, the court may, in addition to or in lieu of any penalty which may be imposed, order the\nforfeiture to the State of any property which has passed in connection with the commission of the\noffence or, if such property cannot be forfeited or cannot be found, of such sum as the court shall assess\nas the value of such property, and any property or sum so forfeited shall be dealt with in such manner as\nthe Governor may direct. Payment of any sum so ordered to be forfeited may be enforced in the same\nmanner and subject to the same incidents as in the case of the payment of a fine."},{"c":"CC","n":"20","t":"Forfeiture of property used in postal offences","ch":"Chapter 4 – Punishments","p":"Part 1 – Introductory","x":"When any person is convicted of an offence under section 170, 175, 177, 179, 180 or 183 of this Code,\nthe court may, in addition to or in lieu of any penalty which may be imposed, order the forfeiture of any\npersonal property which has been used in the commission of the offence or in respect of which the\noffence has been committed and may order such property to be destroyed or otherwise dealt with as to\nit may seem fit."},{"c":"CC","n":"21","t":"Prerogative","ch":"Chapter 4 – Punishments","p":"Part 1 – Introductory","x":"Nothing in this Code affects the prerogative of mercy where exercised in accordance with the\nConstitution of the Federal Republic of Nigeria."},{"c":"CC","n":"22","t":"Ignorance of Law","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"Ignorance of the law does not afford any excuse for any act or omission which would otherwise\nconstitute an offence, unless knowledge of the law by the offender is expressly declared to be an\nelement of the offence."},{"c":"CC","n":"23","t":"Bona fide claim of right","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A person is not criminally responsible, as for an offence relating to property, for an act done or omitted\nto be done by him with respect to any property in the exercise of an honest claim of right and without\nintention to defraud."},{"c":"CC","n":"24","t":"Intention: motive","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"Subject to the express provisions of this Code relating to negligent acts and omissions, a person is not\ncriminally responsible for an act or omission which occurs independently of the exercise of his will, or for\nan event which occurs by accident.\n\nUnless the intention to cause a particular result is expressly declared to be an element of the offence\nconstituted, in whole or part, by an act or omission, the result intended to be caused by an act or\nomission is immaterial.\nUnless otherwise expressly declared, the motive by which a person is induced to do or omit to do an act,\nor to form an intention, is immaterial so far as regards criminal responsibility."},{"c":"CC","n":"25","t":"Mistake of fact","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A person who does or omits to do an act under an honest and reasonable, but mistaken, belief in the\nexistence of any state of things, is not criminally responsible for the act or omission to any greater\nextent than if the real state of things had been such as he believed to exist.\n\nThe operation of this rule may be excluded by the express or implied provisions of the law relating to\nthe subject."},{"c":"CC","n":"26","t":"Extraordinary emergencies","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"Subject to the express provisions of this Code relating to acts done upon compulsion or provocation or\nin self-defence, a person is not criminally responsible for an act done or omission made under such\ncircumstances of sudden or extraordinary emergency that an ordinary person possessing ordinary\npower of self-control could not reasonably be expected to act otherwise."},{"c":"CC","n":"27","t":"Presumption of sanity","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"Every person is presumed to be of sound mind and to have been of sound mind at any time which\ncomes in question, until the contrary is proved."},{"c":"CC","n":"28","t":"Insanity","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A person is not criminally responsible for an act or omission if at the time of doing the act or making the\nomission he is in such a state of mental disease or natural mental infirmity as to deprive him of capacity\nto understand what he is doing, or of capacity to control his actions, or of capacity to know that he\nought not to do the act or make the omission.\n\nA person whose mind, at the time of his doing or omitting to do an act, is affected by delusions on some\nspecific matter or matters, but who is not otherwise entitled to the benefit of the foregoing provisions\nof this section, is criminally responsible for the act or omission to the same extent as if the real state of\nthings had been such as he was induced by the delusion to believe to exist."},{"c":"CC","n":"29","t":"Intoxication","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"(1) Save as provided in this section, intoxication shall not constitute a defence to any criminal charge.\n\n         (2) Intoxication shall be a defence to any criminal charge if by reason thereof the person charged\nat the time of the act or omission complained of did not know that such act or omission was wrong or\ndid not know what he was doing and-\n\n        (a)        the state of intoxication was caused without his consent by the malicious or negligent\n                   act of another person; or\n        (b)       the person charged was by reason of intoxication insane, temporarily or otherwise, at\n                 the time of such act or omission.\n\n        (3)      Where the defence under the preceding subsection is established, then in a case falling\n                 under paragraph (a) thereof, the accused person shall be discharged, and in a case\n                 falling under paragraph (b), sections 229 and 230 of the Criminal Procedure Act shall\n                 apply.\n\n        (4)      Intoxication shall be taken into account for the purpose of determining whether the\n                 person charged had formed any intention, specific or otherwise, in the absence of which\n                 he would not be guilty of the offence.\n\n        (5)      For the purposes of this section, \"intoxication\" shall be deemed to include a state\n                 produced by narcotics or drugs."},{"c":"CC","n":"30","t":"Immature age","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A person under the age of seven years is not criminally responsible for any act or omission.\n\nA person under the age of twelve years is not criminally responsible for an act or omission, unless it is\nproved that at the time of doing the act or making the omission he had capacity to know that he ought\nnot to do the act or make the omission.\n\nA male person under the age of twelve years is presumed to be incapable of having carnal knowledge."},{"c":"CC","n":"31","t":"Judicial Officers","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"Except as expressly provided by this Code, a judicial officer is not criminally responsible for anything\ndone or omitted to be done by him in the exercise of his judicial functions, although the act done is in\nexcess of his judicial authority or although he is bound to do the act omitted to be done."},{"c":"CC","n":"32","t":"Justification and excuse: compulsion","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A person is not criminally responsible for an act or omission if he does or omits to do the act under any\nof the following circumstances-\n\n        (1) in execution of the law;\n\n        (2) in obedience of the order of a competent authority which he is bound by law to obey, unless\nthe order is manifestly unlawful;\n\n       (3) when the act is reasonably necessary in order to resist actual and unlawful violence\nthreatened to him, or to another person in his presence;\n\n        (4) when he does or omits to do the act in order to save himself from immediate death or\ngrievous harm threatened to be inflicted upon him by some person actually present and in a position to\nexecute the threats, and believing himself to be unable otherwise to escape the carrying of the threats\ninto execution,\n\nbut this protection does not extend to an act or omission which would constitute an offence punishable\nwith death, or an offence of which grievous harm to the person of another, or an intention to cause such\nharm, is an element, nor to a person who has by entering into an unlawful association or conspiracy\nrendered himself liable to have such threats made to him.\n\nWhether an order is or is not manifestly unlawful is a question of law."},{"c":"CC","n":"33","t":"Compulsion of husband","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A married woman is not free from criminal responsibility for doing or omitting to do an act merely\nbecause the act or omission takes place in the presence of her husband.\n\nBut a wife of a Christian marriage is not criminally responsible for doing or omitting to do an act which\nshe is actually compelled by her husband to do or omit to do, and which is done or omitted to be done\nin his presence, except in the case of an act or omission which would constitute an offence punishable\nwith death, or an offence of which grievous harm to the person of another, or an intention to cause such\nharm, is an element, in which case the presence of her husband is immaterial."},{"c":"CC","n":"34","t":"No conspiracy between husband and wife alone","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"A husband and wife of Christian marriage are not criminally responsible for a conspiracy between\nthemselves alone."},{"c":"CC","n":"35","t":"Offences by partners and members of companies with respect to partnership or corporate property","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"property\n\nA person who, being a member of a co-partnership, corporation, or joint stock company, does or omits\nto do any act with respect to the property of the co-partnership, corporation, or company, which, if he\nwere not a member of the co-partnership, corporation or company, would constitute an offence, is\ncriminally responsible to the same extent as if he were not such member."},{"c":"CC","n":"36","t":"Liability of husband and wife for offences committed by either with respect to the other's property","ch":"Chapter 5 – Criminal Responsibility","p":"Part 1 – Introductory","x":"When a husband and wife of a Christian marriage are living together, neither of them incurs any criminal\nresponsibility for doing or omitting to do any act with respect to the property of the other, except in the\ncase of an act or omission of which an intention to injure or defraud some other person is an element,\nand except in the case of an act done by either of them when leaving or deserting, or when about to\nleave or desert, the other.\n\nSubject to the foregoing provisions, a husband and wife are, each of them, criminally responsible for any\nact done by him or her with respect to the property of the other, which would be an offence if they\nwere not husband and wife, and to the same extent as if they were not husband and wife.\nBut in the case of a Christian marriage neither of them can institute criminal proceedings against the\nother while they are living together.\n\nIn this section, the term \"property\" used with respect to a wife means her separate property."},{"c":"CC","n":"37","t":"Treason","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"(1) Any person who levies war against the State, in order to intimidate or overawe the President\nor the Governor of a State, is guilty of treason, and is liable to the punishment of death.\n\n                                       [L.N. 112 of 1964. 1967 No. 27.]\n\n         (2) Any person conspiring with any person, either within or without Nigeria, to levy war against\nthe State with intent to cause such levying of war as would be treason if committed by a citizen of\nNigeria, is guilty of treason and is liable to the punishment of death:\n\nProvided that nothing in this section shall prevent any act from being treason which is so by the laws of\nEngland as in force in Nigeria.\n\n          (3) (Inserted by L.N. 112 of 1964 and deleted by L.N. 139 of 1965)."},{"c":"CC","n":"38","t":"Instigating invasion of Nigeria","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who instigates any foreigner to invade Nigeria with an armed force is guilty of treason, and is\nliable to the punishment of death."},{"c":"CC","n":"39","t":"Provision as to juvenile offenders and pregnant women","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"(1) Where an offender who, in the opinion of the court, had not attained the age of seventeen\nyears at the time the offence was committed, has been found guilty of an offence against either section\n37 or 38 of this Code, such offender shall not be sentenced to death but shall be ordered to be detained\nduring the pleasure of the President and upon such an order being made the provisions of Part 44 of the\nCriminal Procedure Act shall apply.\n\n                         [1066 No. 84. L.N. 112 of 1964. 1967 No. 27. Cap. C41.]\n\n(2) Where a woman who has been convicted of an offence against either section 37 or 38 of this Code\nalleges she is pregnant, or where the judge before whom she is convicted considers it advisable to have\ninquiries made as to whether or not she be pregnant, the procedure laid down in section 376 of the\nCriminal Procedure Act shall first be complied with."},{"c":"CC","n":"40","t":"Concealment of treason","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who-\n\n                                                [1967 No. 27.]\n\n        (a)      becomes an accessory after the fact to treason; or\n\n         (b)     knowing that any person intends to commit treason, does not give information thereof\nwith all reasonable despatch to the President or the Governor of the State or a peace officer, or use\nother reasonable endeavours to prevent the commission of the offence, is guilty of a felony and is liable\nto imprisonment for life."},{"c":"CC","n":"41","t":"Treasonable felonies","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who forms an intention to effect any of the following purposes, that is to say-\n\n                                       [L.N. 112 of 1964. 1967 No. 27.]\n\n        (a)      to remove during his term of office otherwise than by constitutional means the\n                 President as Head of State of the Federation and Commander-in-Chief of the Armed\n                 Forces thereof; or\n\n        (b)      to likewise remove during his term of office the Governor of a State; or\n\n        (c)       to levy war against Nigeria in order by force or constraint to compel the President to\n                 change his measures or counsels, or in order to put any force or constraint upon, or in\n                 order to intimidate or overawe any House of the National Assembly or any other\n                 legislature or legislative authority; or\n\n        (d)       to instigate any foreigner to make any armed invasion of Nigeria or any of the\n                 territories thereof, and manifests such intention by an overt act, is guilty of a felony and\n                 is liable to imprisonment for life.\n\nA person charged with any of the felonies defined in this section is not entitled to be acquitted on the\nground that any act proved to have been committed by him constitutes the offence of treason; but a\nperson who has been tried, and convicted or acquitted, on a charge of any such offence, cannot be\nafterwards prosecuted for treason in respect of the same facts."},{"c":"CC","n":"42","t":"Promoting inter-communal war","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who, without lawful authority, carries on, or makes preparation for carrying on, or aids in or\nadvises the carrying on of, or preparation for, any war or warlike undertaking with, for, by, or against,\nany traditional chief, or with, for, by, or against any band of citizens, is guilty of a felony and is liable to\nimprisonment for life."},{"c":"CC","n":"43","t":"Time for proceeding in cases of treason, concealment of treason or promoting inter-communal war","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"war\n\nA person cannot be tried for treason, or for any of the felonies defined in the three last preceding\nsections, unless the prosecution is commenced within two years after the offence is committed."},{"c":"CC","n":"44","t":"Inciting to mutiny","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who advisedly attempts to effect any of the following purposes, that is to say-\n\n                                             [L.N. 112 or 1964.]\n\n        (a)      to seduce any person serving in any of the Armed Forces of Nigeria or any member of\n                the Police Force from his duty and allegiance; or\n        (b)      to incite any such persons to commit an act of mutiny or any traitorous or mutinous\n                act; or\n\n        (c)     to incite any such persons to make or endeavour to make a mutinous assembly, is guilty\n                of a felony, and is liable to imprisonment for life."},{"c":"CC","n":"45","t":"Aiding and inciting to mutinous acts or disobedience of members of Armed Forces or Policemen","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who-\n\n                                    [L.N. 112 of 1964.]\n\n        (a)     aids, abets, or is accessory to, any act of mutiny by; or\n\n        (b)     incites to sedition or to disobedience to any lawful order given by a superior officer,\n\nany warrant or other officer below commissioned rank and others inferior in rank to them and by\nwhatever name described in any of the Armed Forces of Nigeria or any Police Officer, is guilty of a\nmisdemeanour and is liable to imprisonment for two years and to a fine of four hundred naira."},{"c":"CC","n":"46","t":"Inducing such persons to desert","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who, by any means whatever, directly or indirectly-\n\n                                   [L.N. 112 of 1964. L.N. 139 of 1963.]\n\n(a)     procures or persuades or attempts to procure or persuade to desert; or\n\n(b)     aids, abets, or is accessory to the desertion of; or\n\n        (c)     having reason to believe he is a deserter, habours or aids in concealing,\n                any warrant or other officer below commissioned rank and others inferior in rank to\n                them and by whatever name described in any of the said armed forces or any police\n                officer, is guilty of a misdemeanour and is liable to imprisonment for six months and to a\n                fine of one hundred naira."},{"c":"CC","n":"46A","t":"Causing disaffection among members of Armed Forces, Police or Prison Officers","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"(1) Any person who, by any means whatever, causes or attempts to cause, or does any act\ncalculated to cause disaffection amongst persons serving as-\n\n                                            [L.N. 112 of 1964.]\n\n        (a)     members of the Armed Forces of Nigeria;\n\n        (b)      Police Officers; or\n\n        (c)     Prison Officers,\n\nor does any act calculated to induce any person serving as aforesaid to withhold his services or to\ncommit breaches of discipline, is guilty of an offence and liable on conviction to imprisonment for a term\nnot exceeding three years or to a fine not exceeding six hundred naira or to both such imprisonment\nand fine and, if a police officer or prison officer, shall forfeit all pension rights and be disqualified for\nbeing a police officer or prison officer, as the case may be.\n\n        (2) In this section, the expression \"prison officer\" has the same meaning as in subsection (1) of\nsection 10 of the Prisons Act."},{"c":"CC","n":"47","t":"Effect of proceeding under sections 44 and 45","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"A person who has been tried, and convicted or acquitted, on a charge of any of the offences defined in\nsections 44 and 45 of this Code, cannot be afterwards prosecuted for any other offence defined in this\nChapter in respect of the same facts."},{"c":"CC","n":"48","t":"Assisting or allowing escape of prisoners of war","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"Any person who-\n\n                                            [L.N. 112 of 1964.]\n\n        (a)     knowingly and advisedly aids an alien enemy of Nigeria, being a prisoner of war in\n                Nigeria, whether such prisoner is confined in a prison or elsewhere, or is suffered to be\n                at large on his parole, to escape from his prison or place of confinement, or, if he is at\n                large on his parole, to escape from Nigeria, is guilty of a felony and is liable to\n                imprisonment for life;\n\n        (b)     negligently and unlawfully permits the escape of any such person as is mentioned in\n                subsection (1) of this section is guilty of a misdemeanour and is liable to imprisonment\n                for two years."},{"c":"CC","n":"49","t":"Overt act","ch":"Chapter 6","p":"Part 2 – Offences against public order","x":"In the case of any of the offences defined in this Chapter, when the manifestation by an overt act of an\nintention to effect any purpose is an element of the offence, every act of conspiring with any person to\neffect that purpose, and every act done in furtherance of the purpose by any of the persons conspiring,\nis deemed to be an overt act manifesting the intention."},{"c":"CC","n":"49A","t":"Death penalty for treachery","ch":"Chapter 6A – Treachery","p":"Part 2 – Offences against public order","x":"(1) If, with intent to help the enemy in any war in which Nigeria may be engaged, any person\ndoes, or attempts to do, any act which is designed or likely to give assistance to the naval, military or air\noperations of the enemy, to impede such operations of the armed forces of Nigeria, or to endanger life,\nhe is guilty of felony and liable on conviction to suffer death.\n\n                                             [L.N. 112 of 1964.]\n\n        (2) No prosecution in respect of any offence against this section shall be instituted except by, or\nwith the consent of, the Attorney-General or Solicitor-General of the Federation:\n\nProvided that this subsection shall not prevent the arrest, or the issue or the execution of a warrant for\nthe arrest, of any person in respect of any offence, or the remanding, in custody or on bail, of any\nperson charged with such an offence, notwithstanding that the consent of the Attorney-General or\nSolicitor-General of the Federation to the institution of a prosecution for the offence has not been\nobtained."},{"c":"CC","n":"49B","t":"Joinder of charges and place of trial of offences","ch":"Chapter 6A – Treachery","p":"Part 2 – Offences against public order","x":"(1) Notwithstanding any rule of law or practice, charges for any offences, except treason, may\nbe joined with a charge for any offence against the preceding section in the same charge or information,\nif those charges are founded on the same facts, or form, or are a part of, a series of offences of the same\nor a similar character.\n\n                                             [L.N. 112 of 1964.]\n\n         (2) A person charged with an offence against this Chapter who is in Nigeria may, whether or not\nthe offence was committed in Nigeria or in any Nigerian ship or aircraft, be taken in custody to any place\nin Nigeria, and may be proceeded against, charged, tried and punished in any place in Nigeria, as if the\noffence had been committed in that part of Nigeria, and for all purposes incidental to or consequential\non the trial or punishment of the offence it shall be deemed to have been committed in that part of\nNigeria."},{"c":"CC","n":"49C","t":"Extent of Chapter","ch":"Chapter 6A – Treachery","p":"Part 2 – Offences against public order","x":"The provisions of this Chapter shall apply to anything done by any person in Nigeria."},{"c":"CC","n":"49D","t":"(Deleted by L.N. 112 of 1964)","ch":"Chapter 6A – Treachery","p":"Part 2 – Offences against public order","x":""},{"c":"CC","n":"50","t":"Interpretation","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) In this Chapter, unless the context otherwise requires-\n\n\"import\" includes-\n\n                                    [L.N. 112 of 1964. 1967 No. 27.]\n\n        (a)     to bring into Nigeria; and\n\n        (b)     to bring within the inland waters of Nigeria whether or not the publication is brought\n                ashore, and whether or not there is an intention to bring the same ashore;\n\n        \"periodical publication\" includes every publication issued periodically or in parts or numbers at\nintervals whether regular or irregular;\n\n        \"publication\" includes all written or printed matter and everything, whether of a nature similar\nto written or printed matter or not, containing any visible representation, or by its form, shape, or in any\nmanner capable of suggesting words or ideas, and every copy and reproduction of any publication;\n\n        \"seditious publication\" means a publication having a seditious intention;\n\n        \"seditious words\" means words having a seditious intention.\n\n        (2) A \"seditious intention\" is an intention-\n\n        (a)     to bring into hatred or contempt or excite disaffection against the person of the\n                President or of the Governor of a State or the Government of the Federation; or\n\n        (b)     to excite the citizens or other inhabitants of Nigeria to attempt to procure the\n                alteration, otherwise than by lawful means, of any other matter in Nigeria as by law\n                established; or\n\n        (c)     to raise discontent or disaffection amongst the citizens or other inhabitants of Nigeria;\n                or\n\n        (d)     to promote feelings of ill-will and hostility between different classes of the population of\n                Nigeria,\nbut an act, speech or publication is not seditious by reason only that it intends-\n\n        (i)     to show that the President or the Governor of a State has been misled or mistaken in\n                any measure in the Federation or a State, as the case may be; or\n\n        (ii)    to point out errors or defects in the Government or Constitution of Nigeria, or of any\n                State thereof, as by law established or in legislation or in the administration of justice\n                with a view to the remedying of such errors or defects; or\n\n        (iii)   to persuade the citizens or other inhabitants of Nigeria to attempt to procure by lawful\n                means the alteration of any matter in Nigeria as by law established; or\n\n        (iv)     to point out, with a view to their removal, any matters which are producing or have a\n                tendency to produce feelings of ill-will and enmity between different classes of the\n                population of Nigeria.\n\n        (3) In determining whether the intention with which any act was done, any words were spoken,\nor any document was published, was or was not seditious, every person shall be deemed to intend the\nconsequences which would naturally follow from his conduct at the time and under the circumstances in\nwhich he so conducted himself."},{"c":"CC","n":"51","t":"Offences","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) Any person who-\n\n                                             [L.N. 112 of 1964.]\n\n        (a)     does or attempts to do, or makes any preparation to do, or conspires with any person to\n                do, any act with a seditious intention;\n\n        (b)     utters any seditious words;\n\n        (c)     prints, publishes, sells, offers for sale, distributes or reproduces any seditious\n                publication;\n\n        (d)      imports any seditious publication, unless he has no reason to believe that it is seditious,\n                is guilty of an offence and liable on conviction for a first offence to imprisonment for\n                two years or to a fine of two hundred naira or to both such imprisonment and fine and\n                for a subsequent offence to imprisonment for three years and any seditious publication\n                shall be forfeited for the State.\n\n         (2) Any person who without lawful excuse has in his possession any seditious publication is\nguilty of an offence and liable on conviction, for a first offence, to imprisonment for one year or to a fine\nof one hundred naira or to both such imprisonment and fine, and for a subsequent offence, to\nimprisonment for two years; and such publication shall be forfeited to the State."},{"c":"CC","n":"52","t":"Legal proceedings: evidence","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) No prosecution for an offence under section 51 of this Code shall be begun except within six\nmonths after the offence is committed.\n\n       (2) A person shall not be prosecuted for an offence under section 51 without the written\nconsent of the Attorney-General of the Federation or of the State concerned.\n\n         (3) No person shall be convicted of an offence under paragraph (b) of subsection (1) of section\n51 of this Code on the uncorroborated testimony of one witness."},{"c":"CC","n":"53","t":"Unlawful oaths to commit capital offences","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"Any person who-\n\n        (1) administers, or is present at and consents to the administering of, any oath, or engagement\nin the nature of an oath, purporting to bind the person who takes it to commit any offence punishable\nwith death; or\n\n        (2) takes any such oath or engagement, not being compelled to do so; or\n\n        (3) attempts to induce any person to take any such oath or engagement,\n\nis guilty of a felony and is liable to imprisonment for life."},{"c":"CC","n":"54","t":"Other unlawful oaths to commit offences","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"Any person who-\n\n         (1) administers, or is present at and consents to the administering of, any oath, or engagement\nin the nature of an oath, purporting to bind the person who takes it to act in any of the ways following,\nthat is to say-\n\n        (a)      to engage in mutinous or seditious enterprise;\n\n        (b)      to commit any offence not punishable with death, other than a simple offence;\n\n        (c)      to disturb the public peace;\n\n        (d)      to be of any association, society, or confederacy formed for the purposes of doing any\n                 such acts as aforesaid;\n\n        (e)       not to inform or give evidence against any associate, confederate or other person;\n\n        (f)      not to reveal or discover any unlawful association, society, or confederacy, or any illegal\n                 act done or to be done, or any illegal oath or engagement that may have been\n                 administered or tendered to or taken by himself or any other person, or the import of\n                 any such oath or engagement; or\n\n        (2) takes any such oath or engagement, not being compelled to do so; or\n        (3) attempts to induce any person to take any such oath or engagement,\n\nis guilty of a felony and is liable to imprisonment for seven years."},{"c":"CC","n":"55","t":"Compulsion: how far a defence","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"A person who takes any such oath or engagement as is mentioned in the two last preceding sections\nshall not set up as a defence that he was compelled to do so, unless within fourteen days after taking,\nor, if he is prevented by actual force or sickness, within fourteen days after the termination of such\nprevention, he declares by information on oath before some peace officer, or, if he is on actual service\nin the armed forces of Nigeria, or in the police forces, either by such information or by information to his\ncommanding officer, the whole of what he knows concerning the matter, including the person or\npersons by whom and in whose presence, and the place where, and the time when, the oath or\nengagement was administered or taken."},{"c":"CC","n":"56","t":"Effect of prosecution","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"A person who has been tried, and convicted or acquitted, on a charge of any of the offences in this\nChapter defined, shall not be afterwards prosecuted upon the same facts for the offence of treason, or\nfor the offence of failing, when he knows that any person intends to commit treason, to give\ninformation thereof with all reasonable despatch to a peace officer, or use other reasonable endeavours\nto prevent the commission of the offence."},{"c":"CC","n":"57","t":"Unlawful drilling","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) Any person who-\n\n        (a)      without the permission of the President or of the Governor of the State concerned\n                trains or drills any other person to the use of arms or the practice of military exercise,\n                movements, or evolutions; or\n\n                                      [L.N. 112 of 1964. 1967 No. 27.]\n\n        (b)     is present at any meeting or assembly of persons, held without the permission of the\n                President or of the Governor of the State concerned, for the purpose of training or\n                drilling any other persons to the use of arms or the practice of military exercises,\n                movements, or evolutions,\n\nis guilty of a felony, and is liable to imprisonment for seven years.\n\n        (2) Any person who at any meeting or assembly held without the permission of the President or\nof the Governor of the State concerned is trained or drilled to the use of arms or the practice of military\nexercises, movements, or evolutions or who is present at any such meeting or assembly for the purpose\nof being so trained or drilled, is guilty of a misdemeanour and is liable to imprisonment for two years.\nThe offender may be arrested without warrant.\n\n        (3) A prosecution for any of the offences defined in this section of this Code shall be begun\nwithin six months after the offence is committed."},{"c":"CC","n":"58","t":"Power to prohibit importation of publications","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) If the appropriate Minister is of opinion that the importation of any publication or series of\npublications would be contrary to the public interest, he may by order prohibit the importation of such\npublication or series of publications.\n\n                                     [L.N. 258 of 1959. 1967 No. 27.]\n\n        (2) If the appropriate Minister is of opinion that it would be in the public interest to do so, he\nmay by order prohibit the importation of all publications published by or on behalf of any organisation\nor association of persons specified in the order.\n\n        (3) An order made under the provisions of subsection (1) of this section shall, unless a contrary\nintention is expressed therein, have effect-\n\n        (a)     with respect to all subsequent issues of such publication; and\n\n        (b)      not only with respect to any publication under the name specified in relation thereto in\n                the order, but also with respect to any publication published under any other name if\n                the publishing thereof is in any respect in continuation of, or in substitution for, the\n                publishing of the publication named in the order.\n\n        (4) An order under the provisions of subsection (2) of this section shall, unless a contrary\nintention is expressed therein, have effect not only with respect to all publications published by or on\nbehalf of the organisation or association of persons named therein before the date of the order, but also\nwith respect to all publications so published on or after such date.\n\n        (5) An order made under the provisions of subsection (1) or subsection (2) of this section shall,\nunless a contrary intention is expressed therein, apply to any translation into any language whatsoever\nof the publication specified in the order.\n\nOffences\n\n         (6) Any person who imports, publishes, sells, offers for sale, distributes or reproduces any\npublication, the importation of which has been prohibited under subsection (1) or (2) of this section, or\nany extract therefrom, is guilty of an offence and liable, on conviction, for a first offence to\nimprisonment for two years or to a fine of two hundred naira or to both such imprisonment and fine and\nfor a subsequent offence to imprisonment for three years; and such publication or extract therefrom\nshall be forfeited to the State.\n\n                                             [L.N. 112 of 1964.]\n         (7) Any person who without lawful excuse has in his possession any publication, the importation\nof which has been prohibited under subsection (1) or (2) of this section, or any extract therefrom, is\nguilty of an offence and liable, on conviction, for a first offence to imprisonment for one year or to a fine\nof one hundred naira or to both such imprisonment and fine, and for a subsequent offence to\nimprisonment for two years; and such publication or extract therefrom shall be forfeited to the State.\n\nDelivery of prohibited publication to police and administrative officers\n\n         (8) (a) Any person to whom any publication, the importation of which has been prohibited under\nsubsection (1) or (2) of this section, or any extract therefrom, is sent without his knowledge or privity or\nin response to a request made before the prohibition of the importation of such publication came into\neffect, or who has such a publication or extract therefrom in his possession at the time when the\nprohibition of its importation comes into effect, shall forthwith if, or as soon as, the nature of its\ncontents has become known to him, or in the case of a publication or extract therefrom coming into the\npossession of such person before an order prohibiting its importation has been made, forthwith upon\nthe coming into effect of an order prohibiting the importation of such publication, deliver such\npublication or extract therefrom to the officer in charge of the nearest police station or to the nearest\nadministrative officer, and in default thereof shall be guilty of an offence and liable, on conviction, to\nimprisonment for one year or to a fine of one hundred naira or to both such imprisonment and fine; and\nsuch publication or extract therefrom shall be forfeited to the State.\n\n                                              [L.N. 112 of 1964.]\n\n         (b) A person who complies with the provisions of paragraph (a) of this subsection or is convicted\nof an offence under that subsection shall not be liable to be convicted for having imported or having in\nhis possession the same publication or extract therefrom.\n\nPower to examine packages\n\n        (9) (a) Any of the following officers, that is to say-\n\n                                         [1966 No. 84. 1967 No. 27.]\n\n        (i)     any officer of the Nigerian Postal Service not below the rank of Assistant Surveyor;\n\n        (ii)    any officer of the Nigeria Customs Service not below the rank of Collector;\n\n        (iii)   any police officer not below the rank of Assistant Superintendent of Police;\n\n        (iv)     any other official authorised in that behalf by the President,\n\nmay detain, open and examine any package or article which he suspects to contain any publication or\nextract therefrom which it is an offence under the provisions of subsection (6) to import, publish, sell,\noffer for sale, distribute, reproduce or possess, and during such examination may detain any person\nimporting, distributing, or posting such package or article or in whose possession such package or article\nis found.\n        (b) If any such publication or extract therefrom is found in such package or article, the whole\npackage or article may be impounded and retained by the officer and the person importing, distributing,\nor posting it, or in whose possession it is found, may forthwith be arrested and proceeded against for\nthe commission of an offence under subsection (6) or (8), as the case may be."},{"c":"CC","n":"59","t":"Publication of false news with intent to cause fear and alarm to public","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"(1) Any person who publishes or reproduces any statement, rumour or report which is likely to\ncause fear and alarm to the public or to disturb the public peace, knowing or having reason to believe\nthat such statement, rumour or report is false, is guilty of a misdemeanour and liable on conviction to\nimprisonment for three years.\n\n         (2) It shall be no defence to a charge under subsection (1) of this section that he did not know or\ndid not have reason to believe that the statement, rumour or report was false unless he proves that,\nprior to publication, he took reasonable measures to verify the accuracy of such statement, rumour or\nreport."},{"c":"CC","n":"60","t":"Defamation of persons exercising sovereign authority over a State","ch":"Chapter 7 – Sedition and the importation of seditious or undesirable publications","p":"Part 2 – Offences against public order","x":"Any person who, without such justification or excuse as would be sufficient in the case of the\ndefamation of a private person, publishes anything intended to be read, or any sign or visible\nrepresentation, tending to expose to hatred or contempt in the estimation of the people of any foreign\nState any person exercising sovereign authority over that State, is guilty of a misdemeanour, and is liable\nto imprisonment for two years."},{"c":"CC","n":"61","t":"Interference with executive or legislative power","ch":"Chapter 8 – Offences against the executive and legislative power","p":"Part 2 – Offences against public order","x":"Any person who advisedly does any unlawful act calculated to interfere with the free exercise by the\nPresident or a Governor of the duties or authority of his office or with the free exercise by a member of\nthe Federal Executive Council, or a State Executive Council of his duties as such member, is guilty of a\nfelony, and is liable to imprisonment for three years.\n\n                              [L.N. 2 of 1960. L.N. 112 of 1964. 1967 No. 27.]\n\nThe offender cannot be arrested without warrant.\n\nA prosecution for an offence under this section shall not be instituted except by or with the consent of a\nlaw officer."},{"c":"CC","n":"62","t":"Definition of society and unlawful society","ch":"Chapter 9 – Unlawful societies","p":"Part 2 – Offences against public order","x":"(1) A society includes any combination of ten or more persons whether the society be known by\nany name or not.\n\n                                      [L.N. 258 of 1959. 1967 No. 27.]\n\n        (2) A society is an unlawful society-\n\n                (i)      if formed for any of the following purposes-\n\n        (a)      levying war or encouraging or assisting any person to levy war on the Government or\n                the inhabitants of any part of Nigeria; or\n\n        (b)      killing or injuring or encouraging the killing or injuring of any person; or\n\n        (c)     destroying or injuring or encouraging the destruction or injuring of any property; or\n\n        (d)      subverting or promoting the subversion of the Government or of its officials; or\n\n        (e)     committing or inciting to acts of violence or intimidation; or\n\n        (f)     interfering with, or resisting, or encouraging interference with or resistance to the\n                administration of the law; or\n\n        (g)     disturbing or encouraging the disturbance of peace and order in any part of Nigeria; or\n\n                (ii)     if declared by an order of the President to be a society dangerous to the good\n                         government of Nigeria or of any part thereof."},{"c":"CC","n":"62A","t":"Unlawful societies in a State","ch":"Chapter 9 – Unlawful societies","p":"Part 2 – Offences against public order","x":"Without prejudice to the provisions of section 62 of this Code, a society is an unlawful society if it is\ndeclared by an order of the President to be a society dangerous to the good government of Nigeria or of\nany part thereof, and for such purpose the consent of the Attorney-General of the Federation referred\nto in section 65 of this Code shall be construed as a reference to the consent of the Attorney-General of\nthe State."},{"c":"CC","n":"63","t":"Managing an unlawful society","ch":"Chapter 9 – Unlawful societies","p":"Part 2 – Offences against public order","x":"Any person who manages or assists in the management of an unlawful society is guilty of a felony and is\nliable to imprisonment for seven years."},{"c":"CC","n":"64","t":"Members of unlawful society: persons permitting an unlawful society to meet on their premises","ch":"Chapter 9 – Unlawful societies","p":"Part 2 – Offences against public order","x":"Any person who-\n        (a)     is a member of an unlawful society; or\n\n        (b)     knowingly allows a meeting of an unlawful society, or of members of an unlawful\n               society, to be held in any house, building, or place belonging to, or occupied by, him or\n        over which he has control,\n\nis guilty of a felony and is liable to impr
